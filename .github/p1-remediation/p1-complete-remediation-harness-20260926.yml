                  apply_treasury(state, env("TREASURY_SPEND_CANCEL", "@alice", 1, {"treasury_id": "treasury-b", "spend_id": "s1"}))
              assert state["treasury"]["spends"]["s1"]["status"] == "proposed"


          def test_p1_role001_suspension_is_durable_and_scheduler_cannot_reactivate() -> None:
              state = {
                  "height": 10,
                  "roles": {
                      "node_operators": {
                          "by_id": {"@alice": {"account_id": "@alice", "enrolled": True, "active": True, "status": "active"}},
                          "active_set": ["@alice"],
                      }
                  },
                  "accounts": {"@alice": {"poh_tier": 2, "reputation_milli": 10_000}},
              }
              apply_roles(state, env("ROLE_NODE_OPERATOR_SUSPEND", "SYSTEM", 11, {"account_id": "@alice"}, system=True, parent="governance:suspend"))
              rec = state["roles"]["node_operators"]["by_id"]["@alice"]
              assert rec["suspended"] is True and rec["active"] is False
              assert schedule_node_operator_system_txs(state, next_height=11) == 0
              assert not any(item.get("tx_type") == "ROLE_NODE_OPERATOR_ACTIVATE" for item in state.get("system_queue", []))
              with pytest.raises(RolesApplyError, match="node_operator_suspended"):
                  apply_roles(state, env("ROLE_NODE_OPERATOR_ACTIVATE", "SYSTEM", 12, {"account_id": "@alice"}, system=True))


          def test_p1_stor001_user_offer_cannot_target_another_operator() -> None:
