name: Complete P1 Remediation 20260926

on:
  push:
    branches: [p1-complete-remediation-20260926]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p1-complete-remediation-20260926
  cancel-in-progress: true

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p1-complete-remediation-20260926
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Remove temporary workflows from intended final tree
        run: |
          git rm -f .github/workflows/p1-complete-remediation-20260926.yml
          git rm -f .github/workflows/refresh-v2-derivatives-20260926.yml || true

      - name: Apply all remaining P1 repairs
        working-directory: Weall-Protocol
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_between(path: str, start: str, end: str, replacement: str) -> None:
              p = Path(path)
              text = p.read_text()
              i = text.find(start)
              if i < 0:
                  raise SystemExit(f"missing start marker in {path}: {start}")
              j = text.find(end, i + len(start))
              if j < 0:
                  raise SystemExit(f"missing end marker in {path}: {end}")
              p.write_text(text[:i] + replacement + text[j:])

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match in {path}, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # P1-SEC-002: key_id is the canonical revoke authority. Keep pubkey only
          # as a lower-level compatibility fallback for historical/direct replay.
          replace_between(
              "src/weall/runtime/apply/identity.py",
              "def _apply_account_key_revoke(state: Json, env: TxEnvelope) -> Json:\n",
              "def _apply_account_device_register(state: Json, env: TxEnvelope) -> Json:\n",
              '''def _apply_account_key_revoke(state: Json, env: TxEnvelope) -> Json:\n    a = _require_not_banned_or_locked(state, env.signer)\n    _expect_nonce(a, env)\n    p = _payload(env)\n\n    key_id = _as_str(p.get("key_id") or "").strip()\n    legacy_pubkey = _as_str(p.get("pubkey") or "").strip()\n\n    keys = a.get("keys")\n    if not isinstance(keys, dict) or not isinstance(keys.get("by_id"), dict):\n        raise ApplyError("invalid_state", "keys_not_configured", {})\n\n    by_id = keys["by_id"]\n    match_kid: str | None = None\n    if key_id:\n        rec = by_id.get(key_id)\n        if isinstance(rec, dict) and rec.get("revoked") is not True:\n            match_kid = key_id\n    elif legacy_pubkey:\n        for kid, rec in by_id.items():\n            if not isinstance(rec, dict):\n                continue\n            if account_key_pubkey(rec) == legacy_pubkey and rec.get("revoked") is not True:\n                match_kid = kid\n                break\n    else:\n        raise ApplyError("invalid_tx", "missing_key_id", {})\n\n    if not match_kid:\n        details = {"key_id": key_id} if key_id else {"pubkey": legacy_pubkey}\n        raise ApplyError("invalid_tx", "unknown_key", details)\n\n    by_id[match_kid]["revoked"] = True\n    by_id[match_kid]["revoked_at"] = _as_int(state.get("height"), 0)\n    a["nonce"] = _as_int(a.get("nonce"), 0) + 1\n    _sync_account_key_views(a)\n    return state\n\n\n''',
          )

          # P1-CONTENT-001: user media mutations require canonical ownership of
          # both the media object and the target content; SYSTEM remains explicit authority.
          content_helpers = '''def _require_media_mutation_authority(\n    media: Json, *, media_id: str, env: TxEnvelope\n) -> Json:\n    rec = media.get(media_id)\n    if not isinstance(rec, dict):\n        raise ContentApplyError("not_found", "media_not_found", {"media_id": media_id})\n    if not env.system and _as_str(rec.get("declared_by")).strip() != _as_str(env.signer).strip():\n        raise ContentApplyError("forbidden", "not_author", {"media_id": media_id})\n    return rec\n\n\ndef _require_content_target_mutation_authority(\n    content: Json, *, target_id: str, env: TxEnvelope\n) -> Json:\n    for bucket_name in ("posts", "comments"):\n        bucket = content.get(bucket_name)\n        rec = bucket.get(target_id) if isinstance(bucket, dict) else None\n        if not isinstance(rec, dict):\n            continue\n        if not env.system and _as_str(rec.get("author")).strip() != _as_str(env.signer).strip():\n            raise ContentApplyError("forbidden", "not_author", {"target_id": target_id})\n        return rec\n    raise ContentApplyError("not_found", "content_target_not_found", {"target_id": target_id})\n\n\n'''
          replace_once(
              "src/weall/runtime/apply/content.py",
              "def _apply_content_media_declare(state: Json, env: TxEnvelope) -> Json:\n",
              content_helpers + "def _apply_content_media_declare(state: Json, env: TxEnvelope) -> Json:\n",
          )
          replace_between(
              "src/weall/runtime/apply/content.py",
              "def _apply_content_media_bind(state: Json, env: TxEnvelope) -> Json:\n",
              "def _apply_content_media_unbind(state: Json, env: TxEnvelope) -> Json:\n",
              '''def _apply_content_media_bind(state: Json, env: TxEnvelope) -> Json:\n    if not env.system:\n        _require_min_poh_tier(state, signer=env.signer, min_tier=2, action="content_media_action")\n\n    payload = _as_dict(env.payload)\n    content = _ensure_root(state)\n    media = content["media"]\n    bindings = content["media_bindings"]\n\n    media_id = _as_str(payload.get("media_id")).strip()\n    target_id = _as_str(payload.get("target_id")).strip()\n    if not media_id or not target_id:\n        raise ContentApplyError(\n            "invalid_payload", "missing_media_or_target", {"tx_type": env.tx_type}\n        )\n\n    _require_media_mutation_authority(media, media_id=media_id, env=env)\n    _require_content_target_mutation_authority(content, target_id=target_id, env=env)\n\n    bind_id = _as_str(payload.get("binding_id")).strip() or f"bind:{media_id}:{target_id}"\n    bindings[bind_id] = {\n        "binding_id": bind_id,\n        "media_id": media_id,\n        "target_id": target_id,\n        "bound_by": env.signer,\n        "bound_at_nonce": int(env.nonce),\n    }\n\n    posts = content.get("posts")\n    if isinstance(posts, dict) and target_id in posts and isinstance(posts[target_id], dict):\n        post = posts[target_id]\n        cur = post.get("media")\n        if not isinstance(cur, list):\n            cur = []\n        if media_id not in cur:\n            cur.append(media_id)\n        post["media"] = cur\n\n    comments = content.get("comments")\n    if isinstance(comments, dict) and target_id in comments and isinstance(comments[target_id], dict):\n        comment = comments[target_id]\n        cur = comment.get("media")\n        if not isinstance(cur, list):\n            cur = []\n        if media_id not in cur:\n            cur.append(media_id)\n        comment["media"] = cur\n\n    _ensure_account_nonce(state, env.signer, env.nonce)\n    return {"applied": "CONTENT_MEDIA_BIND", "binding_id": bind_id}\n\n\n''',
          )
          replace_between(
              "src/weall/runtime/apply/content.py",
              "def _apply_content_media_unbind(state: Json, env: TxEnvelope) -> Json:\n",
              "def _apply_content_media_replace(state: Json, env: TxEnvelope) -> Json:\n",
              '''def _apply_content_media_unbind(state: Json, env: TxEnvelope) -> Json:\n    if not env.system:\n        _require_min_poh_tier(state, signer=env.signer, min_tier=2, action="content_media_action")\n\n    payload = _as_dict(env.payload)\n    content = _ensure_root(state)\n    bindings = content["media_bindings"]\n\n    binding_id = _as_str(payload.get("binding_id")).strip()\n    if not binding_id:\n        media_id = _as_str(payload.get("media_id")).strip()\n        target_id = _as_str(payload.get("target_id")).strip()\n        if media_id and target_id:\n            binding_id = f"bind:{media_id}:{target_id}"\n\n    if not binding_id or binding_id not in bindings:\n        raise ContentApplyError("not_found", "binding_not_found", {"binding_id": binding_id})\n\n    rec = bindings[binding_id]\n    media_id = _as_str(rec.get("media_id")).strip()\n    target_id = _as_str(rec.get("target_id")).strip()\n\n    if not env.system:\n        signer = _as_str(env.signer).strip()\n        bound_by = _as_str(rec.get("bound_by")).strip()\n        media_rec = content.get("media", {}).get(media_id) if isinstance(content.get("media"), dict) else None\n        media_owner = _as_str(media_rec.get("declared_by")).strip() if isinstance(media_rec, dict) else ""\n        target_owner = ""\n        for bucket_name in ("posts", "comments"):\n            bucket = content.get(bucket_name)\n            target = bucket.get(target_id) if isinstance(bucket, dict) else None\n            if isinstance(target, dict):\n                target_owner = _as_str(target.get("author")).strip()\n                break\n        if signer not in {bound_by, media_owner, target_owner}:\n            raise ContentApplyError("forbidden", "not_author", {"binding_id": binding_id})\n\n    del bindings[binding_id]\n\n    posts = content.get("posts")\n    if isinstance(posts, dict) and target_id in posts and isinstance(posts[target_id], dict):\n        post = posts[target_id]\n        cur = post.get("media")\n        if isinstance(cur, list) and media_id:\n            post["media"] = [x for x in cur if x != media_id]\n\n    comments = content.get("comments")\n    if isinstance(comments, dict) and target_id in comments and isinstance(comments[target_id], dict):\n        comment = comments[target_id]\n        cur = comment.get("media")\n        if isinstance(cur, list) and media_id:\n            comment["media"] = [x for x in cur if x != media_id]\n\n    _ensure_account_nonce(state, env.signer, env.nonce)\n    return {"applied": "CONTENT_MEDIA_UNBIND", "binding_id": binding_id}\n\n\n''',
          )
          replace_between(
              "src/weall/runtime/apply/content.py",
              "def _apply_content_media_replace(state: Json, env: TxEnvelope) -> Json:\n",
              "# ---------------------------\n# Moderation / visibility / labels / locking\n# ---------------------------\n",
              '''def _apply_content_media_replace(state: Json, env: TxEnvelope) -> Json:\n    if not env.system:\n        _require_min_poh_tier(state, signer=env.signer, min_tier=2, action="content_media_action")\n\n    payload = _as_dict(env.payload)\n    content = _ensure_root(state)\n    media = content["media"]\n\n    media_id = _as_str(payload.get("media_id")).strip()\n    new_cid = _as_str(payload.get("new_cid") or payload.get("cid")).strip()\n    if not media_id or not new_cid:\n        raise ContentApplyError("invalid_payload", "missing_media_id_or_new_cid", {})\n    new_cid = _require_public_cid(new_cid, field="new_cid", tx_type=str(env.tx_type or ""))\n\n    rec = _require_media_mutation_authority(media, media_id=media_id, env=env)\n    rec["cid"] = new_cid\n    rec["replaced_at_nonce"] = int(env.nonce)\n    rec["replaced_by"] = env.signer\n    rec["replace_payload"] = payload\n\n    _ensure_account_nonce(state, env.signer, env.nonce)\n    return {"applied": "CONTENT_MEDIA_REPLACE", "media_id": media_id, "cid": new_cid}\n\n\n# ---------------------------\n# Moderation / visibility / labels / locking\n# ---------------------------\n''',
          )

          # P1-TREAS-001: bind cancellation scope to the stored spend treasury.
          replace_between(
              "src/weall/runtime/apply/treasury.py",
              "def _apply_treasury_spend_cancel(state: Json, env: TxEnvelope) -> Json:\n",
              "def _apply_treasury_spend_execute(state: Json, env: TxEnvelope) -> Json:\n",
              '''def _apply_treasury_spend_cancel(state: Json, env: TxEnvelope) -> Json:\n    payload = _as_dict(env.payload)\n    treasury_id = _require_treasury_id(payload)\n    spend_id = _as_str(payload.get("spend_id")).strip()\n    if not spend_id:\n        raise TreasuryApplyError("invalid_payload", "missing_spend_id", {"tx_type": env.tx_type})\n\n    spends = _ensure_spends(state)\n    spend = spends.get(spend_id)\n    if not isinstance(spend, dict):\n        raise TreasuryApplyError("not_found", "spend_not_found", {"spend_id": spend_id})\n\n    stored_treasury_id = _as_str(spend.get("treasury_id")).strip()\n    if not stored_treasury_id:\n        raise TreasuryApplyError("invalid_state", "spend_missing_treasury_id", {"spend_id": spend_id})\n    if stored_treasury_id != treasury_id:\n        raise TreasuryApplyError(\n            "forbidden",\n            "treasury_id_mismatch",\n            {"spend_id": spend_id, "treasury_id": treasury_id, "stored_treasury_id": stored_treasury_id},\n        )\n\n    status = _as_str(spend.get("status")).strip().lower()\n    if status == "executed":\n        raise TreasuryApplyError("forbidden", "spend_already_executed", {"spend_id": spend_id})\n    if status == "canceled":\n        return {"applied": "TREASURY_SPEND_CANCEL", "spend_id": spend_id, "deduped": True}\n\n    spend["status"] = "canceled"\n    spend["canceled_by"] = _as_str(env.signer).strip()\n    spend["canceled_at_nonce"] = int(env.nonce)\n    spends[spend_id] = spend\n    return {"applied": "TREASURY_SPEND_CANCEL", "spend_id": spend_id, "deduped": False}\n\n\n''',
          )

          # P1-ROLE-001: suspension is durable. Scheduler activations carry no
          # parent and therefore cannot silently clear it; an explicit parent-bound
          # authority transition is required to reinstate.
          replace_once(
              "src/weall/runtime/apply/roles.py",
              '''    rec["active"] = True\n    rec["status"] = "active"\n    rec["activated_at_nonce"] = int(env.nonce)\n''',
              '''    if bool(rec.get("suspended", False)):\n        if not _as_str(env.parent).strip():\n            raise RolesApplyError(\n                "forbidden", "node_operator_suspended", {"account_id": account_id}\n            )\n        rec["suspended"] = False\n        rec["reinstated_at_nonce"] = int(env.nonce)\n        rec["reinstatement_parent"] = _as_str(env.parent).strip()\n\n    rec["active"] = True\n    rec["status"] = "active"\n    rec["activated_at_nonce"] = int(env.nonce)\n''',
          )
          replace_once(
              "src/weall/runtime/apply/roles.py",
              '''    rec["active"] = False\n    rec["status"] = "paused"\n    rec["suspended_at_nonce"] = int(env.nonce)\n''',
              '''    rec["active"] = False\n    rec["suspended"] = True\n    rec["status"] = "paused"\n    rec["suspended_at_nonce"] = int(env.nonce)\n''',
          )

          # P1-STOR-001: USER offers may mutate only the signer's operator state.
          replace_once(
              "src/weall/runtime/apply/storage.py",
              '''def _apply_storage_offer_create(state: Json, env: TxEnvelope) -> Json:\n    s = _ensure_storage(state)\n    payload = _as_dict(env.payload)\n\n    operator_id = _operator_id_from_env(env, payload)\n    offer_id = _mk_id("offer", env, _pick(payload, "offer_id", "id"))\n''',
              '''def _apply_storage_offer_create(state: Json, env: TxEnvelope) -> Json:\n    payload = _as_dict(env.payload)\n    operator_id = _operator_id_from_env(env, payload)\n    if not env.system and operator_id != _as_str(env.signer).strip():\n        raise StorageApplyError(\n            "forbidden",\n            "operator_must_match_signer",\n            {"operator_id": operator_id, "signer": _as_str(env.signer).strip()},\n        )\n\n    s = _ensure_storage(state)\n    offer_id = _mk_id("offer", env, _pick(payload, "offer_id", "id"))\n''',
          )

          # P1-CONS-004: consensus-visible SYSTEM payloads remain integer-only.
          replace_once(
              "src/weall/runtime/reputation_accrual.py",
              '''            "account_id": account_id,\n            "delta": float(delta_milli) / 1000.0,\n            "delta_id": delta_id,\n''',
              '''            "account_id": account_id,\n            "delta_milli": int(delta_milli),\n            "delta_id": delta_id,\n''',
          )
          replace_once(
              "src/weall/runtime/block_builder.py",
              "from weall.runtime.block_admission import DEFAULT_MAX_BLOCK_TXS\n",
              "from weall.runtime.block_admission import DEFAULT_MAX_BLOCK_TXS\nfrom weall.runtime.tx_admission import admit_tx\n",
          )
          replace_once(
              "src/weall/runtime/block_builder.py",
              '''        queue_ids_before = set(_queue_lookup()) if tx_type == BLOCK_FINALIZE_TX_TYPE else set()\n        parent_position = len(applied_envs)\n        meta = apply_tx_fn(working, env, consume_nonce_on_fail=False)\n''',
              '''        verdict = admit_tx(\n            env, LedgerView.from_ledger(working), canon=self.tx_index, context="block"\n        )\n        if not bool(verdict.ok):\n            raise ApplyError(\n                "invalid_tx",\n                "system_tx_admission_failed",\n                {"tx_type": tx_type, "code": verdict.code, "reason": verdict.reason},\n            )\n\n        queue_ids_before = set(_queue_lookup()) if tx_type == BLOCK_FINALIZE_TX_TYPE else set()\n        parent_position = len(applied_envs)\n        meta = apply_tx_fn(working, env, consume_nonce_on_fail=False)\n''',
          )

          # P1-CONS-005: BLOCK_ATTEST records equivocation evidence only. Punishment
          # remains behind the canon-declared governance/slash authority path.
          consensus = Path("src/weall/runtime/apply/consensus.py")
          ctext = consensus.read_text()
          ctext = ctext.replace(
              "from weall.runtime.apply.reputation import apply_reputation_delta_system\n", "", 1
          )
          start = '''        if isinstance(prior, str) and prior and prior != block_id:\n            sid = f"equivocation:{validator}:{int(height)}:{int(rnd)}"\n'''
          end = '''        else:\n            per_v[key] = block_id\n'''
          i = ctext.find(start)
          j = ctext.find(end, i)
          if i < 0 or j < 0:
              raise SystemExit("could not locate equivocation authority block")
          evidence_block = '''        if isinstance(prior, str) and prior and prior != block_id:\n            sid = f"equivocation:{validator}:{int(height)}:{int(rnd)}"\n            sl = _ensure_slashing_root(state)\n            evidence = sl.get("equivocation_evidence")\n            if not isinstance(evidence, dict):\n                evidence = {}\n                sl["equivocation_evidence"] = evidence\n            if sid not in evidence:\n                evidence[sid] = {\n                    "evidence_id": sid,\n                    "type": "equivocation",\n                    "validator": validator,\n                    "height": int(height),\n                    "round": int(rnd),\n                    "block_id_1": prior,\n                    "block_id_2": block_id,\n                    "observed_at_nonce": int(env.nonce),\n                    "status": "pending_governance",\n                }\n                events = sl.get("events")\n                events = _require_list_invariant(events, field="events")\n                events.append(\n                    {\n                        "event": "EQUIVOCATION_DETECTED",\n                        "evidence_id": sid,\n                        "validator": validator,\n                    }\n                )\n                sl["events"] = events\n            sl["equivocation_evidence"] = evidence\n'''
          consensus.write_text(ctext[:i] + evidence_block + ctext[j:])

          # P1-DISPUTE-001: juror-authored optional resolution objects are advisory
          # text only; arbitrary enforcement actions never inherit coarse-choice quorum.
          replace_between(
              "src/weall/runtime/apply/dispute.py",
              "def _select_deattributed_resolution(\n",
              "@dataclass\nclass DisputeApplyError",
              '''def _select_deattributed_resolution(\n    dispute: Json, *, winning_choice: str, appeal: bool = False\n) -> Json:\n    key = "appeal_resolution_options" if appeal else "resolution_options"\n    options = dispute.get(key)\n    if not isinstance(options, dict):\n        return {}\n    matching: list[tuple[str, Json]] = []\n    for commitment, rec in options.items():\n        if not isinstance(rec, dict):\n            continue\n        if _as_str(rec.get("choice")).strip().lower() != _as_str(winning_choice).strip().lower():\n            continue\n        matching.append((_as_str(commitment), rec))\n    if not matching:\n        return {}\n    matching.sort(key=lambda item: (-_as_int(item[1].get("count"), 0), item[0]))\n    selected = matching[0][1]\n    out = dict(selected.get("resolution")) if isinstance(selected.get("resolution"), dict) else {}\n    # Ballots may propose explanatory text, but they may not smuggle authority\n    # actions through a coarse yes/no quorum. Enforcement is derived separately.\n    out.pop("actions", None)\n    summary = _as_str(selected.get("summary")).strip()\n    if summary:\n        out.setdefault("summary", summary)\n    return out\n\n\n@dataclass\nclass DisputeApplyError''',
          )
          replace_once(
              "src/weall/runtime/apply/dispute.py",
              '''        selected_actions = (\n            resolution.get("actions") if isinstance(resolution.get("actions"), list) else []\n        )\n        non_content_actions = [\n            a\n            for a in selected_actions\n            if isinstance(a, dict)\n            and _as_str(a.get("tx_type")).strip()\n            not in {"CONTENT_LABEL_SET", "CONTENT_VISIBILITY_SET", "CONTENT_THREAD_LOCK_SET"}\n        ]\n        if report_upheld:\n            resolution["summary"] = "Report upheld. The content should be removed."\n            resolution["actions"] = (\n                _default_content_resolution_actions(dispute, dict(tally)) + non_content_actions\n            )\n''',
              '''        if report_upheld:\n            resolution["summary"] = "Report upheld. The content should be removed."\n            resolution["actions"] = _default_content_resolution_actions(dispute, dict(tally))\n''',
          )

          # P1-NET-001: current hello proofs are initiator-generated and replayable.
          # They may authenticate a live session but may not acquire account-scoped
          # durable strike/ban authority. Keep durable abuse state transport-scoped
          # unless a future receiver-challenge proof explicitly marks session_bound.
          replace_between(
              "src/weall/net/node.py",
              "    def _bind_authenticated_peer_security(self, rec: _PeerRec) -> None:\n",
              "    def _persist_peer_security(self, rec: _PeerRec) -> None:\n",
              '''    def _bind_authenticated_peer_security(\n        self, rec: _PeerRec, *, session_bound: bool = False\n    ) -> None:\n        if not session_bound:\n            # PEER_HELLO V1/V2/V3 proofs are initiated by the peer and can be\n            # replayed on another transport. They are therefore insufficient\n            # authority for durable account-scoped abuse attribution.\n            return\n        key = self._peer_security_identity_key(rec.identity_account)\n        if not key:\n            return\n        store = self._peer_security_store\n        if store is not None:\n            saved = store.load(key)\n            if saved is not None:\n                rec.strikes = max(int(rec.strikes), max(0, int(saved.strikes)))\n                rec.banned_until_ms = max(\n                    int(rec.banned_until_ms), max(0, int(saved.banned_until_ms))\n                )\n                rec.security_score = min(float(rec.security_score), float(saved.score))\n        rec.security_key = key\n        self._persist_peer_security(rec)\n\n''',
          )
          replace_once(
              "src/weall/net/node.py",
              '''        rec.identity_pubkey = pubkey\n        self._bind_authenticated_peer_security(rec)\n''',
              '''        rec.identity_pubkey = pubkey\n        # The current hello proof is not receiver/session-bound, so durable\n        # peer-security attribution must remain on the transport identity.\n        self._bind_authenticated_peer_security(rec, session_bound=False)\n''',
          )

          # Existing focused tests that encoded the vulnerable/float behavior.
          replace_once(
              "tests/test_reputation_accrual_policy.py",
              '''        "delta": 0.01,\n''',
              '''        "delta_milli": 10,\n''',
          )
          replace_once(
              "tests/test_reputation_accrual_policy.py",
              '''    assert payload["delta"] == 0.025\n''',
              '''    assert payload["delta_milli"] == 25\n''',
          )

