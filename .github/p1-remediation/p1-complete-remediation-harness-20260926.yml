      - name: Register new stable failure contracts
        working-directory: Weall-Protocol
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          keys = [
              "forbidden:node_operator_suspended",
              "forbidden:operator_must_match_signer",
              "invalid_tx:missing_key_id",
              "invalid_tx:system_tx_admission_failed",
          ]
          path = Path("specs/v2/source/stable_ids.json")
          payload = json.loads(path.read_text())
          entries = payload["entries"]
          existing = {(r.get("kind"), r.get("canonical_key")) for r in entries if isinstance(r, dict)}
          existing_ids = {r.get("stable_id") for r in entries if isinstance(r, dict)}
          for key in keys:
              if ("failure", key) in existing:
                  continue
              sid = "FAIL-" + hashlib.sha256(key.encode()).hexdigest()[:16].upper()
              if sid in existing_ids:
                  raise SystemExit(f"stable id collision: {sid}")
              entries.append({"aliases": [], "canonical_key": key, "kind": "failure", "stable_id": sid, "status": "active"})
              existing_ids.add(sid)
          entries.sort(key=lambda r: (str(r.get("kind") or ""), str(r.get("canonical_key") or "")))
          path.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + "\n")
          PY

