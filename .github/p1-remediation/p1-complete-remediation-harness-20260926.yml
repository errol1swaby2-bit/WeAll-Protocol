              with pytest.raises(StorageApplyError, match="operator_must_match_signer"):
                  apply_storage(state, env("STORAGE_OFFER_CREATE", "@alice", 1, {"offer_id": "o1", "operator_id": "@bob", "capacity_bytes": 1}))
              assert state == {}


          def test_p1_cons004_reputation_scheduler_emits_integer_payload_and_block_admission_rejects_float() -> None:
              state = {
                  "chain_id": "test",
                  "height": 12,
                  "params": {"content_reputation_maturity_blocks": 1, "post_reputation_delta_milli": 10},
                  "accounts": {"@alice": {"nonce": 0, "poh_tier": 2, "reputation_milli": 0}},
                  "content": {
                      "posts": {
                          "p1": {
                              "post_id": "p1",
                              "author": "@alice",
                              "visibility": "public",
                              "deleted": False,
                              "reputation_accrual": {
                                  "kind": "post",
                                  "source_id": "p1",
                                  "account_id": "@alice",
                                  "created_height": 10,
                                  "matures_at_height": 11,
                                  "delta_milli": 10,
                                  "status": "pending",
                              },
                          }
                      },
                      "flags": {},
                  },
              }
              assert schedule_reputation_accrual_system_txs(state, next_height=13) == 1
              queued = [x for x in state["system_queue"] if x["tx_type"] == "REPUTATION_DELTA_APPLY"][0]
              assert queued["payload"]["delta_milli"] == 10
              assert "delta" not in queued["payload"]
              assert not any(isinstance(v, float) for v in queued["payload"].values())

              canon = load_default_tx_index()
              good = env("REPUTATION_DELTA_APPLY", "SYSTEM", 13, dict(queued["payload"]), system=True, parent=queued.get("parent"))
              verdict = admit_tx(good, state, canon=canon, context="block")
              assert verdict.ok, (verdict.code, verdict.reason, verdict.details)
              bad_payload = dict(queued["payload"])
              bad_payload.pop("delta_milli", None)
              bad_payload["delta"] = 0.01
              bad = env("REPUTATION_DELTA_APPLY", "SYSTEM", 13, bad_payload, system=True, parent=queued.get("parent"))
              rejected = admit_tx(bad, state, canon=canon, context="block")
              assert rejected.ok is False
              assert rejected.reason == "payload_float_not_allowed"


          def test_p1_dispute001_ballot_resolution_actions_never_inherit_coarse_quorum() -> None:
              dispute: dict = {}
              _record_deattributed_resolution_option(
