name: R20 Refresh Public-Only Audit Fix

on:
  workflow_dispatch:
  push:
    branches: ["audit-r20-comprehensive-remediation"]

permissions:
  contents: write

jobs:
  patch-refresh-order:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch refresh ordering and remove one-shot workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path('.github/workflows/r20-comprehensive-remediation.yml')
          text = target.read_text(encoding='utf-8')
          old = '\n'.join([
              '          python scripts/gen_failure_code_registry_v1_5.py',
              '          PYTHONPATH=src python scripts/gen_release_evidence_manifest_v1_5.py',
              '          PYTHONPATH=src:scripts python scripts/gen_public_beta_blocker_report_v1_5.py',
              '',
          ])
          new = '\n'.join([
              '          python scripts/gen_failure_code_registry_v1_5.py',
              '          PYTHONPATH=src:scripts python scripts/gen_public_only_protocol_audit_v1_5.py',
              '          PYTHONPATH=src python scripts/gen_release_evidence_manifest_v1_5.py',
              '          PYTHONPATH=src:scripts python scripts/gen_public_beta_blocker_report_v1_5.py',
              '',
          ])
          if text.count(old) != 1:
              raise SystemExit('expected exactly one r20 refresh sequence to patch')
          target.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/r20-refresh-public-only-audit-fix.yml').unlink()
          PY

      - name: Commit and push ordering repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(r20): refresh public-only audit before evidence manifest"
          git push origin HEAD:audit-r20-comprehensive-remediation
