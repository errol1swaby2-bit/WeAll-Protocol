name: Frontend V2 Source-Digest Reconciliation (one-shot)

on:
  push:
    branches:
      - frontend/f1-guided-account-onboarding-20261104
    paths:
      - .github/workflows/frontend-v2-reconcile-selfremove.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact frontend branch
        uses: actions/checkout@v4
        with:
          ref: frontend/f1-guided-account-onboarding-20261104
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned V2 compiler dependencies
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Remove this one-shot workflow before source hashing
        run: |
          set -euo pipefail
          test -f .github/workflows/frontend-v2-reconcile-selfremove.yml
          rm .github/workflows/frontend-v2-reconcile-selfremove.yml
          test ! -e .github/workflows/frontend-v2-reconcile-selfremove.yml
          # The repo's V2 compiler hashes CI workflow source. Both deletion
          # and newly generated evidence MUST land in the same exact commit.

      - name: Compile and verify final tree without temporary workflow
        working-directory: Weall-Protocol
        run: |
          PYTHONPATH=src python scripts/compile_v2_spec.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check

      - name: Verify only allowed generated evidence and the self-removal changed
        run: |
          set -euo pipefail
          mapfile -t changed < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          for file in "${changed[@]}"; do
            case "$file" in
              Weall-Protocol/generated/v2/*|web/src/generated/protocolStatus.ts|.github/workflows/frontend-v2-reconcile-selfremove.yml) ;;
              *) echo "Unexpected V2 derivative change: $file" >&2; exit 1 ;;
            esac
          done
          echo "Reconciled ${#changed[@]} files with no unrelated mutations"

      - name: Commit source-consistent V2 evidence and self-removal atomically
        run: |
          set -euo pipefail
          git add -u -- .github/workflows/frontend-v2-reconcile-selfremove.yml
          git add -- Weall-Protocol/generated/v2 web/src/generated/protocolStatus.ts
          if git diff --cached --quiet; then
            echo "Nothing to reconcile"; exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "spec(v2): reconcile frontend source digest without temporary workflow"
          test ! -e .github/workflows/frontend-v2-reconcile-selfremove.yml
          (cd Weall-Protocol && PYTHONPATH=src python scripts/compile_v2_spec.py --check)
          git push origin HEAD:refs/heads/frontend/f1-guided-account-onboarding-20261104
