name: PR26 Finalize P1-CONS-003 Safely

on:
  push:
    branches:
      - production-readiness-audit-20260925

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: production-readiness-audit-20260925

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Remove temporary CONS-003 workflows from intended final tree
        shell: bash
        run: |
          set -Eeuo pipefail
          for path in             .github/workflows/pr26-repair-cons003.yml             .github/workflows/pr26-refresh-cons003-evidence.yml             .github/workflows/pr26-finalize-cons003.yml
          do
            if [[ -e "$path" ]]; then
              git rm -f "$path"
            fi
          done

      - name: Install locked backend dependencies
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Refresh explicitly reviewed semantic contracts
        working-directory: Weall-Protocol
        run: |
          PYTHONPATH=src python scripts/refresh_v2_semantic_reviews.py             --tx-type VALIDATOR_CANDIDATE_APPROVE             --tx-type VALIDATOR_SUSPEND             --tx-type VALIDATOR_REMOVE             --register-failure invalid_payload:validator_lifecycle_epoch_must_be_future             --reviewed-at 2026-09-25T19:30:00Z             --reviewer "WeAll Protocol maintainer-directed P1-CONS-003 remediation; independent launch review deferred"             --review-method "maintainer_reviewed_semantic_change_with_regression_evidence"             --authority-effect "validator lifecycle transitions require a strictly future activation/effective epoch; does not activate public testnet or Mainnet"

      - name: Format and lint permanent tooling and repaired runtime
        working-directory: Weall-Protocol
        run: |
          ruff format scripts/refresh_v2_semantic_reviews.py tests/test_refresh_v2_semantic_reviews.py
          ruff format --check             scripts/refresh_v2_semantic_reviews.py             tests/test_refresh_v2_semantic_reviews.py             src/weall/runtime/apply/consensus.py             tests/p0/test_p1_cons003_future_validator_epochs.py
          ruff check             scripts/refresh_v2_semantic_reviews.py             tests/test_refresh_v2_semantic_reviews.py             src/weall/runtime/apply/consensus.py             tests/p0/test_p1_cons003_future_validator_epochs.py

      - name: Validate focused runtime and tooling contracts
        working-directory: Weall-Protocol
        run: |
          pytest -q             tests/test_refresh_v2_semantic_reviews.py             tests/p0/test_p1_cons003_future_validator_epochs.py             tests/p0/test_p0_consensus_core.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check

      - name: Verify generated and claim surfaces
        working-directory: Weall-Protocol
        run: |
          python scripts/check_generated.py
          PYTHONDONTWRITEBYTECODE=1 python scripts/check_v15_public_readiness_artifacts.py
          python scripts/check_public_claim_freshness.py
          python scripts/gen_current_verified_claims.py --check

      - name: Commit intended final tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit; final tree already materialized."
          else
            git commit -m "Finalize P1-CONS-003 semantic evidence and refresh tooling"
          fi

      - name: Verify committed clean archive
        working-directory: Weall-Protocol
        run: |
          python scripts/check_v2_spec_clean_checkout.py

      - name: Push final tree
        run: |
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/production-readiness-audit-20260925)" ]; then
            echo "No new commit to push."
          else
            git push origin HEAD:production-readiness-audit-20260925
          fi
