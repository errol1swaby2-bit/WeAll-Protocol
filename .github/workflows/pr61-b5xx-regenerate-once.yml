# Temporary, branch-restricted source-bound B5xx proof closure.
# Remove the workflow before compiling, then commit its deletion and outputs.
name: PR61 B5xx Final Artifact Closure

on:
  push:
    paths:
      - ".github/workflows/pr61-b5xx-regenerate-once.yml"

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ github.repository == 'errol1swaby2-bit/WeAll-Protocol' && github.ref == 'refs/heads/fix/pr60-content-dispute-system-schema-20261025' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install reproducible dependencies
        working-directory: Weall-Protocol
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install -e . --no-deps
      - name: Remove temporary workflow from final source
        run: git rm -- .github/workflows/pr61-b5xx-regenerate-once.yml
      - name: Regenerate dependent B5xx and V2 files, verify all checks
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          PYTHONPATH=src python scripts/gen_b528_b532_completion_proof_v1_5.py
          PYTHONPATH=src python scripts/gen_b534_b538_completion_proof_v1_5.py
          PYTHONPATH=src python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py
          PYTHONPATH=src python scripts/gen_b528_b532_completion_proof_v1_5.py --check
          PYTHONPATH=src python scripts/gen_b534_b538_completion_proof_v1_5.py --check
          PYTHONPATH=src python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py --check
          PYTHONPATH=src python scripts/gen_tx_semantic_assurance_v1_5.py --check
          PYTHONPATH=src python scripts/gen_tx_lifecycle_assurance_v1_5.py --check
          PYTHONPATH=src python scripts/compile_v2_spec.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          # Clean-checkout guard runs in standard CI after these artifacts are committed.
          PYTHONPATH=src python scripts/check_v15_public_readiness_artifacts.py
          PYTHONPATH=src python scripts/check_public_claim_freshness.py
          PYTHONPATH=src python scripts/gen_current_verified_claims.py --check
          git diff --check
      - name: Commit only regenerated proofs and workflow deletion
        shell: bash
        run: |
          set -Eeuo pipefail
          git add -A -- Weall-Protocol/generated/b528_b532_completion_proof_v1_5.json Weall-Protocol/generated/b534_b538_completion_proof_v1_5.json Weall-Protocol/generated/b567_b571_autonomous_mechanics_proof_v1_5.json Weall-Protocol/generated/v2 web/src/generated/protocolStatus.ts
          if git diff --name-only --cached | grep -Ev '^(.github/workflows/pr61-b5xx-regenerate-once[.]yml$|Weall-Protocol/generated/b(528_b532_completion_proof|534_b538_completion_proof|567_b571_autonomous_mechanics_proof)_v1_5[.]json$|Weall-Protocol/generated/v2/|web/src/generated/protocolStatus[.]ts$)'; then
            echo "Unexpected staged path" >&2
            exit 1
          fi
          test ! -e .github/workflows/pr61-b5xx-regenerate-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(evidence): regenerate final source-bound B5xx proofs for PR61'
          git push origin HEAD:"${GITHUB_REF_NAME}"
