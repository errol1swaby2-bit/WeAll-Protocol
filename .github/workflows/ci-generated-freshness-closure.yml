name: CI Generated Freshness Closure

on:
  push:
    branches: ["p2-complete-remediation-20260927"]
    paths:
      - ".github/workflows/ci-generated-freshness-closure.yml"

permissions:
  contents: write

concurrency:
  group: ci-generated-freshness-closure
  cancel-in-progress: false

jobs:
  refresh-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact trigger branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: p2-complete-remediation-20260927

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Verify release tree before dependency installation
        working-directory: Weall-Protocol
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/verify_release_tree.sh

      - name: Install locked backend dependencies
        working-directory: Weall-Protocol
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Install frontend dependencies
        working-directory: web
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci

      - name: Remove temporary workflow before provenance compilation
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/ci-generated-freshness-closure.yml
          test ! -e .github/workflows/ci-generated-freshness-closure.yml

      - name: Regenerate deterministic v2 derivatives against final source surface
        working-directory: Weall-Protocol
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONPATH=src python scripts/compile_v2_spec.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check

      - name: Prove regeneration touched only the expected repair set
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/expected-repair.txt <<'EOF'
          .github/workflows/ci-generated-freshness-closure.yml
          Weall-Protocol/generated/v2/current_tx_canon.json
          Weall-Protocol/generated/v2/divergence_registry.json
          Weall-Protocol/generated/v2/evidence_index.json
          Weall-Protocol/generated/v2/failure_contract_index.json
          Weall-Protocol/generated/v2/mechanism_registry.json
          Weall-Protocol/generated/v2/message_contract_index.json
          Weall-Protocol/generated/v2/parameter_registry.json
          Weall-Protocol/generated/v2/pdf_identity_manifest.json
          Weall-Protocol/generated/v2/receipt_contract_index.json
          Weall-Protocol/generated/v2/register_fingerprint_manifest.json
          Weall-Protocol/generated/v2/requirement_traceability.json
          Weall-Protocol/generated/v2/route_contract_map.json
          Weall-Protocol/generated/v2/runtime_state_inventory.json
          Weall-Protocol/generated/v2/scheduler_contract_index.json
          Weall-Protocol/generated/v2/source_coverage_map.json
          Weall-Protocol/generated/v2/spec_compilation_manifest.json
          Weall-Protocol/generated/v2/spec_derivative.md
          Weall-Protocol/generated/v2/state_contract_index.json
          Weall-Protocol/generated/v2/target_contract_canon.json
          Weall-Protocol/generated/v2/target_contract_schema_index.json
          Weall-Protocol/generated/v2/target_failure_contract_index.json
          Weall-Protocol/generated/v2/target_tx_canon.json
          Weall-Protocol/generated/v2/tx_contract_matrix.json
          Weall-Protocol/generated/v2/vector_registry.json
          Weall-Protocol/generated/v2/w1_closure_validation_manifest.json
          web/src/generated/protocolStatus.ts
          EOF
          sed -i 's/^          //' /tmp/expected-repair.txt
          git status --porcelain=v1 | sed -E 's/^...//' | sort > /tmp/actual-repair.txt
          sort -o /tmp/expected-repair.txt /tmp/expected-repair.txt
          echo "Expected repair set:"
          cat /tmp/expected-repair.txt
          echo "Actual repair set:"
          cat /tmp/actual-repair.txt
          diff -u /tmp/expected-repair.txt /tmp/actual-repair.txt
          git diff --check

      - name: Run all sibling generated-freshness checks
        working-directory: Weall-Protocol
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/check_generated.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          PYTHONDONTWRITEBYTECODE=1 python scripts/check_v15_public_readiness_artifacts.py
          python scripts/check_public_claim_freshness.py
          python scripts/gen_current_verified_claims.py --check

      - name: Create final-tree candidate commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Refresh deterministic v2 derivatives"
          test -z "$(git status --porcelain)"

      - name: Verify exact candidate commit in a clean checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          CANDIDATE_SHA="$(git rev-parse HEAD)"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          git clone --no-local "${GITHUB_WORKSPACE}" "$TMP/repo"
          cd "$TMP/repo"
          git checkout --detach "$CANDIDATE_SHA"
          test ! -e .github/workflows/ci-generated-freshness-closure.yml
          cd Weall-Protocol
          bash scripts/verify_release_tree.sh
          python -m pip install --upgrade pip >/dev/null
          pip install --require-hashes -r requirements-dev.lock >/dev/null
          pip install -e . --no-deps >/dev/null
          python scripts/check_generated.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          python scripts/check_v2_spec_clean_checkout.py
          PYTHONDONTWRITEBYTECODE=1 python scripts/check_v15_public_readiness_artifacts.py
          python scripts/check_public_claim_freshness.py
          python scripts/gen_current_verified_claims.py --check
          cd ..
          bash scripts/restore_m2_m3_evidence_from_git.sh --destination "$TMP/repo"
          cd Weall-Protocol
          pytest -q
          cd ../web
          npm ci >/dev/null
          cd ../Weall-Protocol
          WEALL_RELEASE_TREE_ALREADY_VERIFIED=1 bash scripts/reviewer_production_readiness_gate.sh

      - name: Push only the fully verified candidate commit
        shell: bash
        run: |
          set -Eeuo pipefail
          REMOTE_SHA="$(git ls-remote origin refs/heads/p2-complete-remediation-20260927 | awk '{print $1}')"
          test "$REMOTE_SHA" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/p2-complete-remediation-20260927
