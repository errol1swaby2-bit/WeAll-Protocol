name: A01-A20 P1 Revalidation

on:
  push:
    branches:
      - p1-revalidation-after-p0-20261005
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-p1:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked backend environment
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Record tested identity
        run: |
          echo "commit=$(git rev-parse HEAD)"
          echo "tree=$(git rev-parse HEAD^{tree})"

      - name: Canon sanity
        working-directory: Weall-Protocol
        run: |
          python -m tooling.canon_lint
          python scripts/check_generated.py

      - name: P1-06 PoH production scope-closure overlap
        working-directory: Weall-Protocol
        run: |
          pytest -q tests/test_p0_06_production_scope_closure.py

      - name: P1-09 failed-transaction replay residual overlap
        working-directory: Weall-Protocol
        run: |
          pytest -q \
            tests/test_p0_a01_a20_closure_regressions.py::test_block_inclusion_context_forces_nonce_consumption_on_apply_failure

      - name: P0 overlap regression guard
        working-directory: Weall-Protocol
        run: |
          pytest -q tests/test_p0_a01_a20_closure_regressions.py

      - name: P0 claim-scope truth remains closed
        working-directory: Weall-Protocol
        run: |
          pytest -q tests/test_current_verified_claims_p0_scope_closed_status.py

      - name: Current A01-A20 P1 remediation regressions
        working-directory: Weall-Protocol
        run: |
          pytest -q \
            tests/test_p1_latest_medium_closure.py \
            tests/test_p1_a01_route_authority.py \
            tests/test_p1_a02_strict_social_booleans.py \
            tests/test_p1_a07_tls_verification.py \
            tests/test_p1_a10_treasury_cancel_scope.py \
            tests/test_p1_a10_reward_scheduler_scope.py \
            tests/test_p1_a12_mempool_redaction.py \
            tests/test_p1_a12_observer_operator_loopback_auth.py \
            tests/test_crypto_signature_profiles.py \
            tests/test_p1_a13_key_identity_canonicalization.py \
            tests/test_p1_a14_state_publication_linearization.py \
            tests/test_tx_signature_profile_admission.py \
            tests/test_block_signature_profiles.py \
            tests/test_validator_operator_signature_profiles.py \
            tests/prod/test_public_testnet_crypto_profile_gate.py
