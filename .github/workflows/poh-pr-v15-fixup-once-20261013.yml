name: PoH PR one-time v1.5 and v2 evidence synchronization

on:
  push:
    branches:
      - fix/poh-two-node-reviewer-readiness-20261013

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install spec compiler prerequisites
        run: python -m pip install 'pyyaml==6.0.3' 'cryptography==50.0.0'
      - name: Remove ephemeral workflow before generating source fingerprints
        run: git rm -- .github/workflows/poh-pr-v15-fixup-once-20261013.yml
      - name: Generate and verify API, failure code, and v2 derivative inventories
        run: |
          cd Weall-Protocol
          python scripts/gen_api_contract_map.py
          python scripts/gen_failure_code_registry_v1_5.py
          python scripts/compile_v2_spec.py
          python scripts/gen_api_contract_map.py --check
          python scripts/gen_failure_code_registry_v1_5.py --check
          python scripts/compile_v2_spec.py --check
      - name: Commit synchronized contract and failure artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- Weall-Protocol/generated/api_contract_map_v1_5.json Weall-Protocol/generated/failure_code_registry_v1_5.json Weall-Protocol/generated/v2 web/src/generated/protocolStatus.ts
          git diff --cached --check
          git commit -m 'chore(poh): synchronize API, failure-code and v2 reviewer evidence indexes'
          git push origin HEAD:fix/poh-two-node-reviewer-readiness-20261013
      - name: Verify clean archive faithfully reproduces v2 derivatives
        run: |
          cd Weall-Protocol
          python scripts/check_v2_spec_clean_checkout.py
