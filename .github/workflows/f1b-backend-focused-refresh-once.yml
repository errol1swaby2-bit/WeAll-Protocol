# Refresh after verifying exact PostCSS and Nano ID lock entries
name: F1b Backend Test and V2 Reconcile (temporary)

on:
  push:
    branches:
      - frontend/f1-guided-account-onboarding-20261104
    paths:
      - .github/workflows/f1b-backend-focused-refresh-once.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact existing frontend PR branch
        uses: actions/checkout@v4
        with:
          ref: frontend/f1-guided-account-onboarding-20261104
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audited, hash-locked test toolchain
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps
      - name: Format the two modified regression tests before hashing source
        working-directory: Weall-Protocol
        run: |
          ruff format tests/test_account_gate_and_tx_queue_status.py tests/test_poh_reviewer_action_gating_frontend.py

      - name: Remove temporary workflow before computing source digest
        run: |
          set -euo pipefail
          rm .github/workflows/f1b-backend-focused-refresh-once.yml
          test ! -e .github/workflows/f1b-backend-focused-refresh-once.yml
      - name: Regenerate V2 compiler derivatives and check
        working-directory: Weall-Protocol
        run: |
          PYTHONPATH=src python scripts/compile_v2_spec.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
      - name: Focused previously failing backend tests
        working-directory: Weall-Protocol
        run: |
          pytest -q \
            tests/test_account_gate_and_tx_queue_status.py \
            tests/test_frontend_dependency_audit.py \
            tests/test_login_recovery_passkey_ux.py \
            tests/test_poh_reviewer_action_gating_frontend.py \
            tests/test_v2_spec_compiler.py
      - name: Python formatting and lint for changed tests
        working-directory: Weall-Protocol
        run: |
          ruff format --check \
            tests/test_account_gate_and_tx_queue_status.py \
            tests/test_frontend_dependency_audit.py \
            tests/test_login_recovery_passkey_ux.py \
            tests/test_poh_reviewer_action_gating_frontend.py \
            tests/test_v2_spec_compiler.py
          ruff check \
            tests/test_account_gate_and_tx_queue_status.py \
            tests/test_frontend_dependency_audit.py \
            tests/test_login_recovery_passkey_ux.py \
            tests/test_poh_reviewer_action_gating_frontend.py \
            tests/test_v2_spec_compiler.py
      - name: Confirm bounded generated-change boundary
        run: |
          set -euo pipefail
          mapfile -t changed < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          for file in "${changed[@]}"; do
            case "$file" in
              .github/workflows/f1b-backend-focused-refresh-once.yml|Weall-Protocol/generated/v2/*|web/src/generated/protocolStatus.ts|Weall-Protocol/tests/test_account_gate_and_tx_queue_status.py|Weall-Protocol/tests/test_poh_reviewer_action_gating_frontend.py) ;;
              *) echo "Unexpected mutation outside V2 derivatives: $file" >&2; exit 1 ;;
            esac
          done
          test "${#changed[@]}" -gt 1
      - name: Commit source-consistent V2 derivatives and self-removal atomically
        run: |
          set -euo pipefail
          git add -- Weall-Protocol/generated/v2 web/src/generated/protocolStatus.ts
          git add -- Weall-Protocol/tests/test_account_gate_and_tx_queue_status.py Weall-Protocol/tests/test_poh_reviewer_action_gating_frontend.py
          git add -u -- .github/workflows/f1b-backend-focused-refresh-once.yml
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "test(F1b): verify current onboarding contracts and reconcile V2 source evidence"
          (cd Weall-Protocol && PYTHONPATH=src python scripts/compile_v2_spec.py --check)
          git push origin HEAD:refs/heads/frontend/f1-guided-account-onboarding-20261104
