name: P1 Refresh Fee Semantic Review

on:
  push:
    branches:
      - p1-revalidation-after-p0-20261005
    paths:
      - .github/workflows/p1-refresh-fee-semantic-review.yml

permissions:
  contents: write

jobs:
  refresh-fee-semantic-review:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: p1-revalidation-after-p0-20261005
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked backend environment
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Refresh only FEE_POLICY_SET semantic binding
        working-directory: Weall-Protocol
        run: |
          python scripts/refresh_v2_semantic_reviews.py \
            --register-failure forbidden:transfer_fee_policy_not_enforced \
            --tx-type FEE_POLICY_SET \
            --reviewer "Errol Jacob Jones Swaby (maintainer-assisted P1 audit)"

      - name: Verify generated state and fee-policy regression
        working-directory: Weall-Protocol
        run: |
          python scripts/check_generated.py
          python -m tooling.canon_lint
          pytest -q tests/test_p1_latest_medium_closure.py

      - name: Commit refreshed semantic binding and derivatives
        run: |
          set -Eeuo pipefail
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git diff --cached --quiet && { echo 'No semantic-review refresh produced'; exit 1; }
          git commit -m 'audit: refresh FEE_POLICY_SET semantic review'
          git push origin HEAD:p1-revalidation-after-p0-20261005

# retry after registering Economics:transfer_fee_int stable ID

# retry after registering transfer-fee enforcement failure ID
