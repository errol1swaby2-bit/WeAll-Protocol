name: Issue71 bounded V2 generated evidence refresh (one-time)

on:
  push:
    branches:
      - feat/issue71-notification-attention-ux-20261030
    paths:
      - .github/workflows/issue71-v2-derivatives-one-time.yml

permissions:
  contents: write

jobs:
  regenerate-source-bound-derivatives:
    # This branch-only one-shot intentionally does not run for external PRs,
    # main, tags, or any other ref.
    if: github.repository == 'errol1swaby2-bit/WeAll-Protocol'
    runs-on: ubuntu-24.04
    concurrency:
      group: issue71-v2-derivatives-one-time
      cancel-in-progress: false
    steps:
      - name: Checkout exact trusted branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Verify exact triggering source identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = "feat/issue71-notification-attention-ux-20261030"
          test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" = "$GITHUB_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen compiler dependencies
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps
      - name: Run canonical V2 generator and exact consistency check
        shell: bash
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          PYTHONPATH=src python scripts/compile_v2_spec.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
      - name: Stage only officially generated V2 derivative paths
        shell: bash
        run: |
          set -Eeuo pipefail
          git add -A -- Weall-Protocol/generated/v2/ web/src/generated/protocolStatus.ts
          python - <<'PY'
          import subprocess
          allowed = ("Weall-Protocol/generated/v2/", "web/src/generated/protocolStatus.ts")
          changed = subprocess.check_output(
              ["git", "diff", "--cached", "--name-only", "--diff-filter=ACDMRT"],
              text=True,
          ).splitlines()
          if not changed:
              raise SystemExit("No generated derivatives changed; refusing empty update")
          if any(not (p.startswith(allowed[0]) or p == allowed[1]) for p in changed):
              raise SystemExit("Unapproved path in generated derivative update")
          print("Validated generated output files:", len(changed))
          for path in changed:
              print(path)
          PY
          test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" = "$GITHUB_SHA"
      - name: Commit exact generated sources to same draft PR branch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(v2): regenerate mapped Issue71 canonical derivatives (draft only)"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
