name: Complete P1 Remediation Driver v11

on:
  push:
    branches: [p1-complete-remediation-20260926]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p1-complete-remediation-20260926
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute consolidated P1 remediation pipeline
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          harness_path = Path('.github/p1-remediation/p1-complete-remediation-harness-20260926.yml')
          harness = harness_path.read_text()
          old_failures = ''.join([
              '          for failure in (\n',
              '              "forbidden:node_operator_suspended",\n',
              '              "forbidden:operator_must_match_signer",\n',
              '              "invalid_tx:missing_key_id",\n',
              '              "invalid_tx:system_tx_admission_failed",\n',
              '          ):\n',
          ])
          new_failures = ''.join([
              '          for failure in (\n',
              '              "forbidden:node_operator_suspended",\n',
              '              "forbidden:not_author",\n',
              '              "forbidden:operator_must_match_signer",\n',
              '              "forbidden:spend_already_executed",\n',
              '              "forbidden:treasury_id_mismatch",\n',
              '              "invalid_payload:missing_media_id_or_new_cid",\n',
              '              "invalid_payload:missing_media_or_target",\n',
              '              "invalid_payload:missing_spend_id",\n',
              '              "invalid_state:keys_not_configured",\n',
              '              "invalid_state:spend_missing_treasury_id",\n',
              '              "invalid_tx:missing_key_id",\n',
              '              "invalid_tx:system_tx_admission_failed",\n',
              '              "invalid_tx:unknown_key",\n',
              '              "not_found:binding_not_found",\n',
              '              "not_found:content_target_not_found",\n',
              '              "not_found:media_not_found",\n',
              '              "not_found:spend_not_found",\n',
              '          ):\n',
          ])
          if harness.count(old_failures) != 1:
              raise SystemExit(f'canonical refresh failure tuple match count={harness.count(old_failures)}')
          harness_path.write_text(harness.replace(old_failures, new_failures, 1))

          source = Path('.github/p1-remediation/p1-complete-remediation-driver-v9-source.yml').read_text()

          def step_script(name: str) -> str:
              lines = source.splitlines()
              marker = f'- name: {name}'
              start = next((i for i, line in enumerate(lines) if line.strip() == marker), None)
              if start is None:
                  raise SystemExit(f'missing v9 step: {name}')
              run_i = next((i for i in range(start + 1, len(lines)) if lines[i].strip() == 'run: |'), None)
              if run_i is None:
                  raise SystemExit(f'missing v9 run block: {name}')
              body = []
              for line in lines[run_i + 1:]:
                  if line.startswith('      - name: ') or line.startswith('      - uses: '):
                      break
                  if line.startswith('          '):
                      body.append(line[10:])
                  elif not line.strip():
                      body.append('')
                  else:
                      break
              return '\n'.join(body) + '\n'

          pipeline = [
              ('Apply corrected P1 source repairs and regression tests', '.'),
              ('Install locked dependencies', 'Weall-Protocol'),
              ('Run focused P1 validation and refresh derivatives', '.'),
              ('Remove temporary workflows and commit exact candidate', '.'),
              ('Exact-commit generated and readiness validation', 'Weall-Protocol'),
              ('Full backend regression suite', 'Weall-Protocol'),
              ('Verify validation left tracked state clean', '.'),
              ('Push validated P1 closure', '.'),
          ]
          old_harness_path = '.github/workflows/p1-complete-remediation-20260926.yml'
          new_harness_path = '.github/p1-remediation/p1-complete-remediation-harness-20260926.yml'

          for name, cwd in pipeline:
              print(f'=== {name} ===', flush=True)
              script = step_script(name).replace(old_harness_path, new_harness_path)
              if name == 'Run focused P1 validation and refresh derivatives':
                  bad = r'canonical_key=([^\\s]+)'
                  good = r'canonical_key=(\S+)'
                  if script.count(bad) != 1:
                      raise SystemExit(f'v9 stable-state regex match count={script.count(bad)}')
                  script = script.replace(bad, good, 1)
              if name == 'Remove temporary workflows and commit exact candidate':
                  script = script.replace('git rm -f .github/workflows/', 'git rm -f --ignore-unmatch .github/workflows/')
                  anchor = "git config user.name 'github-actions[bot]'\n"
                  addition = ''.join([
                      'git rm -f --ignore-unmatch .github/p1-remediation/p1-complete-remediation-harness-20260926.yml\n',
                      'git rm -f --ignore-unmatch .github/p1-remediation/p1-complete-remediation-driver-v9-source.yml\n',
                      'git rm -f --ignore-unmatch .github/workflows/p1-complete-remediation-driver-v11.yml\n',
                      anchor,
                  ])
                  if script.count(anchor) != 1:
                      raise SystemExit(f'candidate cleanup config anchor count={script.count(anchor)}')
                  script = script.replace(anchor, addition, 1)
              subprocess.run(['bash', '-Eeuo', 'pipefail', '-c', script], cwd=cwd, check=True)
          PY
