name: PR77 retained-history replay preflight (no historical proof)

on:
  push:
    branches:
      - review/pr70-pr75-pr76-consolidation-stage23-20261031
    paths:
      - Weall-Protocol/scripts/pr77_retained_history_replay.py
      - Weall-Protocol/tests/test_pr77_retained_history_replay.py
      - .github/workflows/pr77-retained-history-replay-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-intake-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked backend dependencies
        working-directory: Weall-Protocol
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install -e . --no-deps
      - name: Test archive identity and read-only safety (synthetic only)
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          ruff check scripts/pr77_retained_history_replay.py tests/test_pr77_retained_history_replay.py
          ruff format --check scripts/pr77_retained_history_replay.py tests/test_pr77_retained_history_replay.py
          python -m pytest -q tests/test_pr77_retained_history_replay.py
          echo 'Historical compatibility NOT proven: no retained ledger supplied.'
