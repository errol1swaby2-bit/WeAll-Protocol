name: PR26 Exact-Tree Derivative Finalizer

on:
  push:
    branches:
      - production-readiness-audit-20260925

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: production-readiness-audit-20260925

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked backend dependencies
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Remove this temporary workflow from final tree
        run: rm .github/workflows/pr26-finalize-derived-tree.yml

      - name: Regenerate derivatives against final tree
        working-directory: Weall-Protocol
        run: PYTHONPATH=src python scripts/compile_v2_spec.py

      - name: Verify final-tree derivatives
        working-directory: Weall-Protocol
        run: PYTHONPATH=src python scripts/compile_v2_spec.py --check

      - name: Commit final tree atomically
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .github/workflows/pr26-finalize-derived-tree.yml Weall-Protocol/generated/v2 web/src/generated/protocolStatus.ts
          git diff --cached --quiet && { echo "Expected final-tree changes were not produced"; exit 1; }
          git commit -m "Finalize exact-tree v2 derivatives"

      - name: Verify committed clean archive
        working-directory: Weall-Protocol
        run: python scripts/check_v2_spec_clean_checkout.py

      - name: Push exact final tree
        run: git push origin HEAD:production-readiness-audit-20260925
