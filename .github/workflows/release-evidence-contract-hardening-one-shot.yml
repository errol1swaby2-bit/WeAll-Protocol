name: Release evidence contract hardening one-shot

on:
  push:
    branches: ["release-evidence-contract-hardening"]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: release-evidence-contract-hardening

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Apply bounded hardening, recursive contracts, and V2 mapping
        run: |
          python scripts/Apply-Release-Evidence-Contract-Hardening-20260920.py
          python - <<'PY'
          from pathlib import Path
          import json

          contracts_path = Path("Weall-Protocol/scripts/release_evidence_contracts.py")
          text = contracts_path.read_text(encoding="utf-8")
          marker = "NO_OK_ARTIFACTS = "
          if text.count(marker) != 1:
              raise SystemExit("unexpected release_evidence_contracts.py structure")
          recursive = {
              "generated/public_beta_blocker_report_v1_5.json": "weall.v1_5.public_beta_blocker_report",
              "generated/controlled_testnet_go_gate_v1_5.json": "weall.v1_5.controlled_testnet_go_gate",
              "generated/release_evidence_manifest_v1_5.json": "weall.v1_5.release_evidence_manifest",
          }
          injection = f"EXPECTED_SCHEMAS.update({recursive!r})\n\n"
          text = text.replace(marker, injection + marker, 1)
          contracts_path.write_text(text, encoding="utf-8")

          mapping_path = Path("Weall-Protocol/specs/v2/source/source_mappings.json")
          mapping_doc = json.loads(mapping_path.read_text(encoding="utf-8"))
          mappings = mapping_doc.get("mappings")
          if not isinstance(mappings, list):
              raise SystemExit("source_mappings.json missing mappings list")
          mapping = {
              "id": "map-release-evidence-contracts",
              "path": "scripts/release_evidence_contracts.py",
              "source_class": "protocol_relevant",
              "source_type": "tooling",
              "protocol_relevant": True,
              "implementation_evidence": True,
              "ledger_semantics": False,
              "drives": {
                  "primary_mechanism_id": "M-076",
                  "secondary_mechanism_ids": [],
                  "requirement_ids": [],
                  "algorithm_ids": [],
                  "target_contract_ids": [],
                  "message_contract_ids": [],
                  "state_contract_ids": [],
                  "scheduler_contract_ids": [],
                  "affected_registers": ["implementation_evidence"],
              },
              "requires_transactions": False,
              "owner_phase": "v2-compilation",
              "notes": "Fail-closed release evidence contract validation for tracked readiness artifacts and recursive release evidence inputs.",
          }
          duplicate = [
              item
              for item in mappings
              if isinstance(item, dict)
              and (item.get("id") == mapping["id"] or item.get("path") == mapping["path"])
          ]
          if duplicate:
              raise SystemExit("release evidence contract source mapping already exists")
          mappings.append(mapping)
          mapping_path.write_text(json.dumps(mapping_doc, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Remove temporary helpers before source-sensitive generation
        run: |
          rm scripts/Apply-Release-Evidence-Contract-Hardening-20260920.py
          rm .github/workflows/release-evidence-contract-hardening-one-shot.yml

      - name: Format, regenerate, diagnose, and validate
        working-directory: Weall-Protocol
        run: |
          ruff format \
            scripts/release_evidence_contracts.py \
            scripts/gen_release_evidence_manifest_v1_5.py \
            scripts/run_controlled_testnet_go_gate_v1_5.py \
            scripts/gen_final_public_observer_controlled_testnet_go_gate_v1_5.py \
            tests/test_release_evidence_contract_fail_closed.py
          ruff check \
            scripts/release_evidence_contracts.py \
            scripts/gen_release_evidence_manifest_v1_5.py \
            scripts/run_controlled_testnet_go_gate_v1_5.py \
            scripts/gen_final_public_observer_controlled_testnet_go_gate_v1_5.py \
            tests/test_release_evidence_contract_fail_closed.py

          generate_controlled_gate() {
            PYTHONPATH=src:scripts python - <<'PY'
          from run_controlled_testnet_go_gate_v1_5 import OUT, _canon, build

          payload = build()
          if payload.get("public_beta_ready") is not False:
              raise SystemExit("controlled gate unexpectedly claims public beta readiness")
          OUT.parent.mkdir(parents=True, exist_ok=True)
          OUT.write_text(_canon(payload), encoding="utf-8")
          print(f"wrote {OUT}")
          PY
          }

          generate_final_gate() {
            PYTHONPATH=src:scripts python - <<'PY'
          from gen_final_public_observer_controlled_testnet_go_gate_v1_5 import OUT, _pretty, build

          payload = build()
          invalid = {
              key: value
              for key, value in payload.get("generated_artifacts", {}).items()
              if value.get("present") is not True or value.get("contract_valid") is not True
          }
          print("repo_package_ready:", payload.get("repo_package_ready"))
          print("external_blockers_still_open:", payload.get("external_blockers_still_open"))
          print("public_beta_ready:", payload.get("blocker_counts", {}).get("public_beta_ready"))
          print("invalid_generated_artifacts:", invalid)
          OUT.parent.mkdir(parents=True, exist_ok=True)
          OUT.write_text(_pretty(payload), encoding="utf-8")
          if payload.get("repo_package_ready") is not True:
              raise SystemExit("final gate package contract validation failed")
          if payload.get("external_blockers_still_open") is not True:
              raise SystemExit("expected external blockers are not preserved")
          if payload.get("blocker_counts", {}).get("public_beta_ready") is not False:
              raise SystemExit("final gate unexpectedly claims public beta readiness")
          print(f"wrote {OUT}")
          PY
          }

          PYTHONPATH=src:scripts python scripts/gen_release_evidence_manifest_v1_5.py
          generate_controlled_gate
          generate_final_gate
          PYTHONPATH=src:scripts python scripts/gen_release_evidence_manifest_v1_5.py
          generate_controlled_gate
          generate_final_gate
          PYTHONPATH=src python scripts/gen_current_verified_claims.py
          PYTHONPATH=src:scripts python scripts/compile_v2_spec.py

          PYTHONPATH=src:scripts pytest -q \
            tests/test_release_evidence_contract_fail_closed.py \
            tests/test_current_verified_claims_fail_closed.py \
            tests/test_public_beta_blocker_report_fail_closed.py

          PYTHONPATH=src:scripts python scripts/gen_release_evidence_manifest_v1_5.py --check
          PYTHONPATH=src:scripts python scripts/run_controlled_testnet_go_gate_v1_5.py --check
          PYTHONPATH=src:scripts python scripts/gen_final_public_observer_controlled_testnet_go_gate_v1_5.py --check
          PYTHONPATH=src:scripts python scripts/check_v15_public_readiness_artifacts.py --require-git-tracked
          PYTHONPATH=src python scripts/gen_current_verified_claims.py --check
          PYTHONPATH=src python scripts/check_public_claim_freshness.py
          PYTHONPATH=src:scripts python scripts/compile_v2_spec.py --check
          git diff --check

      - name: Commit validated final tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git diff --cached --check
          git commit -m "Harden release evidence aggregation contracts"
          git push origin HEAD:release-evidence-contract-hardening
