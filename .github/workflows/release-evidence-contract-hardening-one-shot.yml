name: Release evidence contract hardening one-shot

on:
  push:
    branches: ["release-evidence-contract-hardening"]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: release-evidence-contract-hardening

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Apply bounded hardening, recursive contracts, V2 mapping, and boolean-boundary audit fixes
        run: |
          python scripts/Apply-Release-Evidence-Contract-Hardening-20260920.py
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one target in {path}, found {count}: {old!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          contracts_path = Path("Weall-Protocol/scripts/release_evidence_contracts.py")
          text = contracts_path.read_text(encoding="utf-8")
          marker = "NO_OK_ARTIFACTS = "
          if text.count(marker) != 1:
              raise SystemExit("unexpected release_evidence_contracts.py structure")
          recursive = {
              "generated/public_beta_blocker_report_v1_5.json": "weall.v1_5.public_beta_blocker_report",
              "generated/controlled_testnet_go_gate_v1_5.json": "weall.v1_5.controlled_testnet_go_gate",
              "generated/release_evidence_manifest_v1_5.json": "weall.v1_5.release_evidence_manifest",
          }
          injection = f"EXPECTED_SCHEMAS.update({recursive!r})\n\n"
          text = text.replace(marker, injection + marker, 1)
          contracts_path.write_text(text, encoding="utf-8")

          mapping_path = Path("Weall-Protocol/specs/v2/source/source_mappings.json")
          mapping_doc = json.loads(mapping_path.read_text(encoding="utf-8"))
          mappings = mapping_doc.get("mappings")
          if not isinstance(mappings, list):
              raise SystemExit("source_mappings.json missing mappings list")
          mapping = {
              "id": "map-release-evidence-contracts",
              "path": "scripts/release_evidence_contracts.py",
              "source_class": "protocol_relevant",
              "source_type": "tooling",
              "protocol_relevant": True,
              "implementation_evidence": True,
              "ledger_semantics": False,
              "drives": {
                  "primary_mechanism_id": "M-076",
                  "secondary_mechanism_ids": [],
                  "requirement_ids": [],
                  "algorithm_ids": [],
                  "target_contract_ids": [],
                  "message_contract_ids": [],
                  "state_contract_ids": [],
                  "scheduler_contract_ids": [],
                  "affected_registers": ["implementation_evidence"],
              },
              "requires_transactions": False,
              "owner_phase": "v2-compilation",
              "notes": "Fail-closed release evidence contract validation for tracked readiness artifacts and recursive release evidence inputs.",
          }
          duplicate = [
              item
              for item in mappings
              if isinstance(item, dict)
              and (item.get("id") == mapping["id"] or item.get("path") == mapping["path"])
          ]
          if duplicate:
              raise SystemExit("release evidence contract source mapping already exists")
          mappings.append(mapping)
          mapping_path.write_text(json.dumps(mapping_doc, indent=2) + "\n", encoding="utf-8")

          # Audit class: Python truthiness must not turn malformed serialized boolean
          # fields (for example "false") into authority/readiness/success.
          testnet = Path("Weall-Protocol/src/weall/runtime/testnet_capabilities.py")
          replace_once(
              testnet,
              '            "ok": bool(payload.get("ok", True)) if payload else False,\n',
              '            "ok": payload.get("ok") is True if payload else False,\n',
          )
          replace_once(
              testnet,
              '            "public_beta_ready": bool(blocker_report.get("public_beta_ready", False))\n            if blocker_report\n            else False,\n',
              '            "public_beta_ready": blocker_report.get("public_beta_ready") is True\n            if blocker_report\n            else False,\n',
          )
          replace_once(
              testnet,
              '            "mainnet_ready": bool(blocker_report.get("mainnet_ready", False))\n            if blocker_report\n            else False,\n',
              '            "mainnet_ready": blocker_report.get("mainnet_ready") is True\n            if blocker_report\n            else False,\n',
          )

          incident = Path("Weall-Protocol/src/weall/runtime/operator_incident_report.py")
          replace_once(
              incident,
              '    if compatibility_contract and not bool(compatibility_contract.get("ok", True)):\n',
              '    if compatibility_contract and compatibility_contract.get("ok") is not True:\n',
          )
          replace_once(
              incident,
              '    if not bool(remote_forensics.get("ok", True)):\n',
              '    if remote_forensics.get("ok") is not True:\n',
          )
          replace_once(
              incident,
              '    stalled = bool(remote_forensics.get("stalled", False))\n',
              '    stalled = remote_forensics.get("stalled") is True\n',
          )
          replace_once(
              incident,
              '        "bootstrap_ok": bool(bootstrap.get("ok", False)),\n',
              '        "bootstrap_ok": bootstrap.get("ok") is True,\n',
          )
          replace_once(
              incident,
              '        "remote_ok": bool(remote.get("ok", True)) if remote else True,\n',
              '        "remote_ok": remote.get("ok") is True if remote else True,\n',
          )
          replace_once(
              incident,
              '        "remote_stalled": bool(remote.get("stalled", False)) if remote else False,\n',
              '        "remote_stalled": remote.get("stalled") is True if remote else False,\n',
          )
          replace_once(
              incident,
              '        "compatibility_contract_ok": bool(compatibility_contract.get("ok", True)),\n',
              '        "compatibility_contract_ok": compatibility_contract.get("ok") is True,\n',
          )
          replace_once(
              incident,
              '        "strict_runtime_authority_mode": bool(\n            authority_contract.get("strict_runtime_authority_mode", False)\n        ),\n',
              '        "strict_runtime_authority_mode": authority_contract.get("strict_runtime_authority_mode")\n        is True,\n',
          )
          replace_once(
              incident,
              '        "validator_effective": bool(authority_contract.get("validator_effective", False)),\n',
              '        "validator_effective": authority_contract.get("validator_effective") is True,\n',
          )
          replace_once(
              incident,
              '        "helper_effective": bool(authority_contract.get("helper_effective", False)),\n',
              '        "helper_effective": authority_contract.get("helper_effective") is True,\n',
          )

          security = Path("Weall-Protocol/src/weall/api/security.py")
          replace_once(
              security,
              '    if not bool(srec.get("active", False)):\n',
              '    if srec.get("active") is not True:\n',
          )

          authority = Path("Weall-Protocol/src/weall/runtime/runtime_authority.py")
          replace_once(
              authority,
              '    helper_requested = bool(lifecycle.get("helper_enabled_requested", cfg.helper_enabled_requested))\n    helper_effective = bool(lifecycle.get("helper_enabled_effective", False))\n    bft_requested = bool(lifecycle.get("bft_enabled_requested", cfg.bft_enabled_requested))\n    bft_effective = bool(lifecycle.get("bft_enabled_effective", False))\n',
              '    helper_requested_raw = lifecycle.get(\n        "helper_enabled_requested", cfg.helper_enabled_requested\n    )\n    bft_requested_raw = lifecycle.get("bft_enabled_requested", cfg.bft_enabled_requested)\n    helper_requested = (\n        helper_requested_raw\n        if isinstance(helper_requested_raw, bool)\n        else bool(cfg.helper_enabled_requested)\n    )\n    helper_effective = lifecycle.get("helper_enabled_effective") is True\n    bft_requested = (\n        bft_requested_raw\n        if isinstance(bft_requested_raw, bool)\n        else bool(cfg.bft_enabled_requested)\n    )\n    bft_effective = lifecycle.get("bft_enabled_effective") is True\n',
          )
          replace_once(
              authority,
              '            return bool(executor._bft_enabled_effective)\n',
              '            return executor._bft_enabled_effective is True\n',
          )
          replace_once(
              authority,
              '                        return bool(status.get("bft_enabled_effective", False))\n                    requested = bool(status.get("bft_enabled_requested", default))\n                    return bool(status.get("bft_enabled_effective", requested) or requested)\n',
              '                        return status.get("bft_enabled_effective") is True\n                    requested_raw = status.get("bft_enabled_requested", default)\n                    requested = (\n                        requested_raw if isinstance(requested_raw, bool) else bool(default)\n                    )\n                    effective = status.get("bft_enabled_effective") is True\n                    return effective or requested\n',
          )

          attester = Path("Weall-Protocol/src/weall/services/validator_attester.py")
          attester_text = attester.read_text(encoding="utf-8")
          before = attester_text
          attester_text = re.sub(
              r'(?m)^(\s*)if not ([A-Za-z_][A-Za-z0-9_]*)\.get\("ok"\):$',
              r'\1if \2.get("ok") is not True:',
              attester_text,
          )
          attester_text = re.sub(
              r'(?m)^(\s*)if ([A-Za-z_][A-Za-z0-9_]*)\.get\("ok"\):$',
              r'\1if \2.get("ok") is True:',
              attester_text,
          )
          if attester_text == before:
              raise SystemExit("validator_attester ok-boundary audit made no replacements")
          attester.write_text(attester_text, encoding="utf-8")

          prod_smoke = Path("Weall-Protocol/scripts/prod_smoke.py")
          replace_once(
              prod_smoke,
              '            assert bool(health.get("ok")) is True, (\n',
              '            assert health.get("ok") is True, (\n',
          )
          replay = Path("Weall-Protocol/scripts/replay_consistency_audit.py")
          replace_once(
              replay,
              '    return 0 if bool(summary.get("ok")) else 1\n',
              '    return 0 if summary.get("ok") is True else 1\n',
          )
          manifest_check = Path("Weall-Protocol/scripts/prod_chain_manifest_check.sh")
          replace_once(
              manifest_check,
              'if not status.get("ok"):\n',
              'if status.get("ok") is not True:\n',
          )
          docker_gate = Path("Weall-Protocol/scripts/docker_genesis_api_boot_gate.sh")
          replace_once(
              docker_gate,
              '        if not payload.get("ok"):\n',
              '        if payload.get("ok") is not True:\n',
          )

          regression = Path("Weall-Protocol/tests/test_fail_closed_boolean_boundaries.py")
          regression.write_text(
              '''from __future__ import annotations\n\nimport pytest\nfrom starlette.requests import Request\n\nfrom weall.api import security\nfrom weall.runtime import testnet_capabilities\nfrom weall.runtime.operator_incident_report import (\n    classify_local_severity,\n    classify_remote_severity,\n)\nfrom weall.runtime.runtime_authority import authority_contract_from_lifecycle\n\n\ndef test_serialized_false_does_not_pass_testnet_artifact_or_readiness_boundaries(monkeypatch) -> None:\n    def fake_load(rel: str) -> dict:\n        if rel == "generated/public_beta_blocker_report_v1_5.json":\n            return {\n                "schema": "weall.v1_5.public_beta_blocker_report",\n                "ok": "false",\n                "public_beta_ready": "false",\n                "mainnet_ready": "true",\n                "blocker_catalog_count": 15,\n                "blocker_count": 15,\n            }\n        return {"schema": "example", "ok": "true"}\n\n    monkeypatch.setattr(testnet_capabilities, "_load_artifact", fake_load)\n    surface = testnet_capabilities.build_testnet_capability_surface({})\n    assert all(item["ok"] is False for item in surface["required_artifacts"].values())\n    report = surface["public_beta_blocker_report"]\n    assert report["public_beta_ready"] is False\n    assert report["mainnet_ready"] is False\n\n\ndef test_operator_incident_external_boolean_fields_fail_closed() -> None:\n    assert (\n        classify_local_severity(\n            bootstrap_report={"issues": [], "release_manifest": {}},\n            manifest_report={"compatibility_contract": {"ok": "false"}},\n        )\n        == "critical"\n    )\n    assert classify_remote_severity(remote_forensics={"ok": "false"}) == "critical"\n    assert (\n        classify_remote_severity(\n            remote_forensics={\n                "ok": True,\n                "stalled": "false",\n                "pending_fetch_requests_count": 1,\n                "recent_rejection_summary": {"count": 0},\n            }\n        )\n        == "ok"\n    )\n\n\ndef test_session_active_requires_exact_true(monkeypatch) -> None:\n    scope = {\n        "type": "http",\n        "method": "GET",\n        "path": "/",\n        "headers": [\n            (b"x-weall-account", b"acct"),\n            (b"x-weall-session-key", b"key"),\n        ],\n    }\n    request = Request(scope)\n    state = {"accounts": {"acct": {"session_keys": {"key": {}}}}}\n    monkeypatch.setattr(\n        security,\n        "session_record_for",\n        lambda sessions, key: {"active": "false", "ttl_s": 0},\n    )\n    with pytest.raises(PermissionError, match="session_revoked"):\n        security.require_account_session(request, state)\n\n\ndef test_runtime_authority_rejects_truthy_effective_strings() -> None:\n    contract = authority_contract_from_lifecycle(\n        {\n            "helper_enabled_effective": "false",\n            "bft_enabled_effective": "true",\n            "service_roles_effective": [],\n        },\n        source="test",\n    )\n    assert contract["helper_effective"] is False\n    assert contract["bft_effective"] is False\n    assert contract["validator_effective"] is False\n''',
              encoding="utf-8",
          )
          PY

      - name: Remove temporary helpers before source-sensitive generation
        run: |
          rm scripts/Apply-Release-Evidence-Contract-Hardening-20260920.py
          rm .github/workflows/release-evidence-contract-hardening-one-shot.yml

      - name: Format, regenerate, diagnose, and validate
        working-directory: Weall-Protocol
        run: |
          ruff format \
            scripts/release_evidence_contracts.py \
            scripts/gen_release_evidence_manifest_v1_5.py \
            scripts/run_controlled_testnet_go_gate_v1_5.py \
            scripts/gen_final_public_observer_controlled_testnet_go_gate_v1_5.py \
            scripts/prod_smoke.py \
            scripts/replay_consistency_audit.py \
            src/weall/api/security.py \
            src/weall/runtime/testnet_capabilities.py \
            src/weall/runtime/operator_incident_report.py \
            src/weall/runtime/runtime_authority.py \
            src/weall/services/validator_attester.py \
            tests/test_release_evidence_contract_fail_closed.py \
            tests/test_fail_closed_boolean_boundaries.py
          ruff check \
            scripts/release_evidence_contracts.py \
            scripts/gen_release_evidence_manifest_v1_5.py \
            scripts/run_controlled_testnet_go_gate_v1_5.py \
            scripts/gen_final_public_observer_controlled_testnet_go_gate_v1_5.py \
            scripts/prod_smoke.py \
            scripts/replay_consistency_audit.py \
            src/weall/api/security.py \
            src/weall/runtime/testnet_capabilities.py \
            src/weall/runtime/operator_incident_report.py \
            src/weall/runtime/runtime_authority.py \
            src/weall/services/validator_attester.py \
            tests/test_release_evidence_contract_fail_closed.py \
            tests/test_fail_closed_boolean_boundaries.py

          generate_controlled_gate() {
            PYTHONPATH=src:scripts python - <<'PY'
          from run_controlled_testnet_go_gate_v1_5 import OUT, _canon, build

          payload = build()
          if payload.get("public_beta_ready") is not False:
              raise SystemExit("controlled gate unexpectedly claims public beta readiness")
          OUT.parent.mkdir(parents=True, exist_ok=True)
          OUT.write_text(_canon(payload), encoding="utf-8")
          print(f"wrote {OUT}")
          PY
          }

          generate_final_gate() {
            PYTHONPATH=src:scripts python - <<'PY'
          from gen_final_public_observer_controlled_testnet_go_gate_v1_5 import OUT, _pretty, build

          payload = build()
          invalid = {
              key: value
              for key, value in payload.get("generated_artifacts", {}).items()
              if value.get("present") is not True or value.get("contract_valid") is not True
          }
          print("repo_package_ready:", payload.get("repo_package_ready"))
          print("external_blockers_still_open:", payload.get("external_blockers_still_open"))
          print("public_beta_ready:", payload.get("blocker_counts", {}).get("public_beta_ready"))
          print("invalid_generated_artifacts:", invalid)
          OUT.parent.mkdir(parents=True, exist_ok=True)
          OUT.write_text(_pretty(payload), encoding="utf-8")
          if payload.get("repo_package_ready") is not True:
              raise SystemExit("final gate package contract validation failed")
          if payload.get("external_blockers_still_open") is not True:
              raise SystemExit("expected external blockers are not preserved")
          if payload.get("blocker_counts", {}).get("public_beta_ready") is not False:
              raise SystemExit("final gate unexpectedly claims public beta readiness")
          print(f"wrote {OUT}")
          PY
          }

          PYTHONPATH=src:scripts python scripts/gen_release_evidence_manifest_v1_5.py
          generate_controlled_gate
          generate_final_gate
          PYTHONPATH=src:scripts python scripts/gen_release_evidence_manifest_v1_5.py
          generate_controlled_gate
          generate_final_gate
          PYTHONPATH=src python scripts/gen_current_verified_claims.py
          PYTHONPATH=src:scripts python scripts/compile_v2_spec.py

          PYTHONPATH=src:scripts pytest -q \
            tests/test_release_evidence_contract_fail_closed.py \
            tests/test_fail_closed_boolean_boundaries.py \
            tests/test_current_verified_claims_fail_closed.py \
            tests/test_public_beta_blocker_report_fail_closed.py

          PYTHONPATH=src:scripts python scripts/gen_release_evidence_manifest_v1_5.py --check
          PYTHONPATH=src:scripts python scripts/run_controlled_testnet_go_gate_v1_5.py --check
          PYTHONPATH=src:scripts python scripts/gen_final_public_observer_controlled_testnet_go_gate_v1_5.py --check
          PYTHONPATH=src:scripts python scripts/check_v15_public_readiness_artifacts.py --require-git-tracked
          PYTHONPATH=src python scripts/gen_current_verified_claims.py --check
          PYTHONPATH=src python scripts/check_public_claim_freshness.py
          PYTHONPATH=src:scripts python scripts/compile_v2_spec.py --check
          git diff --check

      - name: Commit validated final tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git diff --cached --check
          git commit -m "Harden release evidence and boolean trust boundaries"
          git push origin HEAD:release-evidence-contract-hardening
