name: P0-06A one-shot apply

on:
  push:
    branches:
      - p0-03-production-closure-staging-20261001

permissions:
  contents: write

jobs:
  apply-p0-06a:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: p0-03-production-closure-staging-20261001
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Decode and verify patch
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '%s' '' | base64 -d | gzip -d > /tmp/p0-06a.patch
          echo '835f4b6b32f11e473c3ec4b3a7cf8539cb295224e2b8e620c15801393c4f781d  /tmp/p0-06a.patch' | sha256sum -c -
          git apply --check /tmp/p0-06a.patch
          git apply /tmp/p0-06a.patch

      - name: Install locked backend and format focused changes
        working-directory: Weall-Protocol
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps
          ruff format src/weall/runtime/tx_schema.py src/weall/api/routes_public_parts/poh.py src/weall/runtime/apply/poh.py tests/test_p0_06a_duplicate_account_adjudication.py
          ruff check src/weall/runtime/tx_schema.py src/weall/api/routes_public_parts/poh.py src/weall/runtime/apply/poh.py tests/test_p0_06a_duplicate_account_adjudication.py

      - name: Focused P0-06A regression proof
        working-directory: Weall-Protocol
        shell: bash
        run: |
          set -Eeuo pipefail
          pytest -q tests/test_p0_06a_duplicate_account_adjudication.py tests/test_behavior_m1_m10.py
          python scripts/check_generated.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          python scripts/gen_current_verified_claims.py --check

      - name: Commit source changes and remove one-shot workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/p0-06a-one-shot-apply.yml
          git add Weall-Protocol/src/weall/runtime/tx_schema.py Weall-Protocol/src/weall/api/routes_public_parts/poh.py Weall-Protocol/src/weall/runtime/apply/poh.py Weall-Protocol/tests/test_p0_06a_duplicate_account_adjudication.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'P0-06A: bind duplicate-account adjudication'
          git push origin HEAD:p0-03-production-closure-staging-20261001
