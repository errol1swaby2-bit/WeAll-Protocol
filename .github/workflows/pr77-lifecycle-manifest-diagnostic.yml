name: PR77 lifecycle manifest drift diagnostic (no attestation)

on:
  push:
    branches:
      - review/pr70-pr75-pr76-consolidation-stage23-20261031
    paths:
      - Weall-Protocol/src/weall/runtime/bounded_rollback.py
      - Weall-Protocol/src/weall/runtime/apply/roles.py
      - Weall-Protocol/tests/test_bounded_rollback_equivalence.py
      - .github/workflows/pr77-lifecycle-manifest-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-only:
    if: github.repository == 'errol1swaby2-bit/WeAll-Protocol'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout the exact draft head
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked backend dependencies
        working-directory: Weall-Protocol
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install -e . --no-deps

      - name: Generate candidate and compare with committed lifecycle semantics
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python scripts/gen_tx_lifecycle_assurance_v1_5.py
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          path = "Weall-Protocol/generated/tx_lifecycle_assurance_v1_5.json"
          old_bytes = subprocess.check_output(["git", "show", f"HEAD:{path}"], cwd="..")
          new_bytes = Path("generated/tx_lifecycle_assurance_v1_5.json").read_bytes()
          old = json.loads(old_bytes)
          new = json.loads(new_bytes)
          assert len(old.get("rows", [])) == len(new.get("rows", [])) == 236, "incomplete lifecycle vectors"
          original = {r["tx_type"]: r for r in old["rows"]}
          candidate = {r["tx_type"]: r for r in new["rows"]}
          assert len(original) == len(candidate) == 236, "duplicate lifecycle transaction types"
          assert set(original) == set(candidate), "changed transaction inventory"
          changed = sorted(k for k in original if original[k] != candidate[k])
          fields = {
              k: sorted(
                  field
                  for field in set(original[k]) | set(candidate[k])
                  if original[k].get(field) != candidate[k].get(field)
              )
              for k in changed
          }
          meta = sorted(
              k for k in set(old) | set(new)
              if k != "rows" and old.get(k) != new.get(k)
          )
          report = {
              "schema": "weall.pr77.lifecycle_manifest_drift_diagnostic.v1",
              "no_semantic_approval": True,
              "approved_v2_review_rows_changed": False,
              "old_sha256": hashlib.sha256(old_bytes).hexdigest(),
              "candidate_sha256": hashlib.sha256(new_bytes).hexdigest(),
              "changed_tx_types": changed,
              "changed_fields_by_tx_type": fields,
              "changed_top_level_fields": meta,
              "has_drift": bool(old_bytes != new_bytes),
          }
          Path("pr77_lifecycle_drift_report.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          if old_bytes != new_bytes:
              raise SystemExit("FAIL_CLOSED: generated lifecycle manifest differs; review candidate artifact before any refresh")
          PY

      - name: Upload read-only evidence even when drift gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr77-lifecycle-drift-no-approval
          path: |
            Weall-Protocol/pr77_lifecycle_drift_report.json
            Weall-Protocol/generated/tx_lifecycle_assurance_v1_5.json
          if-no-files-found: warn
