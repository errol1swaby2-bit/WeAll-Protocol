name: Temporary V2 Sync Repair

on:
  push:
    branches: ["audit-r20-comprehensive-remediation"]

permissions:
  contents: write

concurrency:
  group: temporary-v2-sync-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message || '', '[v2-sync-repair-applied]') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Weall-Protocol
    env:
      PYTHONPATH: src:scripts

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: audit-r20-comprehensive-remediation
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked backend tooling
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Apply exact Ruff formatting repair
        run: |
          set -Eeuo pipefail
          ruff format scripts/bootstrap_r20_remediation.py scripts/patch_r20_materialized_drivers.py
          ruff format --check scripts/bootstrap_r20_remediation.py scripts/patch_r20_materialized_drivers.py
          ruff check scripts/bootstrap_r20_remediation.py scripts/patch_r20_materialized_drivers.py

      - name: Regenerate v2 derivatives with authoritative compiler
        run: |
          set -Eeuo pipefail
          python scripts/compile_v2_spec.py
          python scripts/compile_v2_spec.py --check

      - name: Validate generated and canon surfaces
        run: |
          set -Eeuo pipefail
          python -m tooling.canon_lint
          python scripts/check_generated.py
          git -C .. diff --check

      - name: Remove temporary repair workflow and commit exact outputs
        run: |
          set -Eeuo pipefail
          rm -f ../.github/workflows/temporary-v2-sync-repair.yml
          git -C .. add -A
          if git -C .. diff --cached --quiet; then
            echo "No repair delta was produced."
            exit 1
          fi
          git -C .. config user.name "github-actions[bot]"
          git -C .. config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .. commit -m "fix: format r20 tooling and refresh v2 derivatives [v2-sync-repair-applied]"

      - name: Push exact repaired branch
        run: |
          set -Eeuo pipefail
          git -C .. push origin HEAD:audit-r20-comprehensive-remediation
