name: Temporary fresh-clone derivative refresh

on:
  push:
    branches:
      - fix/fresh-clone-onboarding-first-run-20261014
    paths:
      - .github/workflows/temp-fresh-clone-derivative-refresh-20261014.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Locked backend install
        working-directory: Weall-Protocol
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install -e . --no-deps
      - name: Recompile exact-source V2 derivatives
        working-directory: Weall-Protocol
        run: |
          PYTHONPATH=src:scripts python scripts/compile_v2_spec.py
          PYTHONPATH=src:scripts python scripts/compile_v2_spec.py --check
      - name: Check focused first-run safety regressions
        working-directory: Weall-Protocol
        run: |
          python -m pytest -q tests/test_fresh_clone_onboarding_guide.py tests/test_observer_boot_onboarding_safety.py tests/test_onboarding_boot_invokes_node_boot_with_bash.py
          ruff format --check tests/test_fresh_clone_onboarding_guide.py
          ruff check tests/test_fresh_clone_onboarding_guide.py
      - name: Commit refreshed source-bound derivatives and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "weall-reviewer-ci"
          git config user.email "weall-reviewer-ci@users.noreply.github.com"
          git add -u Weall-Protocol/generated/v2 web/src/generated/protocolStatus.ts
          git rm .github/workflows/temp-fresh-clone-derivative-refresh-20261014.yml
          git diff --cached --name-only
          git commit -m "chore(onboarding): regenerate exact-source V2 derivatives for first-run fixes"
          git push origin "HEAD:refs/heads/fix/fresh-clone-onboarding-first-run-20261014"
