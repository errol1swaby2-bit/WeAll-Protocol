name: A15 F003 PR38 Closure V5

on:
  push:
    branches: ["p0-03-production-closure-staging-20261001"]

permissions:
  contents: write

jobs:
  closure:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: p0-03-production-closure-staging-20261001

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked backend
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Patch closure dependency order and integration fallout
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("Weall-Protocol/scripts/a15_f003_pr38_closure_v5.sh")
          text = path.read_text(encoding="utf-8")

          route_anchor = 'WEALL_REPO_ROOT="$PROTO" python /tmp/a15_f003_register_v2_route.py\n'
          route_insert = route_anchor + r'''
          python - <<'PYROUTE'
          from pathlib import Path

          path = Path("tests/test_v2_spec_compiler.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              'assert payload["route_count"] == 162': 'assert payload["route_count"] == 163',
              'assert payload["unique_method_path_count"] == 158': 'assert payload["unique_method_path_count"] == 159',
              'assert coverage["routes"] == 162': 'assert coverage["routes"] == 163',
              'assert closure["semantic_reviews"]["route_reviews"] == 162': 'assert closure["semantic_reviews"]["route_reviews"] == 163',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"route_count_assertion_not_found_once:{old}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PYROUTE
          '''.replace("          ", "")
          if text.count(route_anchor) != 1:
              raise SystemExit("route_registration_anchor_not_found_once")
          text = text.replace(route_anchor, route_insert, 1)

          identity_anchor = "python scripts/gen_public_testnet_v1_chain_identity.py --check\n"
          identity_insert = identity_anchor + r'''
          python - <<'PYIDENT'
          import json
          from pathlib import Path

          manifest = json.loads(Path("configs/chains/weall-testnet-v1.json").read_text(encoding="utf-8"))
          trust_path = Path("configs/public_testnet_trust_roots.json")
          registry_path = Path("configs/public_testnet_seed_registry.json")
          trust = json.loads(trust_path.read_text(encoding="utf-8"))
          registry = json.loads(registry_path.read_text(encoding="utf-8"))

          for key in ("network_id", "chain_id", "genesis_hash", "protocol_profile_hash", "tx_index_hash"):
              trust[key] = manifest[key]
              registry[key] = manifest[key]
          trust["genesis_state_root"] = manifest["genesis_state_root"]
          registry["genesis_state_root"] = manifest["genesis_state_root"]

          rotation = registry.get("seed_registry_rotation_commitment")
          if not isinstance(rotation, dict):
              rotation = {}
          for key in ("genesis_hash", "genesis_state_root", "protocol_profile_hash", "tx_index_hash"):
              rotation[key] = manifest[key]
          registry["seed_registry_rotation_commitment"] = rotation
          registry["seed_registry_rotation_reason"] = "a15_f003_account_registration_scarcity_chain_identity_change_20261004"
          registry["seed_registry_rotation_required"] = True
          registry["pq_resign_required_before_public_testnet"] = True
          registry["seed_registry_signature"] = ""

          note = (
              "A15-F003 account-registration scarcity changes the deterministic testnet genesis commitment; "
              "the checked-in registry remains fail-closed until the operator-held ML-DSA key re-signs it."
          )
          notes = trust.get("notes")
          if not isinstance(notes, list):
              notes = []
          if note not in notes:
              notes.append(note)
          trust["notes"] = notes

          trust_path.write_text(json.dumps(trust, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          registry_path.write_text(json.dumps(registry, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PYIDENT
          '''.replace("          ", "")
          if text.count(identity_anchor) != 1:
              raise SystemExit("testnet_identity_check_anchor_not_found_once")
          text = text.replace(identity_anchor, identity_insert, 1)

          old = "python scripts/gen_api_contract_map.py\npython scripts/gen_failure_code_registry_v1_5.py\n\n# V2 must be the final generator after all source/config/v1.5 evidence normalization.\npython scripts/compile_v2_spec.py\n"
          new = "python scripts/gen_api_contract_map.py\npython scripts/gen_failure_code_registry_v1_5.py\npython scripts/gen_genesis_testnet_launch_readiness_v1_5.py\npython scripts/gen_b528_b532_completion_proof_v1_5.py\npython scripts/gen_b534_b538_completion_proof_v1_5.py\npython scripts/gen_b539_b543_production_path_proof_v1_5.py\npython scripts/gen_b549_b553_controlled_testnet_candidate_proof_v1_5.py\npython scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py\npython scripts/gen_public_beta_blocker_report_v1_5.py\npython scripts/gen_release_evidence_manifest_v1_5.py\npython scripts/gen_current_verified_claims.py\n\n# V2 must be the final generator after all source/config/v1.5 evidence normalization.\npython scripts/compile_v2_spec.py\n"
          if text.count(old) != 1:
              raise SystemExit("v15_generator_sequence_not_found_once")
          text = text.replace(old, new, 1)

          marker = '    "Weall-Protocol/generated/failure_code_registry_v1_5.json",\n'
          extras = [
              "Weall-Protocol/generated/genesis_testnet_launch_readiness_v1_5.json",
              "Weall-Protocol/generated/b528_b532_completion_proof_v1_5.json",
              "Weall-Protocol/generated/b534_b538_completion_proof_v1_5.json",
              "Weall-Protocol/generated/b539_b543_production_path_proof_v1_5.json",
              "Weall-Protocol/generated/b549_b553_controlled_testnet_candidate_proof_v1_5.json",
              "Weall-Protocol/generated/b567_b571_autonomous_mechanics_proof_v1_5.json",
              "Weall-Protocol/generated/public_beta_blocker_report_v1_5.json",
              "Weall-Protocol/generated/release_evidence_manifest_v1_5.json",
              "Weall-Protocol/generated/current_verified_claims.json",
              "Weall-Protocol/configs/public_testnet_trust_roots.json",
              "Weall-Protocol/configs/public_testnet_seed_registry.json",
              "Weall-Protocol/tests/test_v2_spec_compiler.py",
          ]
          replacement = marker + "".join(f'    "{item}",\n' for item in extras)
          count = text.count(marker)
          if count != 2:
              raise SystemExit(f"expected_two_v15_diff_markers:found={count}")
          text = text.replace(marker, replacement)

          late_anchor = 'cd "$PROTO"\npytest -q\n'
          late_insert = r'''cd "$PROTO"
          python - <<'PYLATE'
          from pathlib import Path

          path = Path("tests/test_v2_spec_compiler.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              'assert payload["route_count"] == 162': 'assert payload["route_count"] == 163',
              'assert payload["unique_method_path_count"] == 158': 'assert payload["unique_method_path_count"] == 159',
              'assert coverage["routes"] == 162': 'assert coverage["routes"] == 163',
              'assert closure["semantic_reviews"]["route_reviews"] == 162': 'assert closure["semantic_reviews"]["route_reviews"] == 163',
          }
          for old, new in replacements.items():
              old_count = text.count(old)
              new_count = text.count(new)
              if old_count == 1 and new_count == 0:
                  text = text.replace(old, new, 1)
              elif old_count == 0 and new_count == 1:
                  pass
              else:
                  raise SystemExit(
                      f"late_route_cardinality_state_invalid:old={old_count}:new={new_count}:needle={old}"
                  )
          path.write_text(text, encoding="utf-8")
          PYLATE
          pytest -q
          '''.replace("          ", "")
          if text.count(late_anchor) != 1:
              raise SystemExit("full_pytest_anchor_not_found_once")
          text = text.replace(late_anchor, late_insert, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Execute bounded self-cleaning closure
        run: |
          cp Weall-Protocol/scripts/a15_f003_pr38_closure_v5.sh /tmp/a15_f003_pr38_closure_v5.sh
          chmod 700 /tmp/a15_f003_pr38_closure_v5.sh
          bash /tmp/a15_f003_pr38_closure_v5.sh

      - uses: actions/upload-artifact@v4
        with:
          name: a15-f003-account-cardinality-${{ github.run_id }}
          path: |
            /tmp/a15-f003-100k.json
            /tmp/a15-f003-1m.json
          if-no-files-found: error
