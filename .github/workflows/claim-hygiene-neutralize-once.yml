name: Claim Hygiene Neutralization Once

on:
  push:
    branches:
      - claim-hygiene-neutral-language

permissions:
  contents: write

jobs:
  neutralize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: claim-hygiene-neutral-language

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install -e .

      - name: Run bounded claim-hygiene repair
        run: bash scripts/claim_hygiene_neutralize_once.sh
