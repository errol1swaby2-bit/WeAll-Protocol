name: PR70 integrated source derivative refresh

on:
  push:
    branches:
      - integration/pr62-pr69-safe-rehearsal-20261030
    paths:
      - 'Weall-Protocol/scripts/devnet_safe_paths.py'
      - 'Weall-Protocol/specs/v2/source/source_mappings.json'
      - '.github/workflows/pr70-integrated-derivative-refresh.yml'
      - 'Weall-Protocol/tooling/constitutional_change_gate/operational_boundary_review.py'
      - 'Weall-Protocol/tooling/constitutional_change_gate/tests/test_semantic_impact_candidates.py'

permissions:
  contents: write

concurrency:
  group: pr70-integrated-v2-derivative-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'errol1swaby2-bit/WeAll-Protocol'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact fix branch
        uses: actions/checkout@v4
        with:
          ref: integration/pr62-pr69-safe-rehearsal-20261030
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source compiler dependencies from locked inputs
        working-directory: Weall-Protocol
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install -e . --no-deps
      - name: Format review candidate and verify its SHA256 manifest
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          ruff format tooling/constitutional_change_gate/operational_boundary_review.py tooling/constitutional_change_gate/tests/test_semantic_impact_candidates.py
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path("tooling/constitutional_change_gate")
          manifest = root / "SHA256SUMS.txt"
          updated = {
              "operational_boundary_review.py",
              "tests/test_semantic_impact_candidates.py",
          }
          lines = []
          seen = set()
          for line in manifest.read_text(encoding="utf-8").splitlines():
              digest, path = line.split("  ", 1)
              seen.add(path)
              if path in updated:
                  digest = hashlib.sha256((root / path).read_bytes()).hexdigest()
              lines.append(f"{digest}  {path}")
          for path in sorted(updated - seen):
              lines.append(f"{hashlib.sha256((root / path).read_bytes()).hexdigest()}  {path}")
          manifest.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          cd tooling/constitutional_change_gate
          sha256sum -c SHA256SUMS.txt
          python -m unittest discover -s tests -q
      - name: Regenerate source-bound v2 derivatives and verify stability
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python scripts/compile_v2_spec.py
          python scripts/compile_v2_spec.py --check
      - name: Commit only declared v2 derivative outputs
        run: |
          set -Eeuo pipefail
          git diff --check
          git add -u -- Weall-Protocol/tooling/constitutional_change_gate/operational_boundary_review.py Weall-Protocol/tooling/constitutional_change_gate/tests/test_semantic_impact_candidates.py Weall-Protocol/tooling/constitutional_change_gate/SHA256SUMS.txt Weall-Protocol/generated/v2 web/src/generated/protocolStatus.ts
          if git diff --cached --quiet; then
            echo 'All v2 source derivatives are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(pr70): regenerate merged source-bound v2 evidence'
          git push origin HEAD:integration/pr62-pr69-safe-rehearsal-20261030
