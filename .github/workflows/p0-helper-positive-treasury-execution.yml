name: P0 helper positive governance treasury execution

on:
  push:
    branches:
      - p0-tooling-exact-v2-refresh-20261001
    paths:
      - .github/workflows/p0-helper-positive-treasury-execution.yml

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p0-closure-a01-a20-20260930
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          check-latest: false

      - name: Install locked backend dependencies
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade 'pip==26.2.1'
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Add proposed positive A10-F005 regression in runner only
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          cat >> tests/test_p0_group_treasury_governance_binding.py <<'PY'


def test_governance_approved_signed_group_spend_moves_value_once() -> None:
    state = _economic_state()
    state["accounts"] = {
        "@recipient": {
            "balance": 0,
            "nonce": 0,
            "poh_tier": 2,
            "banned": False,
            "locked": False,
        }
    }
    state["treasury_wallets"] = {
        "TREASURY_GROUP::group-1": {
            "wallet_id": "TREASURY_GROUP::group-1",
            "balance": 25,
        }
    }
    spend = _signed_spend()
    state["group_treasury_spends"] = {"spend-1": spend}
    action = {
        "tx_type": "GROUP_TREASURY_SPEND_EXECUTE",
        "payload": {"spend_id": "spend-1"},
    }
    state["gov_proposals_by_id"] = {
        "proposal-1": {
            "proposal_id": "proposal-1",
            "stage": "tallied",
            "group_id": "group-1",
            "electorate_scope": "group_members",
            "electorate_commitment": "electorate-commitment-1",
            "actions": [action],
            "tallied_at_height": 19,
            "tallies": [{"height": 19, "payload": {"passed": True}}],
        }
    }

    _apply_gov_execute(
        state,
        TxEnvelope(
            tx_type="GOV_EXECUTE",
            signer="SYSTEM",
            nonce=0,
            payload={"proposal_id": "proposal-1", "actions": [action]},
            system=True,
            chain_id="weall-prod",
        ),
    )
    queued = [
        row for row in state["system_queue"] if row.get("tx_type") == "GROUP_TREASURY_SPEND_EXECUTE"
    ]
    assert len(queued) == 1

    result = apply_groups(
        state,
        TxEnvelope(
            tx_type="GROUP_TREASURY_SPEND_EXECUTE",
            signer="SYSTEM",
            nonce=1,
            payload=dict(queued[0]["payload"]),
            system=True,
            chain_id="weall-prod",
        ),
    )

    assert result == {
        "applied": "GROUP_TREASURY_SPEND_EXECUTE",
        "spend_id": "spend-1",
        "to": "@recipient",
        "amount": 10,
    }
    assert state["treasury_wallets"]["TREASURY_GROUP::group-1"]["balance"] == 15
    assert state["accounts"]["@recipient"]["balance"] == 10
    assert spend["status"] == "executed"
    assert spend["transferred_to"] == "@recipient"
    assert spend["transferred_amount"] == 10
PY
          ruff format tests/test_p0_group_treasury_governance_binding.py
          ruff check tests/test_p0_group_treasury_governance_binding.py
          pytest -q tests/test_p0_group_treasury_governance_binding.py
