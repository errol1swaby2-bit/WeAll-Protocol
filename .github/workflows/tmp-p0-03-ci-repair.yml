name: Temporary P0-03 CI repair

on:
  push:
    branches:
      - p0-03-ci-repair-20261001

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked backend dependencies
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Repair P0-03 semantics and helper-free artifact graph
        run: |
          set -Eeuo pipefail
          cd Weall-Protocol
          python - <<'PY'
          import json
          from pathlib import Path

          # Register every compiler-visible surface introduced by P0-03.
          stable_path = Path('specs/v2/source/stable_ids.json')
          payload = json.loads(stable_path.read_text(encoding='utf-8'))
          entries = payload.get('entries')
          if not isinstance(entries, list):
              raise SystemExit('stable_ids entries must be a list')
          bindings = [
              ('message', 'src/weall/runtime/bft_runtime_adapter.py:_bft_prepare_transition_vote:message_builder_or_handler', 'MSG-AD7439A7CF9B54D7'),
              ('scheduler', 'src/weall/runtime/bft_pending_frontier_impl.py:_finalized_replay_path_ids', 'SCHED-4EF22601E3CD8CDD'),
              ('scheduler', 'src/weall/runtime/bft_runtime_adapter.py:_bft_transition_bridge_descriptor', 'SCHED-4C631AD6E7165325'),
              ('scheduler', 'src/weall/runtime/bft_runtime_adapter.py:_bft_transition_bridge_has_qc', 'SCHED-ED875704F7B8767A'),
              ('scheduler', 'src/weall/runtime/bft_runtime_adapter.py:_bft_prepare_transition_vote', 'SCHED-4BE4EA54F6651572'),
          ]
          for kind, key, stable_id in bindings:
              ids = {str(row.get('stable_id') or '') for row in entries if isinstance(row, dict)}
              matches = [row for row in entries if isinstance(row, dict) and row.get('kind') == kind and row.get('canonical_key') == key]
              if matches:
                  if len(matches) != 1 or matches[0].get('stable_id') != stable_id:
                      raise SystemExit(f'unexpected stable-ID binding for {kind}:{key}: {matches}')
                  continue
              if stable_id in ids:
                  raise SystemExit(f'new stable ID already bound elsewhere: {stable_id}')
              entries.append({'aliases': [], 'canonical_key': key, 'kind': kind, 'stable_id': stable_id, 'status': 'active'})
          entries.sort(key=lambda row: (str(row.get('stable_id') or ''), str(row.get('kind') or ''), str(row.get('canonical_key') or '')))
          stable_path.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          # Transition lookup is conditional on canonical executor state. Lightweight
          # adapter fixtures and error-path harnesses intentionally do not own state.
          adapter_path = Path('src/weall/runtime/bft_runtime_adapter.py')
          adapter = adapter_path.read_text(encoding='utf-8')
          old_descriptor = '''def _bft_transition_bridge_descriptor(self) -> Json | None:\n    c = self.state.get("consensus")\n    if not isinstance(c, dict):\n        return None\n    vs = c.get("validator_set")\n    if not isinstance(vs, dict):\n        return None\n    bridge = vs.get("transition_bridge")\n    if not isinstance(bridge, dict):\n        return None\n    if str(bridge.get("rule") or "") != "new_set_qc_over_canonical_boundary":\n        return None\n    if self._current_consensus_phase() != CONSENSUS_PHASE_BFT_ACTIVE:\n        return None\n    boundary_height = _safe_int(bridge.get("boundary_height"), 0)\n    local_height = _safe_int(self.state.get("height"), 0)\n    if boundary_height <= 0 or local_height != boundary_height:\n        return None\n    current_epoch = int(self._current_validator_epoch())\n    current_set_hash = str(self._current_validator_set_hash() or "").strip()\n    if _safe_int(bridge.get("to_validator_epoch"), 0) != current_epoch:\n        return None\n    if str(bridge.get("to_validator_set_hash") or "").strip() != current_set_hash:\n        return None\n    tip = str(self.state.get("tip") or "").strip()\n    if not tip:\n        return None\n    try:\n        latest = self.get_latest_block()\n    except Exception:\n        latest = None\n    if not isinstance(latest, dict):\n        return None\n    if str(latest.get("block_id") or "").strip() != tip:\n        return None\n    if _safe_int(latest.get("height"), 0) != boundary_height:\n        return None\n    block_hash = str(latest.get("block_hash") or "").strip()\n    if not block_hash:\n        block_hash = str(self._known_block_hash_for_id(tip) or "").strip()\n    if not block_hash:\n        return None\n    if _safe_int(bridge.get("transition_view"), 0) != 0:\n        return None\n    return {\n        **dict(bridge),\n        "block_id": tip,\n        "block_hash": block_hash,\n        "parent_id": str(latest.get("prev_block_id") or "").strip(),\n        "view": 0,\n    }\n'''
          new_descriptor = '''def _bft_transition_bridge_descriptor(self) -> Json | None:\n    state = getattr(self, "state", None)\n    if not isinstance(state, dict):\n        return None\n    c = state.get("consensus")\n    if not isinstance(c, dict):\n        return None\n    vs = c.get("validator_set")\n    if not isinstance(vs, dict):\n        return None\n    bridge = vs.get("transition_bridge")\n    if not isinstance(bridge, dict):\n        return None\n    if str(bridge.get("rule") or "") != "new_set_qc_over_canonical_boundary":\n        return None\n    phase_reader = getattr(self, "_current_consensus_phase", None)\n    if not callable(phase_reader) or phase_reader() != CONSENSUS_PHASE_BFT_ACTIVE:\n        return None\n    boundary_height = _safe_int(bridge.get("boundary_height"), 0)\n    local_height = _safe_int(state.get("height"), 0)\n    if boundary_height <= 0 or local_height != boundary_height:\n        return None\n    current_epoch = int(self._current_validator_epoch())\n    current_set_hash = str(self._current_validator_set_hash() or "").strip()\n    if _safe_int(bridge.get("to_validator_epoch"), 0) != current_epoch:\n        return None\n    if str(bridge.get("to_validator_set_hash") or "").strip() != current_set_hash:\n        return None\n    tip = str(state.get("tip") or "").strip()\n    if not tip:\n        return None\n    latest_reader = getattr(self, "get_latest_block", None)\n    try:\n        latest = latest_reader() if callable(latest_reader) else None\n    except Exception:\n        latest = None\n    if not isinstance(latest, dict):\n        return None\n    if str(latest.get("block_id") or "").strip() != tip:\n        return None\n    if _safe_int(latest.get("height"), 0) != boundary_height:\n        return None\n    block_hash = str(latest.get("block_hash") or "").strip()\n    if not block_hash:\n        hash_reader = getattr(self, "_known_block_hash_for_id", None)\n        block_hash = str(hash_reader(tip) if callable(hash_reader) else "").strip()\n    if not block_hash:\n        return None\n    if _safe_int(bridge.get("transition_view"), 0) != 0:\n        return None\n    return {\n        **dict(bridge),\n        "block_id": tip,\n        "block_hash": block_hash,\n        "parent_id": str(latest.get("prev_block_id") or "").strip(),\n        "view": 0,\n    }\n'''
          if old_descriptor not in adapter:
              raise SystemExit('transition descriptor anchor not found')
          adapter = adapter.replace(old_descriptor, new_descriptor, 1)

          # A certified parent is mandatory once a BFT chain exists. The very first
          # BFT proposal at height zero is the sole QC-less bootstrap exception.
          old_no_qc = '''    elif _mode() == "prod" and self._current_consensus_phase() == CONSENSUS_PHASE_BFT_ACTIVE:\n        return None\n'''
          new_no_qc = '''    elif _mode() == "prod":\n        state = getattr(self, "state", None)\n        phase_reader = getattr(self, "_current_consensus_phase", None)\n        current_phase = phase_reader() if callable(phase_reader) else ""\n        if isinstance(state, dict) and current_phase == CONSENSUS_PHASE_BFT_ACTIVE:\n            height = _safe_int(state.get("height"), 0)\n            tip = str(state.get("tip") or "").strip()\n            if height > 0 or tip:\n                return None\n'''
          if old_no_qc not in adapter:
              raise SystemExit('no-QC production gate anchor not found')
          adapter = adapter.replace(old_no_qc, new_no_qc, 1)
          adapter_path.write_text(adapter, encoding='utf-8')

          # Preserve the timeout-certificate intent while requiring the certified
          # parent body/state instead of silently executing from the canonical tip.
          test_path = Path('tests/test_bft_timeout_certificate.py')
          test_text = test_path.read_text(encoding='utf-8')
          old_setup = '''    set_hash = ex._current_validator_set_hash()\n    qc = _make_qc(\n        chain_id="bft-live",\n        validators=validators,\n        vpub=vpub,\n        vpriv=vpriv,\n        block_id="known-qc-block",\n        block_hash="11" * 32,\n        parent_id="genesis",\n        view=0,\n        validator_epoch=3,\n        validator_set_hash=set_hash,\n    )\n    ex._pending_missing_qcs["known-qc-block"] = qc\n'''
          new_setup = '''    parent, parent_state, parent_ids, parent_bad, parent_err = ex.build_block_candidate(\n        max_txs=0, allow_empty=True\n    )\n    assert parent_err == ""\n    assert isinstance(parent, dict)\n    assert isinstance(parent_state, dict)\n    assert parent_bad == []\n    parent_id = str(parent["block_id"])\n    parent_hash = str(parent["block_hash"])\n    ex._pending_candidates[parent_id] = (\n        dict(parent),\n        parent_state,\n        list(parent_ids),\n        list(parent_bad),\n    )\n\n    set_hash = ex._current_validator_set_hash()\n    qc = _make_qc(\n        chain_id="bft-live",\n        validators=validators,\n        vpub=vpub,\n        vpriv=vpriv,\n        block_id=parent_id,\n        block_hash=parent_hash,\n        parent_id=str(parent.get("prev_block_id") or ""),\n        view=0,\n        validator_epoch=3,\n        validator_set_hash=set_hash,\n    )\n    ex._pending_missing_qcs[parent_id] = qc\n'''
          if old_setup not in test_text:
              raise SystemExit('timeout certificate setup anchor not found')
          test_text = test_text.replace(old_setup, new_setup, 1)
          test_text = test_text.replace('high_qc_id="known-qc-block",', 'high_qc_id=parent_id,', 1)
          old_assert = '''    assert isinstance(proposal, dict)\n    assert isinstance(proposal.get("justify_qc"), dict)\n    assert proposal["justify_qc"]["block_id"] == "known-qc-block"\n'''
          new_assert = '''    assert isinstance(proposal, dict)\n    assert isinstance(proposal.get("justify_qc"), dict)\n    assert proposal["justify_qc"]["block_id"] == parent_id\n    assert proposal["prev_block_id"] == parent_id\n    assert proposal["prev_block_hash"] == parent_hash\n'''
          if old_assert not in test_text:
              raise SystemExit('timeout certificate assertion anchor not found')
          test_text = test_text.replace(old_assert, new_assert, 1)
          test_path.write_text(test_text, encoding='utf-8')
          PY

          ruff format \
            src/weall/runtime/apply/consensus.py \
            src/weall/runtime/bft_runtime_adapter.py \
            src/weall/runtime/bft_votecheck.py \
            tests/test_bft_timeout_certificate.py

          cd ..
          rm .github/workflows/tmp-p0-03-ci-repair.yml
          cd Weall-Protocol

          # Refresh every generated proof whose deterministic inputs changed.
          PYTHONPATH=src:scripts python scripts/gen_b510_b515_completion_proof_v1_5.py --write
          PYTHONPATH=src:scripts python scripts/gen_b528_b532_completion_proof_v1_5.py
          PYTHONPATH=src:scripts python scripts/gen_b534_b538_completion_proof_v1_5.py
          PYTHONPATH=src:scripts python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py
          PYTHONPATH=src:scripts python scripts/gen_failure_code_registry_v1_5.py
          PYTHONPATH=src:scripts python scripts/gen_release_evidence_manifest_v1_5.py
          PYTHONPATH=src:scripts python scripts/gen_public_beta_blocker_report_v1_5.py
          PYTHONPATH=src python scripts/compile_v2_spec.py

          cd ..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(p0-03): repair bootstrap semantics and synchronize evidence [tested-tree]'

      - name: Exact-current and focused validation
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          ruff format --check \
            src/weall/runtime/apply/consensus.py \
            src/weall/runtime/bft_runtime_adapter.py \
            src/weall/runtime/bft_votecheck.py \
            tests/test_p0_03_certified_branch_transition.py \
            tests/test_bft_timeout_certificate.py
          ruff check \
            src/weall/runtime/apply/consensus.py \
            src/weall/runtime/bft_runtime_adapter.py \
            src/weall/runtime/bft_votecheck.py \
            tests/test_p0_03_certified_branch_transition.py \
            tests/test_bft_timeout_certificate.py
          PYTHONPATH=src:scripts python scripts/gen_b510_b515_completion_proof_v1_5.py --check
          PYTHONPATH=src:scripts python scripts/gen_b528_b532_completion_proof_v1_5.py --check
          PYTHONPATH=src:scripts python scripts/gen_b534_b538_completion_proof_v1_5.py --check
          PYTHONPATH=src:scripts python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py --check
          PYTHONPATH=src:scripts python scripts/gen_failure_code_registry_v1_5.py --check
          PYTHONPATH=src:scripts python scripts/gen_release_evidence_manifest_v1_5.py --check
          PYTHONPATH=src:scripts python scripts/gen_public_beta_blocker_report_v1_5.py --check
          PYTHONPATH=src:scripts python scripts/check_v15_public_readiness_artifacts.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          python scripts/check_v2_spec_clean_checkout.py
          PYTHONPATH=src pytest -q \
            tests/test_p0_03_certified_branch_transition.py \
            tests/test_v2_spec_compiler.py \
            tests/test_bft_artifact_identity_binding.py \
            tests/test_bft_reward_proposer_binding.py \
            tests/test_bft_strict_epoch_binding.py \
            tests/test_bft_timeout_certificate.py \
            tests/test_pb001by_pacemaker_timeout_emission.py \
            tests/test_priority2_consensus_resilience_matrix.py \
            tests/test_recursive_ai_closure_post_green.py \
            tests/test_remaining_ai_closure_batch.py \
            tests/test_generated_checker_read_only.py

      - name: Verify helper-free candidate release tree
        run: |
          set -Eeuo pipefail
          git worktree add --detach /tmp/p0-03-clean HEAD
          bash /tmp/p0-03-clean/Weall-Protocol/scripts/verify_release_tree.sh
          git worktree remove --force /tmp/p0-03-clean

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Restore historical M2/M3 evidence
        working-directory: .
        run: bash scripts/restore_m2_m3_evidence_from_git.sh --destination "${GITHUB_WORKSPACE}"

      - name: Reviewer Readiness
        working-directory: Weall-Protocol
        env:
          WEALL_RELEASE_TREE_ALREADY_VERIFIED: '1'
        run: bash scripts/reviewer_production_readiness_gate.sh

      - name: Full backend suite
        working-directory: Weall-Protocol
        run: PYTHONPATH=src pytest -q

      - name: Push tested helper-free tree
        run: |
          set -Eeuo pipefail
          git status --short
          test ! -e .github/workflows/tmp-p0-03-ci-repair.yml
          git push origin HEAD:p0-03-ci-repair-20261001
