name: Temporary P0-03 CI repair

on:
  push:
    branches:
      - p0-03-ci-repair-20261001

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked backend dependencies
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Repair helper-free source tree and regenerate artifacts
        run: |
          set -Eeuo pipefail
          cd Weall-Protocol
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('specs/v2/source/stable_ids.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          entries = payload.get('entries')
          if not isinstance(entries, list):
              raise SystemExit('stable_ids entries must be a list')

          bindings = [
              ('message', 'src/weall/runtime/bft_runtime_adapter.py:_bft_prepare_transition_vote:message_builder_or_handler', 'MSG-AD7439A7CF9B54D7'),
              ('scheduler', 'src/weall/runtime/bft_pending_frontier_impl.py:_finalized_replay_path_ids', 'SCHED-4EF22601E3CD8CDD'),
              ('scheduler', 'src/weall/runtime/bft_runtime_adapter.py:_bft_transition_bridge_descriptor', 'SCHED-4C631AD6E7165325'),
              ('scheduler', 'src/weall/runtime/bft_runtime_adapter.py:_bft_transition_bridge_has_qc', 'SCHED-ED875704F7B8767A'),
              ('scheduler', 'src/weall/runtime/bft_runtime_adapter.py:_bft_prepare_transition_vote', 'SCHED-4BE4EA54F6651572'),
          ]

          for kind, key, stable_id in bindings:
              ids = {str(row.get('stable_id') or '') for row in entries if isinstance(row, dict)}
              matches = [row for row in entries if isinstance(row, dict) and row.get('kind') == kind and row.get('canonical_key') == key]
              if matches:
                  if len(matches) != 1 or matches[0].get('stable_id') != stable_id:
                      raise SystemExit(f'unexpected stable-ID binding for {kind}:{key}: {matches}')
                  continue
              if stable_id in ids:
                  raise SystemExit(f'new stable ID already bound elsewhere: {stable_id}')
              entries.append({'aliases': [], 'canonical_key': key, 'kind': kind, 'stable_id': stable_id, 'status': 'active'})

          entries.sort(key=lambda row: (str(row.get('stable_id') or ''), str(row.get('kind') or ''), str(row.get('canonical_key') or '')))
          path.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          ruff format \
            src/weall/runtime/apply/consensus.py \
            src/weall/runtime/bft_runtime_adapter.py \
            src/weall/runtime/bft_votecheck.py
          cd ..
          rm .github/workflows/tmp-p0-03-ci-repair.yml
          cd Weall-Protocol
          PYTHONPATH=src:scripts python scripts/gen_failure_code_registry_v1_5.py
          PYTHONPATH=src:scripts python scripts/gen_release_evidence_manifest_v1_5.py
          PYTHONPATH=src:scripts python scripts/gen_public_beta_blocker_report_v1_5.py
          PYTHONPATH=src python scripts/compile_v2_spec.py
          cd ..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(ci): synchronize P0-03 protocol contracts and generated evidence [tested-tree]'

      - name: Exact-current and focused validation
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          ruff format --check \
            src/weall/runtime/apply/consensus.py \
            src/weall/runtime/bft_runtime_adapter.py \
            src/weall/runtime/bft_votecheck.py \
            tests/test_p0_03_certified_branch_transition.py
          ruff check \
            src/weall/runtime/apply/consensus.py \
            src/weall/runtime/bft_runtime_adapter.py \
            src/weall/runtime/bft_votecheck.py \
            tests/test_p0_03_certified_branch_transition.py
          PYTHONPATH=src:scripts python scripts/gen_failure_code_registry_v1_5.py --check
          PYTHONPATH=src:scripts python scripts/gen_release_evidence_manifest_v1_5.py --check
          PYTHONPATH=src:scripts python scripts/gen_public_beta_blocker_report_v1_5.py --check
          PYTHONPATH=src:scripts python scripts/check_v15_public_readiness_artifacts.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          python scripts/check_v2_spec_clean_checkout.py
          PYTHONPATH=src pytest -q tests/test_p0_03_certified_branch_transition.py tests/test_v2_spec_compiler.py

      - name: Verify helper-free candidate release tree
        run: |
          set -Eeuo pipefail
          git worktree add --detach /tmp/p0-03-clean HEAD
          bash /tmp/p0-03-clean/Weall-Protocol/scripts/verify_release_tree.sh
          git worktree remove --force /tmp/p0-03-clean

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Restore historical M2/M3 evidence
        working-directory: .
        run: bash scripts/restore_m2_m3_evidence_from_git.sh --destination "${GITHUB_WORKSPACE}"

      - name: Reviewer Readiness
        working-directory: Weall-Protocol
        env:
          WEALL_RELEASE_TREE_ALREADY_VERIFIED: '1'
        run: bash scripts/reviewer_production_readiness_gate.sh

      - name: Full backend suite
        working-directory: Weall-Protocol
        run: PYTHONPATH=src pytest -q

      - name: Push tested helper-free tree
        run: |
          set -Eeuo pipefail
          git status --short
          test ! -e .github/workflows/tmp-p0-03-ci-repair.yml
          git push origin HEAD:p0-03-ci-repair-20261001
