name: P0-10 A15-F001 bounded history closure

on:
  push:
    branches: ["p0-03-production-closure-staging-20261001"]
    paths:
      - ".github/workflows/p0-10-a15f001-bounded-history-closure.yml"

permissions:
  contents: write

concurrency:
  group: p0-10-a15f001-bounded-history-closure
  cancel-in-progress: false

jobs:
  closure:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Weall-Protocol

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: p0-03-production-closure-staging-20261001
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Patch bounded consensus block history
        working-directory: .
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("Weall-Protocol")
          state_hash_path = root / "src/weall/runtime/state_hash.py"
          commit_path = root / "src/weall/runtime/block_commit.py"
          test_path = root / "tests/test_p0_10_a15_f001_bounded_block_history.py"

          state_hash = state_hash_path.read_text()

          meta_anchor = '        "recent_block_anchor_activation_height",\n'
          if '"consensus_block_history_max_records"' not in state_hash:
              assert meta_anchor in state_hash
              state_hash = state_hash.replace(
                  meta_anchor,
                  meta_anchor + '        "consensus_block_history_max_records",\n',
                  1,
              )

          insertion_anchor = '\n\ndef _canonical(obj: Any) -> Any:\n'
          retention_code = r'''

BLOCK_HISTORY_CHECKPOINT_VERSION: Final[int] = 1
BLOCK_HISTORY_CHECKPOINT_DOMAIN: Final[str] = "weall.consensus-block-history.v1"
BLOCK_HISTORY_CHECKPOINT_KEY: Final[str] = "block_history_checkpoint"
CONSENSUS_BLOCK_HISTORY_META_KEY: Final[str] = "consensus_block_history_max_records"
DEFAULT_CONSENSUS_BLOCK_HISTORY_MAX_RECORDS: Final[int] = 10_000
MIN_CONSENSUS_BLOCK_HISTORY_MAX_RECORDS: Final[int] = 3


class BlockHistoryRetentionError(RuntimeError):
    """Consensus-visible ancestry cannot be compacted without losing live safety context."""


def consensus_block_history_max_records(state: Json) -> int:
    """Return the root-bound live ancestry cap.

    Production has a hard protocol ceiling of 10,000 live ancestry records, aligned
    with the existing durable block-history retention horizon. A committed ``meta``
    value may tighten that bound for a future profile or deterministic test fixture,
    but it cannot enlarge the production ceiling.
    """

    meta = state.get("meta") if isinstance(state, dict) else None
    raw = meta.get(CONSENSUS_BLOCK_HISTORY_META_KEY) if isinstance(meta, dict) else None
    if raw is None:
        return int(DEFAULT_CONSENSUS_BLOCK_HISTORY_MAX_RECORDS)
    try:
        value = int(raw)
    except Exception as exc:
        raise BlockHistoryRetentionError("block_history_limit_not_integer") from exc
    if value < int(MIN_CONSENSUS_BLOCK_HISTORY_MAX_RECORDS):
        raise BlockHistoryRetentionError("block_history_limit_below_safety_minimum")
    if value > int(DEFAULT_CONSENSUS_BLOCK_HISTORY_MAX_RECORDS):
        raise BlockHistoryRetentionError("block_history_limit_exceeds_protocol_ceiling")
    return int(value)


def _block_record_height(block_id: str, record: Any) -> int:
    if not isinstance(record, dict):
        raise BlockHistoryRetentionError(f"block_history_record_not_object:{block_id}")
    try:
        height = int(record.get("height") or 0)
    except Exception as exc:
        raise BlockHistoryRetentionError(f"block_history_height_invalid:{block_id}") from exc
    if height <= 0:
        raise BlockHistoryRetentionError(f"block_history_height_nonpositive:{block_id}")
    return int(height)


def _block_parent(record: Any) -> str:
    if not isinstance(record, dict):
        return ""
    return str(record.get("prev_block_id") or record.get("prev") or "").strip()


def _qc_block_id(value: Any) -> str:
    if not isinstance(value, dict):
        return ""
    return str(value.get("block_id") or "").strip()


def _finalized_block_ids(state: Json) -> set[str]:
    out: set[str] = set()
    bft = state.get("bft") if isinstance(state.get("bft"), dict) else {}
    bid = str(bft.get("finalized_block_id") or "").strip()
    if bid:
        out.add(bid)
    finalized = state.get("finalized")
    if isinstance(finalized, dict):
        bid2 = str(finalized.get("block_id") or "").strip()
        if bid2:
            out.add(bid2)
    return out


def _material_bft_state(state: Json) -> bool:
    bft = state.get("bft")
    if not isinstance(bft, dict):
        return False
    if int(bft.get("view") or 0) > 0:
        return True
    if str(bft.get("finalized_block_id") or "").strip():
        return True
    return bool(_qc_block_id(bft.get("high_qc")) or _qc_block_id(bft.get("locked_qc")))


def _protected_live_ancestry_ids(state: Json, blocks: dict[str, Any]) -> set[str]:
    """Return records that cannot be compacted without breaking live safety ancestry."""

    finalized_ids = _finalized_block_ids(state)
    bft = state.get("bft") if isinstance(state.get("bft"), dict) else {}
    tip = str(state.get("tip") or "").strip()
    roots = [
        tip,
        _qc_block_id(bft.get("high_qc")),
        _qc_block_id(bft.get("locked_qc")),
    ]
    protected: set[str] = set(finalized_ids)
    material_bft = _material_bft_state(state)

    for root in roots:
        cur = str(root or "").strip()
        if not cur:
            continue
        if cur not in blocks:
            # A high/locked QC may legitimately point into the authenticated
            # pending frontier, which is outside root-visible canonical history.
            # Such an ID cannot protect a record that is not present here.
            continue
        seen: set[str] = set()
        reached_finalized = False
        recent_budget = int(MIN_CONSENSUS_BLOCK_HISTORY_MAX_RECORDS)
        while cur and cur not in seen:
            seen.add(cur)
            protected.add(cur)
            if cur in finalized_ids:
                reached_finalized = True
                break
            rec = blocks.get(cur)
            if not isinstance(rec, dict):
                break
            parent = _block_parent(rec)
            if not parent:
                break
            cur = parent
            if not material_bft and not finalized_ids:
                recent_budget -= 1
                if recent_budget <= 0:
                    break

        if material_bft and finalized_ids and root in blocks and not reached_finalized:
            # If a material BFT branch cannot be linked to one of the canonical
            # finalized anchors, discarding any historical prefix would turn a
            # corrupt/incomplete ancestry map into apparently valid compact state.
            raise BlockHistoryRetentionError("live_bft_path_missing_finalized_anchor")

    if material_bft and not finalized_ids and tip in blocks:
        # Before BFT has a finalized checkpoint, the complete live canonical path
        # is still safety-relevant. If it reaches the finite ceiling, block
        # production must fail closed rather than silently forget ancestry.
        cur = tip
        seen: set[str] = set()
        while cur and cur not in seen:
            seen.add(cur)
            protected.add(cur)
            rec = blocks.get(cur)
            if not isinstance(rec, dict):
                break
            cur = _block_parent(rec)

    return protected


def _validated_checkpoint(state: Json) -> dict[str, Any] | None:
    raw = state.get(BLOCK_HISTORY_CHECKPOINT_KEY)
    if raw is None:
        return None
    if not isinstance(raw, dict):
        raise BlockHistoryRetentionError("block_history_checkpoint_not_object")
    try:
        version = int(raw.get("version") or 0)
        records_committed = int(raw.get("records_committed") or 0)
        through_height = int(raw.get("through_height") or 0)
    except Exception as exc:
        raise BlockHistoryRetentionError("block_history_checkpoint_integer_invalid") from exc
    root = str(raw.get("root") or "").strip().lower()
    through_block_id = str(raw.get("through_block_id") or "").strip()
    if version != int(BLOCK_HISTORY_CHECKPOINT_VERSION):
        raise BlockHistoryRetentionError("block_history_checkpoint_version_invalid")
    if records_committed <= 0 or through_height <= 0 or not through_block_id:
        raise BlockHistoryRetentionError("block_history_checkpoint_position_invalid")
    if len(root) != 64:
        raise BlockHistoryRetentionError("block_history_checkpoint_root_invalid")
    try:
        int(root, 16)
    except Exception as exc:
        raise BlockHistoryRetentionError("block_history_checkpoint_root_invalid") from exc
    return {
        "version": int(version),
        "records_committed": int(records_committed),
        "through_height": int(through_height),
        "through_block_id": through_block_id,
        "root": root,
    }


def _extend_checkpoint(
    checkpoint: dict[str, Any] | None,
    pruned: list[tuple[str, dict[str, Any], int]],
) -> dict[str, Any]:
    prior_root = str((checkpoint or {}).get("root") or ("0" * 64)).strip().lower()
    prior_count = int((checkpoint or {}).get("records_committed") or 0)
    prior_height = int((checkpoint or {}).get("through_height") or 0)
    root = prior_root
    last_height = prior_height
    last_bid = str((checkpoint or {}).get("through_block_id") or "").strip()

    for bid, rec, height in pruned:
        if int(height) < int(last_height):
            raise BlockHistoryRetentionError("block_history_checkpoint_nonmonotonic_height")
        payload = {
            "domain": BLOCK_HISTORY_CHECKPOINT_DOMAIN,
            "prior_root": root,
            "block_id": str(bid),
            "record": _canonical(rec),
        }
        encoded = json.dumps(
            _canonical(payload),
            separators=(",", ":"),
            ensure_ascii=False,
            allow_nan=False,
        ).encode("utf-8")
        root = hashlib.sha256(encoded).hexdigest()
        last_height = int(height)
        last_bid = str(bid)

    return {
        "version": int(BLOCK_HISTORY_CHECKPOINT_VERSION),
        "records_committed": int(prior_count + len(pruned)),
        "through_height": int(last_height),
        "through_block_id": str(last_bid),
        "root": str(root),
    }


def project_bounded_block_history_state(state: Json) -> Json:
    """Return a shallow state projection with finite live ``blocks`` history.

    The removed historical prefix is represented by a constant-size rolling hash
    checkpoint. The function is pure: it never mutates ``state``. This lets state
    root calculation commit to the exact compacted form before the durable commit
    path installs that same form in-place.
    """

    if not isinstance(state, dict):
        raise BlockHistoryRetentionError("block_history_state_not_object")
    checkpoint = _validated_checkpoint(state)
    blocks_raw = state.get("blocks")
    if blocks_raw is None:
        return dict(state)
    if not isinstance(blocks_raw, dict):
        raise BlockHistoryRetentionError("block_history_blocks_not_object")

    limit = consensus_block_history_max_records(state)
    if len(blocks_raw) <= int(limit):
        return dict(state)

    ordered: list[tuple[str, dict[str, Any], int]] = []
    for raw_bid, raw_rec in blocks_raw.items():
        bid = str(raw_bid or "").strip()
        if not bid:
            raise BlockHistoryRetentionError("block_history_empty_block_id")
        if not isinstance(raw_rec, dict):
            raise BlockHistoryRetentionError(f"block_history_record_not_object:{bid}")
        ordered.append((bid, raw_rec, _block_record_height(bid, raw_rec)))
    ordered.sort(key=lambda item: (int(item[2]), str(item[0])))

    prune_count = int(len(ordered) - int(limit))
    pruned = ordered[:prune_count]
    protected = _protected_live_ancestry_ids(state, blocks_raw)
    for bid, _rec, _height in pruned:
        if bid in protected:
            raise BlockHistoryRetentionError("block_history_window_exhausted_by_live_safety_ancestry")

    pruned_ids = {bid for bid, _rec, _height in pruned}
    next_blocks = {k: v for k, v in blocks_raw.items() if str(k) not in pruned_ids}
    if len(next_blocks) > int(limit):
        raise BlockHistoryRetentionError("block_history_compaction_failed_to_bound_live_records")

    out = dict(state)
    out["blocks"] = next_blocks
    out[BLOCK_HISTORY_CHECKPOINT_KEY] = _extend_checkpoint(checkpoint, pruned)
    return out


def compact_bounded_block_history_in_place(state: Json) -> int:
    """Install the exact bounded-history projection into canonical live state."""

    before_raw = state.get("blocks") if isinstance(state, dict) else None
    before = len(before_raw) if isinstance(before_raw, dict) else 0
    projected = project_bounded_block_history_state(state)
    state["blocks"] = projected.get("blocks", {})
    if BLOCK_HISTORY_CHECKPOINT_KEY in projected:
        state[BLOCK_HISTORY_CHECKPOINT_KEY] = projected[BLOCK_HISTORY_CHECKPOINT_KEY]
    after_raw = state.get("blocks")
    after = len(after_raw) if isinstance(after_raw, dict) else 0
    return max(0, int(before - after))
'''
          if 'class BlockHistoryRetentionError' not in state_hash:
              assert insertion_anchor in state_hash
              state_hash = state_hash.replace(
                  insertion_anchor,
                  retention_code + insertion_anchor,
