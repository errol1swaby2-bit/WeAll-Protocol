name: P0-10 A15-F001 bounded history closure

on:
  push:
    branches: ["p0-03-production-closure-staging-20261001"]
    paths:
      - ".github/workflows/p0-10-a15f001-bounded-history-closure.yml"

permissions:
  contents: write

concurrency:
  group: p0-10-a15f001-bounded-history-closure
  cancel-in-progress: false

jobs:
  closure:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Weall-Protocol

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: p0-03-production-closure-staging-20261001
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wire bounded history into state root and commit
        working-directory: .
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          state_path = Path("Weall-Protocol/src/weall/runtime/state_hash.py")
          state = state_path.read_text()
          import_anchor = "from typing import Any, Final\n"
          import_line = (
              "from weall.runtime.block_history import "
              "project_bounded_block_history_state\n"
          )
          if import_line not in state:
              assert import_anchor in state
              state = state.replace(import_anchor, import_anchor + "\n" + import_line, 1)

          meta_anchor = '        "recent_block_anchor_activation_height",\n'
          if '"consensus_block_history_max_records"' not in state:
              assert meta_anchor in state
              state = state.replace(
                  meta_anchor,
                  meta_anchor + '        "consensus_block_history_max_records",\n',
                  1,
              )

          if "bounded_state = project_bounded_block_history_state(state)" not in state:
              loop_anchor = (
                  "    out: dict[str, Any] = {}\n"
                  "    for key in sorted(state.keys(), key=lambda x: str(x)):\n"
              )
              loop_replacement = (
                  "    bounded_state = project_bounded_block_history_state(state)\n"
                  "    out: dict[str, Any] = {}\n"
                  "    for key in sorted(bounded_state.keys(), key=lambda x: str(x)):\n"
              )
              assert loop_anchor in state
              state = state.replace(loop_anchor, loop_replacement, 1)
              assert "projected = _canonical_meta(state[key])" in state
              state = state.replace(
                  "projected = _canonical_meta(state[key])",
                  "projected = _canonical_meta(bounded_state[key])",
                  1,
              )
              assert "out[ks] = _canonical(state[key])" in state
              state = state.replace(
                  "out[ks] = _canonical(state[key])",
                  "out[ks] = _canonical(bounded_state[key])",
                  1,
              )
          state_path.write_text(state)

          commit_path = Path("Weall-Protocol/src/weall/runtime/block_commit.py")
          commit = commit_path.read_text()
          commit_import_anchor = (
              "from weall.runtime.block_commitment_validation import "
              "ensure_complete_block_commitments\n"
          )
          commit_import = (
              "from weall.runtime.block_history import "
              "compact_bounded_block_history_in_place\n"
          )
          if commit_import not in commit:
              assert commit_import_anchor in commit
              commit = commit.replace(
                  commit_import_anchor,
                  commit_import_anchor + commit_import,
                  1,
              )

          commit_anchor = (
              "        # Durable history is a stronger trust boundary than cheap received-block\n"
          )
          compact_call = (
              "        # Persist exactly the finite ancestry projection committed by state_root.\n"
              "        # Local BFT metadata is never consulted when selecting compactable history.\n"
              "        try:\n"
              "            compact_bounded_block_history_in_place(new_state)\n"
              "        except Exception as exc:\n"
              "            return ExecutorMeta(\n"
              "                ok=False,\n"
              "                error=f\"block_history_compaction_failed:{type(exc).__name__}:{str(exc)}\",\n"
              "                height=0,\n"
              "                block_id=\"\",\n"
              "            )\n\n"
          )
          if "compact_bounded_block_history_in_place(new_state)" not in commit:
              assert commit_anchor in commit
              commit = commit.replace(commit_anchor, compact_call + commit_anchor, 1)
          commit_path.write_text(commit)

          mapping_path = Path("Weall-Protocol/specs/v2/source/source_mappings.json")
          mapping_payload = json.loads(mapping_path.read_text(encoding="utf-8"))
          mappings = mapping_payload.get("mappings")
          assert isinstance(mappings, list)
          history_path = "src/weall/runtime/block_history.py"
          if not any(
              isinstance(row, dict) and str(row.get("path") or "") == history_path
              for row in mappings
          ):
              mappings.append(
                  {
                      "affected_registers": ["mechanisms"],
                      "classification": "authoritative_or_launch_critical",
                      "path": history_path,
                      "primary_mechanism_id": "M-012",
                      "review_status": "mapped_current_snapshot",
                  }
              )
              mappings.sort(key=lambda row: str(row.get("path") or ""))
              mapping_path.write_text(
                  json.dumps(mapping_payload, indent=2, ensure_ascii=False) + "\n",
                  encoding="utf-8",
              )
          PY

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Format and lint A15-F001 surfaces
        run: |
          ruff format \
            src/weall/runtime/block_history.py \
            src/weall/runtime/state_hash.py \
            src/weall/runtime/block_commit.py \
            tests/test_p0_10_a15_f001_bounded_block_history.py
          ruff check \
            src/weall/runtime/block_history.py \
            src/weall/runtime/state_hash.py \
            src/weall/runtime/block_commit.py \
            tests/test_p0_10_a15_f001_bounded_block_history.py

      - name: Refresh V2 derivatives and deterministic proof artifacts
        run: |
          python scripts/compile_v2_spec.py
          python scripts/gen_b528_b532_completion_proof_v1_5.py
          python scripts/gen_b534_b538_completion_proof_v1_5.py
          python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py

      - name: Verify derivative freshness
        run: |
          python scripts/compile_v2_spec.py --check
          python scripts/gen_b528_b532_completion_proof_v1_5.py --check
          python scripts/gen_b534_b538_completion_proof_v1_5.py --check
          python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py --check

      - name: Focused A15-F001 regressions
        run: |
          pytest -q \
            tests/test_p0_10_a15_f001_bounded_block_history.py \
            tests/test_block_commitments_required.py \
            tests/test_restart_and_sync_safety.py \
            tests/test_bft_canonical_finality_bridge.py \
            tests/test_priority1_lock_vs_highqc_branch_safety.py \
            tests/test_priority1_locked_qc_safety.py

      - name: Canon lint
        run: python -m tooling.canon_lint

      - name: Full backend regression
        run: pytest -q

      - name: Commit workflow-free implementation
        working-directory: .
        env:
          BRANCH: p0-03-production-closure-staging-20261001
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Weall-Protocol/src/weall/runtime/block_history.py \
            Weall-Protocol/src/weall/runtime/state_hash.py \
            Weall-Protocol/src/weall/runtime/block_commit.py \
            Weall-Protocol/tests/test_p0_10_a15_f001_bounded_block_history.py \
            Weall-Protocol/specs/v2/source/source_mappings.json \
            Weall-Protocol/generated/b528_b532_completion_proof_v1_5.json \
            Weall-Protocol/generated/b534_b538_completion_proof_v1_5.json \
            Weall-Protocol/generated/b567_b571_autonomous_mechanics_proof_v1_5.json \
            Weall-Protocol/generated/v2 \
            web/src/generated/protocolStatus.ts
          git rm .github/workflows/p0-10-a15f001-bounded-history-closure.yml
          git commit -m "fix(p0-10): bound root-visible block ancestry"
          git push origin "HEAD:${BRANCH}"
