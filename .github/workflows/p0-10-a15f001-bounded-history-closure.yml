          state_hash_path.write_text(state_hash)

          block_commit = commit_path.read_text()
          import_anchor = 'from weall.runtime.block_commitment_validation import ensure_complete_block_commitments\n'
          import_line = 'from weall.runtime.state_hash import compact_bounded_block_history_in_place\n'
          if import_line not in block_commit:
              assert import_anchor in block_commit
              block_commit = block_commit.replace(import_anchor, import_anchor + import_line, 1)

          compaction_anchor = '''        # Durable history is a stronger trust boundary than cheap received-block\n'''
          compaction_code = '''        # Canonical state must persist the same bounded ancestry projection that\n        # state-root calculation committed to. This turns chain-age history into\n        # a fixed live window plus a rolling prefix commitment before serialization.\n        try:\n            compact_bounded_block_history_in_place(new_state)\n        except Exception as exc:\n            return ExecutorMeta(\n                ok=False,\n                error=f"block_history_compaction_failed:{type(exc).__name__}:{str(exc)}",\n                height=0,\n                block_id="",\n            )\n\n'''
