              )

          projection_anchor = '''    if not isinstance(state, dict):\n        return _canonical(state)\n\n    out: dict[str, Any] = {}\n    for key in sorted(state.keys(), key=lambda x: str(x)):\n'''
          projection_replacement = '''    if not isinstance(state, dict):\n        return _canonical(state)\n\n    bounded_state = project_bounded_block_history_state(state)\n    out: dict[str, Any] = {}\n    for key in sorted(bounded_state.keys(), key=lambda x: str(x)):\n'''
          if 'bounded_state = project_bounded_block_history_state(state)' not in state_hash:
              assert projection_anchor in state_hash
              state_hash = state_hash.replace(projection_anchor, projection_replacement, 1)
              state_hash = state_hash.replace(
                  'projected = _canonical_meta(state[key])',
