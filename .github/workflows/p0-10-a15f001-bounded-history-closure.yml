name: P0-10 A15-F001 bounded history closure

on:
  push:
    branches: ["p0-03-production-closure-staging-20261001"]
    paths:
      - ".github/workflows/p0-10-a15f001-bounded-history-closure.yml"

permissions:
  contents: write

concurrency:
  group: p0-10-a15f001-bounded-history-closure
  cancel-in-progress: false

jobs:
  closure:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Weall-Protocol

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: p0-03-production-closure-staging-20261001
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Patch bounded consensus block history
        working-directory: .
        run: |
          python - <<'PY'
          import base64
          exec(compile(base64.b64decode(""), "<p0-10-a15f001-patch>", "exec"))
          PY

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Format and lint changed Python
        run: |
          ruff format src/weall/runtime/state_hash.py src/weall/runtime/block_commit.py tests/test_p0_10_a15_f001_bounded_block_history.py
          ruff check src/weall/runtime/state_hash.py src/weall/runtime/block_commit.py tests/test_p0_10_a15_f001_bounded_block_history.py

      - name: Focused A15-F001 regressions
        run: |
          pytest -q \
            tests/test_p0_10_a15_f001_bounded_block_history.py \
            tests/test_block_commitments_required.py \
            tests/test_restart_and_sync_safety.py \
            tests/test_priority1_lock_vs_highqc_branch_safety.py \
            tests/test_priority1_locked_qc_safety.py

      - name: Canon lint
        run: python -m tooling.canon_lint

      - name: Full backend regression
        run: pytest -q

      - name: Commit workflow-free implementation
        working-directory: .
        env:
          BRANCH: p0-03-production-closure-staging-20261001
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Weall-Protocol/src/weall/runtime/state_hash.py \
            Weall-Protocol/src/weall/runtime/block_commit.py \
            Weall-Protocol/tests/test_p0_10_a15_f001_bounded_block_history.py
          git rm .github/workflows/p0-10-a15f001-bounded-history-closure.yml
          git commit -m "fix(p0-10): bound root-visible block ancestry"
          git push origin "HEAD:${BRANCH}"
