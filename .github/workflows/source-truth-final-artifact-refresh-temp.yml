name: Source Truth Final Artifact Refresh Temporary

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.ref == 'active-source-truth-hardening-20260921'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked development dependencies
        working-directory: Weall-Protocol
        run: python -m pip install -r requirements-dev.lock

      - name: Remove temporary workflow before generation
        run: rm .github/workflows/source-truth-final-artifact-refresh-temp.yml

      - name: Refresh dependent v1.5 evidence then compile v2 last
        working-directory: Weall-Protocol
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONPATH=src:scripts python scripts/gen_failure_code_registry_v1_5.py
          PYTHONPATH=src:scripts python scripts/gen_failure_code_registry_v1_5.py --check
          PYTHONPATH=src:scripts python scripts/gen_release_evidence_manifest_v1_5.py
          PYTHONPATH=src:scripts python scripts/gen_release_evidence_manifest_v1_5.py --check
          PYTHONPATH=src:scripts python scripts/gen_public_beta_blocker_report_v1_5.py
          PYTHONPATH=src:scripts python scripts/gen_public_beta_blocker_report_v1_5.py --check
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src:scripts python scripts/check_v15_public_readiness_artifacts.py
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src:scripts python scripts/check_release_hygiene_v1_5.py
          PYTHONPATH=src pytest -q tests/test_current_document_registry.py
          PYTHONPATH=src python scripts/check_public_claim_freshness.py
          PYTHONPATH=src python scripts/compile_v2_spec.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check

      - name: Commit final artifact closure
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "weall-source-truth-closure"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git status --short
          git diff --cached --check
          git commit -m "Refresh source-derived readiness evidence"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
