name: P0-10 F002 state-sync resource closure

on:
  push:
    branches: ["p0-03-production-closure-staging-20261001"]
    paths:
      - ".github/workflows/p0-10-f002-state-sync-resource-closure.yml"

permissions:
  contents: write

concurrency:
  group: p0-10-f002-state-sync-resource-closure
  cancel-in-progress: false

jobs:
  close-f002:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Weall-Protocol

    steps:
      - name: Checkout exact staging branch
        uses: actions/checkout@v4
        with:
          ref: p0-03-production-closure-staging-20261001
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply F002 patch and stage workflow-free tree
        working-directory: .
        run: |
          cd Weall-Protocol
          python ../.github/tools/p0_10_f002_apply.py
          cd ..
          git rm .github/tools/p0_10_f002_apply.py
          git rm .github/workflows/p0-10-f002-state-sync-resource-closure.yml

      - name: Install locked backend
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Format and lint F002 patch
        run: |
          ruff format \
            src/weall/net/state_sync.py \
            src/weall/net/node.py \
            src/weall/net/net_loop.py \
            tests/test_p0_10_a15_f002_state_sync_resource_bounds.py
          ruff check \
            src/weall/net/state_sync.py \
            src/weall/net/node.py \
            src/weall/net/net_loop.py \
            tests/test_p0_10_a15_f002_state_sync_resource_bounds.py

      - name: Refresh exact-tree proof and V2 derivatives
        run: |
          python scripts/gen_b528_b532_completion_proof_v1_5.py
          python scripts/gen_b534_b538_completion_proof_v1_5.py
          python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py
          python scripts/compile_v2_spec.py

      - name: Verify generated and canon gates
        run: |
          python scripts/check_generated.py
          python scripts/gen_b528_b532_completion_proof_v1_5.py --check
          python scripts/gen_b534_b538_completion_proof_v1_5.py --check
          python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py --check
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          PYTHONDONTWRITEBYTECODE=1 python scripts/check_v15_public_readiness_artifacts.py
          python scripts/check_public_claim_freshness.py
          python scripts/gen_current_verified_claims.py --check
          python -m tooling.canon_lint

      - name: Focused F002 regression
        run: |
          pytest -q \
            tests/test_p0_10_a15_f002_state_sync_resource_bounds.py \
            tests/test_state_sync_trusted_anchor.py \
            tests/test_priority2_state_sync_transport_safety.py \
            tests/test_net_multi_node.py \
            tests/test_net_loop_state_sync_build.py \
            tests/test_restart_and_sync_safety.py \
            tests/test_transport_config_fail_closed.py

      - name: Full backend regression
        run: pytest -q

      - name: Guard final diff and commit workflow-free tree
        working-directory: .
        run: |
          python - <<'PY'
          import subprocess

          allowed = (
              ".github/tools/p0_10_f002_apply.py",
              ".github/workflows/p0-10-f002-state-sync-resource-closure.yml",
              "Weall-Protocol/src/weall/net/state_sync.py",
              "Weall-Protocol/src/weall/net/node.py",
              "Weall-Protocol/src/weall/net/net_loop.py",
              "Weall-Protocol/tests/test_p0_10_a15_f002_state_sync_resource_bounds.py",
              "Weall-Protocol/generated/b528_b532_completion_proof_v1_5.json",
              "Weall-Protocol/generated/b534_b538_completion_proof_v1_5.json",
              "Weall-Protocol/generated/b567_b571_autonomous_mechanics_proof_v1_5.json",
              "Weall-Protocol/generated/v2/",
              "web/src/generated/protocolStatus.ts",
          )
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "HEAD"], text=True
          ).splitlines()
          unexpected = [
              path for path in changed
              if not any(path == prefix or path.startswith(prefix) for prefix in allowed)
          ]
          if unexpected:
              raise SystemExit(f"unexpected changed paths: {unexpected}")
          print("validated changed paths:")
          for path in changed:
              print(path)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(p0-10): bound P2P state-sync work"

      - name: Verify committed clean checkout contract
        working-directory: .
        run: |
          cd Weall-Protocol
          python scripts/check_v2_spec_clean_checkout.py
          cd ..
          TMP="$(mktemp -d)"
          git archive HEAD | tar -x -C "$TMP"
          cd "$TMP/Weall-Protocol"
          bash scripts/verify_release_tree.sh

      - name: Push verified F002 closure
        working-directory: .
        env:
          BRANCH: p0-03-production-closure-staging-20261001
        run: git push origin "HEAD:${BRANCH}"
