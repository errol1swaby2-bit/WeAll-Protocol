name: P0-10 F002 state-sync resource closure

on:
  push:
    branches: ["p0-03-production-closure-staging-20261001"]
    paths:
      - ".github/workflows/p0-10-f002-state-sync-resource-closure.yml"

permissions:
  contents: write

concurrency:
  group: p0-10-f002-state-sync-resource-closure
  cancel-in-progress: false

jobs:
  close-f002:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Weall-Protocol

    steps:
      - name: Checkout exact staging branch
        uses: actions/checkout@v4
        with:
          ref: p0-03-production-closure-staging-20261001
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stage workflow-free source tree
        working-directory: .
        run: git rm .github/workflows/p0-10-f002-state-sync-resource-closure.yml

      - name: Apply bounded F002 patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          def sub_once(text: str, pattern: str, replacement: str, label: str) -> str:
              new_text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one regex match, found {count}")
              return new_text

          state_path = Path("src/weall/net/state_sync.py")
          state = state_path.read_text(encoding="utf-8")

          state = replace_once(
              state,
              "from weall.net.messages import MsgType, StateSyncRequestMsg, StateSyncResponseMsg, WireHeader\n",
              "from weall.net.messages import MsgType, StateSyncRequestMsg, StateSyncResponseMsg, WireHeader\n"
              "from weall.net.wire_limits import (\n"
              "    MAX_WIRE_MESSAGE_BYTES,\n"
              "    STATE_SYNC_CHUNK_WRAPPER_RESERVE_BYTES,\n"
              ")\n",
              "state_sync wire-limit import",
          )

          state = replace_once(
              state,
              "Json = dict[str, Any]\n",
              "Json = dict[str, Any]\n\n"
              "DEFAULT_STATE_SYNC_MAX_RESPONSE_BYTES = max(\n"
              "    1, int(MAX_WIRE_MESSAGE_BYTES) - int(STATE_SYNC_CHUNK_WRAPPER_RESERVE_BYTES)\n"
              ")\n"
              "_TRUSTED_ANCHOR_PIN_KEYS = (\n"
              "    \"height\",\n"
              "    \"tip_hash\",\n"
              "    \"state_root\",\n"
              "    \"finalized_height\",\n"
              "    \"finalized_block_id\",\n"
              "    \"snapshot_hash\",\n"
              ")\n",
              "state_sync constants",
          )

          state = sub_once(
              state,
              r"def _trusted_anchor_env\(default: bool\) -> bool:\n.*?\n\ndef _finalized_anchor_env",
              '''def _trusted_anchor_env(default: bool) -> bool:
              """Read either trusted-anchor env alias and fail closed on conflict/invalid input."""

              names = ("WEALL_SYNC_REQUIRE_TRUSTED_ANCHOR", "WEALL_STATE_SYNC_REQUIRE_TRUSTED_ANCHOR")
              seen: dict[str, bool] = {}
              for name in names:
                  raw = os.environ.get(name)
                  if raw is None:
                      continue
                  parsed = str(raw).strip().lower()
                  if parsed in {"1", "true", "yes", "y", "on"}:
                      seen[name] = True
                  elif parsed in {"0", "false", "no", "n", "off"}:
                      seen[name] = False
                  elif not parsed:
                      seen[name] = bool(default)
                  elif _mode() == "prod":
                      raise StateSyncVerifyError(f"invalid_boolean_env:{name}")
                  else:
                      seen[name] = bool(default)
              if not seen:
                  return bool(default)
              vals = set(seen.values())
              if len(vals) > 1:
                  raise StateSyncVerifyError("trusted_anchor_env_conflict")
              return bool(next(iter(vals)))


def _finalized_anchor_env''',
              "trusted-anchor env parser",
          )

          state = replace_once(
              state,
              '''    # Hardening caps (tunable by env).
              max_delta_blocks: int = 250
              max_snapshot_bytes: int = 0  # 0 = unlimited
              max_delta_bytes: int = 0  # 0 = unlimited
              require_header_match: bool = True
              fallback_to_snapshot: bool = True
              require_trusted_anchor: bool = False
              enforce_finalized_anchor: bool = False
              bft_enabled: bool | None = None
''',
              '''    # Hardening caps (tunable downward by env in production).
              # Direct state-sync responses share the canonical peer wire budget;
              # production must never silently fall back to an unlimited response.
              max_delta_blocks: int = 250
              max_snapshot_bytes: int = DEFAULT_STATE_SYNC_MAX_RESPONSE_BYTES
              max_delta_bytes: int = DEFAULT_STATE_SYNC_MAX_RESPONSE_BYTES
              require_header_match: bool = True
              fallback_to_snapshot: bool = True
              require_trusted_anchor: bool | None = None
              enforce_finalized_anchor: bool = False
              bft_enabled: bool | None = None
''',
              "state-sync dataclass hardening defaults",
          )

          state = replace_once(
              state,
              '''        self.max_delta_blocks = max(
                          1, _env_int("WEALL_SYNC_MAX_DELTA_BLOCKS", int(self.max_delta_blocks or 250))
                      )
                      self.max_snapshot_bytes = max(
                          0, _env_int("WEALL_SYNC_MAX_SNAPSHOT_BYTES", int(self.max_snapshot_bytes or 0))
                      )
                      self.max_delta_bytes = max(
                          0, _env_int("WEALL_SYNC_MAX_DELTA_BYTES", int(self.max_delta_bytes or 0))
                      )
                      self.require_header_match = _env_bool(
                          "WEALL_SYNC_REQUIRE_HEADER_MATCH", bool(self.require_header_match)
                      )
                      self.fallback_to_snapshot = _env_bool(
                          "WEALL_SYNC_FALLBACK_TO_SNAPSHOT", bool(self.fallback_to_snapshot)
                      )
                      self.require_trusted_anchor = _trusted_anchor_env(bool(self.require_trusted_anchor))
''',
              '''        self.max_delta_blocks = max(
                          1, _env_int("WEALL_SYNC_MAX_DELTA_BLOCKS", int(self.max_delta_blocks or 250))
                      )
                      snapshot_default = int(self.max_snapshot_bytes or DEFAULT_STATE_SYNC_MAX_RESPONSE_BYTES)
                      delta_default = int(self.max_delta_bytes or DEFAULT_STATE_SYNC_MAX_RESPONSE_BYTES)
                      self.max_snapshot_bytes = max(
                          0, _env_int("WEALL_SYNC_MAX_SNAPSHOT_BYTES", snapshot_default)
                      )
                      self.max_delta_bytes = max(
                          0, _env_int("WEALL_SYNC_MAX_DELTA_BYTES", delta_default)
                      )
                      mode = _mode()
                      if mode == "prod":
                          if self.max_snapshot_bytes <= 0:
                              raise StateSyncVerifyError("unsafe_sync_snapshot_cap_unbounded")
                          if self.max_delta_bytes <= 0:
                              raise StateSyncVerifyError("unsafe_sync_delta_cap_unbounded")
                          if self.max_snapshot_bytes > int(DEFAULT_STATE_SYNC_MAX_RESPONSE_BYTES):
                              raise StateSyncVerifyError("unsafe_sync_snapshot_cap_exceeds_wire_budget")
                          if self.max_delta_bytes > int(DEFAULT_STATE_SYNC_MAX_RESPONSE_BYTES):
                              raise StateSyncVerifyError("unsafe_sync_delta_cap_exceeds_wire_budget")
                      self.require_header_match = _env_bool(
                          "WEALL_SYNC_REQUIRE_HEADER_MATCH", bool(self.require_header_match)
                      )
                      self.fallback_to_snapshot = _env_bool(
                          "WEALL_SYNC_FALLBACK_TO_SNAPSHOT", bool(self.fallback_to_snapshot)
                      )
                      require_anchor_default = (
                          mode == "prod"
                          if self.require_trusted_anchor is None
                          else bool(self.require_trusted_anchor)
                      )
                      self.require_trusted_anchor = _trusted_anchor_env(require_anchor_default)
                      if mode == "prod" and not self.require_trusted_anchor:
                          raise StateSyncVerifyError("unsafe_sync_trusted_anchor_disabled")
''',
              "state-sync __post_init__ hardening",
          )

          state = replace_once(
              state,
              '''    def handle_request(self, req: StateSyncRequestMsg) -> StateSyncResponseMsg:
''',
              '''    def _response_header(self, req: StateSyncRequestMsg) -> WireHeader:
                      try:
                          corr_id = str(getattr(req.header, "corr_id", "") or "").strip() or None
                      except Exception:
                          corr_id = None
                      return WireHeader(
                          type=MsgType.STATE_SYNC_RESPONSE,
                          chain_id=self.chain_id,
                          schema_version=self.schema_version,
                          tx_index_hash=self.tx_index_hash,
                          sent_ts_ms=_now_ms(),
                          corr_id=corr_id,
                      )

                  def reject_request(
                      self, req: StateSyncRequestMsg, reason: str, *, height: int = 0
                  ) -> StateSyncResponseMsg:
                      return StateSyncResponseMsg(
                          header=self._response_header(req),
                          ok=False,
                          reason=str(reason or "state_sync_rejected"),
                          height=max(0, int(height or 0)),
                      )

                  def _preflight_trusted_anchor(self, selector: Any) -> tuple[Json | None, str | None]:
                      if selector is None:
                          if self.require_trusted_anchor:
                              return None, "trusted_anchor_required"
                          return None, None
                      if not isinstance(selector, dict):
                          return None, "trusted_anchor_invalid"
                      if "trusted_anchor" not in selector:
                          if self.require_trusted_anchor:
                              return None, "trusted_anchor_required"
                          return None, None
                      raw = selector.get("trusted_anchor")
                      if not isinstance(raw, dict):
                          return None, "trusted_anchor_invalid"
                      anchor = dict(raw)
                      if not any(anchor.get(key) not in (None, "") for key in _TRUSTED_ANCHOR_PIN_KEYS):
                          return None, "trusted_anchor_invalid"
                      for key in ("height", "finalized_height"):
                          if key not in anchor or anchor.get(key) in (None, ""):
                              continue
                          value = anchor.get(key)
                          if isinstance(value, bool):
                              return None, "trusted_anchor_invalid"
                          try:
                              parsed = int(value)
                          except Exception:
                              return None, "trusted_anchor_invalid"
                          if parsed < 0:
                              return None, "trusted_anchor_invalid"
                      for key in (
                          "tip_hash",
                          "state_root",
                          "finalized_block_id",
                          "snapshot_hash",
                      ):
                          if key in anchor and anchor.get(key) not in (None, ""):
                              if not isinstance(anchor.get(key), str):
                                  return None, "trusted_anchor_invalid"
                      return anchor, None

                  def preflight_request(self, req: StateSyncRequestMsg) -> StateSyncResponseMsg | None:
                      reason = self._header_ok(req)
                      if reason:
                          return self.reject_request(req, reason)

                      mode = str(getattr(req, "mode", "") or "").strip().lower()
                      if mode not in {"snapshot", "delta"}:
                          return self.reject_request(req, "bad_mode")

                      _trusted_anchor, anchor_reason = self._preflight_trusted_anchor(req.selector)
                      if anchor_reason:
                          return self.reject_request(req, anchor_reason)

                      if mode == "delta":
                          if not self.enable_delta:
                              return self.reject_request(req, "delta_disabled")
                          if self.block_provider is None:
                              return self.reject_request(req, "delta_unavailable")
                          raw_start = getattr(req, "from_height", 0)
                          if isinstance(raw_start, bool):
                              return self.reject_request(req, "bad_from_height")
                          try:
                              start = int(raw_start or 0)
                          except Exception:
                              return self.reject_request(req, "bad_from_height")
                          if start < 0:
                              return self.reject_request(req, "bad_from_height")
                          raw_to = getattr(req, "to_height", None)
                          if raw_to is not None:
                              if isinstance(raw_to, bool):
                                  return self.reject_request(req, "bad_to_height")
                              try:
                                  end = int(raw_to)
                              except Exception:
                                  return self.reject_request(req, "bad_to_height")
                              if end < 0:
                                  return self.reject_request(req, "bad_to_height")
                              if end < start:
                                  return self.reject_request(req, "bad_height_range")
                      return None

                  def handle_request(self, req: StateSyncRequestMsg) -> StateSyncResponseMsg:
''',
              "state-sync preflight methods",
          )

          state = replace_once(
              state,
              '''        corr_id = req.header.corr_id
                      hdr = WireHeader(
                          type=MsgType.STATE_SYNC_RESPONSE,
                          chain_id=self.chain_id,
                          schema_version=self.schema_version,
                          tx_index_hash=self.tx_index_hash,
                          sent_ts_ms=_now_ms(),
                          corr_id=corr_id,
                      )

                      reason = self._header_ok(req)
                      if reason:
                          return StateSyncResponseMsg(header=hdr, ok=False, reason=reason, height=0)

                      st = self.state_provider()
                      if not isinstance(st, dict):
                          return StateSyncResponseMsg(header=hdr, ok=False, reason="bad_state", height=0)

                      tip_h = int(st.get("height", 0) or 0)
                      local_anchor = build_snapshot_anchor(st)
                      trusted_anchor = self._trusted_anchor_from_selector(req.selector)
                      if trusted_anchor is None and self.require_trusted_anchor:
                          return StateSyncResponseMsg(
                              header=hdr, ok=False, reason="trusted_anchor_required", height=tip_h
                          )
''',
              '''        early = self.preflight_request(req)
                      if early is not None:
                          return early

                      hdr = self._response_header(req)
                      trusted_anchor = self._trusted_anchor_from_selector(req.selector)
                      st = self.state_provider()
                      if not isinstance(st, dict):
                          return StateSyncResponseMsg(header=hdr, ok=False, reason="bad_state", height=0)

                      tip_h = int(st.get("height", 0) or 0)
                      local_anchor = build_snapshot_anchor(st)
''',
              "state-sync handle_request early admission",
          )

          state = replace_once(
              state,
              '''        def _reply_snapshot(reason: str | None) -> StateSyncResponseMsg:
                          snap = state_sync_snapshot_view(st)
                          if not self._size_ok(snap, self.max_snapshot_bytes):
                              return StateSyncResponseMsg(
                                  header=hdr, ok=False, reason="snapshot_too_large", height=tip_h
                              )
                          checkpoint_blocks = _snapshot_checkpoint_blocks()
                          if checkpoint_blocks is None:
                              return StateSyncResponseMsg(
                                  header=hdr,
                                  ok=False,
                                  reason="snapshot_checkpoint_unavailable",
                                  height=tip_h,
                              )
                          snap_hash = sha256_hex_of(snap)
                          return StateSyncResponseMsg(
''',
              '''        def _reply_snapshot(reason: str | None) -> StateSyncResponseMsg:
                          snap = state_sync_snapshot_view(st)
                          checkpoint_blocks = _snapshot_checkpoint_blocks()
                          if checkpoint_blocks is None:
                              return StateSyncResponseMsg(
                                  header=hdr,
                                  ok=False,
                                  reason="snapshot_checkpoint_unavailable",
                                  height=tip_h,
                              )
                          snap_hash = sha256_hex_of(snap)
                          bounded_payload = {
                              "snapshot": snap,
                              "snapshot_hash": snap_hash,
                              "snapshot_anchor": local_anchor,
                              "blocks": list(checkpoint_blocks),
                          }
                          if not self._size_ok(bounded_payload, self.max_snapshot_bytes):
                              return StateSyncResponseMsg(
                                  header=hdr, ok=False, reason="snapshot_too_large", height=tip_h
                              )
                          return StateSyncResponseMsg(
''',
              "snapshot response cap",
          )

          state = replace_once(
              state,
              '''            if self.max_delta_bytes > 0 and not self._size_ok(blocks, self.max_delta_bytes):
                              return StateSyncResponseMsg(
                                  header=hdr, ok=False, reason="delta_too_large", height=tip_h
                              )
''',
              '''            bounded_payload = {"blocks": blocks, "snapshot_anchor": local_anchor}
                          if self.max_delta_bytes > 0 and not self._size_ok(
                              bounded_payload, self.max_delta_bytes
                          ):
                              return StateSyncResponseMsg(
                                  header=hdr, ok=False, reason="delta_too_large", height=tip_h
                              )
''',
              "delta response cap",
          )

          state_path.write_text(state, encoding="utf-8")

          node_path = Path("src/weall/net/node.py")
          node = node_path.read_text(encoding="utf-8")
          node = replace_once(node, "import os\nimport time\n", "import os\nimport queue\nimport threading\nimport time\n", "node worker imports")

          node = replace_once(
              node,
              '''        self._sync_responses: OrderedDict[str, StateSyncResponseMsg] = OrderedDict()
                      self._sync_requests: OrderedDict[str, tuple[str, int]] = OrderedDict()
                      self._sync_completed: OrderedDict[tuple[str, str], int] = OrderedDict()
''',
              '''        self._sync_responses: OrderedDict[str, StateSyncResponseMsg] = OrderedDict()
                      self._sync_requests: OrderedDict[str, tuple[str, int]] = OrderedDict()
                      self._sync_completed: OrderedDict[tuple[str, str], int] = OrderedDict()

                      # A15-F002: expensive state-sync materialization is isolated from
                      # the latency-sensitive network/BFT lane. One daemon worker serves
                      # a globally bounded queue; per-peer admission prevents one session
                      # from occupying the entire work budget.
                      self._sync_work_cap: int = max(1, _env_int("WEALL_NET_SYNC_WORK_MAX", 4))
                      self._sync_work_per_peer_cap: int = max(
                          1, _env_int("WEALL_NET_SYNC_WORK_PER_PEER_MAX", 1)
                      )
                      self._sync_results_per_tick: int = max(
                          1, _env_int("WEALL_NET_SYNC_RESULTS_PER_TICK", 1)
                      )
                      self._sync_work_queue: queue.Queue[
                          tuple[str, StateSyncRequestMsg] | None
                      ] = queue.Queue(maxsize=int(self._sync_work_cap))
                      self._sync_result_queue: queue.Queue[
                          tuple[str, StateSyncResponseMsg]
                      ] = queue.Queue(maxsize=int(self._sync_work_cap))
                      self._sync_work_slots = threading.BoundedSemaphore(int(self._sync_work_cap))
                      self._sync_work_lock = threading.Lock()
                      self._sync_work_per_peer: dict[str, int] = {}
                      self._sync_worker_stop = threading.Event()
                      self._sync_worker: threading.Thread | None = None
''',
              "node sync work budget fields",
          )

          node = replace_once(
              node,
              '''    # ----------------------------
                  # Peer address gossip helpers
                  # ----------------------------
''',
              '''    def _acquire_sync_work_slot(self, peer_id: str) -> bool:
                      pid = str(peer_id or "").strip()
                      if not pid:
                          return False
                      with self._sync_work_lock:
                          peer_count = int(self._sync_work_per_peer.get(pid, 0) or 0)
                          if peer_count >= int(self._sync_work_per_peer_cap):
                              return False
                          if not self._sync_work_slots.acquire(blocking=False):
                              return False
                          self._sync_work_per_peer[pid] = peer_count + 1
                      return True

                  def _release_sync_work_slot(self, peer_id: str) -> None:
                      pid = str(peer_id or "").strip()
                      with self._sync_work_lock:
                          count = int(self._sync_work_per_peer.get(pid, 0) or 0)
                          if count <= 1:
                              self._sync_work_per_peer.pop(pid, None)
                          else:
                              self._sync_work_per_peer[pid] = count - 1
                          try:
                              self._sync_work_slots.release()
                          except ValueError:
                              pass

                  def _ensure_sync_worker(self) -> None:
                      if self.sync_service is None:
                          return
                      with self._sync_work_lock:
                          worker = self._sync_worker
                          if worker is not None and worker.is_alive():
                              return
                          self._sync_worker_stop.clear()
                          worker = threading.Thread(
                              target=self._sync_worker_main,
                              name=f"weall-state-sync-{self.cfg.peer_id}",
                              daemon=True,
                          )
                          self._sync_worker = worker
                          worker.start()

                  def _sync_worker_main(self) -> None:
                      while not self._sync_worker_stop.is_set():
                          try:
                              item = self._sync_work_queue.get(timeout=0.1)
                          except queue.Empty:
                              continue
                          if item is None:
                              self._sync_work_queue.task_done()
                              break
                          peer_id, req = item
                          response: StateSyncResponseMsg | None = None
                          try:
                              service = self.sync_service
                              if service is not None:
                                  response = service.handle_request(req)
                          except Exception:
                              service = self.sync_service
                              if service is not None:
                                  response = service.reject_request(req, "sync_internal_error")
                          finally:
                              self._sync_work_queue.task_done()

                          if response is None:
                              self._release_sync_work_slot(peer_id)
                              continue
                          try:
                              self._sync_result_queue.put_nowait((peer_id, response))
                          except queue.Full:
                              self._release_sync_work_slot(peer_id)

                  def _enqueue_sync_request(
                      self, peer_id: str, req: StateSyncRequestMsg
                  ) -> StateSyncResponseMsg | None:
                      service = self.sync_service
                      if service is None:
                          return None

                      # Cheap request/header/trust/range checks happen before a work
                      # slot is consumed and before state_provider() can run.
                      early = service.preflight_request(req)
                      if early is not None:
                          return early

                      pid = str(peer_id or "").strip()
                      if not self._acquire_sync_work_slot(pid):
                          return service.reject_request(req, "sync_busy")
                      try:
                          self._ensure_sync_worker()
                          self._sync_work_queue.put_nowait((pid, req))
                      except Exception:
                          self._release_sync_work_slot(pid)
                          return service.reject_request(req, "sync_busy")
                      return None

                  def _drain_sync_work(self, *, max_results: int | None = None) -> None:
                      limit = max(
                          1,
                          int(
                              self._sync_results_per_tick
                              if max_results is None
                              else max_results
                          ),
                      )
                      for _ in range(limit):
                          try:
                              peer_id, response = self._sync_result_queue.get_nowait()
                          except queue.Empty:
                              break
                          try:
                              self.send_message(peer_id, response)
                          except Exception:
                              pass
                          finally:
                              self._sync_result_queue.task_done()
                              self._release_sync_work_slot(peer_id)

                  def sync_work_debug(self) -> Json:
                      with self._sync_work_lock:
                          per_peer = dict(self._sync_work_per_peer)
                      worker = self._sync_worker
                      outstanding = sum(max(0, int(v)) for v in per_peer.values())
                      return {
                          "capacity": int(self._sync_work_cap),
                          "per_peer_capacity": int(self._sync_work_per_peer_cap),
                          "results_per_tick": int(self._sync_results_per_tick),
                          "outstanding": int(outstanding),
                          "queued": int(self._sync_work_queue.qsize()),
                          "completed_waiting": int(self._sync_result_queue.qsize()),
                          "worker_alive": bool(worker is not None and worker.is_alive()),
                          "per_peer": per_peer,
                      }

                  # ----------------------------
                  # Peer address gossip helpers
                  # ----------------------------
''',
              "node async sync worker methods",
          )

          node = replace_once(
              node,
              '''        def _on_sync_request(msg: WireMessage) -> WireMessage | None:
                          if not self.sync_service:
                              return None
                          return self.sync_service.handle_request(msg)  # type: ignore[arg-type]
''',
              '''        def _on_sync_request(msg: WireMessage) -> WireMessage | None:
                          if not self.sync_service or not isinstance(msg, StateSyncRequestMsg):
                              return None
                          return self._enqueue_sync_request(peer_id, msg)
''',
              "node state-sync router isolation",
          )

          node = replace_once(
              node,
              '''    def close(self) -> None:
                      try:
                          self.transport.close()
                      except Exception:
                          pass
                      self._conns.clear()
                      self._peers.clear()
''',
              '''    def close(self) -> None:
                      self._sync_worker_stop.set()
                      try:
                          self._sync_work_queue.put_nowait(None)
                      except queue.Full:
                          pass
                      worker = self._sync_worker
                      if worker is not None and worker.is_alive():
                          worker.join(timeout=0.25)
                      try:
                          self.transport.close()
                      except Exception:
                          pass
                      self._conns.clear()
                      self._peers.clear()
''',
              "node close sync worker",
          )

          node = replace_once(
              node,
              '''    def tick(self, *, max_packets: int = 250) -> None:
                      self._refresh_conns()
                      try:
                          for pkt in self.transport.poll(max_packets=int(max_packets)):
                              try:
                                  self._handle_packet(pkt)
                              except Exception:
                                  continue
                      except Exception:
                          return
''',
              '''    def tick(self, *, max_packets: int = 250) -> None:
                      self._refresh_conns()
                      try:
                          for pkt in self.transport.poll(max_packets=int(max_packets)):
                              try:
                                  self._handle_packet(pkt)
                              except Exception:
                                  continue
                      except Exception:
                          self._drain_sync_work()
                          return
                      self._drain_sync_work()
''',
              "node bounded sync response drain",
