# Temporary branch-scoped full derivative closure; self-removes before compile.
name: PR61 Final Assurance Derivative Closure

on:
  push:
    paths:
      - ".github/workflows/pr61-final-assurance-once.yml"

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ github.repository == 'errol1swaby2-bit/WeAll-Protocol' && github.ref == 'refs/heads/fix/pr60-content-dispute-system-schema-20261025' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Locked environment
        working-directory: Weall-Protocol
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install -e . --no-deps
      - name: Remove transient workflow before deriving source fingerprints
        run: git rm -- .github/workflows/pr61-final-assurance-once.yml
      - name: Rebuild all changed strict schema dependent artifacts
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          PYTHONPATH=src python scripts/gen_tx_semantic_assurance_v1_5.py
          PYTHONPATH=src python scripts/gen_tx_lifecycle_assurance_v1_5.py
          PYTHONPATH=src python scripts/gen_tx_semantic_assurance_v1_5.py --check
          PYTHONPATH=src python scripts/gen_tx_lifecycle_assurance_v1_5.py --check
          PYTHONPATH=src python scripts/compile_v2_spec.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          PYTHONPATH=src python -m pytest -q tests/test_content_escalation_followup_restart_admission.py tests/test_p2_a02_lifecycle_manifest.py tests/test_a16_f006_all_tx_semantic_assurance.py
          python -m ruff format --check src/weall/runtime/tx_schema.py tests/test_content_escalation_followup_restart_admission.py
          git diff --check
      - name: Commit source-bound derivatives with workflow removal
        shell: bash
        run: |
          set -Eeuo pipefail
          git add -A -- Weall-Protocol/generated/tx_semantic_assurance_v1_5.json Weall-Protocol/generated/tx_lifecycle_assurance_v1_5.json Weall-Protocol/generated/v2 web/src/generated/protocolStatus.ts
          if git diff --name-only --cached | grep -Ev '^(.github/workflows/pr61-final-assurance-once[.]yml$|Weall-Protocol/generated/tx_(semantic|lifecycle)_assurance_v1_5[.]json$|Weall-Protocol/generated/v2/|web/src/generated/protocolStatus[.]ts$)'; then
            echo "Unexpected staged artifact" >&2
            exit 1
          fi
          test ! -e .github/workflows/pr61-final-assurance-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(evidence): close lifecycle and semantic source-bound derivatives'
          git push origin HEAD:"${GITHUB_REF_NAME}"
