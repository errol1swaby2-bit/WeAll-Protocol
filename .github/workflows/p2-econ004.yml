name: P2 ECON004 Closure

on:
  push:
    branches:
      - p2-complete-remediation-20260927
    paths:
      - .github/workflows/p2-econ004.yml

permissions:
  contents: write

jobs:
  close:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: p2-complete-remediation-20260927
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked backend dependencies
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Remove one-shot workflow from source tree
        run: git rm .github/workflows/p2-econ004.yml

      - name: Patch strict balance-transfer schema and ingress regression
        working-directory: Weall-Protocol
        run: |
          python - <<'PY'
          from pathlib import Path

          schema_path = Path("src/weall/runtime/tx_schema.py")
          text = schema_path.read_text(encoding="utf-8")
          start = text.index("class BalanceTransferPayload(_StrictModel):")
          end = text.index("\n\nclass FeePayPayload", start)
          block = text[start:end]
          if "    purpose: str | None" not in block:
              anchor = "    memo: str | None = None"
              if anchor not in block:
                  raise SystemExit("BalanceTransferPayload memo anchor missing")
              block = block.replace(
                  anchor,
                  anchor
                  + "\n    purpose: str | None = Field(default=None, min_length=1)"
                  + "\n    content_id: str | None = Field(default=None, min_length=1)",
                  1,
              )
              text = text[:start] + block + text[end:]
              schema_path.write_text(text, encoding="utf-8")

          test_path = Path("tests/test_tx_schema_remaining_canon_cleanup.py")
          test_text = test_path.read_text(encoding="utf-8")
          test_name = "def test_balance_transfer_content_tip_fields_pass_strict_schema() -> None:"
          if test_name not in test_text:
              test_text += '''\n\n\ndef test_balance_transfer_content_tip_fields_pass_strict_schema() -> None:\n    _, parsed = validate_tx_envelope(\n        _env(\n            "BALANCE_TRANSFER",\n            {\n                "from_account_id": "@alice",\n                "to_account_id": "@creator",\n                "amount": 250,\n                "memo": "Tip for post:abc",\n                "purpose": "content_tip",\n                "content_id": "post:abc",\n            },\n        )\n    )\n    assert parsed is not None\n    payload = parsed.model_dump()\n    assert payload["purpose"] == "content_tip"\n    assert payload["content_id"] == "post:abc"\n'''
              test_path.write_text(test_text, encoding="utf-8")
          PY

      - name: Format and verify focused P2 ECON004 behavior
        working-directory: Weall-Protocol
        run: |
          ruff format src/weall/runtime/tx_schema.py tests/test_tx_schema_remaining_canon_cleanup.py
          ruff format --check src/weall/runtime/tx_schema.py tests/test_tx_schema_remaining_canon_cleanup.py
          ruff check src/weall/runtime/tx_schema.py tests/test_tx_schema_remaining_canon_cleanup.py
          pytest -q tests/test_tx_schema_remaining_canon_cleanup.py tests/test_transfer_tip_contract.py

      - name: Refresh BALANCE_TRANSFER semantic review and v2 derivatives
        working-directory: Weall-Protocol
        run: |
          python scripts/refresh_v2_semantic_reviews.py \
            --tx-type BALANCE_TRANSFER \
            --reviewer 'WeAll Protocol P2 audit remediation; independent launch review deferred'
          PYTHONPATH=src python scripts/compile_v2_spec.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          python scripts/gen_failure_code_registry_v1_5.py --check
          PYTHONPATH=src python scripts/gen_release_evidence_manifest_v1_5.py --check
          PYTHONPATH=src:scripts python scripts/gen_public_beta_blocker_report_v1_5.py --check
          python scripts/gen_current_verified_claims.py --check
          PYTHONDONTWRITEBYTECODE=1 python scripts/check_v15_public_readiness_artifacts.py
          python scripts/check_public_claim_freshness.py
          git diff --check

      - name: Commit verified P2 ECON004 closure and self-delete
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Close P2 ECON004 balance-transfer tipping admission gap'
          git push origin HEAD:p2-complete-remediation-20260927
