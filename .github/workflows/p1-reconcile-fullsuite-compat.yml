name: P1 Reconcile Full Suite Compatibility

on:
  push:
    branches:
      - p1-revalidation-after-p0-20261005
    paths:
      - .github/workflows/p1-reconcile-fullsuite-compat.yml

permissions:
  contents: write

concurrency:
  group: p1-reconcile-fullsuite-compat
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p1-revalidation-after-p0-20261005
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked backend environment
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Format bounded compatibility changes
        working-directory: Weall-Protocol
        run: |
          FILES=(
            src/weall/crypto/signature_profiles.py
            tests/test_crypto_signature_profiles.py
            tests/bench_a15_f003_registration_attack.py
            tests/test_session_auth_safety.py
            tests/test_session_login_route.py
            tests/test_p0_03_production_composition.py
            scripts/bft_fault_injection_soak.py
            scripts/bft_consensus_resilience_matrix.py
          )
          ruff check --fix "${FILES[@]}"
          ruff format "${FILES[@]}"
          ruff check "${FILES[@]}"
          ruff format --check "${FILES[@]}"

      - name: Prove compatibility fixes before evidence regeneration
        working-directory: Weall-Protocol
        run: |
          pytest -q \
            tests/test_crypto_signature_profiles.py \
            tests/test_session_auth_safety.py::test_seeded_demo_direct_login_stores_hashed_session_key \
            tests/test_session_login_route.py::test_session_login_creates_device_and_session \
            tests/test_fault_injection_soak.py::test_fault_injection_cli_emits_summary_json \
            tests/test_priority1_heavy_soak.py::test_priority1_heavy_soak_cli_reports_all_subsystems_green \
            tests/test_priority1_leader_rotation_pacemaker.py::test_bft_adversarial_matrix_cli_runs_all_scenarios \
            tests/test_priority1_multinode_adversarial.py::test_bft_adversarial_matrix_cli_runs_all_scenarios \
            tests/test_priority2_adversarial_soak.py::test_fault_injection_cli_reports_epoch_bumps_and_stale_qc_rejections \
            tests/test_priority2_adversarial_soak_runner.py::test_priority2_adversarial_soak_cli_reports_all_subsystems_green \
            tests/test_priority2_consensus_resilience_matrix.py::test_consensus_resilience_matrix_cli_reports_all_scenarios_green \
            tests/test_vrf_manifest_fixture_compat.py::test_heavy_soak_cli_sets_nonproduction_vrf_fixture_defaults \
            tests/test_p0_03_production_composition.py::test_four_validator_prod_three_chain_restart_delayed_qc_and_wrong_parent_rejection
          python tests/bench_a15_f003_registration_attack.py --accounts 8 > /tmp/a15-compat.json
          cat /tmp/a15-compat.json

      - name: Remove temporary workflow from candidate tree
        run: |
          rm -f .github/workflows/p1-reconcile-fullsuite-compat.yml

      - name: Regenerate chain identity and crypto posture
        working-directory: Weall-Protocol
        run: |
          PYTHONPATH=src python scripts/gen_crypto_posture_v1_5.py
          python scripts/gen_consensus_bootstrap_thresholds_v1_5.py
          python scripts/gen_controlled_devnet_chain_manifest.py
          python scripts/gen_public_testnet_v1_chain_identity.py

      - name: Regenerate affected live proof bundles
        working-directory: Weall-Protocol
        run: |
          PYTHONPATH=src:scripts python scripts/gen_b539_b543_production_path_proof_v1_5.py
          PYTHONPATH=src:scripts python scripts/gen_b544_b548_live_network_final_proof_v1_5.py
          PYTHONPATH=src:scripts python scripts/gen_b549_b553_controlled_testnet_candidate_proof_v1_5.py
          PYTHONPATH=src:scripts python scripts/gen_b556_b561_final_missing_mechanics_proof_v1_5.py
          PYTHONPATH=src:scripts python scripts/gen_b562_b566_mechanics_hardening_proof_v1_5.py

      - name: Regenerate full-source freshness proofs and release derivatives twice
        working-directory: Weall-Protocol
        run: |
          for round in 1 2; do
            echo "regeneration round $round"
            python scripts/gen_b528_b532_completion_proof_v1_5.py
            python scripts/gen_b534_b538_completion_proof_v1_5.py
            PYTHONPATH=src:scripts python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py
            python scripts/gen_failure_code_registry_v1_5.py
            if [[ -f scripts/gen_api_response_vectors_v1_5.py ]]; then
              python scripts/gen_api_response_vectors_v1_5.py
            fi
            PYTHONPATH=src python scripts/compile_v2_spec.py
            python scripts/gen_public_beta_blocker_report_v1_5.py
            python scripts/gen_release_evidence_manifest_v1_5.py
            python scripts/gen_current_verified_claims.py
          done

      - name: Commit workflow-free reconciled candidate locally
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No reconciliation diff produced'; exit 1; }
          git diff --check --cached
          git commit -m 'audit: reconcile P1 full-suite compatibility evidence'
          echo "candidate_sha=$(git rev-parse HEAD)"
          echo "candidate_tree=$(git rev-parse HEAD^{tree})"
          test -z "$(git status --porcelain)"

      - name: Verify generated truth on committed candidate
        working-directory: Weall-Protocol
        run: |
          python scripts/check_generated.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          python scripts/check_v2_spec_clean_checkout.py
          python scripts/gen_b528_b532_completion_proof_v1_5.py --check
          python scripts/gen_b534_b538_completion_proof_v1_5.py --check
          PYTHONPATH=src:scripts python scripts/gen_b539_b543_production_path_proof_v1_5.py --check
          PYTHONPATH=src:scripts python scripts/gen_b544_b548_live_network_final_proof_v1_5.py --check
          PYTHONPATH=src:scripts python scripts/gen_b549_b553_controlled_testnet_candidate_proof_v1_5.py --check
          PYTHONPATH=src:scripts python scripts/gen_b556_b561_final_missing_mechanics_proof_v1_5.py --check
          PYTHONPATH=src:scripts python scripts/gen_b562_b566_mechanics_hardening_proof_v1_5.py --check
          PYTHONPATH=src:scripts python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py --check
          python scripts/gen_controlled_devnet_chain_manifest.py --check
          python scripts/gen_public_testnet_v1_chain_identity.py --check
          PYTHONDONTWRITEBYTECODE=1 python scripts/check_v15_public_readiness_artifacts.py
          python scripts/check_public_claim_freshness.py
          python scripts/gen_current_verified_claims.py --check
          test -z "$(git status --porcelain)"

      - name: Re-run previously failing full-suite slice
        working-directory: Weall-Protocol
        run: |
          pytest -q \
            tests/prod/test_public_testnet_v1_chain_identity.py::test_public_testnet_v1_chain_identity_generator_is_fresh \
            tests/test_external_observer_controlled_devnet_rehearsal.py::test_controlled_devnet_manifest_exists_for_external_observer_rehearsal \
            tests/test_fault_injection_soak.py::test_fault_injection_cli_emits_summary_json \
            tests/test_m2_chain_manifest_closure_gates.py::test_controlled_devnet_manifest_generator_is_current \
            tests/test_m2_chain_manifest_closure_gates.py::test_fresh_joiner_does_not_treat_provisional_state_as_manifest_genesis \
            tests/test_p0_03_production_composition.py::test_four_validator_prod_three_chain_restart_delayed_qc_and_wrong_parent_rejection \
            tests/test_priority1_heavy_soak.py::test_priority1_heavy_soak_cli_reports_all_subsystems_green \
            tests/test_priority1_leader_rotation_pacemaker.py::test_bft_adversarial_matrix_cli_runs_all_scenarios \
            tests/test_priority1_multinode_adversarial.py::test_bft_adversarial_matrix_cli_runs_all_scenarios \
            tests/test_priority2_adversarial_soak.py::test_fault_injection_cli_reports_epoch_bumps_and_stale_qc_rejections \
            tests/test_priority2_adversarial_soak_runner.py::test_priority2_adversarial_soak_cli_reports_all_subsystems_green \
            tests/test_priority2_consensus_resilience_matrix.py::test_consensus_resilience_matrix_cli_reports_all_scenarios_green \
            tests/test_production_bft_block_replay_api_storage_claim_boundaries.py::test_generated_artifact_is_fresh \
            tests/test_production_block_progression_rehearsal.py::test_controlled_devnet_boot_uses_manifest_clock_and_empty_blocks \
            tests/test_public_validator_state_sync_storage_anti_sybil_economics_boundaries.py::test_claim_boundaries_and_artifact_freshness \
            tests/test_public_write_validator_storage_anti_sybil_testnet_boundaries.py::test_generated_artifact_is_fresh \
            tests/test_session_auth_safety.py::test_seeded_demo_direct_login_stores_hashed_session_key \
            tests/test_session_login_route.py::test_session_login_creates_device_and_session \
            tests/test_validator_follower_catchup_storage_anti_sybil_locked_economics.py::test_claim_boundaries_and_artifact_freshness \
            tests/test_vrf_manifest_fixture_compat.py::test_heavy_soak_cli_sets_nonproduction_vrf_fixture_defaults

      - name: Push verified workflow-free candidate
        run: |
          set -Eeuo pipefail
          test ! -e .github/workflows/p1-reconcile-fullsuite-compat.yml
          test -z "$(git status --porcelain)"
          git push origin HEAD:p1-revalidation-after-p0-20261005
