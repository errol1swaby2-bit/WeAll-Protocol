name: P1 Format A02 Boolean Regression

on:
  push:
    branches:
      - p1-revalidation-after-p0-20261005
    paths:
      - .github/workflows/p1-format-a02.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p1-revalidation-after-p0-20261005
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned dev environment
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Format and verify A02 regression
        working-directory: Weall-Protocol
        run: |
          ruff check --fix tests/test_p1_a02_strict_social_booleans.py
          ruff format tests/test_p1_a02_strict_social_booleans.py
          ruff check tests/test_p1_a02_strict_social_booleans.py
          pytest -q tests/test_p1_a02_strict_social_booleans.py

      - name: Commit formatted test and remove formatter
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/p1-format-a02.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No A02 format diff produced'; exit 1; }
          git diff --check --cached
          git commit -m 'style: format A02 strict boolean regression'
          git push origin HEAD:p1-revalidation-after-p0-20261005
