name: P1 Track A16 Semantic Manifest

on:
  push:
    branches:
      - p1-revalidation-after-p0-20261005
    paths:
      - .github/workflows/p1-track-a16-manifest.yml

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p1-revalidation-after-p0-20261005
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dev environment
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Remove temporary workflow from candidate tree
        run: |
          rm -f .github/workflows/p1-track-a16-manifest.yml

      - name: Generate and prove exact semantic manifest
        working-directory: Weall-Protocol
        run: |
          python scripts/gen_tx_semantic_assurance_v1_5.py
          pytest -q tests/test_a16_f006_all_tx_semantic_assurance.py

      - name: Commit workflow-free manifest candidate locally
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No A16 manifest diff produced'; exit 1; }
          git diff --check --cached
          git commit -m 'audit: track all-236 semantic assurance evidence'
          echo "candidate_sha=$(git rev-parse HEAD)"
          echo "candidate_tree=$(git rev-parse HEAD^{tree})"
          test -z "$(git status --porcelain)"

      - name: Verify manifest from committed candidate
        working-directory: Weall-Protocol
        run: |
          python scripts/gen_tx_semantic_assurance_v1_5.py --check
          pytest -q tests/test_a16_f006_all_tx_semantic_assurance.py
          test -z "$(git status --porcelain)"

      - name: Push verified workflow-free candidate
        run: |
          set -Eeuo pipefail
          test ! -e .github/workflows/p1-track-a16-manifest.yml
          test -z "$(git status --porcelain)"
          git push origin HEAD:p1-revalidation-after-p0-20261005
