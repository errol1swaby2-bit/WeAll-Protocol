name: Trigger V2 derivative refresh

on:
  push:
    branches:
      - production-readiness-audit-20260925
    paths:
      - '.github/workflows/refresh-v2-derivatives-trigger-20260926.yml'

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-readiness-audit-20260925
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Remove temporary remediation workflows from final tree
        run: |
          git rm -f .github/workflows/refresh-v2-derivatives-trigger-20260926.yml
          git rm -f .github/workflows/p1-group-001-ci-closure.yml

      - name: Update remaining legacy fixtures to explicit group scope
        working-directory: Weall-Protocol
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'tests/test_bootstrap_economics_emissary_treasury_safety.py': [
                  ('_env("GROUP_EMISSARY_ELECTION_FINALIZE", "@owner", 2, {"election_id": "ge1"})',
                   '_env("GROUP_EMISSARY_ELECTION_FINALIZE", "@owner", 2, {"group_id": "g1", "election_id": "ge1"})'),
              ],
              'tests/test_group_emissary_election_windows.py': [
                  ('_env("GROUP_EMISSARY_ELECTION_FINALIZE", "@alice", 20, {"election_id": "e-win"})',
                   '_env("GROUP_EMISSARY_ELECTION_FINALIZE", "@alice", 20, {"group_id": "gwin", "election_id": "e-win"})'),
                  ('_env("GROUP_EMISSARY_ELECTION_FINALIZE", "@alice", 40, {"election_id": "e-win"})',
                   '_env("GROUP_EMISSARY_ELECTION_FINALIZE", "@alice", 40, {"group_id": "gwin", "election_id": "e-win"})'),
              ],
              'tests/test_group_policy_transition_safety.py': [
                  ('_env("GROUP_EMISSARY_ELECTION_FINALIZE", "@alice", 10, {"election_id": "e-open"})',
                   '_env("GROUP_EMISSARY_ELECTION_FINALIZE", "@alice", 10, {"group_id": "g-open", "election_id": "e-open"})'),
              ],
              'tests/test_system_queue_lifecycle_integrity.py': [
                  ('payload={"spend_id": "late-spend"},',
                   'payload={"group_id": "g1", "spend_id": "late-spend"},'),
              ],
              'tests/test_tx_schema_treasury_groups.py': [
                  ('("GROUP_TREASURY_SPEND_SIGN", {"spend_id": "gspend-1"}),',
                   '("GROUP_TREASURY_SPEND_SIGN", {"group_id": "group-1", "spend_id": "gspend-1"}),'),
                  ('("GROUP_TREASURY_SPEND_CANCEL", {"spend_id": "gspend-1"}),',
                   '("GROUP_TREASURY_SPEND_CANCEL", {"group_id": "group-1", "spend_id": "gspend-1"}),'),
                  ('("GROUP_EMISSARY_ELECTION_FINALIZE", {"election_id": "e1"}),',
                   '("GROUP_EMISSARY_ELECTION_FINALIZE", {"group_id": "group-1", "election_id": "e1"}),'),
              ],
          }
          for name, pairs in replacements.items():
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{name}: expected exactly one match, got {count}: {old}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Install locked development environment
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Refresh deterministic v1.5 proofs
        working-directory: Weall-Protocol
        run: |
          python scripts/gen_b528_b532_completion_proof_v1_5.py
          python scripts/gen_b534_b538_completion_proof_v1_5.py
          python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py
          python scripts/gen_b528_b532_completion_proof_v1_5.py --check
          python scripts/gen_b534_b538_completion_proof_v1_5.py --check
          python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py --check

      - name: Regenerate V2 derivatives
        working-directory: Weall-Protocol
        run: |
          ruff format tests/test_bootstrap_economics_emissary_treasury_safety.py tests/test_group_emissary_election_windows.py tests/test_group_policy_transition_safety.py tests/test_system_queue_lifecycle_integrity.py tests/test_tx_schema_treasury_groups.py
          ruff check tests/test_bootstrap_economics_emissary_treasury_safety.py tests/test_group_emissary_election_windows.py tests/test_group_policy_transition_safety.py tests/test_system_queue_lifecycle_integrity.py tests/test_tx_schema_treasury_groups.py
          PYTHONPATH=src python scripts/compile_v2_spec.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          python scripts/check_generated.py

      - name: Commit complete deterministic closure locally
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Close P1-GROUP-001 full CI and derivative chain'

      - name: Validate committed clean checkout and complete suite
        working-directory: Weall-Protocol
        run: |
          python scripts/check_v2_spec_clean_checkout.py
          PYTHONDONTWRITEBYTECODE=1 python scripts/check_v15_public_readiness_artifacts.py
          python scripts/check_public_claim_freshness.py
          python scripts/gen_current_verified_claims.py --check
          python -m tooling.canon_lint
          pytest -q

      - name: Ensure validation did not mutate tracked content
        run: |
          git diff --exit-code
          git diff --cached --exit-code

      - name: Push validated closure
        run: git push origin HEAD:production-readiness-audit-20260925
