name: Issue71 V2 canonical self-cleaning derivative finalization (one-time)

on:
  push:
    branches:
      - feat/issue71-notification-attention-ux-20261030
    paths:
      - .github/workflows/issue71-v2-diff-diagnostic-once.yml

permissions:
  contents: write

jobs:
  regenerate-final-tree:
    if: github.repository == 'errol1swaby2-bit/WeAll-Protocol'
    runs-on: ubuntu-24.04
    concurrency:
      group: issue71-v2-derivatives-final-tree
      cancel-in-progress: false
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Fail closed on moved branch or wrong repository
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = "feat/issue71-notification-attention-ux-20261030"
          test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" = "$GITHUB_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen dependencies
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps
      - name: Remove the temporary source BEFORE canonical generation
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm -- .github/workflows/issue71-v2-diff-diagnostic-once.yml
          test ! -e .github/workflows/issue71-v2-diff-diagnostic-once.yml
      - name: Generate and verify derivatives from the final source tree
        working-directory: Weall-Protocol
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONPATH=src python scripts/compile_v2_spec.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
      - name: Stage, check allowed paths, and commit to SAME draft head
        shell: bash
        run: |
          set -Eeuo pipefail
          git add -A -- Weall-Protocol/generated/v2/ web/src/generated/protocolStatus.ts
          python - <<'PY'
          import subprocess
          changed = subprocess.check_output(
              ["git", "diff", "--cached", "--name-only"], text=True
          ).splitlines()
          allowed_workflow = ".github/workflows/issue71-v2-diff-diagnostic-once.yml"
          assert allowed_workflow in changed, "one-shot workflow deletion missing"
          assert len(changed) >= 2, "no generated updates staged"
          for p in changed:
              assert p == allowed_workflow or p.startswith("Weall-Protocol/generated/v2/") or p == "web/src/generated/protocolStatus.ts", f"unexpected path: {p}"
          print("FINAL_TREE_OUTPUT_COUNT", len(changed) - 1)
          print("ONE_TIME_WORKFLOW_REMOVED_FROM_FINAL_TREE", allowed_workflow)
          PY
          test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(v2): finalize Issue71 derivatives from workflow-free canonical source"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
