name: Issue71 V2 failure-index reproducibility diagnostic (one-time)

on:
  push:
    branches:
      - feat/issue71-notification-attention-ux-20261030
    paths:
      - .github/workflows/issue71-v2-diff-diagnostic-once.yml

permissions:
  contents: read

jobs:
  inspect-v2-differences:
    if: github.repository == 'errol1swaby2-bit/WeAll-Protocol'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen compiler dependencies
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps
      - name: Report precise generated delta, without changing branch
        working-directory: Weall-Protocol
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          PYTHONPATH=src python scripts/compile_v2_spec.py
          git diff --stat -- generated/v2/failure_contract_index.json generated/v2/target_failure_contract_index.json
          git diff --no-ext-diff --unified=3 -- generated/v2/failure_contract_index.json generated/v2/target_failure_contract_index.json | head -n 180 || true
          git status --short
