name: P0-03 Exact-Head Diagnostic

on:
  push:
    branches:
      - p0-03-production-closure-staging-20261001
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-03-exact-head-diagnostic
  cancel-in-progress: false

jobs:
  diagnose-follower-continuity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout canonical P0 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: p0-03-production-closure-staging-20261001

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked backend dependencies
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Apply currently rehearsed P0-03 repairs
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, label: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_exact(
              "Weall-Protocol/src/weall/runtime/bft_runtime_adapter.py",
              '''    elif _mode() == "prod":
                  state = getattr(self, "state", None)
                  phase_reader = getattr(self, "_current_consensus_phase", None)
                  current_phase = phase_reader() if callable(phase_reader) else ""
                  if isinstance(state, dict) and current_phase == CONSENSUS_PHASE_BFT_ACTIVE:
                      height = _safe_int(state.get("height"), 0)
                      tip = str(state.get("tip") or "").strip()
                      if height > 0 or tip:
                          return None
          ''',
              '''    elif _mode() == "prod":
                  phase_reader = getattr(self, "_current_consensus_phase", None)
                  current_phase = phase_reader() if callable(phase_reader) else ""
                  if current_phase == CONSENSUS_PHASE_BFT_ACTIVE:
                      return None
          ''',
              "production BFT-active QC-less proposal fence",
          )

          replace_exact(
              "Weall-Protocol/src/weall/runtime/block_replay.py",
              '''            ok_bft, rej_bft = _call_admit_bft_commit_block(
                          block=block2,
                          state=self.state,
                          blocks_map=self._bft_speculative_blocks_map(),
                          bft_enabled=effective_bft_enabled(executor=self, default=False),
                      )
          ''',
              '''            admission_blocks_map = self._bft_speculative_blocks_map()
                      current_bid = str(block2.get("block_id") or "").strip()
                      if current_bid:
                          admission_blocks_map = dict(admission_blocks_map)
                          admission_blocks_map[current_bid] = {
                              "height": int(height),
                              "prev_block_id": advertised_prev_block_id,
                              "block_ts_ms": int(ts_ms),
                              "block_hash": str(block2.get("block_hash") or "").strip(),
                          }
                      ok_bft, rej_bft = _call_admit_bft_commit_block(
                          block=block2,
                          state=self.state,
                          blocks_map=admission_blocks_map,
                          bft_enabled=effective_bft_enabled(executor=self, default=False),
                      )
          ''',
              "BFT replay admission current-block ancestry map",
          )

          replace_exact(
              "Weall-Protocol/src/weall/runtime/bft_runtime_adapter.py",
              '''    blocks_map = self.state.get("blocks")
              if not isinstance(blocks_map, dict):
                  blocks_map = {}
              else:
                  blocks_map = dict(blocks_map)
              blocks_map[bid] = {
          ''',
              '''    blocks_map = dict(self._bft_speculative_blocks_map())
              blocks_map[bid] = {
          ''',
              "BFT follower vote safety speculative ancestry map",
          )
          PY

      - name: Run exact failing regression and capture trace
        id: regression
        working-directory: Weall-Protocol
        env:
          WEALL_MODE: prod
        run: |
          set +e
          pytest -vv -s --tb=long \
            tests/test_p0_03_production_composition.py::test_restart_preserves_certified_pending_frontier_for_bft_continuity \
            > ../p0-03-regression-trace.txt 2>&1
          rc=$?
          cat ../p0-03-regression-trace.txt
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload exact regression trace
        uses: actions/upload-artifact@v4
        with:
          name: p0-03-regression-trace
          path: p0-03-regression-trace.txt
          if-no-files-found: error

      - name: Fail after preserving trace
        run: |
          test "${{ steps.regression.outputs.exit_code }}" = "0"
