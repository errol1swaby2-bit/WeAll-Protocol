name: P0-06 Production Scope Closure

on:
  push:
    branches: ["p0-03-production-closure-staging-20261001"]

permissions:
  contents: write

jobs:
  closure:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: p0-03-production-closure-staging-20261001

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked backend
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Apply scope closure to workflow-free tree
        run: |
          set -Eeuo pipefail
          ROOT="$GITHUB_WORKSPACE"
          PROTO="$ROOT/Weall-Protocol"
          cp "$PROTO/scripts/p0_06_scope_closure.py" /tmp/p0_06_scope_closure.py
          rm -f "$PROTO/scripts/p0_06_scope_closure.py"
          rm -f "$ROOT/.github/workflows/p0-06-scope-closure.yml"
          WEALL_REPO_ROOT="$ROOT" python /tmp/p0_06_scope_closure.py

      - name: Ruff bounded source surface
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          PY_FILES=(
            src/weall/runtime/poh/state.py
            src/weall/runtime/apply/poh.py
            src/weall/runtime/poh/async_scheduler.py
            src/weall/runtime/poh/tier2_scheduler.py
            src/weall/runtime/poh/live_scheduler.py
            scripts/build_production_genesis_manifest.py
            tests/test_p0_06_production_scope_closure.py
            tests/p0_assurance.py
          )
          ruff check --fix "${PY_FILES[@]}"
          ruff format "${PY_FILES[@]}"
          ruff check "${PY_FILES[@]}"
          ruff format --check "${PY_FILES[@]}"

      - name: Rebuild production genesis from patched builder
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python scripts/build_production_genesis_manifest.py \
            --chain-id weall-prod \
            --founding-account '@errol-genesis' \
            --founding-pubkey c195d59d38ecf84b9baa227aff88960759afb72d2150f6e27a3187d0a3ae08be \
            --authority-pubkey c195d59d38ecf84b9baa227aff88960759afb72d2150f6e27a3187d0a3ae08be \
            --genesis-time 1778368894 \
            --econ-unlock-days 90 \
            --bootstrap-expires-height 1008

      - name: Test production scope closure
        working-directory: Weall-Protocol
        run: pytest -q tests/test_p0_06_production_scope_closure.py

      - name: Test duplicate-account adjudication
        working-directory: Weall-Protocol
        run: pytest -q tests/test_p0_06a_duplicate_account_adjudication.py

      - name: Test async panel grinding regression
        working-directory: Weall-Protocol
        run: pytest -q tests/test_poh_async_panel_grinding_regression.py

      - name: Test production genesis builder
        working-directory: Weall-Protocol
        run: pytest -q tests/test_production_genesis_manifest_builder.py

      - name: Final source guard
        run: |
          set -Eeuo pipefail
          git diff --check
          test ! -e Weall-Protocol/scripts/p0_06_scope_closure.py
          test ! -e .github/workflows/p0-06-scope-closure.yml
          git diff --name-only

      - name: Commit bounded source closure
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: scope-close production PoH authority pending uniqueness entropy"
          git push origin "HEAD:p0-03-production-closure-staging-20261001"
