name: Temporary Vite dependency lock repair (PR 78)
on:
  push:
    branches:
      - feat/cloudflare-static-testnet-access-20261103

permissions:
  contents: write

jobs:
  refresh-vite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh pinned Vite and lockfile
        working-directory: web
        run: |
          npm install --save-dev --save-exact vite@8.3.5
          npm audit --audit-level=moderate
          npm ci
          npm run typecheck
      - name: Commit lockfile changes to PR branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package.json web/package-lock.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No dependency changes needed"
            exit 0
          fi
          git commit -m "fix(web): pin security-patched Vite and regenerate npm lockfile"
          git push origin HEAD:feat/cloudflare-static-testnet-access-20261103
