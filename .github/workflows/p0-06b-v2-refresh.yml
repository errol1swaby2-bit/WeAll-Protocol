name: P0-06B V2 derivative refresh

on:
  push:
    branches:
      - p0-03-production-closure-staging-20261001
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-v2:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: p0-03-production-closure-staging-20261001
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked backend dependencies
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Stage temporary workflow removal before regeneration
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/p0-06b-v2-refresh.yml

      - name: Regenerate V2 derivatives from final source tree
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python scripts/compile_v2_spec.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          python scripts/check_generated.py

      - name: Guard changed paths
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from __future__ import annotations

          import subprocess
          import sys

          allowed_exact = {
              ".github/workflows/p0-06b-v2-refresh.yml",
              "web/src/generated/protocolStatus.ts",
          }
          allowed_prefixes = ("Weall-Protocol/generated/v2/",)

          changed = [
              line.strip()
              for line in subprocess.check_output(
                  ["git", "diff", "--name-only", "HEAD"], text=True
              ).splitlines()
              if line.strip()
          ]
          unexpected = [
              path
              for path in changed
              if path not in allowed_exact
              and not any(path.startswith(prefix) for prefix in allowed_prefixes)
          ]
          derivative_changes = [
              path
              for path in changed
              if path == "web/src/generated/protocolStatus.ts"
              or path.startswith("Weall-Protocol/generated/v2/")
          ]
          print("Changed paths:")
          for path in changed:
              print(f"- {path}")
          if unexpected:
              print("Unexpected changed paths:", file=sys.stderr)
              for path in unexpected:
                  print(f"- {path}", file=sys.stderr)
              raise SystemExit(1)
          if not derivative_changes:
              raise SystemExit("expected at least one V2 derivative change")
          PY

      - name: Commit exact generated repair
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Weall-Protocol/generated/v2 web/src/generated/protocolStatus.ts
          git status --short
          git commit -m "Refresh V2 derivatives for P0-06B phase 1"

      - name: Validate committed clean tree
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          test -z "$(git status --porcelain)"
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          python scripts/check_generated.py
          python scripts/check_v2_spec_clean_checkout.py

      - name: Push exact repair head
        run: |
          set -Eeuo pipefail
          git push origin HEAD:p0-03-production-closure-staging-20261001
