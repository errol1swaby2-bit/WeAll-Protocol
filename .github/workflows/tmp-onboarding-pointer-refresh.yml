name: Temporary Onboarding Pointer Refresh

on:
  push:
    branches:
      - top-level-doc-truth-boundary-closure-20260921

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: top-level-doc-truth-boundary-closure-20260921
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked development environment
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Validate source and legacy redirect contract before regeneration
        run: |
          rm .github/workflows/tmp-onboarding-pointer-refresh.yml
          cd Weall-Protocol
          python scripts/check_public_claim_freshness.py
          sh scripts/operator_onboarding_smoke.sh
          pytest -q \
            tests/test_top_level_document_truth_classification.py \
            tests/test_release_docs_truth_sync.py \
            tests/test_new_node_operator_quickstart.py \
            tests/test_no_stale_operator_lifecycle_artifacts.py

      - name: Regenerate v2 derivatives last
        working-directory: Weall-Protocol
        run: |
          PYTHONPATH=src python scripts/compile_v2_spec.py

      - name: Commit regenerated exact-tree outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Refresh v2 derivatives after onboarding pointer repair'

      - name: Verify committed exact tree
        working-directory: Weall-Protocol
        run: |
          python scripts/check_generated.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          python scripts/check_v2_spec_clean_checkout.py
          PYTHONDONTWRITEBYTECODE=1 python scripts/check_v15_public_readiness_artifacts.py
          python scripts/check_public_claim_freshness.py
          python scripts/gen_current_verified_claims.py --check
          sh scripts/operator_onboarding_smoke.sh
          pytest -q \
            tests/test_top_level_document_truth_classification.py \
            tests/test_release_docs_truth_sync.py \
            tests/test_new_node_operator_quickstart.py \
            tests/test_no_stale_operator_lifecycle_artifacts.py

      - name: Push validated refresh
        run: |
          git push origin HEAD:top-level-doc-truth-boundary-closure-20260921
