name: Source Truth Final V2 Refresh Temporary

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.ref == 'active-source-truth-hardening-20260921'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked development dependencies
        working-directory: Weall-Protocol
        run: python -m pip install -r requirements-dev.lock

      - name: Remove temporary workflow before source-tree compilation
        run: rm .github/workflows/source-truth-v2-refresh-temp.yml

      - name: Revalidate source truth and compile v2 last
        working-directory: Weall-Protocol
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m ruff check \
            src/weall/runtime/apply/notifications.py \
            src/weall/runtime/apply/indexing.py \
            src/weall/tx/canon.py \
            scripts/check_public_claim_freshness.py \
            tests/test_current_document_registry.py
          PYTHONPATH=src pytest -q tests/test_current_document_registry.py
          PYTHONPATH=src python scripts/check_public_claim_freshness.py
          PYTHONPATH=src python scripts/compile_v2_spec.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check

      - name: Commit final source-tree-bound derivatives
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "weall-source-truth-closure"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git status --short
          git diff --cached --check
          git commit -m "Refresh v2 after temporary workflow removal"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
