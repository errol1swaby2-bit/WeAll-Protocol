name: P2B Final Local Plan Binding Closure

on:
  push:
    branches: ["p2-complete-remediation-20260927"]
    paths:
      - ".github/workflows/p2b-final-local-plan-binding-closure.yml"

permissions:
  contents: write

concurrency:
  group: p2b-final-local-plan-binding-closure
  cancel-in-progress: false

jobs:
  close-p2b:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact trigger branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: p2-complete-remediation-20260927

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify audited source preimages
        shell: bash
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor 484e1b481d7a5a588fa3f39fb20c0480c3f258c4 HEAD
          test "$(git hash-object Weall-Protocol/src/weall/runtime/helper_merge.py)" = "067a6e6feedebc237131e995310ef45aac6e824e"
          test "$(git hash-object Weall-Protocol/src/weall/runtime/helper_apply.py)" = "9f70851f1c460772f6f75e88997b589a85b3ad5a"
          test "$(git hash-object Weall-Protocol/tests/test_helper_merge.py)" = "f43f04e2a4ecb89ce4060a6f5242e0d0ecd802dc"
          test "$(git hash-object Weall-Protocol/tests/test_helper_materialized_merge_restart.py)" = "89ca2ca7fdb81f4e4b3e2a22a1d08eec8d0e8237"
          test "$(git hash-object Weall-Protocol/scripts/rehearse_helper_block_path_adversarial_b593_v1_5.py)" = "9c862768e4b316e5c0c08244420ffca3c6176d1b"
          python .github/p2b_extract_patcher.py
          python -m py_compile /tmp/p2b_patch.py

      - name: Install locked backend tooling
        working-directory: Weall-Protocol
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Remove all temporary P2B tooling from final tree
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/p2b-materialized-helper-local-plan-binding-closure.yml
          rm -f .github/workflows/p2b-materialized-helper-diagnostic.yml
          rm -f .github/workflows/p2b-final-local-plan-binding-closure.yml
          rm -f .github/p2b_extract_patcher.py
          git add -u .github/workflows .github/p2b_extract_patcher.py

      - name: Apply P2B coordinator-local binding patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python /tmp/p2b_patch.py
          cd Weall-Protocol
          python -m py_compile src/weall/runtime/helper_merge.py
          python -m py_compile src/weall/runtime/helper_apply.py
          python -m py_compile tests/test_helper_merge.py
          python -m py_compile tests/test_helper_materialized_merge_restart.py
          python -m py_compile scripts/rehearse_helper_block_path_adversarial_b593_v1_5.py

      - name: Format and lint P2B changes
        working-directory: Weall-Protocol
        shell: bash
        run: |
          set -Eeuo pipefail
          FILES="src/weall/runtime/helper_merge.py src/weall/runtime/helper_apply.py tests/test_helper_merge.py tests/test_helper_materialized_merge_restart.py scripts/rehearse_helper_block_path_adversarial_b593_v1_5.py"
          ruff format $FILES
          ruff check --fix $FILES
          ruff format $FILES
          ruff check $FILES

      - name: Run focused P2B adversarial proof
        working-directory: Weall-Protocol
        shell: bash
        run: |
          set -Eeuo pipefail
          pytest -q tests/test_helper_merge.py tests/test_helper_materialized_merge_restart.py
          PYTHONPATH=src:scripts python scripts/rehearse_helper_block_path_adversarial_b593_v1_5.py

      - name: Refresh deterministic helper and release evidence
        working-directory: Weall-Protocol
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONPATH=src:scripts python scripts/gen_b587_b594_testnet_mechanism_completion_v1_5.py || true
          PYTHONPATH=src:scripts python scripts/gen_b587_b594_testnet_mechanism_completion_v1_5.py --check
          PYTHONPATH=src:scripts python scripts/gen_release_evidence_manifest_v1_5.py || true
          PYTHONPATH=src:scripts python scripts/gen_release_evidence_manifest_v1_5.py --check
          PYTHONPATH=src:scripts python scripts/gen_public_beta_blocker_report_v1_5.py || true
          PYTHONPATH=src:scripts python scripts/gen_public_beta_blocker_report_v1_5.py --check
          PYTHONPATH=src python scripts/gen_current_verified_claims.py
          PYTHONPATH=src python scripts/gen_current_verified_claims.py --check
          PYTHONPATH=src python scripts/compile_v2_spec.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check

      - name: Verify working-tree freshness and hygiene
        working-directory: Weall-Protocol
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/check_generated.py
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python scripts/check_v15_public_readiness_artifacts.py
          python scripts/check_public_claim_freshness.py
          git diff --check

      - name: Run full locked backend suite
        working-directory: Weall-Protocol
        shell: bash
        run: |
          set -Eeuo pipefail
          pytest -q

      - name: Create local P2B closure commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Close P2B materialized helper local-plan binding"
          test -z "$(git status --porcelain)"

      - name: Verify clean checkout of exact closure commit
        shell: bash
        run: |
          set -Eeuo pipefail
          CLOSURE_SHA="$(git rev-parse HEAD)"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          git clone --no-local "${GITHUB_WORKSPACE}" "$TMP/repo"
          cd "$TMP/repo"
          git checkout --detach "$CLOSURE_SHA"
          test ! -e .github/workflows/p2b-materialized-helper-local-plan-binding-closure.yml
          test ! -e .github/workflows/p2b-materialized-helper-diagnostic.yml
          test ! -e .github/workflows/p2b-final-local-plan-binding-closure.yml
          test ! -e .github/p2b_extract_patcher.py
          cd Weall-Protocol
          python -m pip install -e . --no-deps >/dev/null
          pytest -q tests/test_helper_merge.py tests/test_helper_materialized_merge_restart.py
          python scripts/check_generated.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          python scripts/check_v2_spec_clean_checkout.py
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python scripts/check_v15_public_readiness_artifacts.py
          python scripts/check_public_claim_freshness.py
          python scripts/gen_current_verified_claims.py --check

      - name: Push only the verified P2B closure commit
        shell: bash
        run: |
          set -Eeuo pipefail
          REMOTE_SHA="$(git ls-remote origin refs/heads/p2-complete-remediation-20260927 | awk '{print $1}')"
          test "$REMOTE_SHA" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/p2-complete-remediation-20260927
