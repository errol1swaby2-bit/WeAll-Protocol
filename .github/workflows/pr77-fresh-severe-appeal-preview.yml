name: PR77 fresh severe appeal preview - no authorization

on:
  pull_request:
    paths:
      - 'Weall-Protocol/src/weall/runtime/apply/dispute.py'
      - 'Weall-Protocol/src/weall/runtime/severe_appeal_candidate.py'
      - 'Weall-Protocol/tests/test_pr77_fresh_severe_appeal_preview.py'
      - '.github/workflows/pr77-fresh-severe-appeal-preview.yml'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        working-directory: Weall-Protocol
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install -e . --no-deps
      - name: Verify fresh-panel candidate selection without authority
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          ruff check src/weall/runtime/apply/dispute.py src/weall/runtime/severe_appeal_candidate.py tests/test_pr77_fresh_severe_appeal_preview.py
          ruff format --check src/weall/runtime/apply/dispute.py src/weall/runtime/severe_appeal_candidate.py tests/test_pr77_fresh_severe_appeal_preview.py
          pytest -q tests/test_pr77_fresh_severe_appeal_preview.py tests/test_pr77_severe_account_finality_no_go.py tests/test_stage23_account_ban_severe_sanction_no_go.py
