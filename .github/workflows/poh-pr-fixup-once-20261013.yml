name: PoH PR one-time formatter and v2 derivative synchronization

on:
  push:
    branches:
      - fix/poh-two-node-reviewer-readiness-20261013

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the exact formatter and v2 compiler prerequisites
        run: python -m pip install 'ruff==0.15.22' 'pyyaml==6.0.3' 'cryptography==50.0.0'
      - name: Remove this temporary workflow before fingerprint compilation
        run: git rm -- .github/workflows/poh-pr-fixup-once-20261013.yml
      - name: Format regression test and regenerate source-bound derivatives
        run: |
          cd Weall-Protocol
          ruff format tests/test_local_two_node_review_rehearsal_regression.py
          python scripts/compile_v2_spec.py
          ruff format --check tests/test_local_two_node_review_rehearsal_regression.py
          python scripts/compile_v2_spec.py --check
      - name: Commit synchronized results to PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- Weall-Protocol/tests/test_local_two_node_review_rehearsal_regression.py Weall-Protocol/generated/v2 web/src/generated/protocolStatus.ts .github/workflows/poh-pr-fixup-once-20261013.yml
          git diff --cached --check
          git commit -m 'chore(poh): format regression and synchronize v2 source-bound derivatives'
          git push origin HEAD:fix/poh-two-node-reviewer-readiness-20261013
      - name: Verify clean archive reproduces derivatives
        run: |
          cd Weall-Protocol
          python scripts/check_v2_spec_clean_checkout.py
