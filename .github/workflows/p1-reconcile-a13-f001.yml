name: P1 Reconcile A13 Canonical Key Identity

on:
  push:
    branches:
      - p1-revalidation-after-p0-20261005
    paths:
      - .github/workflows/p1-reconcile-a13-f001.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p1-revalidation-after-p0-20261005
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked backend environment
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Prove A13-F001 before regeneration
        working-directory: Weall-Protocol
        run: |
          FILES=(
            src/weall/crypto/pq_mldsa.py
            src/weall/crypto/account_keys.py
            src/weall/runtime/apply/identity.py
            src/weall/runtime/sigverify.py
            src/weall/runtime/genesis_bootstrap.py
            tests/test_p1_a13_key_identity_canonicalization.py
          )
          ruff check "${FILES[@]}"
          ruff format --check "${FILES[@]}"
          pytest -q \
            tests/test_p1_a13_key_identity_canonicalization.py \
            tests/test_account_pq_key_schema.py \
            tests/test_priority0_account_key_normalization.py \
            tests/test_m2_account_recovery_and_tier2_lifecycle.py \
            tests/test_m2_complete_security_and_lifecycle.py

      - name: Remove temporary workflow from candidate tree
        run: |
          rm -f .github/workflows/p1-reconcile-a13-f001.yml

      - name: Regenerate crypto posture
        working-directory: Weall-Protocol
        run: |
          PYTHONPATH=src python scripts/gen_crypto_posture_v1_5.py

      - name: Refresh Identity semantic bindings
        working-directory: Weall-Protocol
        run: |
          python scripts/refresh_v2_semantic_reviews.py \
            --tx-type ACCOUNT_REGISTER \
            --tx-type ACCOUNT_KEY_ADD \
            --tx-type ACCOUNT_KEY_REVOKE \
            --tx-type ACCOUNT_DEVICE_REGISTER \
            --tx-type ACCOUNT_DEVICE_REVOKE \
            --tx-type ACCOUNT_SESSION_KEY_ISSUE \
            --tx-type ACCOUNT_SESSION_KEY_REVOKE \
            --tx-type ACCOUNT_SECURITY_POLICY_SET \
            --tx-type ACCOUNT_LOCK \
            --tx-type ACCOUNT_UNLOCK \
            --tx-type ACCOUNT_RECOVERY_CONFIG_SET \
            --tx-type ACCOUNT_GUARDIAN_ADD \
            --tx-type ACCOUNT_GUARDIAN_REMOVE \
            --tx-type ACCOUNT_RECOVERY_REQUEST \
            --tx-type ACCOUNT_RECOVERY_APPROVE \
            --tx-type ACCOUNT_RECOVERY_CANCEL \
            --tx-type ACCOUNT_RECOVERY_FINALIZE \
            --tx-type ACCOUNT_RECOVERY_RECEIPT \
            --reviewer "Errol Jacob Jones Swaby (maintainer-assisted P1 audit)"

      - name: Regenerate dependent evidence twice
        working-directory: Weall-Protocol
        run: |
          for round in 1 2; do
            echo "regeneration round $round"
            python scripts/gen_failure_code_registry_v1_5.py
            if [[ -f scripts/gen_api_response_vectors_v1_5.py ]]; then
              python scripts/gen_api_response_vectors_v1_5.py
            fi
            PYTHONPATH=src python scripts/compile_v2_spec.py
            python scripts/gen_b528_b532_completion_proof_v1_5.py
            python scripts/gen_b534_b538_completion_proof_v1_5.py
            python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py
            python scripts/gen_public_beta_blocker_report_v1_5.py
            python scripts/gen_release_evidence_manifest_v1_5.py
            python scripts/gen_current_verified_claims.py
          done

      - name: Commit workflow-free A13 candidate locally
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No A13 reconciliation diff produced'; exit 1; }
          git diff --check --cached
          git commit -m 'audit: reconcile canonical ML-DSA authority evidence'
          echo "candidate_sha=$(git rev-parse HEAD)"
          echo "candidate_tree=$(git rev-parse HEAD^{tree})"
          test -z "$(git status --porcelain)"

      - name: Verify committed A13 candidate
        working-directory: Weall-Protocol
        run: |
          python scripts/check_generated.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          python scripts/check_v2_spec_clean_checkout.py
          python scripts/gen_b528_b532_completion_proof_v1_5.py --check
          python scripts/gen_b534_b538_completion_proof_v1_5.py --check
          python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py --check
          PYTHONDONTWRITEBYTECODE=1 python scripts/check_v15_public_readiness_artifacts.py
          python scripts/check_public_claim_freshness.py
          python scripts/gen_current_verified_claims.py --check
          PYTHONPATH=src python scripts/gen_crypto_posture_v1_5.py
          git diff --exit-code -- \
            generated/crypto_inventory_v1_5.json \
            generated/signature_profile_registry_v1_5.json \
            generated/quantum_resistance_readiness_v1_5.json
          pytest -q \
            tests/test_p1_a13_key_identity_canonicalization.py \
            tests/test_account_pq_key_schema.py \
            tests/test_priority0_account_key_normalization.py \
            tests/test_m2_account_recovery_and_tier2_lifecycle.py \
            tests/test_m2_complete_security_and_lifecycle.py
          test -z "$(git status --porcelain)"

      - name: Push verified workflow-free A13 candidate
        run: |
          set -Eeuo pipefail
          test ! -e .github/workflows/p1-reconcile-a13-f001.yml
          test -z "$(git status --porcelain)"
          git push origin HEAD:p1-revalidation-after-p0-20261005
