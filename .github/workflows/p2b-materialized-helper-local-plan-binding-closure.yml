name: P2B Materialized Helper Local Plan Binding Closure

on:
  push:
    branches: ["p2-complete-remediation-20260927"]
    paths:
      - ".github/workflows/p2b-materialized-helper-local-plan-binding-closure.yml"

permissions:
  contents: write

concurrency:
  group: p2b-materialized-helper-local-plan-binding-closure
  cancel-in-progress: false

jobs:
  close-p2b:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: p2-complete-remediation-20260927

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify audited preimage
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD~2)" = "484e1b481d7a5a588fa3f39fb20c0480c3f258c4"
          test "$(git hash-object Weall-Protocol/src/weall/runtime/helper_merge.py)" = "067a6e6feedebc237131e995310ef45aac6e824e"
          test "$(git hash-object Weall-Protocol/src/weall/runtime/helper_apply.py)" = "9f70851f1c460772f6f75e88997b589a85b3ad5a"
          test "$(git hash-object Weall-Protocol/tests/test_helper_merge.py)" = "f43f04e2a4ecb89ce4060a6f5242e0d0ecd802dc"
          test "$(git hash-object Weall-Protocol/tests/test_helper_materialized_merge_restart.py)" = "89ca2ca7fdb81f4e4b3e2a22a1d08eec8d0e8237"
          test "$(git hash-object Weall-Protocol/scripts/rehearse_helper_block_path_adversarial_b593_v1_5.py)" = "9c862768e4b316e5c0c08244420ffca3c6176d1b"

      - name: Recover patcher from failed wrapper parent
        shell: bash
        run: |
          set -Eeuo pipefail
          git show HEAD^:.github/workflows/p2b-materialized-helper-local-plan-binding-closure.yml > /tmp/p2b-old-wrapper.yml
          python - <<'PY'
          from pathlib import Path

          text = Path("/tmp/p2b-old-wrapper.yml").read_text(encoding="utf-8")
          marker = "          python - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("\n          PY\n", start)
          block = text[start:end]
          lines = []
          for line in block.splitlines():
              if line.startswith("          "):
                  line = line[10:]
              lines.append(line)
          Path("/tmp/p2b_patch.py").write_text("\n".join(lines) + "\n", encoding="utf-8")
          compile(Path("/tmp/p2b_patch.py").read_text(encoding="utf-8"), "/tmp/p2b_patch.py", "exec")
          PY

      - name: Install locked backend tooling
        working-directory: Weall-Protocol
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Remove one-shot workflow before source and evidence changes
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/p2b-materialized-helper-local-plan-binding-closure.yml
          git add -u .github/workflows/p2b-materialized-helper-local-plan-binding-closure.yml

      - name: Apply P2B local-plan binding hardening
        shell: bash
        run: |
          set -Eeuo pipefail
          python /tmp/p2b_patch.py

      - name: Format and lint P2B Python changes
        working-directory: Weall-Protocol
        shell: bash
        run: |
          set -Eeuo pipefail
          ruff format \
            src/weall/runtime/helper_merge.py \
            src/weall/runtime/helper_apply.py \
            tests/test_helper_merge.py \
            tests/test_helper_materialized_merge_restart.py \
            scripts/rehearse_helper_block_path_adversarial_b593_v1_5.py
          ruff check \
            src/weall/runtime/helper_merge.py \
            src/weall/runtime/helper_apply.py \
            tests/test_helper_merge.py \
            tests/test_helper_materialized_merge_restart.py \
            scripts/rehearse_helper_block_path_adversarial_b593_v1_5.py

      - name: Run focused P2B adversarial tests
        working-directory: Weall-Protocol
        shell: bash
        run: |
          set -Eeuo pipefail
          pytest -q tests/test_helper_merge.py tests/test_helper_materialized_merge_restart.py
          PYTHONPATH=src:scripts python scripts/rehearse_helper_block_path_adversarial_b593_v1_5.py

      - name: Refresh P2B-dependent deterministic evidence
        working-directory: Weall-Protocol
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONPATH=src:scripts python scripts/gen_b587_b594_testnet_mechanism_completion_v1_5.py || true
          PYTHONPATH=src:scripts python scripts/gen_b587_b594_testnet_mechanism_completion_v1_5.py --check
          PYTHONPATH=src:scripts python scripts/gen_release_evidence_manifest_v1_5.py || true
          PYTHONPATH=src:scripts python scripts/gen_release_evidence_manifest_v1_5.py --check
          PYTHONPATH=src:scripts python scripts/gen_public_beta_blocker_report_v1_5.py || true
          PYTHONPATH=src:scripts python scripts/gen_public_beta_blocker_report_v1_5.py --check
          PYTHONPATH=src python scripts/gen_current_verified_claims.py
          PYTHONPATH=src python scripts/gen_current_verified_claims.py --check
          PYTHONPATH=src python scripts/compile_v2_spec.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check

      - name: Verify working-tree freshness and hygiene
        working-directory: Weall-Protocol
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/check_generated.py
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python scripts/check_v15_public_readiness_artifacts.py
          python scripts/check_public_claim_freshness.py
          git diff --check

      - name: Run full locked backend suite before push
        working-directory: Weall-Protocol
        shell: bash
        run: |
          set -Eeuo pipefail
          pytest -q

      - name: Create local P2B closure commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Close P2B materialized helper local-plan binding"
          git status --short

      - name: Verify clean checkout from exact P2B closure commit
        shell: bash
        run: |
          set -Eeuo pipefail
          CLOSURE_SHA="$(git rev-parse HEAD)"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          git clone --no-local "${GITHUB_WORKSPACE}" "$TMP/repo"
          cd "$TMP/repo"
          git checkout --detach "$CLOSURE_SHA"
          cd Weall-Protocol
          python -m pip install -e . --no-deps >/dev/null
          pytest -q tests/test_helper_merge.py tests/test_helper_materialized_merge_restart.py
          python scripts/check_generated.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          python scripts/check_v2_spec_clean_checkout.py
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python scripts/check_v15_public_readiness_artifacts.py
          python scripts/check_public_claim_freshness.py
          python scripts/gen_current_verified_claims.py --check

      - name: Push verified P2B closure commit
        shell: bash
        run: |
          set -Eeuo pipefail
          REMOTE_SHA="$(git ls-remote origin refs/heads/p2-complete-remediation-20260927 | awk '{print $1}')"
          test "$REMOTE_SHA" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/p2-complete-remediation-20260927
