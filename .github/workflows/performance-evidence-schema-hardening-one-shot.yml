name: Performance evidence schema hardening one-shot

on:
  push:
    branches:
      - performance-evidence-schema-hardening

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: performance-evidence-schema-hardening
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Weall-Protocol/requirements-dev.lock

      - name: Apply bounded hardening
        run: python .github/performance-evidence-schema-hardening.py

      - name: Remove temporary helpers before source-sensitive generation
        run: |
          rm .github/performance-evidence-schema-hardening.py
          rm .github/workflows/performance-evidence-schema-hardening-one-shot.yml

      - name: Regenerate and validate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd Weall-Protocol
          python -m ruff check --fix scripts/gen_current_verified_claims.py tests/test_current_verified_claims_fail_closed.py
          python -m ruff format scripts/gen_current_verified_claims.py tests/test_current_verified_claims_fail_closed.py
          python -m ruff check scripts/gen_current_verified_claims.py tests/test_current_verified_claims_fail_closed.py
          PYTHONPATH=src python scripts/gen_current_verified_claims.py
          PYTHONPATH=src:scripts python scripts/compile_v2_spec.py
          PYTHONPATH=src python -m pytest -q tests/test_current_verified_claims_fail_closed.py tests/prod/test_public_beta_evidence_gates.py tests/test_public_readiness_artifacts_v15.py
          PYTHONPATH=src python scripts/gen_current_verified_claims.py --check
          PYTHONPATH=src python scripts/check_public_claim_freshness.py
          PYTHONPATH=src:scripts python scripts/compile_v2_spec.py --check
          cd ..
          git diff --check

      - name: Commit validated final tree
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Tighten performance evidence qualification schema'
          git push origin HEAD:performance-evidence-schema-hardening
