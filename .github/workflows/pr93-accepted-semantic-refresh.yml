name: PR93 maintainer-approved semantic acceptance and regeneration

on:
  push:
    branches:
      - integration/unified-baseline-all-open-prs-20261114
    paths:
      - docs/integration/PR93_DEVELOPMENT_SEMANTIC_ACCEPTANCE_DECISION.json

permissions:
  contents: write

concurrency:
  group: pr93-exact-semantic-acceptance
  cancel-in-progress: false

jobs:
  apply-exact-approved-packet:
    if: github.repository == 'errol1swaby2-bit/WeAll-Protocol'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm exact reviewed predecessor
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD^)" = 730166e048bea33ec90bc1190f3aeb187bccb75b
          git diff --exit-code HEAD^ HEAD -- Weall-Protocol/src web/src Weall-Protocol/specs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked environment
        working-directory: Weall-Protocol
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install -e . --no-deps
      - name: Apply exact explicitly approved bindings and preserve historical packet
        working-directory: Weall-Protocol
        run: python scripts/apply_pr93_approved_semantic_packet.py
      - name: Commit verified approval and archived comparison
        run: |
          set -Eeuo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Weall-Protocol/specs/v2/source/semantic_reviews.json docs/integration/PR93_PRE_ACCEPTANCE_SEMANTIC_REVIEW_PACKET.json
          git commit -m 'review(v2): apply exact maintainer-authorized PR93 development bindings'
          git push origin HEAD:"${GITHUB_REF_NAME}"
      - name: Regenerate reviewer derivatives without altering dependency locks
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python scripts/gen_api_contract_map.py
          python scripts/gen_failure_code_registry_v1_5.py
          python scripts/gen_api_response_vectors_v1_5.py
          python scripts/gen_public_only_protocol_audit_v1_5.py
          python scripts/gen_public_beta_blocker_report_v1_5.py
          python scripts/gen_release_evidence_manifest_v1_5.py
          python scripts/gen_b528_b532_completion_proof_v1_5.py
          python scripts/gen_b534_b538_completion_proof_v1_5.py
          python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py
          python scripts/gen_current_verified_claims.py
          python scripts/check_public_claim_freshness.py
          python scripts/compile_v2_spec.py
          python scripts/compile_v2_spec.py --check
          python scripts/check_generated.py
          python -m tooling.canon_lint
      - name: Commit only regenerated evidence
        run: |
          set -Eeuo pipefail
          git diff --check
          git diff --exit-code -- web/package.json web/package-lock.json Weall-Protocol/requirements.lock Weall-Protocol/requirements-dev.lock Weall-Protocol/src
          git add -A -- Weall-Protocol/generated web/src/generated/protocolStatus.ts
          if ! git diff --cached --quiet; then
            git commit -m 'chore(v2): regenerate accepted development reviewer derivatives'
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
      - name: Verify exact committed clean archive and live acceptance
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python scripts/check_v2_spec_clean_checkout.py
          python -m pytest -q tests/test_pr93_v2_semantic_review_inventory.py tests/test_pr77_v2_semantic_review_packet.py
          python scripts/pr93_v2_semantic_review_inventory.py
          echo 'Development semantic acceptance only. Web CI security audit and independent launch gate remain mandatory.'
