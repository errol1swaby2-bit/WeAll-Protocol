name: P1 Remediate A12 F002

on:
  push:
    branches:
      - p1-revalidation-after-p0-20261005
    paths:
      - .github/workflows/p1-remediate-a12-f002.yml

permissions:
  contents: write

jobs:
  patch-a12-f002:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: p1-revalidation-after-p0-20261005
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked backend environment
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Apply exact A12-F002 public projection repair
        working-directory: Weall-Protocol
        run: python scripts/p1_patch_a12_f002.py

      - name: Run focused A12-F002 regressions
        working-directory: Weall-Protocol
        run: |
          pytest -q \
            tests/test_p1_a12_mempool_redaction.py \
            tests/test_status_consensus_diagnostics.py

      - name: Canon sanity
        working-directory: Weall-Protocol
        run: |
          python -m tooling.canon_lint
          python scripts/check_generated.py

      - name: Commit proven repair to P1 branch
        run: |
          set -Eeuo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Weall-Protocol/src/weall/api/routes_public_parts/status.py
          git diff --cached --quiet && { echo 'No implementation change produced'; exit 1; }
          git commit -m 'fix: redact public pending mempool envelopes'
          git push origin HEAD:p1-revalidation-after-p0-20261005
