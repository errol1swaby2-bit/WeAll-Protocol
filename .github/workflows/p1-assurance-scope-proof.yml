name: P1 Assurance Scope Proof

on:
  push:
    branches:
      - p1-revalidation-after-p0-20261005
    paths:
      - .github/workflows/p1-assurance-scope-proof.yml

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p1-revalidation-after-p0-20261005
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked backend environment
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Verify assurance-scope edits
        working-directory: Weall-Protocol
        run: |
          FILES=(
            tests/test_p1_a17_reviewer_repro_contract.py
            tests/test_p1_a17_clean_lifecycle.py
            scripts/generate_tx_coverage_report.py
            tests/test_tx_coverage_report_current_index.py
          )
          ruff format --check "${FILES[@]}"
          ruff check "${FILES[@]}"
          pytest -q \
            tests/test_p1_a17_reviewer_repro_contract.py \
            tests/test_p1_a17_clean_lifecycle.py \
            tests/test_tx_coverage_report_current_index.py
