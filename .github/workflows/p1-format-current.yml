name: P1 Format Current Regression

on:
  push:
    branches:
      - p1-revalidation-after-p0-20261005
    paths:
      - .github/workflows/p1-format-current.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p1-revalidation-after-p0-20261005
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Format exact P1 regression file
        run: |
          python -m pip install ruff==0.15.22
          cd Weall-Protocol
          ruff format tests/test_p1_latest_medium_closure.py
          ruff check tests/test_p1_latest_medium_closure.py

      - name: Commit formatted file and remove temporary formatter
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/p1-format-current.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No format diff produced'; exit 1; }
          git commit -m 'style: format current P1 regression'
          git push origin HEAD:p1-revalidation-after-p0-20261005
