name: Temporary post-delete v2 sync repair

on:
  push:
    branches:
      - audit-r20-comprehensive-remediation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: audit-r20-comprehensive-remediation
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Remove this temporary workflow before generation
        run: rm -f .github/workflows/temporary-post-delete-v2-sync-repair.yml

      - name: Install locked backend dependencies
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install -e .

      - name: Regenerate v2 derivatives from final tree shape
        working-directory: Weall-Protocol
        run: |
          python scripts/compile_v2_spec.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          python scripts/check_generated.py
          python -m tooling.canon_lint
          git diff --check

      - name: Commit regenerated derivatives and self-removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repair changes were required."
            exit 0
          fi
          git commit -m "fix: regenerate v2 derivatives after repair workflow removal"
          git push origin HEAD:audit-r20-comprehensive-remediation
