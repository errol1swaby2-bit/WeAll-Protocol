# Temporary branch-scoped validation/derivative generation.
# Removes itself before generating source-bound V2 artifacts.
name: PR61 Repair Validation and V2 Regeneration

on:
  push:
    paths:
      - ".github/workflows/pr61-regenerate-once.yml"

permissions:
  contents: write

jobs:
  validate-and-regenerate:
    if: ${{ github.repository == 'errol1swaby2-bit/WeAll-Protocol' && github.ref == 'refs/heads/fix/pr60-content-dispute-system-schema-20261025' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout PR61 candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked backend dependencies
        working-directory: Weall-Protocol
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install -e . --no-deps
      - name: Validate existing canonical escalation queue regression
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          PYTHONPATH=src python -m pytest -q tests/test_content_escalation_followup_restart_admission.py
          python -m ruff check src/weall/runtime/tx_schema.py tests/test_content_escalation_followup_restart_admission.py
      - name: Remove transient workflow before source compilation
        run: |
          set -Eeuo pipefail
          git rm -- .github/workflows/pr61-regenerate-once.yml
      - name: Compile and validate final-source V2 derivatives
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          PYTHONPATH=src python scripts/compile_v2_spec.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          git diff --check
      - name: Commit output and remove one-time workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git add -A -- Weall-Protocol/generated/v2 web/src/generated/protocolStatus.ts
          if git diff --name-only --cached | grep -Ev '^(.github/workflows/pr61-regenerate-once[.]yml$|Weall-Protocol/generated/v2/|web/src/generated/protocolStatus[.]ts$)'; then
            echo "Unexpected staged file" >&2
            exit 1
          fi
          test ! -e .github/workflows/pr61-regenerate-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(v2): derive final source-bound artifacts for PR61'
          git push origin HEAD:"${GITHUB_REF_NAME}"
