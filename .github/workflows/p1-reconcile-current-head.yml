name: P1 Reconcile Current Head Truth

on:
  push:
    branches:
      - p1-revalidation-after-p0-20261005
    paths:
      - .github/workflows/p1-reconcile-current-head.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: p1-revalidation-after-p0-20261005
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked environments
        run: |
          python -m pip install --upgrade pip
          cd Weall-Protocol
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps
          cd ../web
          npm ci

      - name: Format only currently failing Python files
        working-directory: Weall-Protocol
        run: |
          FILES=(
            scripts/gen_current_verified_claims.py
            tests/test_p1_a17_reviewer_repro_contract.py
            tests/test_p1_a18_claim_boundaries.py
          )
          ruff check --fix "${FILES[@]}"
          ruff format "${FILES[@]}"
          ruff check "${FILES[@]}"
          ruff format --check "${FILES[@]}"

      - name: Remove temporary workflow from candidate tree
        run: |
          rm -f .github/workflows/p1-reconcile-current-head.yml

      - name: Regenerate exact-tree derivatives twice
        working-directory: Weall-Protocol
        run: |
          for round in 1 2; do
            echo "regeneration round $round"
            python scripts/gen_tx_index.py
            python scripts/gen_failure_code_registry_v1_5.py
            if [[ -f scripts/gen_api_response_vectors_v1_5.py ]]; then
              python scripts/gen_api_response_vectors_v1_5.py
            fi
            PYTHONPATH=src python scripts/gen_crypto_posture_v1_5.py
            python scripts/gen_api_contract_map.py
            PYTHONPATH=src python scripts/compile_v2_spec.py
            python scripts/gen_b528_b532_completion_proof_v1_5.py
            python scripts/gen_b534_b538_completion_proof_v1_5.py
            python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py
            python scripts/gen_public_beta_blocker_report_v1_5.py
            python scripts/gen_release_evidence_manifest_v1_5.py
            python scripts/gen_current_verified_claims.py
          done

      - name: Normalize current-facing verification entry and finalize derivatives
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "**External reviewers:** start with [Reviewer verification: start here]",
              "**Verification entry point:** start with [Reviewer verification: start here]",
          )
          path.write_text(text, encoding="utf-8")
          if "**External reviewers:** start with [Reviewer verification: start here]" in text:
              raise SystemExit("current README reviewer framing normalization failed")
          PY
          cd Weall-Protocol
          python scripts/gen_api_contract_map.py
          PYTHONPATH=src python scripts/compile_v2_spec.py
          python scripts/gen_b528_b532_completion_proof_v1_5.py
          python scripts/gen_b534_b538_completion_proof_v1_5.py
          python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py
          python scripts/gen_public_beta_blocker_report_v1_5.py
          python scripts/gen_release_evidence_manifest_v1_5.py
          python scripts/gen_current_verified_claims.py

      - name: Commit workflow-free candidate locally
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No reconciliation diff produced'; exit 1; }
          git diff --check --cached
          git commit -m 'audit: reconcile current P1 head truth'
          echo "candidate_sha=$(git rev-parse HEAD)"
          echo "candidate_tree=$(git rev-parse HEAD^{tree})"
          test -z "$(git status --porcelain)"

      - name: Verify exact committed candidate truth
        working-directory: Weall-Protocol
        run: |
          python scripts/check_generated.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          python scripts/check_v2_spec_clean_checkout.py
          python scripts/gen_b528_b532_completion_proof_v1_5.py --check
          python scripts/gen_b534_b538_completion_proof_v1_5.py --check
          python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py --check
          PYTHONDONTWRITEBYTECODE=1 python scripts/check_v15_public_readiness_artifacts.py
          python scripts/check_public_claim_freshness.py
          python scripts/gen_current_verified_claims.py --check
          test -z "$(git status --porcelain)"

      - name: Reprove P0 A15 scarcity under valid testnet crypto posture
        working-directory: Weall-Protocol
        run: |
          python tests/bench_a15_f003_registration_attack.py --accounts 32 \
            > /tmp/a15-f003-registration-attack.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/a15-f003-registration-attack.json").read_text())
          assert report["production_registration_work_parameters_used"] is True
          assert report["all_solved_work_passed_canonical_block_admission"] is True
          assert report["all_admissions_verified_valid_mldsa_signatures"] is True
          assert report["production_mainnet_mldsa_admission_claimed"] is False
          assert report["signature_runtime_mode"] == "public-testnet"
          PY

      - name: Focused A01-A20 P1 regression matrix
        working-directory: Weall-Protocol
        run: |
          bash -n ../scripts/fresh_clone_smoke.sh scripts/weall_tester_node.sh
          pytest -q \
            tests/test_p1_latest_medium_closure.py \
            tests/test_p1_a01_route_authority.py \
            tests/test_p1_a02_strict_social_booleans.py \
            tests/test_p1_a03_startup_durable_authority.py \
            tests/test_p1_a03_observer_queue_durability.py \
            tests/test_p1_a05_timeout_qc_ranking.py \
            tests/test_p1_a06_constitutional_not_before.py \
            tests/test_bft_timeout_certificate.py \
            tests/test_bft_timeout_recovery.py \
            tests/test_pb001bw_pending_timeout_restart_revalidation.py \
            tests/test_recursive_production_readiness_closure.py::test_pruned_delta_falls_back_to_restartable_checkpoint_snapshot \
            tests/test_state_sync_aux_branch_reset.py::test_checkpoint_sync_purges_aux_attestation_pool_and_restart_stays_clean \
            tests/test_pb001bo_canonical_block_hash_persistence.py::test_restart_fails_closed_when_persisted_tip_header_does_not_match_hash \
            tests/test_p1_a07_tls_verification.py \
            tests/test_p1_a10_treasury_cancel_scope.py \
            tests/test_p1_a10_reward_scheduler_scope.py \
            tests/test_p1_a12_mempool_redaction.py \
            tests/test_p1_a12_observer_operator_loopback_auth.py \
            tests/test_crypto_signature_profiles.py \
            tests/test_p1_a13_key_identity_canonicalization.py \
            tests/test_p1_a14_state_publication_linearization.py \
            tests/test_p1_a15_health_bounded_telemetry.py \
            tests/test_p1_a15_snapshot_scope.py \
            tests/test_p1_a17_reviewer_repro_contract.py \
            tests/test_p1_a17_clean_lifecycle.py \
            tests/test_p1_a18_claim_boundaries.py \
            tests/test_p1_a19_reviewer_front_door.py \
            tests/test_p1_a19_reviewer_bootstrap.py \
            tests/test_tx_signature_profile_admission.py \
            tests/test_block_signature_profiles.py \
            tests/test_validator_operator_signature_profiles.py \
            tests/prod/test_public_testnet_crypto_profile_gate.py

      - name: Reviewer readiness on exact candidate
        working-directory: Weall-Protocol
        env:
          WEALL_RELEASE_TREE_ALREADY_VERIFIED: "1"
        run: |
          bash scripts/reviewer_production_readiness_gate.sh

      - name: Final clean-tree guard
        run: |
          test -z "$(git status --porcelain)"
          test ! -e .github/workflows/p1-reconcile-current-head.yml
          echo "final_sha=$(git rev-parse HEAD)"
          echo "final_tree=$(git rev-parse HEAD^{tree})"

      - name: Push verified workflow-free candidate
        run: |
          git push origin HEAD:p1-revalidation-after-p0-20261005

# retry after adding deterministic API contract-map regeneration

# retry with API contract map generated before V2 source digest

# retry with final current-facing verification wording normalization
