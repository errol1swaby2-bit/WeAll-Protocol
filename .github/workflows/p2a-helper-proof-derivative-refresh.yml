name: P2A Helper Proof Derivative Refresh

on:
  push:
    branches:
      - p2-complete-remediation-20260927

permissions:
  contents: write

jobs:
  refresh-helper-proof-derivative:
    runs-on: ubuntu-latest
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate helper proof derivative
        run: python Weall-Protocol/tooling/gen_helper_contract_map.py

      - name: Verify lane-alignment semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("Weall-Protocol/generated/helper_contract_map.json").read_text(encoding="utf-8")
          )
          expected = {
              "IDENTITY": "PARALLEL_IDENTITY",
              "SOCIAL": "PARALLEL_SOCIAL",
              "CONTENT": "PARALLEL_CONTENT",
              "STORAGE": "PARALLEL_CONTENT",
              "ECONOMICS": "PARALLEL_ECONOMY",
          }

          for collection in ("contracts", "instance_contracts"):
              mismatches = []
              for row in data[collection]:
                  if not bool(row["helper_eligible"]):
                      continue
                  hint = str(row["planner_lane_hint"])
                  expected_lane = expected.get(hint)
                  if (
                      expected_lane is None
                      or row["execution_lane_id"] != expected_lane
                      or row["effective_lane_id"] != expected_lane
                  ):
                      mismatches.append(row["tx_type"])
              assert not mismatches, (collection, mismatches)

          contracts = {row["tx_type"]: row for row in data["contracts"]}
          for tx_type in ("ACCOUNT_BAN", "ACCOUNT_REINSTATE", "CONTENT_SHARE_CREATE"):
              row = contracts[tx_type]
              assert row["helper_eligible"] is False, row
              assert row["degraded_to_serial"] is True, row
              assert row["effective_lane_id"] == "SERIAL", row
              assert row["reason"] == "planner_execution_lane_mismatch", row

          instances = {row["tx_type"]: row for row in data["instance_contracts"]}
          share = instances["CONTENT_SHARE_CREATE"]
          assert share["helper_eligible"] is False, share
          assert share["degraded_to_serial"] is True, share
          assert share["effective_lane_id"] == "SERIAL", share
          assert share["reason"] == "planner_execution_lane_mismatch", share
          assert data["instance_summary"]["proven_helper_eligible_count"] == 12
          assert data["instance_summary"]["degraded_to_serial_count"] == 1
          PY

      - name: Commit regenerated derivative and remove one-shot workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/p2a-helper-proof-derivative-refresh.yml
          git add Weall-Protocol/generated/helper_contract_map.json
          git add -u .github/workflows/p2a-helper-proof-derivative-refresh.yml
          if git diff --cached --quiet; then
            echo "No derivative changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate P2A helper proof derivative"
          git push origin "HEAD:${{ github.ref_name }}"
