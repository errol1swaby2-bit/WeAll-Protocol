name: F1b one-shot complete exact-tree proof regeneration

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'frontend/f1-guided-account-onboarding-20261104'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact PR source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up locked Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install hash-locked proof dependencies
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Remove temporary workflow and regenerate live proof outputs
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -z "$(git status --porcelain)"
          rm .github/workflows/f1b-one-shot-v2-refresh.yml

          cd Weall-Protocol
          export PYTHONPATH=src
          python scripts/gen_b528_b532_completion_proof_v1_5.py
          python scripts/gen_b528_b532_completion_proof_v1_5.py --check
          python scripts/gen_b534_b538_completion_proof_v1_5.py
          python scripts/gen_b534_b538_completion_proof_v1_5.py --check
          python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py
          python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py --check
          python scripts/compile_v2_spec.py
          python scripts/compile_v2_spec.py --check
          cd ..

          git add -A -- \
            .github/workflows/f1b-one-shot-v2-refresh.yml \
            Weall-Protocol/generated/b528_b532_completion_proof_v1_5.json \
            Weall-Protocol/generated/b534_b538_completion_proof_v1_5.json \
            Weall-Protocol/generated/b567_b571_autonomous_mechanics_proof_v1_5.json \
            Weall-Protocol/generated/v2 \
            web/src/generated/protocolStatus.ts

          # Fail if any generator made unexpected changes or untracked files.
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
          test ! -e .github/workflows/f1b-one-shot-v2-refresh.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(F1b): regenerate live B528/B534/B567 proofs and source-bound V2 evidence"
          git push origin HEAD:refs/heads/frontend/f1-guided-account-onboarding-20261104
