name: P2 DISPUTE002 Closure

on:
  push:
    branches:
      - p2-complete-remediation-20260927
    paths:
      - .github/workflows/p2-dispute002.yml

permissions:
  contents: write

jobs:
  close:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: p2-complete-remediation-20260927
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked backend dependencies
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Remove one-shot workflow from source tree
        run: git rm .github/workflows/p2-dispute002.yml

      - name: Patch dispute appeal actor binding
        working-directory: Weall-Protocol
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/weall/runtime/apply/dispute.py")
          text = path.read_text(encoding="utf-8")

          start = text.index("def _appeal_allowed_accounts(state: Json, d: Json) -> list[str]:")
          end = text.index("\n\ndef _require_dispute_appeal_actor", start)
          replacement = '''def _direct_dispute_target_account(state: Json, d: Json) -> str:\n    target_type = _as_str(d.get("target_type") or "").strip().lower()\n    if target_type not in {"account", "moderator", "reviewer", "poh"}:\n        return ""\n    target_id = _as_str(d.get("target_id") or "").strip()\n    if not target_id:\n        return ""\n    accounts = _as_dict(state.get("accounts"))\n    for variant in _identity_variants(target_id):\n        if variant in accounts:\n            return variant\n    return ""\n\n\ndef _appeal_allowed_accounts(state: Json, d: Json) -> list[str]:\n    raw = d.get("appeal_allowed_accounts")\n    candidates: list[str] = []\n    if isinstance(raw, list):\n        candidates.extend(_as_str(x).strip() for x in raw if _as_str(x).strip())\n\n    owner = _dispute_target_owner(state, d)\n    if owner:\n        candidates.append(owner)\n\n    direct_target = _direct_dispute_target_account(state, d)\n    if direct_target:\n        candidates.append(direct_target)\n\n    normalized: list[str] = []\n    for candidate in candidates:\n        resolved = _resolve_account_identity(state, candidate)\n        if not resolved:\n            continue\n        if any(_same_account(resolved, existing) for existing in normalized):\n            continue\n        normalized.append(resolved)\n    return normalized'''
          text = text[:start] + replacement + text[end:]

          start = text.index("def _require_dispute_appeal_actor(state: Json, d: Json, signer: str) -> None:")
          end = text.index("\n\ndef ", start + 5)
          replacement = '''def _require_dispute_appeal_actor(state: Json, d: Json, signer: str) -> None:\n    """Require an affected or explicitly authorized appellant.\n\n    Empty actor bindings fail closed.  Account-like targets are resolved only\n    when their target id maps to canonical account state; unresolved group,\n    membership, or other resource identifiers do not widen appeal authority.\n    """\n\n    allowed = _appeal_allowed_accounts(state, d)\n    if not allowed:\n        raise DisputeApplyError(\n            "forbidden",\n            "appeal_actor_unresolved",\n            {\n                "dispute_id": _as_str(d.get("id") or d.get("dispute_id") or ""),\n                "target_type": _as_str(d.get("target_type") or ""),\n                "target_id": _as_str(d.get("target_id") or ""),\n            },\n        )\n    if not any(_same_account(signer, acct) for acct in allowed):\n        raise DisputeApplyError(\n            "forbidden",\n            "appeal_not_target_owner",\n            {\n                "dispute_id": _as_str(d.get("id") or d.get("dispute_id") or ""),\n                "signer": signer,\n                "allowed_accounts": allowed,\n            },\n        )'''
          text = text[:start] + replacement + text[end:]

          old = '''    target_owner = _content_target_owner(state, target_type=target_type, target_id=target_id)\n    reported_by = _as_str('''
          new = '''    target_owner = _content_target_owner(state, target_type=target_type, target_id=target_id)\n    target_binding = {"target_type": target_type, "target_id": target_id}\n    direct_target_account = _direct_dispute_target_account(state, target_binding)\n    appeal_allowed_accounts = _normalized_str_list(\n        [value for value in (target_owner, direct_target_account) if value]\n    )\n    if not target_owner and direct_target_account:\n        target_owner = direct_target_account\n    reported_by = _as_str('''
          if old not in text:
              raise SystemExit("dispute-open target owner anchor missing")
          text = text.replace(old, new, 1)

          old = '        "appeal_allowed_accounts": [target_owner] if target_owner else [],'
          new = '        "appeal_allowed_accounts": list(appeal_allowed_accounts),'
          if old not in text:
              raise SystemExit("dispute-open appeal allowlist anchor missing")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

          api_path = Path("src/weall/api/routes_public_parts/disputes.py")
          api = api_path.read_text(encoding="utf-8")
          start = api.index("def _resolved_target_owner(st: dict[str, Any], obj: dict[str, Any]) -> str:")
          end = api.index("\n\ndef _content_target_snapshot", start)
          replacement = '''def _direct_target_account(st: dict[str, Any], obj: dict[str, Any]) -> str:\n    target_type = str(obj.get("target_type") or "").strip().lower()\n    if target_type not in {"account", "moderator", "reviewer", "poh"}:\n        return ""\n    target_id = str(obj.get("target_id") or "").strip()\n    accounts = _as_dict(st.get("accounts"))\n    for variant in _identity_variants(target_id):\n        if variant in accounts:\n            return variant\n    return ""\n\n\ndef _resolved_target_owner(st: dict[str, Any], obj: dict[str, Any]) -> str:\n    owner = str(obj.get("target_owner") or obj.get("target_author") or "").strip()\n    if owner:\n        return owner\n    owner = _content_target_owner(\n        st,\n        target_type=str(obj.get("target_type") or "content"),\n        target_id=str(obj.get("target_id") or ""),\n    )\n    if owner:\n        return owner\n    return _direct_target_account(st, obj)'''
          api = api[:start] + replacement + api[end:]
          api_path.write_text(api, encoding="utf-8")

          test_path = Path("tests/test_p2_dispute_appeal_actor.py")
          test_path.write_text('''from __future__ import annotations\n\nimport pytest\n\nfrom weall.api.routes_public_parts.disputes import _appeal_eligibility\nfrom weall.runtime.apply.dispute import (\n    DisputeApplyError,\n    _appeal_allowed_accounts,\n    _require_dispute_appeal_actor,\n    apply_dispute,\n)\nfrom weall.runtime.tx_admission import TxEnvelope\n\n\ndef _env(tx_type: str, signer: str, nonce: int, payload: dict[str, object]) -> TxEnvelope:\n    return TxEnvelope(\n        tx_type=tx_type,\n        signer=signer,\n        nonce=nonce,\n        payload=payload,\n        sig="sig",\n        system=False,\n    )\n\n\ndef test_account_dispute_binds_appeal_to_target_account() -> None:\n    state = {\n        "height": 10,\n        "accounts": {\n            "@reporter": {"poh_tier": 2},\n            "@subject": {"poh_tier": 2},\n            "@intruder": {"poh_tier": 2},\n        },\n        "roles": {},\n        "system_queue": [],\n    }\n    apply_dispute(\n        state,\n        _env(\n            "DISPUTE_OPEN",\n            "@reporter",\n            1,\n            {\n                "dispute_id": "d-account",\n                "target_type": "account",\n                "target_id": "@subject",\n                "reason": "account restriction review",\n            },\n        ),\n    )\n    dispute = state["disputes_by_id"]["d-account"]\n    assert dispute["appeal_allowed_accounts"] == ["@subject"]\n    assert _appeal_allowed_accounts(state, dispute) == ["@subject"]\n\n    _require_dispute_appeal_actor(state, dispute, "@subject")\n    with pytest.raises(DisputeApplyError) as exc_info:\n        _require_dispute_appeal_actor(state, dispute, "@intruder")\n    assert exc_info.value.code == "forbidden"\n    assert exc_info.value.reason == "appeal_not_target_owner"\n\n\ndef test_unresolved_noncontent_appeal_binding_fails_closed() -> None:\n    state = {\n        "accounts": {"@intruder": {"poh_tier": 2}},\n    }\n    dispute = {\n        "dispute_id": "d-group",\n        "target_type": "group",\n        "target_id": "group:unknown",\n        "appeal_allowed_accounts": [],\n    }\n    assert _appeal_allowed_accounts(state, dispute) == []\n    with pytest.raises(DisputeApplyError) as exc_info:\n        _require_dispute_appeal_actor(state, dispute, "@intruder")\n    assert exc_info.value.code == "forbidden"\n    assert exc_info.value.reason == "appeal_actor_unresolved"\n\n\ndef test_legacy_account_dispute_read_model_derives_subject() -> None:\n    state = {"accounts": {"@subject": {"poh_tier": 2}}}\n    dispute = {\n        "dispute_id": "d-legacy-account",\n        "target_type": "account",\n        "target_id": "@subject",\n        "stage": "appeal_window",\n    }\n    eligibility = _appeal_eligibility(state, dispute, viewer="@subject")\n    assert eligibility["can_file"] is True\n    assert eligibility["allowed_accounts"] == ["@subject"]\n''', encoding="utf-8")
          PY

      - name: Format and focused dispute verification
        working-directory: Weall-Protocol
        run: |
          ruff format \
            src/weall/runtime/apply/dispute.py \
            src/weall/api/routes_public_parts/disputes.py \
            tests/test_p2_dispute_appeal_actor.py
          ruff format --check \
            src/weall/runtime/apply/dispute.py \
            src/weall/api/routes_public_parts/disputes.py \
            tests/test_p2_dispute_appeal_actor.py
          ruff check \
            src/weall/runtime/apply/dispute.py \
            src/weall/api/routes_public_parts/disputes.py \
            tests/test_p2_dispute_appeal_actor.py
          pytest -q \
            tests/test_p2_dispute_appeal_actor.py \
            tests/test_dispute_followups.py \
            tests/test_m3_closure_regressions.py

      - name: Refresh semantic and reviewer evidence
        working-directory: Weall-Protocol
        run: |
          python scripts/refresh_v2_semantic_reviews.py \
            --tx-type DISPUTE_OPEN \
            --tx-type DISPUTE_APPEAL \
            --register-failure forbidden:appeal_actor_unresolved \
            --reviewer 'WeAll Protocol P2 audit remediation; independent launch review deferred'

          python scripts/gen_failure_code_registry_v1_5.py
          PYTHONPATH=src python scripts/gen_release_evidence_manifest_v1_5.py
          PYTHONPATH=src:scripts python scripts/gen_public_beta_blocker_report_v1_5.py
          python scripts/gen_current_verified_claims.py

          python scripts/gen_failure_code_registry_v1_5.py --check
          PYTHONPATH=src python scripts/gen_release_evidence_manifest_v1_5.py --check
          PYTHONPATH=src:scripts python scripts/gen_public_beta_blocker_report_v1_5.py --check
          python scripts/gen_current_verified_claims.py --check

          PYTHONPATH=src python scripts/compile_v2_spec.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          PYTHONDONTWRITEBYTECODE=1 python scripts/check_v15_public_readiness_artifacts.py
          python scripts/check_public_claim_freshness.py
          python scripts/gen_current_verified_claims.py --check
          git diff --check

      - name: Commit verified P2 DISPUTE002 closure and self-delete
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Close P2 DISPUTE002 fail-closed appeal actor binding'
          git push origin HEAD:p2-complete-remediation-20260927
