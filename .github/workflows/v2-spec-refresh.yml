name: Reviewer Artifact Refresh
# P2 dependent evidence refresh retry

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/v2-spec-refresh.yml

permissions:
  contents: write

concurrency:
  group: reviewer-artifact-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-reviewer-artifacts:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout triggering ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked backend environment
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Format P2 closure Python files
        working-directory: Weall-Protocol
        run: |
          ruff format \
            src/weall/runtime/helper_certificates.py \
            src/weall/runtime/helper_receipts.py \
            tests/test_p2_a13_signature_authority.py \
            tests/test_p2_a20_deployment_csp.py

      - name: Refresh reviewer-facing v1.5 derivatives
        working-directory: Weall-Protocol
        run: |
          python scripts/gen_api_contract_map.py
          python scripts/gen_failure_code_registry_v1_5.py
          python scripts/gen_api_response_vectors_v1_5.py
          python scripts/gen_b587_b594_testnet_mechanism_completion_v1_5.py || test $? -eq 1
          python scripts/gen_public_beta_blocker_report_v1_5.py
          python scripts/gen_final_public_observer_controlled_testnet_go_gate_v1_5.py || test $? -eq 1
          python scripts/gen_release_evidence_manifest_v1_5.py
          python scripts/run_controlled_testnet_go_gate_v1_5.py || test $? -eq 1
          python scripts/gen_final_public_observer_controlled_testnet_go_gate_v1_5.py || test $? -eq 1
          python scripts/gen_release_evidence_manifest_v1_5.py
          python scripts/run_controlled_testnet_go_gate_v1_5.py || test $? -eq 1

      - name: Verify v1.5 public-readiness derivatives
        working-directory: Weall-Protocol
        run: python scripts/check_v15_public_readiness_artifacts.py --require-git-tracked

      - name: Refresh and verify current verified claims
        working-directory: Weall-Protocol
        run: |
          python scripts/gen_current_verified_claims.py
          python scripts/check_public_claim_freshness.py
          python scripts/gen_current_verified_claims.py --check

      - name: Regenerate V2 derivatives after reviewer artifacts
        working-directory: Weall-Protocol
        run: python scripts/compile_v2_spec.py

      - name: Verify regenerated V2 state
        working-directory: Weall-Protocol
        run: |
          python scripts/check_generated.py
          python -m tooling.canon_lint

      - name: Commit derivative refresh when needed
        run: |
          set -Eeuo pipefail
          git diff --check
          if git diff --quiet -- \
            Weall-Protocol/generated \
            web/src/generated/protocolStatus.ts \
            Weall-Protocol/src/weall/runtime/helper_certificates.py \
            Weall-Protocol/src/weall/runtime/helper_receipts.py \
            Weall-Protocol/tests/test_p2_a13_signature_authority.py \
            Weall-Protocol/tests/test_p2_a20_deployment_csp.py; then
            echo "Reviewer artifacts already current."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u \
            Weall-Protocol/generated \
            web/src/generated/protocolStatus.ts \
            Weall-Protocol/src/weall/runtime/helper_certificates.py \
            Weall-Protocol/src/weall/runtime/helper_receipts.py \
            Weall-Protocol/tests/test_p2_a13_signature_authority.py \
            Weall-Protocol/tests/test_p2_a20_deployment_csp.py
          git commit -m 'audit: refresh reviewer-facing generated artifacts'
          git push origin HEAD:"${GITHUB_REF_NAME}"
