name: Reviewer Artifact Refresh

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/v2-spec-refresh.yml

permissions:
  contents: write

concurrency:
  group: reviewer-artifact-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-reviewer-artifacts:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout triggering ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked backend environment
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Refresh reviewer-facing v1.5 derivatives
        working-directory: Weall-Protocol
        run: |
          python scripts/gen_api_contract_map.py
          python scripts/gen_failure_code_registry_v1_5.py
          python scripts/gen_api_response_vectors_v1_5.py
          # Source-scanning audit feeds release-manifest digests, which feed the
          # blocker report. Preserve this dependency order before strict checks.
          python scripts/gen_public_only_protocol_audit_v1_5.py
          python scripts/gen_release_evidence_manifest_v1_5.py
          python scripts/gen_public_beta_blocker_report_v1_5.py
          # These are source-bound P1 completion proofs; preserve their strict
          # clean-check gates by regenerating them after source changes.
          python scripts/gen_b528_b532_completion_proof_v1_5.py
          python scripts/gen_b534_b538_completion_proof_v1_5.py
          python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py

      - name: Verify v1.5 public-readiness derivatives
        working-directory: Weall-Protocol
        run: python scripts/check_v15_public_readiness_artifacts.py --require-git-tracked

      - name: Refresh and verify current verified claims
        working-directory: Weall-Protocol
        run: |
          python scripts/gen_current_verified_claims.py
          python scripts/check_public_claim_freshness.py
          python scripts/gen_current_verified_claims.py --check

      - name: Regenerate V2 derivatives after reviewer artifacts
        working-directory: Weall-Protocol
        run: python scripts/compile_v2_spec.py

      - name: Verify regenerated V2 state
        working-directory: Weall-Protocol
        run: |
          python scripts/check_generated.py
          python -m tooling.canon_lint

      - name: Commit derivative refresh when needed
        run: |
          set -Eeuo pipefail
          git diff --check
          if git diff --quiet -- Weall-Protocol/generated web/src/generated/protocolStatus.ts; then
            echo "Reviewer artifacts already current."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u Weall-Protocol/generated web/src/generated/protocolStatus.ts
          git commit -m 'audit: refresh reviewer-facing generated artifacts'
          git push origin HEAD:"${GITHUB_REF_NAME}"
