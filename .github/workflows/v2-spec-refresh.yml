# PR56 scoped-role status hardening: one-shot semantic refresh retry.
# PR56 one-shot retry: rebind without introducing new Groups state-key stable IDs.
# Exact-tree integration refresh requested after local bootstrap exposure remediation.
# Refresh V2 source coverage and generated provenance for active deliberations frontend wiring.
# Follow-up: incorporate strict TypeScript comparator for signed comment ordering.
# Keep the canonical refresh and clean-check behavior unchanged.
# Integration refresh trigger: update WSL loopback regression to match hardened local-only bootstrap.
# PR53 final Ruff-formatted parity and nonce-consumption regression evidence; regenerate all exact source-bound artifacts.
name: Reviewer Artifact Refresh

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/v2-spec-refresh.yml
      - Weall-Protocol/tests/test_frontend_dependency_audit.py
      - .github/workflows/web-ci.yml

permissions:
  contents: write

concurrency:
  group: reviewer-artifact-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-reviewer-artifacts:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout triggering ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked backend environment
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Setup Node for audited frontend lock update
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Update vulnerable Vite lock, retain exact npm reproducibility
        working-directory: web
        run: |
          npm install --package-lock-only --save-dev --save-exact vite@8.3.5
          npm ci
          npm audit --audit-level=moderate
          npm run typecheck
          npm run build

      - name: Update vulnerable certifi lock with reproducible hashes
        working-directory: Weall-Protocol
        run: |
          pip-compile --resolver=backtracking --allow-unsafe --generate-hashes --no-emit-index-url --no-emit-trusted-host --upgrade-package certifi==2026.10.19 --output-file requirements-dev.lock requirements-dev.in
          python -m pip install --require-hashes -r requirements-dev.lock
          pip-audit -r requirements.lock
          pip-audit -r requirements-dev.lock

      # PR #56 bounded one-shot provisional update. This does NOT assert
      # independent acceptance. Remove after generated derivatives are committed.
      - name: Rebind the four changed semantic contracts with explicit AI-assisted provenance
        if: ${{ github.ref_name == 'fix/group-scope-election-deliberation-20261023' }}
        working-directory: Weall-Protocol
        run: |
          python scripts/refresh_v2_semantic_reviews.py \
            --tx-type GROUP_EMISSARY_ELECTION_FINALIZE \
            --tx-type GOV_PROPOSAL_CREATE \
            --tx-type GOV_PROPOSAL_EDIT \
            --tx-type GOV_PROPOSAL_COMMENT \
            --register-failure 'invalid_payload:proposal_group_scope_conflict' \
            --register-failure 'invalid_payload:proposal_electorate_scope_conflict' \
            --register-failure 'not_found:governance_group_not_found' \
            --register-failure 'forbidden:group_governance_participant_not_eligible' \
            --register-failure 'forbidden:group_governance_participation_required' \
            --register-failure 'forbidden:group_proposal_requires_group_electorate' \
            --register-failure 'forbidden:proposal_scope_immutable' \
            --reviewed-at 2026-10-23T21:38:00Z \
            --reviewer 'AI-assisted scoped governance code review; independent review pending' \
            --review-method 'provisional_ai_assisted_contract_review_pr56_independent_review_pending'

      - name: Refresh reviewer-facing v1.5 derivatives
        working-directory: Weall-Protocol
        run: |
          python scripts/gen_api_contract_map.py
          python scripts/gen_failure_code_registry_v1_5.py
          python scripts/gen_api_response_vectors_v1_5.py
          # Public-only audit is an input to the blocker/readiness inventory.
          python scripts/gen_public_only_protocol_audit_v1_5.py
          python scripts/gen_public_beta_blocker_report_v1_5.py
          python scripts/gen_release_evidence_manifest_v1_5.py
          # These are source-bound P1 completion proofs; preserve their strict
          # clean-check gates by regenerating them after source changes.
          python scripts/gen_b528_b532_completion_proof_v1_5.py
          python scripts/gen_b534_b538_completion_proof_v1_5.py
          python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py

      - name: Verify v1.5 public-readiness derivatives
        working-directory: Weall-Protocol
        run: python scripts/check_v15_public_readiness_artifacts.py --require-git-tracked

      - name: Refresh and verify current verified claims
        working-directory: Weall-Protocol
        run: |
          python scripts/gen_current_verified_claims.py
          python scripts/check_public_claim_freshness.py
          python scripts/gen_current_verified_claims.py --check

      - name: Regenerate V2 derivatives after reviewer artifacts
        working-directory: Weall-Protocol
        run: python scripts/compile_v2_spec.py

      - name: Verify regenerated V2 state
        working-directory: Weall-Protocol
        run: |
          python scripts/check_generated.py
          python -m tooling.canon_lint

      - name: Commit derivative refresh when needed
        run: |
          set -Eeuo pipefail
          git diff --check
          if git diff --quiet -- Weall-Protocol/specs/v2/source/semantic_reviews.json Weall-Protocol/specs/v2/source/stable_ids.json Weall-Protocol/generated web/src/generated/protocolStatus.ts Weall-Protocol/requirements-dev.lock web/package.json web/package-lock.json; then
            echo "Reviewer artifacts already current."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u Weall-Protocol/specs/v2/source/semantic_reviews.json Weall-Protocol/specs/v2/source/stable_ids.json Weall-Protocol/generated web/src/generated/protocolStatus.ts Weall-Protocol/requirements-dev.lock web/package.json web/package-lock.json
          git commit -m 'fix(ci): update vulnerable locked dependencies and regenerate evidence'
          git push origin HEAD:"${GITHUB_REF_NAME}"
