name: V2 Spec Refresh

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/v2-spec-refresh.yml

permissions:
  contents: write

concurrency:
  group: v2-spec-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-v2-spec:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout triggering ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked backend environment
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Regenerate V2 derivatives
        working-directory: Weall-Protocol
        run: python scripts/compile_v2_spec.py

      - name: Verify regenerated state
        working-directory: Weall-Protocol
        run: |
          python scripts/check_generated.py
          python -m tooling.canon_lint

      - name: Commit derivative refresh when needed
        run: |
          set -Eeuo pipefail
          git diff --check
          if git diff --quiet -- Weall-Protocol/generated/v2 web/src/generated/protocolStatus.ts; then
            echo "V2 derivatives already current."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Weall-Protocol/generated/v2 web/src/generated/protocolStatus.ts
          git commit -m 'spec: refresh V2 generated derivatives'
          git push origin HEAD:"${GITHUB_REF_NAME}"
