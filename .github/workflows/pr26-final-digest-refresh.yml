name: PR26 Final Digest Refresh

on:
  push:
    branches:
      - production-readiness-audit-20260925

permissions:
  contents: write

concurrency:
  group: pr26-final-digest-refresh
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: production-readiness-audit-20260925

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Remove one-shot remediation workflow from final tree
        run: git rm -f .github/workflows/pr26-final-digest-refresh.yml

      - name: Install locked backend dependencies
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Refresh all deterministic source-digest proof artifacts affected by runtime changes
        working-directory: Weall-Protocol
        run: |
          export PYTHONPATH=src:scripts
          python scripts/gen_b528_b532_completion_proof_v1_5.py
          python scripts/gen_b534_b538_completion_proof_v1_5.py
          python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py
          python scripts/gen_b528_b532_completion_proof_v1_5.py --check
          python scripts/gen_b534_b538_completion_proof_v1_5.py --check
          python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py --check

      - name: Refresh dependent release evidence and claims
        working-directory: Weall-Protocol
        run: |
          export PYTHONPATH=src:scripts
          python scripts/gen_release_evidence_manifest_v1_5.py
          python scripts/gen_public_beta_blocker_report_v1_5.py

          # These two writers intentionally return 1 when the bounded readiness
          # verdict is NO-GO. That is a protocol verdict, not a generation
          # failure. Remove the old file first, require a newly written artifact,
          # then use --check (which validates freshness/integrity independently
          # of the readiness verdict).
          rm -f generated/controlled_testnet_go_gate_v1_5.json
          set +e
          python scripts/run_controlled_testnet_go_gate_v1_5.py
          controlled_rc=$?
          set -e
          if [[ "$controlled_rc" -ne 0 && "$controlled_rc" -ne 1 ]]; then
            exit "$controlled_rc"
          fi
          test -s generated/controlled_testnet_go_gate_v1_5.json
          python scripts/run_controlled_testnet_go_gate_v1_5.py --check

          rm -f generated/final_public_observer_controlled_testnet_go_gate_v1_5.json
          set +e
          python scripts/gen_final_public_observer_controlled_testnet_go_gate_v1_5.py
          final_rc=$?
          set -e
          if [[ "$final_rc" -ne 0 && "$final_rc" -ne 1 ]]; then
            exit "$final_rc"
          fi
          test -s generated/final_public_observer_controlled_testnet_go_gate_v1_5.json
          python scripts/gen_final_public_observer_controlled_testnet_go_gate_v1_5.py --check

          python scripts/gen_release_evidence_manifest_v1_5.py
          python scripts/gen_public_beta_blocker_report_v1_5.py
          python scripts/gen_current_verified_claims.py
          PYTHONPATH=src python scripts/compile_v2_spec.py

      - name: Audit all known deterministic source-digest siblings
        working-directory: Weall-Protocol
        run: |
          export PYTHONPATH=src:scripts
          python scripts/gen_b528_b532_completion_proof_v1_5.py --check
          python scripts/gen_b534_b538_completion_proof_v1_5.py --check
          python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py --check
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          python scripts/check_generated.py
          python scripts/check_v2_spec_clean_checkout.py
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src:scripts python scripts/check_v15_public_readiness_artifacts.py
          python scripts/check_public_claim_freshness.py
          python scripts/gen_current_verified_claims.py --check

      - name: Run full backend suite
        working-directory: Weall-Protocol
        run: pytest -q

      - name: Clean validation residue
        working-directory: Weall-Protocol
        run: |
          find . -type d \( -name '__pycache__' -o -name '.pytest_cache' -o -name '.ruff_cache' -o -name '*.egg-info' \) -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

      - name: Validate release tree and reviewer gate
        run: |
          cd Weall-Protocol
          bash scripts/verify_release_tree.sh
          cd ..
          bash scripts/restore_m2_m3_evidence_from_git.sh --destination "${GITHUB_WORKSPACE}"
          cd Weall-Protocol
          WEALL_RELEASE_TREE_ALREADY_VERIFIED=1 bash scripts/reviewer_production_readiness_gate.sh

      - name: Commit and push validated repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Refresh deterministic proof digests after runtime remediation"
          git push origin HEAD:production-readiness-audit-20260925
