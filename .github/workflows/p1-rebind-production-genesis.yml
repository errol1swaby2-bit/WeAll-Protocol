name: P1 Rebind Production Genesis

on:
  push:
    branches:
      - p1-revalidation-after-p0-20261005
    paths:
      - .github/workflows/p1-rebind-production-genesis.yml

permissions:
  contents: write

jobs:
  rebind:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p1-revalidation-after-p0-20261005
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked backend environment
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Diagnose current production binding
        working-directory: Weall-Protocol
        run: |
          set +e
          bash scripts/prod_chain_manifest_check.sh configs/chains/weall-genesis.json
          rc=$?
          set -e
          echo "current_prod_chain_manifest_check_rc=$rc"
          python scripts/assert_production_genesis_artifacts.py \
            --manifest configs/chains/weall-genesis.json \
            --genesis configs/genesis.ledger.prod.json \
            --tx-index generated/tx_index.json || true

      - name: Rebuild production genesis and manifest with preserved ceremony identity
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          CHAIN_ID="$(python -c 'import json; print(json.load(open("configs/chains/weall-genesis.json"))["chain_id"])')"
          FOUNDER="$(python -c 'import json; print(json.load(open("configs/genesis.ledger.prod.json"))["params"]["bootstrap_founder_account"])')"
          FOUNDING_PUBKEY="$(python -c 'import json; g=json.load(open("configs/genesis.ledger.prod.json")); f=g["params"]["bootstrap_founder_account"]; print(g["params"]["bootstrap_allowlist"][f]["pubkey"])')"
          AUTHORITY_PUBKEY="$(python -c 'import json; print(json.load(open("configs/chains/weall-genesis.json"))["trusted_authority_pubkeys"][0])')"
          GENESIS_TIME="$(python -c 'import json; print(json.load(open("configs/genesis.ledger.prod.json"))["params"]["genesis_time"])')"
          ECON_DAYS="$(python -c 'import json; g=json.load(open("configs/genesis.ledger.prod.json")); d=int(g["params"]["economic_unlock_time"])-int(g["params"]["genesis_time"]); assert d>0 and d%86400==0; print(d//86400)')"
          BOOTSTRAP_EXPIRES="$(python -c 'import json; print(json.load(open("configs/genesis.ledger.prod.json"))["params"]["bootstrap_expires_height"])')"

          test "$CHAIN_ID" = "weall-prod"
          test "$ECON_DAYS" -ge 90

          python scripts/build_production_genesis_manifest.py \
            --chain-id "$CHAIN_ID" \
            --founding-account "$FOUNDER" \
            --founding-pubkey "$FOUNDING_PUBKEY" \
            --authority-pubkey "$AUTHORITY_PUBKEY" \
            --tx-index generated/tx_index.json \
            --genesis-out configs/genesis.ledger.prod.json \
            --manifest-out configs/chains/weall-genesis.json \
            --genesis-time "$GENESIS_TIME" \
            --econ-unlock-days "$ECON_DAYS" \
            --bootstrap-expires-height "$BOOTSTRAP_EXPIRES"

          changed="$(git diff --name-only -- configs/genesis.ledger.prod.json configs/chains/weall-genesis.json)"
          test -n "$changed"
          printf 'production artifact changes:\n%s\n' "$changed"

      - name: Verify rebound production artifacts and observer gates
        working-directory: Weall-Protocol
        run: |
          bash scripts/prod_chain_manifest_check.sh configs/chains/weall-genesis.json
          python scripts/assert_production_genesis_artifacts.py \
            --manifest configs/chains/weall-genesis.json \
            --genesis configs/genesis.ledger.prod.json \
            --tx-index generated/tx_index.json
          pytest -q \
            tests/test_external_testnet_p0_p2_safety.py::test_authority_lock_gate_passes_minimal_observer_posture \
            tests/test_genesis_api_external_observer_readiness.py::test_first_external_observer_gate_still_passes_local_scope

      - name: Remove temporary workflow from candidate tree
        run: |
          rm -f .github/workflows/p1-rebind-production-genesis.yml

      - name: Regenerate dependent evidence twice
        working-directory: Weall-Protocol
        run: |
          for round in 1 2; do
            echo "regeneration round $round"
            python scripts/gen_failure_code_registry_v1_5.py
            if [[ -f scripts/gen_api_response_vectors_v1_5.py ]]; then
              python scripts/gen_api_response_vectors_v1_5.py
            fi
            PYTHONPATH=src python scripts/compile_v2_spec.py
            python scripts/gen_b528_b532_completion_proof_v1_5.py
            python scripts/gen_b534_b538_completion_proof_v1_5.py
            python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py
            python scripts/gen_public_beta_blocker_report_v1_5.py
            python scripts/gen_release_evidence_manifest_v1_5.py
            python scripts/gen_current_verified_claims.py
          done

      - name: Commit workflow-free production binding locally
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No production binding diff produced'; exit 1; }
          git diff --check --cached
          git commit -m 'audit: rebind production genesis to current canon'
          echo "candidate_sha=$(git rev-parse HEAD)"
          echo "candidate_tree=$(git rev-parse HEAD^{tree})"
          test -z "$(git status --porcelain)"

      - name: Verify committed candidate
        working-directory: Weall-Protocol
        run: |
          bash scripts/prod_chain_manifest_check.sh configs/chains/weall-genesis.json
          python scripts/assert_production_genesis_artifacts.py \
            --manifest configs/chains/weall-genesis.json \
            --genesis configs/genesis.ledger.prod.json \
            --tx-index generated/tx_index.json
          python scripts/check_generated.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          python scripts/check_v2_spec_clean_checkout.py
          python scripts/gen_b528_b532_completion_proof_v1_5.py --check
          python scripts/gen_b534_b538_completion_proof_v1_5.py --check
          python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py --check
          PYTHONDONTWRITEBYTECODE=1 python scripts/check_v15_public_readiness_artifacts.py
          python scripts/check_public_claim_freshness.py
          python scripts/gen_current_verified_claims.py --check
          pytest -q \
            tests/test_external_testnet_p0_p2_safety.py::test_authority_lock_gate_passes_minimal_observer_posture \
            tests/test_genesis_api_external_observer_readiness.py::test_first_external_observer_gate_still_passes_local_scope
          test -z "$(git status --porcelain)"

      - name: Push verified workflow-free candidate
        run: |
          set -Eeuo pipefail
          test ! -e .github/workflows/p1-rebind-production-genesis.yml
          test -z "$(git status --porcelain)"
          git push origin HEAD:p1-revalidation-after-p0-20261005
