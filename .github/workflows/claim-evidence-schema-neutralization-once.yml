name: Claim Evidence Schema Neutralization Once

on:
  push:
    branches:
      - claim-evidence-schema-neutralization

permissions:
  contents: write

concurrency:
  group: claim-evidence-schema-neutralization-once
  cancel-in-progress: false

jobs:
  neutralize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: claim-evidence-schema-neutralization

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked backend dependencies
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Apply, regenerate, validate, and push
        run: bash scripts/claim-evidence-schema-neutralization-once.sh
