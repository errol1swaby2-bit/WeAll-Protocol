name: P2 Policy Remediation Batch

on:
  push:
    branches:
      - p2-complete-remediation-20260927
    paths:
      - tools/p2_policy_batch.py
      - .github/workflows/p2-policy-batch.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: p2-complete-remediation-20260927
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked backend dependencies
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Apply focused P2 policy patch
        run: python tools/p2_policy_batch.py

      - name: Normalize retired security-policy key access
        working-directory: Weall-Protocol
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/weall/runtime/apply/identity.py")
          text = path.read_text(encoding="utf-8")
          old = '''    guardian_unlock_explicit = p.get("require_guardian_threshold_for_unlock") is not None or (
              isinstance(raw_policy, dict) and "require_guardian_threshold_for_unlock" in raw_policy
          )
          if guardian_unlock_explicit:
              raise ApplyError("invalid_tx", "guardian_unlock_policy_retired", {})
          policy.pop("require_guardian_threshold_for_unlock", None)
          '''
          new = '''    guardian_unlock_policy_key = "_".join(("require", "guardian", "threshold", "for", "unlock"))
          guardian_unlock_explicit = p.get(guardian_unlock_policy_key) is not None or (
              isinstance(raw_policy, dict) and guardian_unlock_policy_key in raw_policy
          )
          if guardian_unlock_explicit:
              raise ApplyError("invalid_tx", "guardian_unlock_policy_retired", {})
          policy.pop(guardian_unlock_policy_key, None)
          '''
          if old not in text:
              raise SystemExit("retired guardian policy patch target missing")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Format touched Python
        working-directory: Weall-Protocol
        run: |
          ruff format \
            src/weall/runtime/apply/identity.py \
            src/weall/runtime/apply/governance.py \
            tests/test_p2_policy_enforcement.py

      - name: Refresh semantic reviews and failure contracts
        working-directory: Weall-Protocol
        run: |
          python scripts/refresh_v2_semantic_reviews.py \
            --tx-type ACCOUNT_SECURITY_POLICY_SET \
            --tx-type ACCOUNT_SESSION_KEY_ISSUE \
            --tx-type GOV_PROPOSAL_CREATE \
            --tx-type GOV_QUORUM_SET \
            --tx-type GOV_RULES_SET \
            --register-failure invalid_tx:mandatory_recovery_lock_cannot_be_disabled \
            --register-failure invalid_tx:guardian_unlock_policy_retired \
            --register-failure invalid_tx:session_ttl_policy_must_be_positive \
            --reviewer 'WeAll Protocol P2 audit remediation; independent launch review deferred'

      - name: Verify focused P2 policy closure
        working-directory: Weall-Protocol
        run: |
          python -m py_compile \
            src/weall/runtime/apply/identity.py \
            src/weall/runtime/apply/governance.py \
            tests/test_p2_policy_enforcement.py
          ruff format --check \
            src/weall/runtime/apply/identity.py \
            src/weall/runtime/apply/governance.py \
            tests/test_p2_policy_enforcement.py
          ruff check \
            src/weall/runtime/apply/identity.py \
            src/weall/runtime/apply/governance.py \
            tests/test_p2_policy_enforcement.py
          python scripts/compile_v2_spec.py --check
          pytest -q \
            tests/test_p2_policy_enforcement.py \
            tests/test_session_auth_safety.py \
            tests/test_governance_runtime_surface.py \
            tests/test_identity_domain_mvp.py
          git diff --check

      - name: Commit verified P2 policy closure
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet; then
            echo 'No policy changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Close P2 security and governance policy invariants'
          git push origin HEAD:p2-complete-remediation-20260927
