name: P0 helper close deterministic and receipt evidence tracks

on:
  push:
    branches:
      - p0-tooling-exact-v2-refresh-20261001
    paths:
      - .github/workflows/p0-helper-close-evidence-tracks.yml

permissions:
  contents: write

jobs:
  validate-evidence-tracks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p0-evidence-closure-a10-a12-vectors-20261001
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          check-latest: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked backend and frontend dependencies
        run: |
          set -Eeuo pipefail
          cd Weall-Protocol
          python -m pip install --upgrade 'pip==26.2.1'
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps
          cd ../web
          npm ci

      - name: Add P0-02 scheduler breadth and P0-04 follower receipt evidence
        run: |
          set -Eeuo pipefail
          cat > Weall-Protocol/tests/test_p0_scheduler_and_receipt_breadth_closure.py <<'PYTEST'
          from __future__ import annotations

          import copy
          from pathlib import Path

          import pytest

          from weall.runtime.executor import WeAllExecutor
          from weall.runtime.poh.async_scheduler import schedule_poh_async_system_txs
          from weall.runtime.poh.live_scheduler import schedule_poh_live_system_txs
          from weall.runtime.poh.tier2_scheduler import schedule_poh_tier2_system_txs
          from weall.runtime.scheduler_pipeline import (
              run_leader_pre_schedulers,
              run_replay_pre_schedulers,
          )
          from weall.runtime.state_hash import compute_state_root


          def _reviewer_record() -> dict:
              return {
                  "active": True,
                  "responsibilities": {
                      "reviewer": {
                          "poh_async_review": {"opted_in": True, "active": True},
                          "poh_live_review": {"opted_in": True, "active": True},
                      }
                  },
              }


          def _accounts(order: tuple[str, ...]) -> dict:
              records = {
                  "@alice": {"poh_tier": 1, "reputation_milli": 0},
                  "@bob": {"poh_tier": 1, "reputation_milli": 0},
                  "@j1": {"poh_tier": 2, "reputation_milli": 5000},
                  "@j2": {"poh_tier": 2, "reputation_milli": 5000},
                  "@j3": {"poh_tier": 2, "reputation_milli": 5000},
              }
              return {account_id: copy.deepcopy(records[account_id]) for account_id in order}


          def _roles(order: tuple[str, ...]) -> dict:
              return {
                  "jurors": {
                      "by_id": {account_id: _reviewer_record() for account_id in order},
                      "active_set": sorted(order),
                  }
              }


          def _base_state(
              *,
              account_order: tuple[str, ...],
              reviewer_order: tuple[str, ...],
          ) -> dict:
              return {
                  "height": 10,
                  "tip": "b10",
                  "tip_hash": "b10",
                  "accounts": _accounts(account_order),
                  "roles": _roles(reviewer_order),
                  "params": {
                      "poh": {
                          "async_n_jurors": 3,
                          "async_min_reviews": 3,
                          "async_approval_threshold": 2,
                          "async_rejection_threshold": 2,
                          "async_min_rep_milli": 0,
                          "tier2_n_jurors": 3,
                          "tier2_min_total_reviews": 3,
                          "tier2_pass_threshold": 2,
                          "tier2_fail_max": 1,
                          "tier2_min_rep_milli": 0,
                          "live_min_rep_milli": 0,
                          "live_partial_panels_enabled": True,
                      }
                  },
                  "system_queue": [],
              }


          def _assignment_state(
              case_order: tuple[str, str],
              *,
              account_order: tuple[str, ...],
              reviewer_order: tuple[str, ...],
          ) -> dict:
              state = _base_state(account_order=account_order, reviewer_order=reviewer_order)
              async_cases = {}
              tier2_cases = {}
              live_cases = {}
              for case_id in case_order:
                  account_id = "@alice" if case_id == "case-a" else "@bob"
                  async_cases[case_id] = {
                      "case_id": case_id,
                      "account_id": account_id,
                      "status": "open",
                      "followup_round": 0,
                      "evidence_binds": {"bind-1": {"followup_round": 0}},
                      "assigned_juror_count": 3,
                      "assigned_jurors": [],
                  }
                  tier2_cases[case_id] = {
                      "case_id": case_id,
                      "account_id": account_id,
                      "status": "open",
                      "jurors": {},
                  }
                  live_cases[case_id] = {
                      "case_id": case_id,
                      "account_id": account_id,
                      "status": "open",
                      "jurors": {},
                  }
              state["poh"] = {
                  "async_cases": async_cases,
                  "tier2_cases": tier2_cases,
                  "live_cases": live_cases,
              }
              return state


          def _finalize_state(case_order: tuple[str, str]) -> dict:
              state = _base_state(
                  account_order=("@alice", "@bob", "@j1", "@j2", "@j3"),
                  reviewer_order=("@j1", "@j2", "@j3"),
              )
              async_cases = {}
              tier2_cases = {}
              live_cases = {}
              for case_id in case_order:
                  account_id = "@alice" if case_id == "case-a" else "@bob"
                  async_cases[case_id] = {
                      "case_id": case_id,
                      "account_id": account_id,
                      "status": "under_review",
                      "followup_round": 0,
                      "evidence_binds": {"bind-1": {"followup_round": 0}},
                      "assigned_juror_count": 3,
                      "assigned_jurors": ["@j1", "@j2", "@j3"],
                      "minimum_reviews": 3,
                      "approval_threshold": 2,
                      "rejection_threshold": 2,
                      "reviews": {
                          "@j1": {"followup_round": 0, "verdict": "approve"},
                          "@j2": {"followup_round": 0, "verdict": "approve"},
                          "@j3": {"followup_round": 0, "verdict": "reject"},
                      },
                  }
                  tier2_cases[case_id] = {
                      "case_id": case_id,
                      "account_id": account_id,
                      "status": "under_review",
                      "jurors": {
                          "@j1": {"verdict": "pass"},
                          "@j2": {"verdict": "pass"},
                          "@j3": {"verdict": "fail"},
                      },
                  }
                  live_cases[case_id] = {
                      "case_id": case_id,
                      "account_id": account_id,
                      "status": "open",
                      "jurors": {
                          "@j1": {
                              "role": "interacting",
                              "accepted": True,
                              "attended": True,
                              "verdict": "pass",
                          },
                          "@j2": {
                              "role": "interacting",
                              "accepted": True,
                              "attended": True,
                              "verdict": "pass",
                          },
                      },
                  }
              state["poh"] = {
                  "async_cases": async_cases,
                  "tier2_cases": tier2_cases,
                  "live_cases": live_cases,
              }
              return state


          def _queue_projection(state: dict) -> list[tuple[str, str]]:
              out: list[tuple[str, str]] = []
              for item in state.get("system_queue", []):
                  if not isinstance(item, dict):
                      continue
                  payload = item.get("payload")
                  payload = payload if isinstance(payload, dict) else {}
                  out.append(
                      (
                          str(item.get("tx_type") or ""),
                          str(payload.get("case_id") or ""),
                      )
                  )
              return out


          @pytest.mark.parametrize(
              "scheduler",
              [
                  schedule_poh_async_system_txs,
                  schedule_poh_tier2_system_txs,
                  schedule_poh_live_system_txs,
              ],
          )
          def test_p0_02_equal_root_assignment_permutations_schedule_identical_work(
              scheduler,
          ) -> None:
              """A04-F001/A16-F003: assignment cannot consume JSON insertion order."""

              state_a = _assignment_state(
                  ("case-a", "case-b"),
                  account_order=("@alice", "@bob", "@j1", "@j2", "@j3"),
                  reviewer_order=("@j1", "@j2", "@j3"),
              )
              state_b = _assignment_state(
                  ("case-b", "case-a"),
                  account_order=("@j3", "@j2", "@j1", "@bob", "@alice"),
                  reviewer_order=("@j3", "@j2", "@j1"),
              )

              assert compute_state_root(state_a) == compute_state_root(state_b)

              scheduler(state_a, next_height=11)
              scheduler(state_b, next_height=11)

              assert state_a["system_queue"] == state_b["system_queue"]
              assert compute_state_root(state_a) == compute_state_root(state_b)
              projection = _queue_projection(state_a)
              assert projection
              assert [case_id for _tx_type, case_id in projection] == sorted(
                  case_id for _tx_type, case_id in projection
              )


          @pytest.mark.parametrize(
              "scheduler",
              [
                  schedule_poh_async_system_txs,
                  schedule_poh_tier2_system_txs,
                  schedule_poh_live_system_txs,
              ],
          )
          def test_p0_02_equal_root_finalize_permutations_schedule_identical_work(
              scheduler,
          ) -> None:
              """A04-F001/A16-F003: finalize/receipt work is equal-root deterministic."""

              state_a = _finalize_state(("case-a", "case-b"))
              state_b = _finalize_state(("case-b", "case-a"))

              assert compute_state_root(state_a) == compute_state_root(state_b)

              scheduler(state_a, next_height=11)
              scheduler(state_b, next_height=11)

              assert state_a["system_queue"] == state_b["system_queue"]
              assert compute_state_root(state_a) == compute_state_root(state_b)
              projection = _queue_projection(state_a)
              assert projection
              assert [case_id for _tx_type, case_id in projection] == sorted(
                  case_id for _tx_type, case_id in projection
              )


          def test_p0_02_equal_root_poh_pipeline_matches_leader_and_replay() -> None:
              """A04-F001/A16-F003/A18-F001: leader/replay derive identical PoH work."""

              leader = _finalize_state(("case-a", "case-b"))
              follower = _finalize_state(("case-b", "case-a"))

              assert compute_state_root(leader) == compute_state_root(follower)

              run_leader_pre_schedulers(leader, next_height=11)
              run_replay_pre_schedulers(follower, next_height=11)

              assert leader == follower
              assert compute_state_root(leader) == compute_state_root(follower)
              assert _queue_projection(leader)


          def _repo_root() -> Path:
              return Path(__file__).resolve().parents[1]


          def _executor(tmp_path: Path, name: str) -> WeAllExecutor:
              return WeAllExecutor(
                  db_path=str(tmp_path / f"{name}.db"),
                  node_id=f"@{name}",
                  chain_id="p0-a06-follower-closure",
                  tx_index_path=str(_repo_root() / "generated" / "tx_index.json"),
              )


          def test_p0_04_follower_rejects_receipt_body_tamper_and_restart_preserves_canonical_block(
              tmp_path: Path,
          ) -> None:
              """A06-F001/A16-F002: replay/readback binds canonical receipts."""

              leader = _executor(tmp_path, "leader")
              submitted = leader.submit_tx(
                  {
                      "tx_type": "ACCOUNT_REGISTER",
                      "signer": "@alice",
                      "nonce": 1,
                      "payload": {"pubkey": "k:@alice"},
                  }
              )
              assert submitted["ok"] is True
              produced = leader.produce_block(max_txs=1)
              assert produced.ok is True
              canonical = leader.get_block_by_height(1)
              assert isinstance(canonical, dict)
              assert isinstance(canonical.get("receipts"), list)
              assert canonical["receipts"]

              forged = copy.deepcopy(canonical)
              forged["receipts"][0]["signer"] = "@forged"

              follower = _executor(tmp_path, "follower")
              before = copy.deepcopy(follower.state)
              rejected = follower.apply_block(forged)
              assert rejected.ok is False
              assert follower.state == before
              assert follower.get_block_by_height(1) is None

              accepted = follower.apply_block(copy.deepcopy(canonical))
              assert accepted.ok is True
              assert follower.get_block_by_height(1) == canonical
              assert compute_state_root(follower.state) == compute_state_root(leader.state)

              restarted = _executor(tmp_path, "follower")
              assert restarted.get_block_by_height(1) == canonical
              assert compute_state_root(restarted.state) == compute_state_root(leader.state)
          PYTEST

          cd Weall-Protocol
          ruff format tests/test_p0_scheduler_and_receipt_breadth_closure.py
          ruff check tests/test_p0_scheduler_and_receipt_breadth_closure.py
          ruff format --check tests/test_p0_scheduler_and_receipt_breadth_closure.py

      - name: Prove P0-01 P0-02 P0-04 P0-08 P0-09 focused closure matrix
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          pytest -q \
            tests/test_nonce_failure_block_progression.py \
            tests/test_p0_scheduler_and_receipt_breadth_closure.py \
            tests/test_p0_restart_and_poh_privacy_closure.py \
            tests/test_p0_a10_treasury_restart_replay.py \
            tests/test_p0_a10_a12_generated_contract_closure.py \
            tests/test_p0_a12_generated_vector_runtime_truth.py \
            tests/test_p0_group_treasury_governance_binding.py \
            tests/test_p0_governance_economics_closure.py \
            tests/test_p0_a01_a20_closure_regressions.py

      - name: Update exact P0 closure status ledger
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/audit/WeAll-A01-A20-P0-Closure-Status-20260930.md")
          text = path.read_text(encoding="utf-8")
          text = text.replace("Umbrella PR: #33", "Canonical closure PR: #36", 1)

          replacements = {
              "P0-01 Canonical transaction identity / replay": (
                  "CLOSED — PATCHED AND PROVEN",
                  "Failed canonical inclusion consumes nonce and immutable tx identity; resubmission is rejected on leader, follower, and restarted follower with equal state roots. Focused lifecycle evidence plus exact-head full-suite/reviewer gates are required before push.",
              ),
              "P0-02 Equal-root deterministic execution": (
                  "CLOSED — PATCHED AND PROVEN",
                  "Async/Tier-2/Live case maps and reviewer pools are canonically ordered. Equal-root permutations now cover receipt-only, assignment, finalize/receipt, and leader-vs-replay scheduler-pipeline parity. Public/generated claims are refreshed only after the proof. Generalized same-tree audit-to-claim binding remains separately tracked under P0-12.",
              ),
              "P0-04 Follower receipt canonicality": (
                  "CLOSED — PATCHED AND PROVEN",
                  "Follower apply rejects a tampered receipt body without state movement, accepts the canonical block, and restart/readback preserves the exact canonical block and state root. State-sync tamper/restart coverage remains as a second path.",
              ),
              "P0-08 Economics activation / treasury governance binding": (
                  "CLOSED — PATCHED AND PROVEN",
                  "Locked economics cannot schedule value execution; production enablement runs readiness preconditions; group treasury requires governance approval bound to the immutable spend plan; approved queue-to-apply value movement is one-shot across restart/replay and mutation is rejected.",
              ),
              "P0-09 PoH API authorization/privacy": (
                  "CLOSED — PATCHED AND PROVEN",
                  "All six scoped account/juror queues and Tier-2/Live full-case reads are session/principal or participant bound. Anonymous, wrong-principal, and authorized runtime matrices pass, and all protected surfaces are represented by current generated auth/privacy vectors executed against runtime truth.",
              ),
          }

          lines = text.splitlines()
          seen = set()
          for index, line in enumerate(lines):
              if not line.startswith("| P0-"):
                  continue
              cells = [cell.strip() for cell in line.strip().strip("|").split("|")]
              if len(cells) != 4 or cells[0] not in replacements:
                  continue
              status, detail = replacements[cells[0]]
              cells[2] = status
              cells[3] = detail
              lines[index] = "| " + " | ".join(cells) + " |"
              seen.add(cells[0])
          assert seen == set(replacements), (seen, set(replacements))
          text = "\n".join(lines) + "\n"

          text = text.replace(
              "PR #33 remains a draft and MUST NOT be converted to merge-ready",
              "PR #36 remains the single canonical closure PR and MUST NOT be represented as fully P0-closed or merge-ready",
              1,
          )

          marker = "## Next implementation order\n"
          assert marker in text
          prefix = text.split(marker, 1)[0]
          next_order = """## Next implementation order

          1. Finish P0-07 A09-F004 only where Genesis Constitution Article XIII is mechanically explicit; protected-right amendments remain fail-closed until the stricter normative threshold/process is defined.
          2. Implement the architecture-heavy P0-03 HotStuff transition, P0-05 P2P session/frame, and P0-10 bounded-state/state-sync tracks with adversarial multinode or stress evidence.
          3. Adjudicate P0-06 A08/A20 together so global human uniqueness and reviewer anti-grinding share one coherent protocol trust model.
          4. Install P0-11's locked property/mutation gate with deterministic seeds and survivor artifacts across the closed and remaining P0 surfaces.
          5. Implement P0-12 generalized same-tree audit-finding-to-claim binding, regenerate exact-head public evidence, and capture the final closure SHA/tree only after all remaining HIGH findings are actually resolved.
          """
          path.write_text(prefix + next_order, encoding="utf-8")
          PY

      - name: Refresh exact claims and V2 derivatives
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          PYTHONPATH=src python scripts/gen_current_verified_claims.py
          PYTHONPATH=src python scripts/compile_v2_spec.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          python scripts/check_generated.py
          python scripts/check_public_claim_freshness.py

      - name: Commit only bounded closure evidence changes
        run: |
          set -Eeuo pipefail
          BAD="$(git status --short --untracked-files=all | awk '{p=$2; if (p != "Weall-Protocol/tests/test_p0_scheduler_and_receipt_breadth_closure.py" && p != "docs/audit/WeAll-A01-A20-P0-Closure-Status-20260930.md" && p != "Weall-Protocol/generated/current_verified_claims.json" && p != "Weall-Protocol/docs/CURRENT_VERIFIED_CLAIMS.md" && p != "web/src/generated/protocolStatus.ts" && p !~ /^Weall-Protocol\/generated\/v2\//) print}')"
          if [[ -n "$BAD" ]]; then
            echo 'Unexpected P0 closure evidence changes:' >&2
            printf '%s\n' "$BAD" >&2
            exit 1
          fi
          git add \
            Weall-Protocol/tests/test_p0_scheduler_and_receipt_breadth_closure.py \
            docs/audit/WeAll-A01-A20-P0-Closure-Status-20260930.md \
            Weall-Protocol/generated/current_verified_claims.json \
            Weall-Protocol/docs/CURRENT_VERIFIED_CLAIMS.md \
            Weall-Protocol/generated/v2 \
            web/src/generated/protocolStatus.ts
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'test(p0): prove replay determinism receipt and privacy closure tracks'
          fi
          test -z "$(git status --short --untracked-files=all)"

      - name: Verify exact committed generated state
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python scripts/check_generated.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          python scripts/check_v2_spec_clean_checkout.py
          python scripts/gen_current_verified_claims.py --check
          python scripts/check_public_claim_freshness.py
          PYTHONDONTWRITEBYTECODE=1 python scripts/check_v15_public_readiness_artifacts.py

      - name: Restore historical M2/M3 closure evidence
        run: |
          set -Eeuo pipefail
          bash scripts/restore_m2_m3_evidence_from_git.sh --destination "${GITHUB_WORKSPACE}"

      - name: Full pytest
        working-directory: Weall-Protocol
        run: pytest -q

      - name: Reviewer readiness gate
        env:
          WEALL_RELEASE_TREE_ALREADY_VERIFIED: "1"
        run: |
          set -Eeuo pipefail
          cd Weall-Protocol
          bash scripts/reviewer_production_readiness_gate.sh

      - name: Push validated product evidence branch
        run: |
          set -Eeuo pipefail
          git push origin HEAD:p0-evidence-closure-a10-a12-vectors-20261001

# Branch-only helper on the closed #35 tooling branch. Never merge into product history.
