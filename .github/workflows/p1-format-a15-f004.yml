name: P1 Format A15 F004 Health

on:
  push:
    branches:
      - p1-revalidation-after-p0-20261005
    paths:
      - .github/workflows/p1-format-a15-f004.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p1-revalidation-after-p0-20261005
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dev environment
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Format and verify A15-F004 regression
        working-directory: Weall-Protocol
        run: |
          FILES=(
            src/weall/runtime/sqlite_db.py
            src/weall/runtime/diagnostics.py
            src/weall/runtime/executor.py
            src/weall/api/routes_public_parts/health.py
            tests/test_p1_a15_health_bounded_telemetry.py
          )
          ruff check --fix "${FILES[@]}"
          ruff format "${FILES[@]}"
          ruff check "${FILES[@]}"
          ruff format --check "${FILES[@]}"
          pytest -q tests/test_p1_a15_health_bounded_telemetry.py

      - name: Commit formatted workflow-free tree
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/p1-format-a15-f004.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No A15-F004 format diff produced'; exit 1; }
          git diff --check --cached
          git commit -m 'style: format A15 bounded health telemetry'
          git push origin HEAD:p1-revalidation-after-p0-20261005
