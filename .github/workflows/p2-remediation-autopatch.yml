name: P2 Remediation Autopatch

on:
  push:
    branches:
      - p2-complete-remediation-20260927
    paths:
      - tools/p2_autopatch.py
      - .github/workflows/p2-remediation-autopatch.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: p2-complete-remediation-20260927
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked backend dependencies
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Apply deterministic patch
        run: python tools/p2_autopatch.py

      - name: Format P2-touched Python
        working-directory: Weall-Protocol
        run: |
          ruff format \
            src/weall/runtime/apply/rewards.py \
            src/weall/runtime/sqlite_db.py \
            src/weall/net/state_sync.py \
            src/weall/runtime/apply/roles.py \
            src/weall/runtime/node_operator_responsibilities.py \
            src/weall/runtime/apply/treasury.py \
            src/weall/runtime/apply/groups.py \
            tests/test_reward_issuance_invariants.py \
            tests/test_p2_persistence_synchronous.py \
            tests/test_p2_state_sync_hardening.py \
            tests/test_p2_scoped_authority_repairs.py

      - name: Register new group audit-anchor state identifiers
        working-directory: Weall-Protocol
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path("specs/v2/source/stable_ids.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          entries = payload["entries"]
          by_key = {
              (str(row.get("kind") or ""), str(row.get("canonical_key") or "")): row
              for row in entries
              if isinstance(row, dict)
          }
          known_ids = {
              str(row.get("stable_id") or "")
              for row in entries
              if isinstance(row, dict)
          }
          for canonical_key in (
              "Groups:anchor",
              "Groups:set_at_nonce",
              "Groups:treasury_audit_anchors",
          ):
              expected = "STATE-" + hashlib.sha256(canonical_key.encode("utf-8")).hexdigest()[:16].upper()
              existing = by_key.get(("state", canonical_key))
              if existing is not None:
                  if str(existing.get("stable_id") or "") != expected:
                      raise SystemExit(
                          f"state stable ID mismatch for {canonical_key}: "
                          f"expected {expected}, found {existing.get('stable_id')}"
                      )
                  continue
              if expected in known_ids:
                  raise SystemExit(f"state stable ID collision for {canonical_key}: {expected}")
              row = {
                  "aliases": [],
                  "canonical_key": canonical_key,
                  "kind": "state",
                  "stable_id": expected,
                  "status": "active",
              }
              entries.append(row)
              by_key[("state", canonical_key)] = row
              known_ids.add(expected)
          entries.sort(key=lambda row: str(row.get("stable_id") or ""))
          path.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY

      - name: Refresh explicitly reviewed V2 transaction semantics
        working-directory: Weall-Protocol
        run: |
          python scripts/refresh_v2_semantic_reviews.py \
            --tx-type BLOCK_REWARD_DISTRIBUTE \
            --tx-type FORFEITURE_APPLY \
            --tx-type ROLE_NODE_OPERATOR_ENROLL \
            --tx-type NODE_OPERATOR_HELPER_OPT_IN \
            --tx-type NODE_OPERATOR_RESPONSIBILITY_UPDATE \
            --tx-type TREASURY_SIGNER_ADD \
            --tx-type TREASURY_SIGNER_REMOVE \
            --tx-type GROUP_TREASURY_AUDIT_ANCHOR_SET \
            --register-failure invalid_payload:helper_reputation_threshold_policy_mismatch \
            --register-failure invalid_state:treasury_signer_authority_missing \
            --register-failure forbidden:signer_must_be_seated_emissary \
            --register-failure invalid_state:threshold_exceeds_signer_set \
            --register-failure forbidden:signer_removal_would_break_threshold \
            --register-failure invalid_state:treasury_signer_not_seated_emissary \
            --register-failure invalid_payload:missing_anchor \
            --reviewer 'WeAll Protocol P2 audit remediation; independent launch review deferred'

      - name: Verify focused P2 repairs
        working-directory: Weall-Protocol
        run: |
          python -m py_compile \
            src/weall/runtime/apply/rewards.py \
            src/weall/runtime/sqlite_db.py \
            src/weall/net/state_sync.py \
            src/weall/runtime/apply/roles.py \
            src/weall/runtime/node_operator_responsibilities.py \
            src/weall/runtime/apply/treasury.py \
            src/weall/runtime/apply/groups.py \
            tests/test_reward_issuance_invariants.py \
            tests/test_p2_persistence_synchronous.py \
            tests/test_p2_state_sync_hardening.py \
            tests/test_p2_scoped_authority_repairs.py
          ruff format --check \
            src/weall/runtime/apply/rewards.py \
            src/weall/runtime/sqlite_db.py \
            src/weall/net/state_sync.py \
            src/weall/runtime/apply/roles.py \
            src/weall/runtime/node_operator_responsibilities.py \
            src/weall/runtime/apply/treasury.py \
            src/weall/runtime/apply/groups.py \
            tests/test_reward_issuance_invariants.py \
            tests/test_p2_persistence_synchronous.py \
            tests/test_p2_state_sync_hardening.py \
            tests/test_p2_scoped_authority_repairs.py
          ruff check \
            src/weall/runtime/apply/rewards.py \
            src/weall/runtime/sqlite_db.py \
            src/weall/net/state_sync.py \
            src/weall/runtime/apply/roles.py \
            src/weall/runtime/node_operator_responsibilities.py \
            src/weall/runtime/apply/treasury.py \
            src/weall/runtime/apply/groups.py \
            tests/test_reward_issuance_invariants.py \
            tests/test_p2_persistence_synchronous.py \
            tests/test_p2_state_sync_hardening.py \
            tests/test_p2_scoped_authority_repairs.py
          python scripts/compile_v2_spec.py --check
          pytest -q \
            tests/test_reward_issuance_invariants.py \
            tests/test_p2_persistence_synchronous.py \
            tests/test_p2_state_sync_hardening.py \
            tests/test_p2_scoped_authority_repairs.py
          git diff --check

      - name: Commit repaired runtime, semantic bindings, and derivatives
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet; then
            echo 'No repair changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Repair P2 CI formatting and semantic bindings'
          git push origin HEAD:p2-complete-remediation-20260927
