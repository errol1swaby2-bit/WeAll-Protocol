name: Refresh Claim Hygiene Artifacts Once

on:
  push:
    branches:
      - claim-hygiene-neutral-language
    paths:
      - '.github/workflows/refresh-claim-hygiene-artifacts-once.yml'
      - 'Weall-Protocol/tests/prod/test_readme_to_implementation_traceability.py'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: claim-hygiene-neutral-language
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked backend dependencies
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Refresh dependent artifacts in established order
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          PYTHONPATH=src:scripts python scripts/gen_public_only_protocol_audit_v1_5.py
          PYTHONPATH=src:scripts python scripts/gen_public_beta_blocker_report_v1_5.py
          PYTHONPATH=src python scripts/gen_release_evidence_manifest_v1_5.py
          PYTHONPATH=src python scripts/gen_current_verified_claims.py
          PYTHONPATH=src python scripts/compile_v2_spec.py

      - name: Verify refreshed artifacts and targeted test
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python scripts/check_generated.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          python scripts/check_v2_spec_clean_checkout.py
          PYTHONDONTWRITEBYTECODE=1 python scripts/check_v15_public_readiness_artifacts.py
          python scripts/check_public_claim_freshness.py
          python scripts/gen_current_verified_claims.py --check
          PYTHONPATH=src python -m pytest -q tests/prod/test_readme_to_implementation_traceability.py

      - name: Commit refreshed derivatives and remove one-shot workflow
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/refresh-claim-hygiene-artifacts-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Refresh generated artifacts after claim hygiene test alignment'
          git push origin HEAD:claim-hygiene-neutral-language
