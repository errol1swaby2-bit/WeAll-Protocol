name: Refresh Claim Hygiene Artifacts Once

on:
  push:
    branches:
      - claim-hygiene-neutral-language
    paths:
      - '.github/workflows/refresh-claim-hygiene-artifacts-once.yml'
      - 'Weall-Protocol/tests/prod/test_readme_to_implementation_traceability.py'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: claim-hygiene-neutral-language
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked backend dependencies
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Build final tree and refresh dependent artifacts
        run: |
          set -Eeuo pipefail

          # The one-shot workflow itself is part of the compiler source inventory.
          # Remove it before regeneration so artifacts describe the final tree.
          rm -f .github/workflows/refresh-claim-hygiene-artifacts-once.yml

          cd Weall-Protocol
          PYTHONPATH=src:scripts python scripts/gen_public_only_protocol_audit_v1_5.py
          PYTHONPATH=src:scripts python scripts/gen_public_beta_blocker_report_v1_5.py
          PYTHONPATH=src python scripts/gen_release_evidence_manifest_v1_5.py
          PYTHONPATH=src python scripts/gen_current_verified_claims.py
          PYTHONPATH=src python scripts/compile_v2_spec.py
          cd ..

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Refresh generated artifacts after claim hygiene test alignment'

      - name: Verify exact local final commit
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python scripts/check_generated.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          python scripts/check_v2_spec_clean_checkout.py
          PYTHONDONTWRITEBYTECODE=1 python scripts/check_v15_public_readiness_artifacts.py
          python scripts/check_public_claim_freshness.py
          python scripts/gen_current_verified_claims.py --check
          PYTHONPATH=src python scripts/check_reviewer_truth_boundaries.py
          ruff format --check scripts/check_public_claim_freshness.py tests/prod/test_readme_to_implementation_traceability.py tests/test_release_docs_truth_sync.py
          ruff check scripts/check_public_claim_freshness.py tests/prod/test_readme_to_implementation_traceability.py tests/test_release_docs_truth_sync.py
          PYTHONPATH=src python -m pytest -q \
            tests/prod/test_readme_to_implementation_traceability.py \
            tests/test_release_docs_truth_sync.py \
            tests/test_reviewer_language_cleanup.py \
            tests/test_public_readiness_artifacts_v15.py

      - name: Push verified final commit
        run: |
          set -Eeuo pipefail
          git status --short
          git push origin HEAD:claim-hygiene-neutral-language
