name: PR38 Documentation Truth Cleanup

on:
  push:
    branches: ["p0-03-production-closure-staging-20261001"]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: p0-03-production-closure-staging-20261001

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify bounded temporary lineage
        run: |
          set -Eeuo pipefail
          BASE=e4762faaacc24f169a2fc5f99d3dc1f2435e75ec
          git merge-base --is-ancestor "$BASE" HEAD
          unexpected="$(git diff --name-only "$BASE"..HEAD | grep -Ev '^\.github/(workflows/pr38-documentation-truth-cleanup\.yml|scripts/pr38_documentation_truth_cleanup\.py)$' || true)"
          test -z "$unexpected" || { printf 'Unexpected pre-cleanup paths:\n%s\n' "$unexpected"; exit 1; }

      - name: Reconcile reviewer-facing documentation truth
        run: |
          set -Eeuo pipefail
          python .github/scripts/pr38_documentation_truth_cleanup.py
          rm -f .github/workflows/pr38-documentation-truth-cleanup.yml
          rm -f .github/scripts/pr38_documentation_truth_cleanup.py
          git diff --check

      - name: Install locked backend
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Regenerate same-tree current claims
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python scripts/gen_current_verified_claims.py
          python scripts/gen_current_verified_claims.py --check

      - name: Compile V2 derivatives against workflow-free documentation tree
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python scripts/compile_v2_spec.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check

      - name: Validate documentation, generated claims, and V2 freshness
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python scripts/check_generated.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          PYTHONDONTWRITEBYTECODE=1 python scripts/check_v15_public_readiness_artifacts.py
          python scripts/check_public_claim_freshness.py
          python scripts/gen_current_verified_claims.py --check
          python scripts/check_reviewer_truth_boundaries.py
          python scripts/check_release_hygiene_v1_5.py
          pytest -q \
            tests/test_current_document_registry.py \
            tests/test_release_docs_truth_sync.py \
            tests/test_reviewer_language_cleanup.py \
            tests/test_current_verified_claims_fail_closed.py \
            tests/test_current_verified_claims_p0_scope_closed_status.py \
            tests/test_p0_claim_audit_binding.py \
            tests/prod/test_public_beta_evidence_gates.py \
            tests/prod/test_public_observer_testnet_readiness_docs.py \
            tests/test_public_readiness_artifacts_v15.py

      - name: Re-run P0 assurance on documentation-only reconciled tree
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python tests/p0_assurance.py gate --report /tmp/p0_assurance_report.json --timeout-seconds 120
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/p0_assurance_report.json').read_text())
          summary = payload.get('mutation_summary', {})
          gate = payload.get('gate', {})
          property_suite = payload.get('property_suite', {})
          assert summary.get('non_equivalent_total') == 15, summary
          assert summary.get('killed') == 15, summary
          assert summary.get('survived') == [], summary
          assert summary.get('invalid') == [], summary
          assert gate.get('passed') is True, gate
          assert property_suite.get('returncode') == 0, property_suite
          print(summary)
          PY

      - name: Full backend regression suite
        working-directory: Weall-Protocol
        run: pytest -q

      - name: Commit workflow-free documentation truth candidate
        run: |
          set -Eeuo pipefail
          test ! -e .github/workflows/pr38-documentation-truth-cleanup.yml
          test ! -e .github/scripts/pr38_documentation_truth_cleanup.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: reconcile reviewer-facing claim truth"

      - name: Exact-commit validation
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python scripts/check_generated.py
          python scripts/check_v2_spec_clean_checkout.py
          PYTHONDONTWRITEBYTECODE=1 python scripts/check_v15_public_readiness_artifacts.py
          python scripts/check_public_claim_freshness.py
          python scripts/gen_current_verified_claims.py --check
          git -C .. diff --exit-code
          git -C .. diff --cached --exit-code
          test -z "$(git -C .. status --porcelain)"

      - name: Push validated documentation truth candidate
        run: git push origin HEAD:p0-03-production-closure-staging-20261001
