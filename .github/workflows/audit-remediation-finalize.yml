name: Finalize audit remediation

on:
  push:
    branches: ["audit-remediation-20260929"]

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: audit-remediation-20260929
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Apply reviewed source repair in worktree
        working-directory: Weall-Protocol
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path("../.github/workflows/audit-remediation-recovery2.yml").read_text(encoding="utf-8")
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          code = textwrap.dedent(workflow[start:end])
          exec(compile(code, "audit-remediation-final-source-patch", "exec"), {"__name__": "__main__"})
          PY

      - name: Install locked backend toolchain
        working-directory: Weall-Protocol
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Format and lint repaired backend sources
        working-directory: Weall-Protocol
        shell: bash
        run: |
          ruff format \
            src/weall/runtime/apply/roles.py \
            src/weall/runtime/validator_transition_scheduler.py \
            src/weall/runtime/scheduler_pipeline.py \
            src/weall/api/routes_public_parts/health.py \
            scripts/compile_v2_spec.py \
            tests/test_readyz_block_loop_signals.py \
            tests/test_audit_remediation_validator_transitions.py \
            tests/test_audit_remediation_spec_compiler.py \
            tests/test_audit_remediation_readyz_truth.py
          ruff check \
            src/weall/runtime/apply/roles.py \
            src/weall/runtime/validator_transition_scheduler.py \
            src/weall/runtime/scheduler_pipeline.py \
            src/weall/api/routes_public_parts/health.py \
            scripts/compile_v2_spec.py \
            tests/test_readyz_block_loop_signals.py \
            tests/test_audit_remediation_validator_transitions.py \
            tests/test_audit_remediation_spec_compiler.py \
            tests/test_audit_remediation_readyz_truth.py

      - name: Regenerate transaction canon derivative
        working-directory: Weall-Protocol
        run: python scripts/gen_tx_index.py

      - name: Refresh only explicitly reviewed semantic bindings and V2 derivatives
        working-directory: Weall-Protocol
        shell: bash
        run: |
          python scripts/refresh_v2_semantic_reviews.py \
            --tx-type GOV_EXECUTE \
            --tx-type ROLE_NODE_OPERATOR_ACTIVATE \
            --tx-type VALIDATOR_READINESS_VERIFY \
            --tx-type ROLE_VALIDATOR_ACTIVATE \
            --reviewer "AI-assisted audit remediation requested by repository maintainer; not independent review" \
            --review-method "AI-assisted source review of authority/canonical-emission repair with targeted regression evidence"

      - name: Focused remediation tests and generation gates
        working-directory: Weall-Protocol
        shell: bash
        run: |
          pytest -q \
            tests/test_audit_remediation_validator_transitions.py \
            tests/test_audit_remediation_spec_compiler.py \
            tests/test_audit_remediation_readyz_truth.py \
            tests/test_validator_live_readiness_runner.py \
            tests/test_node_operator_auto_activation_and_responsibilities.py \
            tests/test_readyz_block_loop_signals.py \
            tests/test_v2_spec_compiler.py \
            tests/test_canonical_poh_eligibility_and_node_controls.py \
            tests/test_p2_final_source_closure.py
          python -m tooling.canon_lint
          python scripts/check_generated.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check

      - name: Full backend suite
        working-directory: Weall-Protocol
        run: pytest -q

      - name: Frontend install
        working-directory: web
        run: npm ci

      - name: Frontend typecheck and build
        working-directory: web
        shell: bash
        run: |
          npm run typecheck
          npm run build

      - name: Commit exact validated repair tree
        shell: bash
        run: |
          rm -f .github/workflows/audit-remediation-apply.yml
          rm -f .github/workflows/audit-remediation-recovery.yml
          rm -f .github/workflows/audit-remediation-recovery2.yml
          rm -f .github/workflows/audit-remediation-semantic-discovery.yml
          rm -f .github/workflows/audit-remediation-finalize.yml
          git status --short
          git config user.name "weall-audit-remediation-bot"
          git config user.email "weall-audit-remediation-bot@users.noreply.github.com"
          git add -A
          git commit -m "fix: repair validator reachability, canon, evidence, and readiness truth [audit-remediation-applied]"
          git push origin HEAD:audit-remediation-20260929
