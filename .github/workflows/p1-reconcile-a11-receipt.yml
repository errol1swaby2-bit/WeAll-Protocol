name: P1 Reconcile A11 Receipt Compatibility

on:
  push:
    branches:
      - p1-revalidation-after-p0-20261005
    paths:
      - .github/workflows/p1-reconcile-a11-receipt.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p1-revalidation-after-p0-20261005
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked backend environment
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Prove atomic fees and legacy receipt compatibility
        working-directory: Weall-Protocol
        run: |
          ruff format --check src/weall/runtime/apply/economics.py tests/test_p1_latest_medium_closure.py
          ruff check src/weall/runtime/apply/economics.py tests/test_p1_latest_medium_closure.py
          pytest -q             tests/test_p1_latest_medium_closure.py             tests/test_transfer_tip_contract.py             tests/test_civic_social_governance_fee_free_after_activation.py             tests/test_genesis_econ_lock_smoke.py             tests/test_economics_canon_apply_alignment.py

      - name: Remove temporary workflow from candidate tree
        run: |
          rm -f .github/workflows/p1-reconcile-a11-receipt.yml

      - name: Refresh BALANCE_TRANSFER semantic binding
        working-directory: Weall-Protocol
        run: |
          python scripts/refresh_v2_semantic_reviews.py             --tx-type BALANCE_TRANSFER             --reviewer "Errol Jacob Jones Swaby (maintainer-assisted P1 audit)"

      - name: Regenerate dependent evidence twice
        working-directory: Weall-Protocol
        run: |
          for round in 1 2; do
            echo "regeneration round $round"
            python scripts/gen_failure_code_registry_v1_5.py
            if [[ -f scripts/gen_api_response_vectors_v1_5.py ]]; then
              python scripts/gen_api_response_vectors_v1_5.py
            fi
            PYTHONPATH=src python scripts/compile_v2_spec.py
            python scripts/gen_b528_b532_completion_proof_v1_5.py
            python scripts/gen_b534_b538_completion_proof_v1_5.py
            python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py
            python scripts/gen_public_beta_blocker_report_v1_5.py
            python scripts/gen_release_evidence_manifest_v1_5.py
            python scripts/gen_current_verified_claims.py
          done

      - name: Commit workflow-free A11 compatibility candidate locally
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No A11 compatibility reconciliation diff produced'; exit 1; }
          git diff --check --cached
          git commit -m 'audit: reconcile A11 receipt compatibility evidence'
          echo "candidate_sha=$(git rev-parse HEAD)"
          echo "candidate_tree=$(git rev-parse HEAD^{tree})"
          test -z "$(git status --porcelain)"

      - name: Verify committed candidate
        working-directory: Weall-Protocol
        run: |
          python scripts/check_generated.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          python scripts/check_v2_spec_clean_checkout.py
          python scripts/gen_b528_b532_completion_proof_v1_5.py --check
          python scripts/gen_b534_b538_completion_proof_v1_5.py --check
          python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py --check
          PYTHONDONTWRITEBYTECODE=1 python scripts/check_v15_public_readiness_artifacts.py
          python scripts/check_public_claim_freshness.py
          python scripts/gen_current_verified_claims.py --check
          bash scripts/prod_chain_manifest_check.sh configs/chains/weall-genesis.json
          pytest -q             tests/test_p1_latest_medium_closure.py             tests/test_transfer_tip_contract.py             tests/test_civic_social_governance_fee_free_after_activation.py             tests/test_genesis_econ_lock_smoke.py             tests/test_economics_canon_apply_alignment.py
          test -z "$(git status --porcelain)"

      - name: Push verified workflow-free candidate
        run: |
          set -Eeuo pipefail
          test ! -e .github/workflows/p1-reconcile-a11-receipt.yml
          test -z "$(git status --porcelain)"
          git push origin HEAD:p1-revalidation-after-p0-20261005
