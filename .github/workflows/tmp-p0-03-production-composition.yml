name: Temporary P0-03 production composition

on:
  push:
    branches:
      - p0-03-production-closure-staging-20261001

permissions:
  contents: read

jobs:
  p0-03-production-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked backend dependencies
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps
      - name: Apply consolidated P0-03 runtime repair
        run: |
          set -Eeuo pipefail
          python .github/tmp-p0-03-runtime-repair.py
      - name: Instrument speculative execution in disposable checkout
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_p0_03_production_composition.py')
          s = p.read_text(encoding='utf-8')
          old = '''    assert b2["prev_block_id"] == b1["block_id"]\n    assert b2["justify_qc"]["block_id"] == b1["block_id"]\n\n    wrong = _signed_wrong_parent(\n'''
          new = '''    assert b2["prev_block_id"] == b1["block_id"]\n    assert b2["justify_qc"]["block_id"] == b1["block_id"]\n\n    from weall.runtime import bft_votecheck as _votecheck\n    from weall.runtime.bft_hotstuff import qc_from_json as _qc_from_json\n    probe_id = next(v for v in VALIDATORS if v != leader2)\n    probe = nodes[probe_id]\n    with _env(_prod_env(probe_id, pub=pubs[probe_id], priv=privs[probe_id])):\n        slot = _votecheck._acquire_spec_exec_slot(probe)\n        try:\n            clone = _votecheck._reset_spec_exec_slot(probe, slot)\n            seeded = _votecheck._seed_spec_exec_to_parent(probe, clone, str(b1["block_id"]))\n            meta = clone.apply_block(copy.deepcopy(b2)) if seeded else None\n        finally:\n            _votecheck._release_spec_exec_slot(probe, slot)\n        smap = probe._bft_speculative_blocks_map()\n        smap[str(b2["block_id"])] = {\n            "height": int(b2.get("height") or 0),\n            "prev_block_id": str(b2.get("prev_block_id") or ""),\n            "block_hash": str(b2.get("block_hash") or ""),\n        }\n        can_vote = probe._bft.can_vote_for(blocks=smap, block_id=str(b2["block_id"]), justify_qc=_qc_from_json(qc1))\n        print("P003 B2_PROBE", {"probe": probe_id, "pending": list(probe._pending_remote_blocks), "seeded": seeded, "meta": None if meta is None else {"ok": meta.ok, "error": meta.error, "height": meta.height, "block_id": meta.block_id}, "can_vote": can_vote, "high_qc": None if probe._bft.high_qc is None else probe._bft.high_qc.block_id, "locked_qc": None if probe._bft.locked_qc is None else probe._bft.locked_qc.block_id}, flush=True)\n\n    wrong = _signed_wrong_parent(\n'''
          if s.count(old) != 1:
              raise SystemExit(f'marker count={s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          ruff format tests/test_p0_03_production_composition.py
      - name: Execute production composition diagnostic
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          pytest -s -q -vv tests/test_p0_03_production_composition.py::test_four_validator_prod_three_chain_restart_delayed_qc_and_wrong_parent_rejection
