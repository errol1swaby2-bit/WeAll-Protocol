name: Temporary P0-03 production composition

on:
  push:
    branches:
      - p0-03-production-closure-staging-20261001

permissions:
  contents: write

jobs:
  p0-03-production-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked backend dependencies
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps
      - name: Apply consolidated P0-03 runtime repair
        run: |
          set -Eeuo pipefail
          python .github/tmp-p0-03-runtime-repair.py
          python .github/tmp-p0-03-block-replay-current-candidate.py
          python .github/tmp-p0-03-certified-identity-conflict.py
          python .github/tmp-p0-03-delayed-genesis-epoch-finality.py
          python .github/tmp-p0-03-system-block-context.py
          python .github/tmp-p0-03-spec-bft-authority.py
          python .github/tmp-p0-03-finalized-replay-scope.py
      - name: Normalize candidate source and tests
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          ruff check --fix \
            src/weall/runtime/bft_hotstuff.py \
            src/weall/runtime/bft_runtime_adapter.py \
            src/weall/runtime/bft_votecheck.py \
            src/weall/runtime/bft_pending_frontier_impl.py \
            src/weall/runtime/block_admission.py \
            src/weall/runtime/block_replay.py \
            src/weall/runtime/apply/consensus.py \
            src/weall/runtime/executor.py \
            tests/test_p0_03_production_composition.py \
            tests/test_priority0_system_signer_canon.py \
            tests/test_priority1_pending_frontier_apply_order.py \
            tests/test_priority2_votecheck_dos_hardening.py \
            tests/test_fresh_ai_error_closure.py
          ruff format \
            src/weall/runtime/bft_hotstuff.py \
            src/weall/runtime/bft_runtime_adapter.py \
            src/weall/runtime/bft_votecheck.py \
            src/weall/runtime/bft_pending_frontier_impl.py \
            src/weall/runtime/block_admission.py \
            src/weall/runtime/block_replay.py \
            src/weall/runtime/apply/consensus.py \
            src/weall/runtime/executor.py \
            tests/test_p0_03_production_composition.py \
            tests/test_priority0_system_signer_canon.py \
            tests/test_priority1_pending_frontier_apply_order.py \
            tests/test_priority2_votecheck_dos_hardening.py \
            tests/test_fresh_ai_error_closure.py
          ruff check \
            src/weall/runtime/bft_hotstuff.py \
            src/weall/runtime/bft_runtime_adapter.py \
            src/weall/runtime/bft_votecheck.py \
            src/weall/runtime/bft_pending_frontier_impl.py \
            src/weall/runtime/block_admission.py \
            src/weall/runtime/block_replay.py \
            src/weall/runtime/apply/consensus.py \
            src/weall/runtime/executor.py \
            tests/test_p0_03_production_composition.py \
            tests/test_priority0_system_signer_canon.py \
            tests/test_priority1_pending_frontier_apply_order.py \
            tests/test_priority2_votecheck_dos_hardening.py \
            tests/test_fresh_ai_error_closure.py
          git diff --check
      - name: Trace leader and follower speculative finality state
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python ../.github/tmp-p0-03-finality-state-trace.py
      - name: Execute P0-03 production and adjacent regressions
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          pytest -q -vv \
            tests/test_p0_03_production_composition.py \
            tests/test_p0_03_certified_branch_transition.py \
            tests/test_bft_timeout_certificate.py \
            tests/test_bft_production_safety.py \
            tests/test_bft_pending_frontier_restart_persistence.py \
            tests/test_executor_epoch_transition_pending_prune.py \
            tests/test_priority1_bft_sender_rate_budget.py \
            tests/test_priority1_pending_frontier_apply_order.py \
            tests/test_pb001br_proposal_duplicate_cache_trust_boundary.py \
            tests/test_priority2_votecheck_dos_hardening.py \
            tests/test_bft_votecheck_safety.py \
            tests/test_fresh_ai_error_closure.py \
            tests/test_protocol_blocker_safety.py \
            tests/test_production_consensus_profile.py \
            tests/test_node_lifecycle_block_admission_authority.py \
            tests/test_helper_block_plan_admission.py \
            tests/test_block_signature_profiles.py \
            tests/test_block_identity_quarantine.py \
            tests/test_pb001bn_bft_identity_quarantine_restart.py \
            tests/test_pb001bq_quarantine_trust_boundary.py \
            tests/test_priority1_pending_qc_cache_safety.py \
            tests/test_bft_canonical_finality_bridge.py \
            tests/test_epoch_blocks_per_epoch.py \
            tests/test_system_queue_lifecycle_integrity.py \
            tests/test_system_tx_apply_fail_closed.py \
            tests/test_priority0_system_signer_canon.py
      - name: Commit tested helper-free canonical tree
        if: success()
        run: |
          set -Eeuo pipefail
          rm .github/workflows/tmp-p0-03-production-composition.yml
          rm .github/workflows/p0-03-exact-head-repair.yml
          rm .github/tmp-p0-03-runtime-repair.py
          rm .github/tmp-p0-03-block-replay-current-candidate.py
          rm .github/tmp-p0-03-certified-identity-conflict.py
          rm .github/tmp-p0-03-delayed-genesis-epoch-finality.py
          rm .github/tmp-p0-03-system-block-context.py
          rm .github/tmp-p0-03-spec-bft-authority.py
          rm .github/tmp-p0-03-finalized-replay-scope.py
          rm .github/tmp-p0-03-follower-diagnostic.py
          rm .github/tmp-p0-03-votecheck-trace.py
          rm .github/tmp-p0-03-finality-state-trace.py
          (
            cd Weall-Protocol
            python scripts/compile_v2_spec.py
          )
          git config user.name 'errol1swaby2-bit'
          git config user.email 'errol1swaby2@gmail.com'
          git add -A
          git diff --cached --check
          test ! -e .github/workflows/tmp-p0-03-production-composition.yml
          test ! -e .github/workflows/p0-03-exact-head-repair.yml
          test ! -e .github/tmp-p0-03-runtime-repair.py
          test ! -e .github/tmp-p0-03-block-replay-current-candidate.py
          test ! -e .github/tmp-p0-03-certified-identity-conflict.py
          test ! -e .github/tmp-p0-03-delayed-genesis-epoch-finality.py
          test ! -e .github/tmp-p0-03-system-block-context.py
          test ! -e .github/tmp-p0-03-spec-bft-authority.py
          test ! -e .github/tmp-p0-03-finalized-replay-scope.py
          test ! -e .github/tmp-p0-03-follower-diagnostic.py
          test ! -e .github/tmp-p0-03-votecheck-trace.py
          test ! -e .github/tmp-p0-03-finality-state-trace.py
          git commit -m 'fix(p0-03): complete certified-chain follower and transition repair'
          (
            cd Weall-Protocol
            python scripts/compile_v2_spec.py --check
            python scripts/check_v2_spec_clean_checkout.py
          )
          git push origin HEAD:p0-03-production-closure-staging-20261001
