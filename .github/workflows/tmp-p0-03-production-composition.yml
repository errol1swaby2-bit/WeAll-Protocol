name: Temporary P0-03 production composition

on:
  push:
    branches:
      - p0-03-production-closure-staging-20261001

permissions:
  contents: read

jobs:
  p0-03-production-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked backend dependencies
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps
      - name: Apply consolidated P0-03 runtime repair
        run: |
          set -Eeuo pipefail
          python .github/tmp-p0-03-runtime-repair.py
      - name: Instrument post-rejection vote gates in disposable checkout
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_p0_03_production_composition.py')
          s = p.read_text(encoding='utf-8')
          old = '''    with _env(_prod_env(victim, pub=pubs[victim], priv=privs[victim])):\n        assert nodes[victim].bft_on_proposal(copy.deepcopy(wrong)) is None\n\n    votes2 = _follower_votes(nodes, b2, leader=leader2, pubs=pubs, privs=privs)\n'''
          new = '''    with _env(_prod_env(victim, pub=pubs[victim], priv=privs[victim])):\n        assert nodes[victim].bft_on_proposal(copy.deepcopy(wrong)) is None\n        probe = nodes[victim]\n        from weall.runtime import bft_artifact_cache as _artifact_cache\n        from weall.runtime import bft_votecheck as _votecheck\n        from weall.runtime.bft_hotstuff import qc_from_json as _qc_from_json\n        from weall.runtime.block_admission import admit_bft_block as _admit\n\n        bid = str(b2["block_id"])\n        bh = str(b2["block_hash"])\n        parent = str(b2["prev_block_id"])\n        jqc = _qc_from_json(b2["justify_qc"])\n        smap = probe._bft_speculative_blocks_map()\n        smap[bid] = {\n            "height": int(b2.get("height") or 0),\n            "prev_block_id": parent,\n            "block_hash": bh,\n        }\n        sender_entry = dict(getattr(probe, "_recent_bft_sender_budgets", {})).get(leader2)\n        peer_entry = dict(getattr(probe, "_proposal_peer_budget", {})).get(leader2)\n        checks = {\n            "recent": _artifact_cache._has_recent_bft_artifact(probe, b2, cache_attr="_recent_bft_proposals"),\n            "phase": probe._bft_payload_phase_matches_current_security_model(b2),\n            "epoch": probe._bft_epoch_binding_matches(b2),\n            "id_conflict": probe._block_identity_conflicts(copy.deepcopy(b2), record_conflicts=False),\n            "admission": _admit(block=copy.deepcopy(b2), state=probe.state, bft_enabled=True)[0],\n            "votecheck_static": _votecheck._proposal_votecheck_static_ok(probe, copy.deepcopy(b2)),\n            "votecheck_full": _votecheck._validate_remote_proposal_for_vote(probe, copy.deepcopy(b2)),\n            "can_vote": probe._bft.can_vote_for(blocks=smap, block_id=bid, justify_qc=jqc),\n            "signing_permitted": probe._validator_signing_permitted(),\n            "last_voted_view": probe._bft.last_voted_view,\n            "last_voted_block_id": probe._bft.last_voted_block_id,\n            "view": probe._bft.view,\n            "sender_budget": sender_entry,\n            "peer_budget": peer_entry,\n            "pending": list(probe._pending_remote_blocks),\n            "quarantined": list(probe._quarantined_remote_blocks),\n            "high_qc": None if probe._bft.high_qc is None else probe._bft.high_qc.block_id,\n            "locked_qc": None if probe._bft.locked_qc is None else probe._bft.locked_qc.block_id,\n        }\n        vote_preview = probe.bft_make_vote_for_block(view=2, block_id=bid, block_hash=bh, parent_id=parent)\n        checks["vote_preview"] = isinstance(vote_preview, dict) and bool(vote_preview)\n        print("P003 POST_WRONG_GATES", checks, flush=True)\n        raise AssertionError("diagnostic_stop_after_post_wrong_gates")\n\n    votes2 = _follower_votes(nodes, b2, leader=leader2, pubs=pubs, privs=privs)\n'''
          if s.count(old) != 1:
              raise SystemExit(f'marker count={s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          ruff format tests/test_p0_03_production_composition.py
      - name: Execute production composition diagnostic
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          pytest -s -q -vv tests/test_p0_03_production_composition.py::test_four_validator_prod_three_chain_restart_delayed_qc_and_wrong_parent_rejection
