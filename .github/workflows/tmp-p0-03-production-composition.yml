name: Temporary P0-03 production composition

on:
  push:
    branches:
      - p0-03-production-closure-staging-20261001

permissions:
  contents: write

jobs:
  p0-03-production-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked backend dependencies
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps
      - name: Apply consolidated P0-03 runtime repair
        run: |
          set -Eeuo pipefail
          python .github/tmp-p0-03-runtime-repair.py
      - name: Add current replay candidate to ephemeral commit ancestry
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('Weall-Protocol/src/weall/runtime/block_replay.py')
          text = path.read_text(encoding='utf-8')
          old = '''        if strict_bft_apply:
            ok_bft, rej_bft = _call_admit_bft_commit_block(
                block=block2,
                state=self.state,
                blocks_map=self._bft_speculative_blocks_map(),
                bft_enabled=effective_bft_enabled(executor=self, default=False),
            )
'''
          new = '''        if strict_bft_apply:
            admission_blocks_map = self._bft_speculative_blocks_map()
            current_bid = str(block2.get("block_id") or "").strip()
            if current_bid:
                admission_blocks_map = dict(admission_blocks_map)
                admission_blocks_map[current_bid] = {
                    "height": int(height),
                    "prev_block_id": advertised_prev_block_id,
                    "block_ts_ms": int(ts_ms),
                    "block_hash": str(block2.get("block_hash") or "").strip(),
                }
            ok_bft, rej_bft = _call_admit_bft_commit_block(
                block=block2,
                state=self.state,
                blocks_map=admission_blocks_map,
                bft_enabled=effective_bft_enabled(executor=self, default=False),
            )
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'block replay current-candidate ancestry: expected one match, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Normalize candidate source and tests
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          ruff check --fix \
            src/weall/runtime/bft_hotstuff.py \
            src/weall/runtime/bft_runtime_adapter.py \
            src/weall/runtime/bft_votecheck.py \
            src/weall/runtime/block_admission.py \
            src/weall/runtime/block_replay.py \
            src/weall/runtime/executor.py \
            tests/test_p0_03_production_composition.py \
            tests/test_priority2_votecheck_dos_hardening.py \
            tests/test_fresh_ai_error_closure.py
          ruff format \
            src/weall/runtime/bft_hotstuff.py \
            src/weall/runtime/bft_runtime_adapter.py \
            src/weall/runtime/bft_votecheck.py \
            src/weall/runtime/block_admission.py \
            src/weall/runtime/block_replay.py \
            src/weall/runtime/executor.py \
            tests/test_p0_03_production_composition.py \
            tests/test_priority2_votecheck_dos_hardening.py \
            tests/test_fresh_ai_error_closure.py
          ruff check \
            src/weall/runtime/bft_hotstuff.py \
            src/weall/runtime/bft_runtime_adapter.py \
            src/weall/runtime/bft_votecheck.py \
            src/weall/runtime/block_admission.py \
            src/weall/runtime/block_replay.py \
            src/weall/runtime/executor.py \
            tests/test_p0_03_production_composition.py \
            tests/test_priority2_votecheck_dos_hardening.py \
            tests/test_fresh_ai_error_closure.py
          git diff --check
      - name: Trace wrong-parent rejection and valid follower continuity
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from __future__ import annotations

          import copy
          import importlib.util
          import tempfile
          from pathlib import Path

          from weall.runtime.bft_hotstuff import qc_from_json

          test_path = Path('tests/test_p0_03_production_composition.py').resolve()
          spec = importlib.util.spec_from_file_location('p0diag', test_path)
          assert spec is not None and spec.loader is not None
          t = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(t)

          def qc_summary(qc):
              if qc is None:
                  return None
              return {
                  'view': int(getattr(qc, 'view', -1)),
                  'block_id': str(getattr(qc, 'block_id', '') or ''),
                  'parent_id': str(getattr(qc, 'parent_id', '') or ''),
              }

          def snapshot(node, label, *, b1_id='', b2_id='', wrong_id=''):
              speculative = node._bft_speculative_blocks_map()
              snap = {
                  'label': label,
                  'tip': str(node.state.get('tip') or ''),
                  'height': int(node.state.get('height') or 0),
                  'view': int(getattr(node._bft, 'view', -1)),
                  'last_voted_view': int(getattr(node._bft, 'last_voted_view', -1)),
                  'finalized_block_id': str(getattr(node._bft, 'finalized_block_id', '') or ''),
                  'high_qc': qc_summary(getattr(node._bft, 'high_qc', None)),
                  'locked_qc': qc_summary(getattr(node._bft, 'locked_qc', None)),
                  'transition_qc': qc_summary(getattr(node._bft, 'validator_transition_qc', None)),
                  'pending_remote': list(node._pending_remote_blocks.keys()),
                  'pending_candidates': list(node._pending_candidates.keys()),
                  'pending_missing_qcs': list(node._pending_missing_qcs.keys()),
                  'pending_fetches': list(getattr(node, '_pending_missing_fetches', {}).keys()),
                  'conflicted_ids': list(node._conflicted_block_ids.keys()),
                  'conflicted_hashes': list(node._conflicted_block_hashes.keys()),
                  'spec_has_b1': bool(b1_id and b1_id in speculative),
                  'spec_has_b2': bool(b2_id and b2_id in speculative),
                  'spec_has_wrong': bool(wrong_id and wrong_id in speculative),
                  'pending_b1': bool(b1_id and isinstance(node._bft_pending_block_json(b1_id), dict)),
              }
              print('P0DIAG_SNAPSHOT', snap, flush=True)

          pubs, privs = t._key_material()
          with tempfile.TemporaryDirectory(prefix='weall-p0diag-') as td:
              tmp_path = Path(td)
              nodes, boundary_id, _boundary_hash = t._install_prod_boundary(
                  tmp_path, pubs=pubs, privs=privs
              )
              qc0 = t._prepare_transition_qc(
                  nodes, boundary_id=boundary_id, pubs=pubs, privs=privs
              )
              assert str(qc0['block_id']) == boundary_id

              leader1, b1 = t._propose(nodes, view=1, pubs=pubs, privs=privs)
              votes1 = t._follower_votes(nodes, b1, leader=leader1, pubs=pubs, privs=privs)
              qc1 = t._form_qc(nodes[leader1], leader1, votes1, pubs=pubs, privs=privs)
              t._broadcast_qc(nodes, qc1, pubs=pubs, privs=privs)

              leader2 = t.leader_for_view(t.VALIDATORS, 2)
              with t._env(t._prod_env(leader2, pub=pubs[leader2], priv=privs[leader2])):
                  nodes[leader2].mark_clean_shutdown()
                  nodes[leader2] = t._make_executor(tmp_path, leader2, node_id=leader2)

              leader2_actual, b2 = t._propose(nodes, view=2, pubs=pubs, privs=privs)
              assert leader2_actual == leader2
              wrong = t._signed_wrong_parent(
                  nodes[leader2],
                  leader2,
                  view=2,
                  justify_qc=qc1,
                  pubs=pubs,
                  privs=privs,
              )
              victim = next(v for v in t.VALIDATORS if v != leader2)
              node = nodes[victim]
              b1_id = str(b1['block_id'])
              b2_id = str(b2['block_id'])
              wrong_id = str(wrong['block_id'])
              print('P0DIAG_IDS', {
                  'victim': victim,
                  'leader2': leader2,
                  'boundary': boundary_id,
                  'b1': b1_id,
                  'b2': b2_id,
                  'wrong': wrong_id,
                  'b2_parent': str(b2.get('prev_block_id') or ''),
                  'wrong_parent': str(wrong.get('prev_block_id') or ''),
                  'qc1_block': str(qc1.get('block_id') or ''),
              }, flush=True)

              snapshot(node, 'before_wrong', b1_id=b1_id, b2_id=b2_id, wrong_id=wrong_id)
              with t._env(t._prod_env(victim, pub=pubs[victim], priv=privs[victim])):
                  wrong_vote = node.bft_on_proposal(copy.deepcopy(wrong))
              print('P0DIAG_WRONG_RESULT', wrong_vote, flush=True)
              snapshot(node, 'after_wrong', b1_id=b1_id, b2_id=b2_id, wrong_id=wrong_id)

              with t._env(t._prod_env(victim, pub=pubs[victim], priv=privs[victim])):
                  validation_ok = node._validate_remote_proposal_for_vote(copy.deepcopy(b2))
              print('P0DIAG_B2_VOTECHECK', validation_ok, flush=True)

              vote_map = dict(node._bft_speculative_blocks_map())
              vote_map[b2_id] = {
                  'height': int(b2.get('height') or 0),
                  'prev_block_id': str(b2.get('prev_block_id') or ''),
                  'block_ts_ms': int(b2.get('block_ts_ms') or 0),
                  'block_hash': str(b2.get('block_hash') or ''),
              }
              justify = qc_from_json(b2.get('justify_qc')) if isinstance(b2.get('justify_qc'), dict) else None
              can_vote = node._bft.can_vote_for(blocks=vote_map, block_id=b2_id, justify_qc=justify)
              print('P0DIAG_B2_CAN_VOTE', can_vote, flush=True)
              print('P0DIAG_SIGNING_PERMITTED', node._validator_signing_permitted(), flush=True)
              snapshot(node, 'after_direct_b2_checks', b1_id=b1_id, b2_id=b2_id, wrong_id=wrong_id)

              with t._env(t._prod_env(victim, pub=pubs[victim], priv=privs[victim])):
                  b2_vote = node.bft_on_proposal(copy.deepcopy(b2))
              print('P0DIAG_B2_RESULT', b2_vote, flush=True)
              snapshot(node, 'after_b2', b1_id=b1_id, b2_id=b2_id, wrong_id=wrong_id)
          PY
      - name: Execute P0-03 production and adjacent regressions
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          pytest -q -vv \
            tests/test_p0_03_production_composition.py \
            tests/test_p0_03_certified_branch_transition.py \
            tests/test_bft_timeout_certificate.py \
            tests/test_bft_production_safety.py \
            tests/test_bft_pending_frontier_restart_persistence.py \
            tests/test_executor_epoch_transition_pending_prune.py \
            tests/test_priority1_bft_sender_rate_budget.py \
            tests/test_pb001br_proposal_duplicate_cache_trust_boundary.py \
            tests/test_priority2_votecheck_dos_hardening.py \
            tests/test_bft_votecheck_safety.py \
            tests/test_fresh_ai_error_closure.py \
            tests/test_protocol_blocker_safety.py \
            tests/test_production_consensus_profile.py \
            tests/test_node_lifecycle_block_admission_authority.py \
            tests/test_helper_block_plan_admission.py \
            tests/test_block_signature_profiles.py
      - name: Commit tested helper-free canonical tree
        if: success()
        run: |
          set -Eeuo pipefail
          rm .github/workflows/tmp-p0-03-production-composition.yml
          rm .github/tmp-p0-03-runtime-repair.py
          rm -f .github/workflows/p0-03-exact-head-repair.yml

          (
            cd Weall-Protocol
            python scripts/compile_v2_spec.py
          )

          git config user.name 'errol1swaby2-bit'
          git config user.email 'errol1swaby2@gmail.com'
          git add -A
          git diff --cached --check
          test ! -e .github/workflows/tmp-p0-03-production-composition.yml
          test ! -e .github/tmp-p0-03-runtime-repair.py
          test ! -e .github/workflows/p0-03-exact-head-repair.yml
          git commit -m 'fix(p0-03): complete certified-chain follower and transition repair'

          (
            cd Weall-Protocol
            python scripts/compile_v2_spec.py --check
            python scripts/check_v2_spec_clean_checkout.py
          )

          git push origin HEAD:p0-03-production-closure-staging-20261001
