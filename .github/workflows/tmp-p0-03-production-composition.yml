name: Temporary P0-03 production composition

on:
  push:
    branches:
      - p0-03-production-closure-staging-20261001

permissions:
  contents: read

jobs:
  p0-03-production-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked backend dependencies
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps
      - name: Apply consolidated P0-03 runtime repair
        run: |
          set -Eeuo pipefail
          python .github/tmp-p0-03-runtime-repair.py
      - name: Instrument exact QC1 boundary in disposable checkout
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_p0_03_production_composition.py')
          s = p.read_text(encoding='utf-8')
          old = '''    votes1 = _follower_votes(nodes, b1, leader=leader1, pubs=pubs, privs=privs)\n    qc1 = _form_qc(nodes[leader1], leader1, votes1, pubs=pubs, privs=privs)\n    _broadcast_qc(nodes, qc1, pubs=pubs, privs=privs)\n'''
          new = '''    votes1 = _follower_votes(nodes, b1, leader=leader1, pubs=pubs, privs=privs)\n    print("P003 BEFORE_QC1", {vid: {"pending": list(n._pending_remote_blocks), "has_b1": n._has_local_block(str(b1["block_id"])), "epoch_ok": n._bft_pending_artifact_matches_current_epoch(b1), "desc": n._bft_block_is_applyable_finalized_descendant(b1, str(n._bft.finalized_block_id or ""))} for vid, n in nodes.items()}, flush=True)\n    qc1 = _form_qc(nodes[leader1], leader1, votes1, pubs=pubs, privs=privs)\n    _broadcast_qc(nodes, qc1, pubs=pubs, privs=privs)\n    print("P003 AFTER_QC1", {vid: {"pending": list(n._pending_remote_blocks), "has_b1": n._has_local_block(str(b1["block_id"])), "epoch_ok": n._bft_pending_artifact_matches_current_epoch(b1), "desc": n._bft_block_is_applyable_finalized_descendant(b1, str(n._bft.finalized_block_id or "")), "tip": str(n.state.get("tip") or ""), "finalized": str(n._bft.finalized_block_id or "")} for vid, n in nodes.items()}, flush=True)\n'''
          if s.count(old) != 1:
              raise SystemExit(f'marker count={s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          ruff format tests/test_p0_03_production_composition.py
      - name: Execute production composition diagnostic
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          pytest -s -q -vv tests/test_p0_03_production_composition.py::test_four_validator_prod_three_chain_restart_delayed_qc_and_wrong_parent_rejection
