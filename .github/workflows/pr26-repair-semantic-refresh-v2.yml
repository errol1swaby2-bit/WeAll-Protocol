name: PR26 Repair Semantic Refresh V4

on:
  push:
    branches:
      - production-readiness-audit-20260925

permissions:
  contents: write

concurrency:
  group: pr26-semantic-refresh
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: production-readiness-audit-20260925

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Remove this temporary remediation workflow from intended final tree
        run: git rm -f .github/workflows/pr26-repair-semantic-refresh-v2.yml

      - name: Register permanent semantic refresh tooling in fail-closed source coverage
        working-directory: Weall-Protocol
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("specs/v2/source/source_mappings.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          target = "scripts/refresh_v2_semantic_reviews.py"
          rows = payload.get("mappings")
          if not isinstance(rows, list):
              raise SystemExit("source_mappings.json mappings must be a list")
          matches = [row for row in rows if isinstance(row, dict) and row.get("path") == target]
          if len(matches) > 1:
              raise SystemExit(f"duplicate source mappings for {target}")
          if not matches:
              rows.append({
                  "affected_registers": ["transactions", "failures", "stable_ids", "evidence"],
                  "classification": "authoritative_spec_maintenance_tooling",
                  "path": target,
                  "primary_mechanism_id": "M-076",
                  "review_status": "mapped_current_snapshot",
              })
              rows.sort(key=lambda row: str(row.get("path") or ""))
              path.write_text(
                  json.dumps(payload, indent=2, ensure_ascii=False) + "\n",
                  encoding="utf-8",
              )
          PY

      - name: Install locked backend dependencies
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Sweep and safely repair Ruff-detectable Python defects repository-wide
        working-directory: Weall-Protocol
        run: |
          # Apply only Ruff's safe fixes across the complete Python surface so
          # equivalent defects are not left behind outside the PR26 file list.
          ruff check --fix .
          ruff format .
          ruff format --check .
          ruff check .

      - name: Refresh every semantic contract changed by PR26 runtime patches
        working-directory: Weall-Protocol
        run: |
          PYTHONPATH=src python scripts/refresh_v2_semantic_reviews.py \
            --tx-type BALANCE_TRANSFER \
            --tx-type VALIDATOR_CANDIDATE_APPROVE \
            --tx-type VALIDATOR_SUSPEND \
            --tx-type VALIDATOR_REMOVE \
            --register-failure invalid_payload:validator_lifecycle_epoch_must_be_future \
            --reviewed-at 2026-09-26T03:30:00Z \
            --reviewer "WeAll Protocol maintainer-directed production-readiness remediation; independent launch review deferred" \
            --review-method "maintainer_reviewed_semantic_change_with_regression_evidence"

      - name: Validate repository-wide formatting lint and focused regressions
        working-directory: Weall-Protocol
        run: |
          ruff format --check .
          ruff check .
          pytest -q \
            tests/test_refresh_v2_semantic_reviews.py \
            tests/test_balance_transfer_self_transfer_regression.py \
            tests/p0/test_p1_cons003_future_validator_epochs.py \
            tests/p0/test_p0_consensus_core.py

      - name: Validate all V2 semantic and generated surfaces
        working-directory: Weall-Protocol
        run: |
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          python scripts/check_generated.py
          python scripts/check_v2_spec_clean_checkout.py
          PYTHONDONTWRITEBYTECODE=1 python scripts/check_v15_public_readiness_artifacts.py
          python scripts/check_public_claim_freshness.py
          python scripts/gen_current_verified_claims.py --check

      - name: Validate production reviewer gate before committing
        working-directory: Weall-Protocol
        run: |
          bash scripts/verify_release_tree.sh
          bash scripts/restore_m2_m3_evidence_from_git.sh --destination "${GITHUB_WORKSPACE}"
          WEALL_RELEASE_TREE_ALREADY_VERIFIED=1 bash scripts/reviewer_production_readiness_gate.sh

      - name: Commit validated final tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit; final tree already materialized."
          else
            git commit -m "Repair PR26 CI freshness and source coverage comprehensively"
          fi

      - name: Verify committed clean archive
        working-directory: Weall-Protocol
        run: python scripts/check_v2_spec_clean_checkout.py

      - name: Push validated final tree
        run: |
          if [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/production-readiness-audit-20260925)" ]]; then
            echo "No new commit to push."
          else
            git push origin HEAD:production-readiness-audit-20260925
          fi
