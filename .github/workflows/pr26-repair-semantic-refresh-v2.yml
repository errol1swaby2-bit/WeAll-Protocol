name: PR26 Repair Semantic Refresh V4

on:
  push:
    branches:
      - production-readiness-audit-20260925

permissions:
  contents: write

concurrency:
  group: pr26-semantic-refresh
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: production-readiness-audit-20260925

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Remove this temporary remediation workflow from intended final tree
        run: git rm -f .github/workflows/pr26-repair-semantic-refresh-v2.yml

      - name: Register permanent semantic refresh tooling in fail-closed source coverage
        working-directory: Weall-Protocol
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("specs/v2/source/source_mappings.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          target = "scripts/refresh_v2_semantic_reviews.py"
          rows = payload.get("mappings")
          if not isinstance(rows, list):
              raise SystemExit("source_mappings.json mappings must be a list")
          matches = [row for row in rows if isinstance(row, dict) and row.get("path") == target]
          if len(matches) > 1:
              raise SystemExit(f"duplicate source mappings for {target}")
          if not matches:
              rows.append({
                  "affected_registers": ["transactions", "failures", "stable_ids", "evidence"],
                  "classification": "authoritative_spec_maintenance_tooling",
                  "path": target,
                  "primary_mechanism_id": "M-076",
                  "review_status": "mapped_current_snapshot",
              })
              rows.sort(key=lambda row: str(row.get("path") or ""))
              path.write_text(
                  json.dumps(payload, indent=2, ensure_ascii=False) + "\n",
                  encoding="utf-8",
              )
          PY

      - name: Install locked backend dependencies
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Sweep and safely repair Ruff-detectable Python defects repository-wide
        working-directory: Weall-Protocol
        run: |
          ruff check --fix .
          ruff format .
          ruff format --check .
          ruff check .

      - name: Refresh every semantic contract changed by PR26 runtime patches
        working-directory: Weall-Protocol
        run: |
          PYTHONPATH=src python scripts/refresh_v2_semantic_reviews.py \
            --tx-type BALANCE_TRANSFER \
            --tx-type VALIDATOR_CANDIDATE_APPROVE \
            --tx-type VALIDATOR_SUSPEND \
            --tx-type VALIDATOR_REMOVE \
            --register-failure invalid_payload:validator_lifecycle_epoch_must_be_future \
            --reviewed-at 2026-09-26T03:30:00Z \
            --reviewer "WeAll Protocol maintainer-directed production-readiness remediation; independent launch review deferred" \
            --review-method "maintainer_reviewed_semantic_change_with_regression_evidence"

      - name: Regenerate complete dependent v1.5 readiness artifact closure
        working-directory: Weall-Protocol
        run: |
          PYTHONPATH=src:scripts python - <<'PY'
          import json
          from pathlib import Path

          from gen_failure_code_registry_v1_5 import build_payload as build_failure_registry
          from gen_api_response_vectors_v1_5 import build as build_api_vectors
          from gen_b587_b594_testnet_mechanism_completion_v1_5 import build as build_b587
          from gen_release_evidence_manifest_v1_5 import build as build_release_manifest
          from gen_public_beta_blocker_report_v1_5 import build as build_public_beta
          from run_controlled_testnet_go_gate_v1_5 import build as build_controlled_gate
          from gen_final_public_observer_controlled_testnet_go_gate_v1_5 import (
              build as build_final_gate,
          )

          ROOT = Path.cwd()

          def write(rel: str, payload: dict) -> None:
              path = ROOT / rel
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(
                  json.dumps(payload, indent=2, sort_keys=True, ensure_ascii=False) + "\n",
                  encoding="utf-8",
              )
              print(f"regenerated {rel}")

          write("generated/failure_code_registry_v1_5.json", build_failure_registry())
          write("generated/api_response_vectors_v1_5.json", build_api_vectors())
          write("generated/b587_b594_testnet_mechanism_completion_v1_5.json", build_b587())
          write("generated/release_evidence_manifest_v1_5.json", build_release_manifest())
          write("generated/public_beta_blocker_report_v1_5.json", build_public_beta())
          write("generated/controlled_testnet_go_gate_v1_5.json", build_controlled_gate())
          write("generated/final_public_observer_controlled_testnet_go_gate_v1_5.json", build_final_gate())
          write("generated/release_evidence_manifest_v1_5.json", build_release_manifest())
          write("generated/public_beta_blocker_report_v1_5.json", build_public_beta())
          write("generated/controlled_testnet_go_gate_v1_5.json", build_controlled_gate())
          write("generated/final_public_observer_controlled_testnet_go_gate_v1_5.json", build_final_gate())
          write("generated/release_evidence_manifest_v1_5.json", build_release_manifest())
          write("generated/public_beta_blocker_report_v1_5.json", build_public_beta())
          PY
          python scripts/gen_current_verified_claims.py

      - name: Rematerialize V2 derivatives after v1.5 evidence closure
        working-directory: Weall-Protocol
        run: |
          PYTHONPATH=src python scripts/compile_v2_spec.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check

      - name: Validate repository-wide formatting lint and focused regressions
        working-directory: Weall-Protocol
        run: |
          ruff format --check .
          ruff check .
          pytest -q \
            tests/test_refresh_v2_semantic_reviews.py \
            tests/test_balance_transfer_self_transfer_regression.py \
            tests/p0/test_p1_cons003_future_validator_epochs.py \
            tests/p0/test_p0_consensus_core.py

      - name: Validate all generated and readiness surfaces
        working-directory: Weall-Protocol
        run: |
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          python scripts/check_generated.py
          python scripts/check_v2_spec_clean_checkout.py
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src:scripts python scripts/check_v15_public_readiness_artifacts.py
          PYTHONPATH=src:scripts python scripts/gen_failure_code_registry_v1_5.py --check
          PYTHONPATH=src:scripts python scripts/gen_api_response_vectors_v1_5.py --check
          PYTHONPATH=src:scripts python scripts/gen_b587_b594_testnet_mechanism_completion_v1_5.py --check
          PYTHONPATH=src:scripts python scripts/gen_release_evidence_manifest_v1_5.py --check
          PYTHONPATH=src:scripts python scripts/gen_public_beta_blocker_report_v1_5.py --check
          PYTHONPATH=src:scripts python scripts/gen_final_public_observer_controlled_testnet_go_gate_v1_5.py --check
          python scripts/check_public_claim_freshness.py
          python scripts/gen_current_verified_claims.py --check

      - name: Remove validation-only local artifacts before release verification
        working-directory: Weall-Protocol
        run: |
          find . -type d \( \
            -name '__pycache__' -o \
            -name '.pytest_cache' -o \
            -name '.ruff_cache' -o \
            -name '*.egg-info' \
          \) -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          if find . \( \
            -type d \( -name '__pycache__' -o -name '.pytest_cache' -o -name '*.egg-info' \) -o \
            -type f \( -name '*.pyc' -o -name '*.pyo' \) \
          \) -print -quit | grep -q .; then
            echo "validation-only Python artifacts remain after cleanup" >&2
            exit 1
          fi

      - name: Validate production reviewer gate before committing
        run: |
          cd Weall-Protocol
          bash scripts/verify_release_tree.sh
          cd ..
          bash scripts/restore_m2_m3_evidence_from_git.sh --destination "${GITHUB_WORKSPACE}"
          cd Weall-Protocol
          WEALL_RELEASE_TREE_ALREADY_VERIFIED=1 bash scripts/reviewer_production_readiness_gate.sh

      - name: Commit validated final tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit; final tree already materialized."
          else
            git commit -m "Repair PR26 CI freshness and dependent artifact closure"
          fi

      - name: Verify committed clean archive
        working-directory: Weall-Protocol
        run: |
          python scripts/check_v2_spec_clean_checkout.py
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src:scripts python scripts/check_v15_public_readiness_artifacts.py

      - name: Push validated final tree
        run: |
          if [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/production-readiness-audit-20260925)" ]]; then
            echo "No new commit to push."
          else
            git push origin HEAD:production-readiness-audit-20260925
          fi
