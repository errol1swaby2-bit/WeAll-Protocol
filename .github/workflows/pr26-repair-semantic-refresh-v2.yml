name: PR26 Repair Semantic Refresh V3

on:
  push:
    branches:
      - production-readiness-audit-20260925

permissions:
  contents: write

concurrency:
  group: pr26-semantic-refresh
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: production-readiness-audit-20260925

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Remove temporary remediation workflows from intended final tree
        shell: bash
        run: |
          set -Eeuo pipefail
          for path in \
            .github/workflows/pr26-finalize-cons003.yml \
            .github/workflows/pr26-repair-semantic-refresh-v2.yml
          do
            if [[ -e "$path" ]]; then
              git rm -f "$path"
            fi
          done

      - name: Install locked backend dependencies
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Format permanent semantic refresh tooling
        working-directory: Weall-Protocol
        run: |
          ruff format scripts/refresh_v2_semantic_reviews.py tests/test_refresh_v2_semantic_reviews.py
          ruff check scripts/refresh_v2_semantic_reviews.py tests/test_refresh_v2_semantic_reviews.py
          ruff format --check scripts/refresh_v2_semantic_reviews.py tests/test_refresh_v2_semantic_reviews.py

      - name: Refresh all PR26 implementation semantic contracts
        working-directory: Weall-Protocol
        run: |
          PYTHONPATH=src python scripts/refresh_v2_semantic_reviews.py \
            --tx-type BALANCE_TRANSFER \
            --tx-type VALIDATOR_CANDIDATE_APPROVE \
            --tx-type VALIDATOR_SUSPEND \
            --tx-type VALIDATOR_REMOVE \
            --register-failure invalid_payload:validator_lifecycle_epoch_must_be_future \
            --reviewed-at 2026-09-25T19:30:00Z \
            --reviewer "WeAll Protocol maintainer-directed production-readiness remediation; independent launch review deferred" \
            --review-method "maintainer_reviewed_semantic_change_with_regression_evidence"

      - name: Validate focused runtime and semantic tooling
        working-directory: Weall-Protocol
        run: |
          ruff format --check .
          ruff check .
          pytest -q \
            tests/test_refresh_v2_semantic_reviews.py \
            tests/test_balance_transfer_self_transfer_regression.py \
            tests/p0/test_p1_cons003_future_validator_epochs.py \
            tests/p0/test_p0_consensus_core.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check

      - name: Validate generated and public-claim surfaces
        working-directory: Weall-Protocol
        run: |
          python scripts/check_generated.py
          PYTHONDONTWRITEBYTECODE=1 python scripts/check_v15_public_readiness_artifacts.py
          python scripts/check_public_claim_freshness.py
          python scripts/gen_current_verified_claims.py --check

      - name: Commit intended final tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit; intended tree already materialized."
          else
            git commit -m "Repair PR26 semantic evidence freshness and formatter gate"
          fi

      - name: Verify committed clean archive
        working-directory: Weall-Protocol
        run: |
          python scripts/check_v2_spec_clean_checkout.py

      - name: Push final tree
        run: |
          if [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/production-readiness-audit-20260925)" ]]; then
            echo "No new commit to push."
          else
            git push origin HEAD:production-readiness-audit-20260925
          fi
