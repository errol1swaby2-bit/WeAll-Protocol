name: A15 F003 PR38 Closure V6

on:
  push:
    branches: ["p0-03-production-closure-staging-20261001"]

permissions:
  contents: write

jobs:
  closure:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: p0-03-production-closure-staging-20261001

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked backend
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Reuse proven V5 integration patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          workflow = yaml.safe_load(Path(".github/workflows/a15-f003-pr38-closure-v5.yml").read_text(encoding="utf-8"))
          steps = workflow["jobs"]["closure"]["steps"]
          script = next(
              step["run"]
              for step in steps
              if isinstance(step, dict)
              and step.get("name") == "Patch closure dependency order and integration fallout"
          )
          patch_path = Path("/tmp/a15_f003_v5_integration_patch.sh")
          patch_path.write_text(script, encoding="utf-8")
          subprocess.run(["bash", str(patch_path)], check=True)
          PY

      - name: Repair self-cleaning diff accounting
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("Weall-Protocol/scripts/a15_f003_pr38_closure_v5.sh")
          text = path.read_text(encoding="utf-8")

          old = 'changed = set(subprocess.check_output(["git", "diff", "--name-only", base], text=True).splitlines())\n'
          new = old + 'changed.update(subprocess.check_output(["git", "ls-files", "--others", "--exclude-standard"], text=True).splitlines())\n'
          if text.count(old) != 1:
              raise SystemExit("tracked_diff_accounting_anchor_not_found_once")
          text = text.replace(old, new, 1)

          old_cleanup = 'rm -f "$ROOT/.github/workflows/a15-f003-pr38-closure-v5.yml"\n'
          new_cleanup = old_cleanup + 'rm -f "$ROOT/.github/workflows/a15-f003-pr38-closure-v6.yml"\n'
          if text.count(old_cleanup) != 1:
              raise SystemExit("v5_cleanup_anchor_not_found_once")
          text = text.replace(old_cleanup, new_cleanup, 1)

          old_test = 'test ! -e .github/workflows/a15-f003-pr38-closure-v5.yml\n'
          new_test = old_test + 'test ! -e .github/workflows/a15-f003-pr38-closure-v6.yml\n'
          if text.count(old_test) != 1:
              raise SystemExit("v5_cleanup_test_anchor_not_found_once")
          text = text.replace(old_test, new_test, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Execute bounded self-cleaning closure
        run: |
          cp Weall-Protocol/scripts/a15_f003_pr38_closure_v5.sh /tmp/a15_f003_pr38_closure_v6.sh
          chmod 700 /tmp/a15_f003_pr38_closure_v6.sh
          bash /tmp/a15_f003_pr38_closure_v6.sh

      - uses: actions/upload-artifact@v4
        with:
          name: a15-f003-account-cardinality-${{ github.run_id }}
          path: |
            /tmp/a15-f003-100k.json
            /tmp/a15-f003-1m.json
          if-no-files-found: error
