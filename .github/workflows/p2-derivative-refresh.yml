name: P2 Derivative Refresh

on:
  push:
    branches:
      - p2-complete-remediation-20260927
    paths:
      - .github/workflows/p2-derivative-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: p2-complete-remediation-20260927
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked backend dependencies
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Remove refresh workflow from compilation input
        run: git rm .github/workflows/p2-derivative-refresh.yml

      - name: Regenerate V2 derivatives from clean source tree
        working-directory: Weall-Protocol
        run: |
          python scripts/compile_v2_spec.py
          python scripts/compile_v2_spec.py --check
          git diff --check

      - name: Verify temporary workflow is absent from derivatives
        working-directory: Weall-Protocol
        run: |
          if grep -R --line-number --fixed-strings 'p2-derivative-refresh.yml' generated/v2 ../web/src/generated/protocolStatus.ts; then
            echo 'temporary derivative-refresh workflow leaked into generated outputs' >&2
            exit 1
          fi
          if grep -R --line-number --fixed-strings 'p2-policy-batch.yml' generated/v2 ../web/src/generated/protocolStatus.ts; then
            echo 'deleted policy workflow remains in generated outputs' >&2
            exit 1
          fi
          if grep -R --line-number --fixed-strings 'p2-remediation-autopatch.yml' generated/v2 ../web/src/generated/protocolStatus.ts; then
            echo 'deleted remediation workflow remains in generated outputs' >&2
            exit 1
          fi

      - name: Commit refreshed derivatives and self-delete
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Refresh V2 derivatives after P2 closures'
          git push origin HEAD:p2-complete-remediation-20260927
