name: P1 Final A16 Evidence Reconcile

on:
  push:
    branches:
      - p1-revalidation-after-p0-20261005
    paths:
      - .github/workflows/p1-final-a16-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p1-revalidation-after-p0-20261005
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dev environment
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Remove temporary workflow from candidate tree
        run: |
          rm -f .github/workflows/p1-final-a16-reconcile.yml

      - name: Format and lint A16 closure changes
        working-directory: Weall-Protocol
        run: |
          FILES=(
            scripts/gen_tx_semantic_assurance_v1_5.py
            scripts/generate_tx_coverage_report.py
            tests/test_a16_f006_all_tx_semantic_assurance.py
            tests/test_tx_coverage_report_current_index.py
            tests/bench_a15_f003_registration_attack.py
            src/weall/runtime/public_protocol_policy.py
            src/weall/runtime/reputation_events.py
          )
          ruff check --fix "${FILES[@]}"
          ruff format "${FILES[@]}"
          ruff check "${FILES[@]}"
          ruff format --check "${FILES[@]}"

      - name: Regenerate all-236 semantic assurance manifest
        working-directory: Weall-Protocol
        run: |
          python scripts/gen_tx_semantic_assurance_v1_5.py
          pytest -q tests/test_a16_f006_all_tx_semantic_assurance.py

      - name: Regenerate dependent exact-tree evidence twice
        working-directory: Weall-Protocol
        run: |
          for round in 1 2; do
            echo "regeneration round $round"
            python scripts/gen_failure_code_registry_v1_5.py
            if [[ -f scripts/gen_api_response_vectors_v1_5.py ]]; then
              python scripts/gen_api_response_vectors_v1_5.py
            fi
            PYTHONPATH=src python scripts/compile_v2_spec.py
            python scripts/gen_b528_b532_completion_proof_v1_5.py
            python scripts/gen_b534_b538_completion_proof_v1_5.py
            python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py
            python scripts/gen_public_beta_blocker_report_v1_5.py
            python scripts/gen_release_evidence_manifest_v1_5.py
            python scripts/gen_current_verified_claims.py
          done

      - name: Commit workflow-free exact-tree candidate locally
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No final A16 reconciliation diff produced'; exit 1; }
          git diff --check --cached
          git commit -m 'audit: reconcile exact-head A16 semantic evidence'
          echo "candidate_sha=$(git rev-parse HEAD)"
          echo "candidate_tree=$(git rev-parse HEAD^{tree})"
          test -z "$(git status --porcelain)"

      - name: Verify exact committed candidate
        working-directory: Weall-Protocol
        run: |
          python scripts/check_generated.py
          python scripts/gen_tx_semantic_assurance_v1_5.py --check
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          python scripts/check_v2_spec_clean_checkout.py
          python scripts/gen_b528_b532_completion_proof_v1_5.py --check
          python scripts/gen_b534_b538_completion_proof_v1_5.py --check
          python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py --check
          PYTHONDONTWRITEBYTECODE=1 python scripts/check_v15_public_readiness_artifacts.py
          python scripts/check_public_claim_freshness.py
          python scripts/gen_current_verified_claims.py --check
          pytest -q \
            tests/test_a16_f006_all_tx_semantic_assurance.py \
            tests/test_constitution_and_public_payload_policy.py \
            tests/test_public_only_protocol_redesign.py \
            tests/test_reputation_matrix_completion_v1_5.py \
            tests/test_tx_coverage_report_current_index.py
          python tests/bench_a15_f003_registration_attack.py --accounts 4 > /tmp/a15-smoke.json
          cat /tmp/a15-smoke.json
          test -z "$(git status --porcelain)"

      - name: Push verified workflow-free candidate
        run: |
          set -Eeuo pipefail
          test ! -e .github/workflows/p1-final-a16-reconcile.yml
          test -z "$(git status --porcelain)"
          git push origin HEAD:p1-revalidation-after-p0-20261005
