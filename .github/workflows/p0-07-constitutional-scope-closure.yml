name: P0-07 constitutional scope closure

on:
  push:
    branches: ["p0-03-production-closure-staging-20261001"]
    paths:
      - ".github/workflows/p0-07-constitutional-scope-closure.yml"

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Weall-Protocol
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: p0-03-production-closure-staging-20261001

      - name: Guard exact P0-05 baseline plus temporary P0-07 surfaces only
        working-directory: .
        run: |
          set -euo pipefail
          BASE="65329c71df7a2f029760d49fc57b21beffd650cc"
          git merge-base --is-ancestor "${BASE}" HEAD
          mapfile -t CHANGED < <(git diff --name-only "${BASE}"...HEAD | sort)
          printf '%s\n' "${CHANGED[@]}"
          EXPECTED=(
            ".github/workflows/p0-07-constitutional-scope-closure.yml"
            "Weall-Protocol/scripts/repair_p0_07_constitutional_scope_closure.py"
          )
          test "${#CHANGED[@]}" -eq "${#EXPECTED[@]}"
          for i in "${!EXPECTED[@]}"; do
            test "${CHANGED[$i]}" = "${EXPECTED[$i]}"
          done

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked backend
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Apply bounded P0-07 repair
        run: |
          set -euo pipefail
          ruff format scripts/repair_p0_07_constitutional_scope_closure.py
          ruff check scripts/repair_p0_07_constitutional_scope_closure.py
          python scripts/repair_p0_07_constitutional_scope_closure.py
          python - <<'PY'
          from pathlib import Path

          path = Path("../docs/audit/WeAll-A01-A20-P0-Closure-Status-20260930.md")
          text = path.read_text(encoding="utf-8")
          old = (
              "| P0-07 Governance electorate / proposal binding / constitutional authority | "
              "A09-F001..F004, A16-F005 | PARTIAL — RUNTIME ROOTS CLOSED / ASSURANCE PENDING |"
          )
          new = (
              "| P0-07 Governance electorate / proposal binding / constitutional authority | "
              "A09-F001..F004, A16-F005 | PARTIAL |"
          )
          if text.count(old) != 1:
              raise SystemExit("expected exactly one P0-07 extended status cell")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          ruff check --fix \
            src/weall/runtime/apply/governance.py \
            src/weall/runtime/apply/protocol.py \
            tests/test_p0_07_constitutional_scope_closure.py
          ruff format \
            src/weall/runtime/apply/governance.py \
            src/weall/runtime/apply/protocol.py \
            tests/test_p0_07_constitutional_scope_closure.py
          ruff check \
            src/weall/runtime/apply/governance.py \
            src/weall/runtime/apply/protocol.py \
            tests/test_p0_07_constitutional_scope_closure.py

      - name: Focused constitutional authority regressions
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_p0_07_constitutional_scope_closure.py \
            tests/test_p0_governance_economics_closure.py \
            tests/test_governance_no_creator_fallback_for_executable_prod.py \
            tests/test_constitution_upgrade_height_scheduled_lifecycle.py \
            tests/prod/test_protocol_upgrade_execution_hardening_plan.py

      - name: Remove temporary P0-07 repair surfaces
        working-directory: .
        run: |
          set -euo pipefail
          rm -f Weall-Protocol/scripts/repair_p0_07_constitutional_scope_closure.py
          rm -f .github/workflows/p0-07-constitutional-scope-closure.yml

      - name: Regenerate exact-tree evidence
        run: |
          set -euo pipefail
          python scripts/gen_b528_b532_completion_proof_v1_5.py
          python scripts/gen_b534_b538_completion_proof_v1_5.py
          python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py
          python scripts/refresh_v2_semantic_reviews.py \
            --tx-type CONSTITUTION_UPGRADE_DECLARE \
            --tx-type CONSTITUTION_UPGRADE_ACTIVATE \
            --tx-type GOV_PROPOSAL_CREATE \
            --tx-type GOV_PROPOSAL_EDIT \
            --register-failure forbidden:constitutional_amendment_process_not_enabled \
            --register-failure forbidden:constitutional_activation_scope_disabled_pending_normative_process \
            --reviewed-at 2026-10-04T04:33:00Z \
            --reviewer "WeAll Protocol Maintainer acceptance snapshot (AI-assisted); independent launch review deferred"
          python scripts/compile_v2_spec.py
          python scripts/gen_failure_code_registry_v1_5.py
          python scripts/gen_api_response_vectors_v1_5.py
          PYTHONPATH=src:scripts python scripts/gen_public_beta_blocker_report_v1_5.py
          PYTHONPATH=src python scripts/gen_release_evidence_manifest_v1_5.py
          python scripts/gen_current_verified_claims.py
          python scripts/compile_v2_spec.py

      - name: Validate generated and claim contract
        run: |
          set -euo pipefail
          python scripts/check_generated.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          PYTHONDONTWRITEBYTECODE=1 python scripts/check_v15_public_readiness_artifacts.py
          python scripts/check_public_claim_freshness.py
          python scripts/gen_current_verified_claims.py --check

      - name: Full backend regression
        run: |
          set -euo pipefail
          pytest -q

      - name: Commit final workflow-free tree
        working-directory: .
        run: |
          set -euo pipefail
          git status --short
          git add -A
          test -n "$(git diff --cached --name-only)"
          test -z "$(git diff --cached --diff-filter=ACMRTUXB --name-only -- \
            .github/workflows/p0-07-constitutional-scope-closure.yml \
            Weall-Protocol/scripts/repair_p0_07_constitutional_scope_closure.py)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Close P0-07 constitutional activation scope"
          git push origin HEAD:p0-03-production-closure-staging-20261001
