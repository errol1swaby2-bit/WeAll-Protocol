name: Claim evidence hardening one-shot

on:
  push:
    branches:
      - claims-fail-closed-evidence-hardening

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply bounded repair
        run: python .github/claim_evidence_repair_once.py

      - name: Install locked backend dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          cd Weall-Protocol
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Focused validation
        shell: bash
        run: |
          set -Eeuo pipefail
          cd Weall-Protocol
          PYTHONPATH=src python -m pytest -q tests/test_current_verified_claims_fail_closed.py
          PYTHONPATH=src python scripts/check_public_claim_freshness.py
          PYTHONPATH=src python scripts/gen_current_verified_claims.py --check
          cd ..
          git diff --check

      - name: Commit repair and remove one-shot helpers
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -- .github/claim_evidence_repair_once.py
          rm -- .github/workflows/claims-fail-closed-evidence-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Harden current verified claim evidence ingestion'
          git push origin HEAD:claims-fail-closed-evidence-hardening
