name: Refresh V2 derivatives

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-readiness-audit-20260925
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked development environment
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps
      - name: Regenerate and verify V2 derivatives
        working-directory: Weall-Protocol
        run: |
          PYTHONPATH=src python scripts/compile_v2_spec.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          python scripts/check_generated.py
          python scripts/check_v2_spec_clean_checkout.py
          PYTHONDONTWRITEBYTECODE=1 python scripts/check_v15_public_readiness_artifacts.py
          python scripts/check_public_claim_freshness.py
          python scripts/gen_current_verified_claims.py --check
      - name: Commit deterministic derivative refresh
        run: |
          set -Eeuo pipefail
          git status --short
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No derivative changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Weall-Protocol/generated/v2 Weall-Protocol/web/src/generated/protocolStatus.ts
          git diff --cached --check
          git commit -m 'chore: refresh deterministic V2 derivatives'
          git push origin HEAD:production-readiness-audit-20260925
