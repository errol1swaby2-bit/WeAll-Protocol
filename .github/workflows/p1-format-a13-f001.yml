name: P1 Format A13 F001 Canonical Identity

on:
  push:
    branches:
      - p1-revalidation-after-p0-20261005
    paths:
      - .github/workflows/p1-format-a13-f001.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p1-revalidation-after-p0-20261005
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dev environment
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Format and verify A13-F001 files
        working-directory: Weall-Protocol
        run: |
          FILES=(
            src/weall/crypto/pq_mldsa.py
            src/weall/crypto/account_keys.py
            src/weall/runtime/apply/identity.py
            src/weall/runtime/sigverify.py
            src/weall/runtime/genesis_bootstrap.py
            tests/test_p1_a13_key_identity_canonicalization.py
          )
          ruff check --fix "${FILES[@]}"
          ruff format "${FILES[@]}"
          ruff check "${FILES[@]}"
          ruff format --check "${FILES[@]}"
          pytest -q \
            tests/test_p1_a13_key_identity_canonicalization.py \
            tests/test_account_pq_key_schema.py \
            tests/test_priority0_account_key_normalization.py \
            tests/test_m2_account_recovery_and_tier2_lifecycle.py

      - name: Commit formatted workflow-free tree
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/p1-format-a13-f001.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No A13-F001 format diff produced'; exit 1; }
          git diff --check --cached
          git commit -m 'style: format A13 canonical key identity'
          git push origin HEAD:p1-revalidation-after-p0-20261005
