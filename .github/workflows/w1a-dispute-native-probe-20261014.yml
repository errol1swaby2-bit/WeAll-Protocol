name: W1-A isolated native dispute closure proof + one-time derivatives

on:
  push:
    branches:
      - audit/w1a-dispute-native-proof-20261014

permissions:
  contents: write

jobs:
  native-dispute-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked native test environment
        run: |
          cd Weall-Protocol
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install -e . --no-deps
      - name: Format test and run native/adjacent W1-A regressions
        run: |
          cd Weall-Protocol
          ruff format tests/test_rem_w1a_r06_f001_canonical_scheduler_order.py
          ruff format --check tests/test_rem_w1a_r06_f001_canonical_scheduler_order.py
          python -m pytest -q tests/test_rem_w1a_r06_f001_canonical_scheduler_order.py
          python -m pytest -q tests/test_system_tx_completeness.py tests/test_dispute_followups.py tests/test_dispute_height_lifecycle_boundaries.py tests/test_constitutional_procedure_clock.py
      - name: Remove temporary workflow from the final source tree
        run: git rm -- .github/workflows/w1a-dispute-native-probe-20261014.yml
      - name: Refresh source-bound proof artifacts
        run: |
          cd Weall-Protocol
          python scripts/gen_b528_b532_completion_proof_v1_5.py
          python scripts/gen_b534_b538_completion_proof_v1_5.py
          python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py
          python scripts/gen_api_contract_map.py
          python scripts/gen_failure_code_registry_v1_5.py
          python scripts/gen_release_evidence_manifest_v1_5.py
          python scripts/gen_public_beta_blocker_report_v1_5.py
          python scripts/gen_current_verified_claims.py
          python scripts/compile_v2_spec.py
          python scripts/gen_b528_b532_completion_proof_v1_5.py --check
          python scripts/gen_b534_b538_completion_proof_v1_5.py --check
          python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py --check
          python scripts/gen_release_evidence_manifest_v1_5.py --check
          python scripts/gen_current_verified_claims.py --check
          python scripts/compile_v2_spec.py --check
      - name: Commit verified isolated proof tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- .github/workflows Weall-Protocol/src/weall/runtime/dispute_engine.py Weall-Protocol/tests/test_rem_w1a_r06_f001_canonical_scheduler_order.py Weall-Protocol/generated Weall-Protocol/docs/CURRENT_VERIFIED_CLAIMS.md web/src/generated/protocolStatus.ts
          git diff --cached --check
          git commit -m 'test(w1a): validate native dispute receipt and regenerate exact-source derivatives'
          git push origin HEAD:audit/w1a-dispute-native-proof-20261014
      - name: Check clean checkout derivative sources
        run: |
          cd Weall-Protocol
          python scripts/check_v2_spec_clean_checkout.py
