name: W1-A isolated native dispute closure probe

on:
  push:
    branches:
      - audit/w1a-dispute-native-proof-20261014

permissions:
  contents: read

jobs:
  native-dispute-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Weall-Protocol
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked native test environment
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install -e . --no-deps
      - name: Check new test format
        run: |
          ruff format tests/test_rem_w1a_r06_f001_canonical_scheduler_order.py
          ruff format --check tests/test_rem_w1a_r06_f001_canonical_scheduler_order.py
      - name: Run clean genesis dispute real-block witness
        run: |
          python -m pytest -q -vv \
            tests/test_rem_w1a_r06_f001_canonical_scheduler_order.py::test_clean_database_two_block_dispute_replay_omission_reorder_and_restart
      - name: Run rest of W1-A native regressions
        run: python -m pytest -q tests/test_rem_w1a_r06_f001_canonical_scheduler_order.py
