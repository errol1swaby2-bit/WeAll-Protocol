name: PR77 severe appeal threshold and fresh-panel safety

on:
  pull_request:
    paths:
      - Weall-Protocol/src/weall/runtime/apply/dispute.py
      - Weall-Protocol/tests/test_pr77_severe_appeal_twenty_vote_guard.py
      - .github/workflows/pr77-severe-appeal-20-vote-guard.yml

permissions:
  contents: read

jobs:
  appeal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        working-directory: Weall-Protocol
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install -e . --no-deps
      - name: Check severe appeal without authorizing sanctions
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          ruff check src/weall/runtime/apply/dispute.py tests/test_pr77_severe_appeal_twenty_vote_guard.py
          pytest -q tests/test_pr77_severe_appeal_twenty_vote_guard.py tests/test_pr77_severe_initial_20_vote_guard.py tests/test_m3_closure_regressions.py tests/test_pr77_severe_account_finality_no_go.py
