name: P1 Full Closure Rerun 20260927

on:
  push:
    branches: ["p1-full-closure-rerun-20260927"]

permissions:
  contents: read
  actions: read
  checks: read

jobs:
  p1-full-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      TARGET_SHA: a555892cdec04bec85961af843bec75713b44fc7
      TARGET_TREE: 89cadcac77b3657e051e2e497572d94bed085d41
    steps:
      - name: Checkout exact current-main freeze
        uses: actions/checkout@v4
        with:
          ref: a555892cdec04bec85961af843bec75713b44fc7
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify immutable audit anchor
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Install locked backend environment
        working-directory: Weall-Protocol
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Run full P1 closure audit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          ART="$RUNNER_TEMP/WeAll-P1-Full-Closure-Rerun-20260927"
          BACKEND="$GITHUB_WORKSPACE/Weall-Protocol"
          rm -rf "$ART"
          mkdir -p "$ART"/{logs,proof,meta}
          RESULTS="$ART/gate-results.tsv"
          : > "$RESULTS"

          run_gate() {
            local name="$1" rel="$2"; shift 2
            local log="$ART/$rel" rc command_text
            mkdir -p "$(dirname "$log")"
            printf -v command_text '%q ' "$@"
            echo "[P1-RERUN] $name"
            set +e
            ( set -o pipefail; "$@" ) >"$log" 2>&1
            rc=$?
            set -e
            if [[ $rc -eq 0 ]]; then
              printf '%s\tpassed\t0\t%s\t%s\n' "$name" "$rel" "$command_text" >> "$RESULTS"
              echo "[P1-RERUN] PASS $name"
            else
              printf '%s\tfailed\t%s\t%s\t%s\n' "$name" "$rc" "$rel" "$command_text" >> "$RESULTS"
              echo "[P1-RERUN] FAIL $name -- see $log" >&2
              return "$rc"
            fi
          }

          cat > "$ART/meta/target.txt" <<EOF
          repository=errol1swaby2-bit/WeAll-Protocol
          audit_kind=full_p1_closure_rerun
          target_commit=$TARGET_SHA
          target_tree=$TARGET_TREE
          generated_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          git show -s --format=fuller "$TARGET_SHA" > "$ART/meta/commit.txt"
          git ls-tree -r "$TARGET_SHA" > "$ART/meta/git-ls-tree.txt"
          git status --porcelain=v1 --untracked-files=all > "$ART/meta/worktree-status-before.txt"

          run_gate "dependency audit" "logs/01-dependency-audit.log" \
            bash -lc "cd '$BACKEND' && pip-audit -r requirements.lock && pip-audit -r requirements-dev.lock"

          run_gate "canon and generated artifacts" "logs/02-canon-generated.log" \
            bash -lc "cd '$BACKEND' && PYTHONPATH=src python -m tooling.canon_lint && python scripts/check_generated.py && PYTHONPATH=src python scripts/compile_v2_spec.py --check && python scripts/check_v2_spec_clean_checkout.py && PYTHONDONTWRITEBYTECODE=1 python scripts/check_v15_public_readiness_artifacts.py && python scripts/check_public_claim_freshness.py && python scripts/gen_current_verified_claims.py --check"

          run_gate "P1 targeted regression matrix" "logs/03-p1-targeted-regressions.log" \
            bash -lc "cd '$BACKEND' && PYTHONPATH=src python -m pytest -q tests/test_p1_remaining_complete_remediation.py tests/p0/test_p1_cons003_future_validator_epochs.py tests/test_balance_transfer_self_transfer_regression.py tests/test_p1_group001_scoped_reference_authority.py tests/test_consensus_equivocation_slash_execute.py"

          run_gate "P1 identity canonical-key compatibility" "logs/04-p1-identity-canonical-key.log" \
            bash -lc "cd '$BACKEND' && PYTHONPATH=src python -m pytest -q tests/test_priority0_account_key_normalization.py"

          run_gate "restart replay and convergence" "logs/05-restart-replay-convergence.log" \
            bash -lc "cd '$BACKEND' && PYTHONPATH=src python -m pytest -q tests/test_feed_persists_order_after_restart_api.py tests/test_priority1_replay_schedule_consistency.py tests/test_priority2_state_replay_determinism.py tests/test_e2e_two_node_convergence.py"

          run_gate "full backend suite" "logs/06-full-pytest.log" \
            bash -lc "cd '$BACKEND' && PYTHONPATH=src python -m pytest -q"

          python - "$GITHUB_WORKSPACE" "$ART/proof/P1_SOURCE_INVARIANT_SCAN.json" <<'PY'
          import json, sys
          from pathlib import Path
          root=Path(sys.argv[1]); out=Path(sys.argv[2])
          def r(p): return (root/p).read_text(encoding='utf-8')
          identity=r('Weall-Protocol/src/weall/runtime/apply/identity.py')
          schema=r('Weall-Protocol/src/weall/runtime/tx_schema.py')
          cons=r('Weall-Protocol/src/weall/runtime/apply/consensus.py')
          rep=r('Weall-Protocol/src/weall/runtime/reputation_accrual.py')
          builder=r('Weall-Protocol/src/weall/runtime/block_builder.py')
          econ=r('Weall-Protocol/src/weall/runtime/apply/economics.py')
          content=r('Weall-Protocol/src/weall/runtime/apply/content.py')
          dispute=r('Weall-Protocol/src/weall/runtime/apply/dispute.py')
          groups=r('Weall-Protocol/src/weall/runtime/apply/groups.py')
          treasury=r('Weall-Protocol/src/weall/runtime/apply/treasury.py')
          roles=r('Weall-Protocol/src/weall/runtime/apply/roles.py')
          scheduler=r('Weall-Protocol/src/weall/runtime/node_operator_scheduler.py')
          storage=r('Weall-Protocol/src/weall/runtime/apply/storage.py')
          tests=r('Weall-Protocol/tests/test_p1_remaining_complete_remediation.py')
          checks=[]
          def add(i, ok, evidence): checks.append({'id':i,'ok':bool(ok),'evidence':evidence})
          add('P1-NET-001', 'session_bound=False' in tests and 'identity-account:@victim' in tests, 'replayed hello cannot acquire victim durable security namespace')
          add('P1-SEC-002', 'class AccountKeyRevokePayload' in schema and 'key_id: str' in schema and 'p.get("key_id")' in identity, 'schema and handler share canonical key_id')
          add('P1-CONS-003', cons.count('_require_future_validator_epoch(') >= 4, 'future-epoch validator lifecycle guard present across covered paths')
          add('P1-CONS-004', '"delta_milli": int(delta_milli)' in rep and 'float(delta_milli)' not in rep and 'verdict = admit_tx(' in builder, 'integer reputation delta plus leader admission')
          add('P1-CONS-005', '"status": "pending_governance"' in cons and 'parent=f"equivocation:' not in cons, 'equivocation evidence requires governance rather than synthetic auto-slash')
          add('P1-ECON-001', 'self_transfer_forbidden' in econ, 'self-transfer rejection present')
          add('P1-CONTENT-001', '_require_media_mutation_authority' in content and '_require_content_target_mutation_authority' in content, 'media and target mutation authority checks present')
          add('P1-DISPUTE-001', 'out.pop("actions", None)' in dispute and 'non_content_actions' not in dispute, 'strict resolution strips juror-supplied enforcement actions')
          add('P1-GROUP-001', groups.count('group_scope_mismatch') >= 3, 'stored group scope checks present')
          add('P1-TREAS-001', 'treasury_id_mismatch' in treasury and 'stored_treasury_id' in treasury, 'stored treasury bound to caller scope')
          add('P1-ROLE-001', 'rec["suspended"] = True' in roles and 'rec.get("suspended", False)' in scheduler, 'durable suspension flag produced and consumed')
          add('P1-STOR-001', 'operator_must_match_signer' in storage, 'storage offer operator bound to signer')
          obj={'schema':'weall.p1.source-invariant-scan.rerun.v1','target_commit':'a555892cdec04bec85961af843bec75713b44fc7','checks':checks,'all_passed':all(c['ok'] for c in checks)}
          out.write_text(json.dumps(obj,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(obj,indent=2,sort_keys=True))
          if not obj['all_passed']:
              raise SystemExit(1)
          PY
          cp "$ART/proof/P1_SOURCE_INVARIANT_SCAN.json" "$ART/logs/07-source-invariant-scan.log"
          printf '%s\tpassed\t0\t%s\t%s\n' "12-P1 source invariant scan" "logs/07-source-invariant-scan.log" "python source-invariant-scan" >> "$RESULTS"

          git fetch -q origin main
          if [[ "$(git rev-parse origin/main)" != "$TARGET_SHA" ]]; then
            echo "main moved during audit; refusing current-main closure claim" > "$ART/logs/08-main-ci.log"
            printf '%s\tfailed\t2\t%s\t%s\n' "current-main CI green" "logs/08-main-ci.log" "GitHub check-runs API" >> "$RESULTS"
            exit 2
          fi

          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/check-runs" \
            > "$ART/proof/CURRENT_MAIN_CHECK_RUNS_RAW.json"

          python - "$ART/proof/CURRENT_MAIN_CHECK_RUNS_RAW.json" "$ART/proof/CURRENT_MAIN_CI.json" <<'PY'
          import json,sys
          src,out=sys.argv[1:3]
          obj=json.load(open(src,encoding='utf-8'))
          rows=[{k:r.get(k) for k in ('name','head_sha','status','conclusion','started_at','completed_at','html_url')} for r in obj.get('check_runs',[])]
          required={'backend','web','reviewer-readiness','secrets_guard'}
          by={r['name']:r for r in rows}
          missing=sorted(required-set(by))
          not_green=sorted(n for n in required if n in by and (by[n]['status']!='completed' or by[n]['conclusion']!='success'))
          result={'schema':'weall.p1.current-main-ci.rerun.v1','commit':'a555892cdec04bec85961af843bec75713b44fc7','required':sorted(required),'missing':missing,'not_green':not_green,'all_required_green':not missing and not not_green,'check_runs':sorted(rows,key=lambda x:str(x['name']))}
          open(out,'w',encoding='utf-8').write(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps(result,indent=2,sort_keys=True))
          if not result['all_required_green']:
              raise SystemExit(1)
          PY
          cp "$ART/proof/CURRENT_MAIN_CI.json" "$ART/logs/08-main-ci.log"
          printf '%s\tpassed\t0\t%s\t%s\n' "current-main CI green" "logs/08-main-ci.log" "GitHub check-runs API" >> "$RESULTS"

          git status --porcelain=v1 --untracked-files=all > "$ART/meta/worktree-status-after.txt"
          test -z "$(cat "$ART/meta/worktree-status-after.txt")"

          python - "$ART" "$TARGET_SHA" "$TARGET_TREE" "$RESULTS" <<'PY'
          import csv,hashlib,json,re,sys
          from datetime import datetime,timezone
          from pathlib import Path
          art=Path(sys.argv[1]); sha=sys.argv[2]; tree=sys.argv[3]; results=Path(sys.argv[4])
          gates=[]
          with results.open(encoding='utf-8') as f:
              for row in csv.reader(f,delimiter='\t'):
                  if not row: continue
                  name,status,rc,rel,cmd=row
                  b=(art/rel).read_bytes()
                  gates.append({'gate':name,'status':status,'exit_code':int(rc),'log':rel,'command':cmd,'log_sha256':hashlib.sha256(b).hexdigest()})
          scan=json.loads((art/'proof/P1_SOURCE_INVARIANT_SCAN.json').read_text())
          ci=json.loads((art/'proof/CURRENT_MAIN_CI.json').read_text())
          full=(art/'logs/06-full-pytest.log').read_text(encoding='utf-8',errors='replace')
          m=re.search(r'(\d+) passed(?:,\s*(\d+) skipped)?',full)
          counts={'passed':int(m.group(1)) if m else None,'skipped':int(m.group(2) or 0) if m else None}
          ok=all(g['status']=='passed' and g['exit_code']==0 for g in gates) and scan['all_passed'] and ci['all_required_green']
          manifest={'schema':'weall.p1.full-closure-rerun.v1','generated_at_utc':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),'repository':'errol1swaby2-bit/WeAll-Protocol','target_commit':sha,'target_tree':tree,'known_p1_count':12,'all_p1_invariants_passed':bool(scan['all_passed']),'all_gates_passed':bool(ok),'current_main_ci_green':bool(ci['all_required_green']),'full_pytest':counts,'gates':gates,'p1_checks':scan['checks']}
          (art/'P1_FULL_CLOSURE_RERUN_MANIFEST.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          if not ok:
              raise SystemExit('P1 full closure rerun failed')
          PY

          ( cd "$ART" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS )
          echo "P1 full closure rerun PASS for $TARGET_SHA"

      - name: Upload rerun evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WeAll-P1-Full-Closure-Rerun-20260927
          path: ${{ runner.temp }}/WeAll-P1-Full-Closure-Rerun-20260927
          if-no-files-found: warn
