name: P1 Remediate Batch 1

on:
  push:
    branches:
      - p1-revalidation-after-p0-20261005
    paths:
      - .github/workflows/p1-remediate-batch1.yml

permissions:
  contents: write

jobs:
  patch-a11-f001:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: p1-revalidation-after-p0-20261005
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked backend environment
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Apply exact A11-F001 fail-closed repair
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("Weall-Protocol/src/weall/runtime/apply/economics.py")
          text = path.read_text(encoding="utf-8")
          needle = '''    ).strip()\n\n    if amount > 0:\n        payer = _require_existing_account(state, from_account, field="from")\n'''
          replacement = '''    ).strip()\n\n    if amount > 0 and not to_account:\n        raise EconomicsApplyError(\n            "invalid_payload",\n            "fee_destination_required",\n            {"amount": int(amount)},\n        )\n\n    if amount > 0:\n        payer = _require_existing_account(state, from_account, field="from")\n'''
          count = text.count(needle)
          if count != 1:
              raise SystemExit(f"A11-F001 source anchor mismatch: expected 1 occurrence, found {count}")
          path.write_text(text.replace(needle, replacement, 1), encoding="utf-8")
          PY

      - name: Run focused A11-F001 regression
        working-directory: Weall-Protocol
        run: |
          pytest -q \
            tests/test_p1_latest_medium_closure.py \
            tests/test_economics_canon_apply_alignment.py

      - name: Canon sanity
        working-directory: Weall-Protocol
        run: |
          python -m tooling.canon_lint
          python scripts/check_generated.py

      - name: Commit proven repair to P1 branch
        run: |
          set -Eeuo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Weall-Protocol/src/weall/runtime/apply/economics.py
          git diff --cached --quiet && { echo 'No implementation change produced'; exit 1; }
          git commit -m 'fix: fail closed on fee payment without disposition'
          git push origin HEAD:p1-revalidation-after-p0-20261005
