name: PR26 Repair P1-CONS-003

on:
  push:
    branches:
      - production-readiness-audit-20260925

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: production-readiness-audit-20260925

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore consensus source and apply future-epoch guard
        run: |
          git show 1099c52efa84dddb8890291fbabd52cc0849c8ba:Weall-Protocol/src/weall/runtime/apply/consensus.py > Weall-Protocol/src/weall/runtime/apply/consensus.py
          python - <<'PY'
          from pathlib import Path

          path = Path("Weall-Protocol/src/weall/runtime/apply/consensus.py")
          text = path.read_text(encoding="utf-8")

          anchor = '''def _chain_id(state: Json) -> str:\n    p = _get_params(state)\n    cid = p.get("chain_id")\n    return _as_str(cid) or "weall"\n\n\n'''
          helper = '''def _chain_id(state: Json) -> str:\n    p = _get_params(state)\n    cid = p.get("chain_id")\n    return _as_str(cid) or "weall"\n\n\ndef _current_consensus_epoch(state: Json) -> int:\n    consensus = state.get("consensus")\n    if not isinstance(consensus, dict):\n        return 0\n    epochs = consensus.get("epochs") if isinstance(consensus.get("epochs"), dict) else {}\n    validator_set = (\n        consensus.get("validator_set")\n        if isinstance(consensus.get("validator_set"), dict)\n        else {}\n    )\n    return max(\n        _as_int(epochs.get("current"), 0),\n        _as_int(validator_set.get("epoch"), 0),\n        0,\n    )\n\n\ndef _require_future_validator_epoch(\n    state: Json, *, requested_epoch: int, field: str\n) -> None:\n    current_epoch = _current_consensus_epoch(state)\n    if int(requested_epoch) <= int(current_epoch):\n        raise ConsensusApplyError(\n            "invalid_payload",\n            "validator_lifecycle_epoch_must_be_future",\n            {\n                "field": field,\n                "requested_epoch": int(requested_epoch),\n                "current_epoch": int(current_epoch),\n            },\n        )\n\n\n'''
          if anchor not in text:
              raise SystemExit("chain-id anchor not found")
          text = text.replace(anchor, helper, 1)

          approve = '''    if activate_at_epoch <= 0:\n        raise ConsensusApplyError(\n            "invalid_payload", "missing_activate_at_epoch", {"tx_type": env.tx_type}\n        )\n\n    vroot = _ensure_validators_root(state)\n'''
          approve_new = '''    if activate_at_epoch <= 0:\n        raise ConsensusApplyError(\n            "invalid_payload", "missing_activate_at_epoch", {"tx_type": env.tx_type}\n        )\n    _require_future_validator_epoch(\n        state, requested_epoch=activate_at_epoch, field="activate_at_epoch"\n    )\n\n    vroot = _ensure_validators_root(state)\n'''
          if approve not in text:
              raise SystemExit("approve anchor not found")
          text = text.replace(approve, approve_new, 1)

          lifecycle = '''    if effective_epoch <= 0:\n        raise ConsensusApplyError(\n            "invalid_payload", "missing_effective_epoch", {"tx_type": env.tx_type}\n        )\n\n    vroot = state.get("validators")\n'''
          lifecycle_new = '''    if effective_epoch <= 0:\n        raise ConsensusApplyError(\n            "invalid_payload", "missing_effective_epoch", {"tx_type": env.tx_type}\n        )\n    _require_future_validator_epoch(\n        state, requested_epoch=effective_epoch, field="effective_epoch"\n    )\n\n    vroot = state.get("validators")\n'''
          if text.count(lifecycle) < 2:
              raise SystemExit("suspend/remove anchors not found")
          text = text.replace(lifecycle, lifecycle_new, 2)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Add focused regression coverage
        run: |
          cat > Weall-Protocol/tests/p0/test_p1_cons003_future_validator_epochs.py <<'PY'
          from __future__ import annotations

          import copy

          import pytest

          from weall.runtime.domain_dispatch import apply_tx
          from weall.runtime.errors import ApplyError


          def _env(tx_type: str, payload: dict, *, nonce: int = 1) -> dict:
              return {
                  "tx_type": tx_type,
                  "signer": "SYSTEM",
                  "nonce": nonce,
                  "sig": "",
                  "payload": payload,
                  "system": True,
                  "parent": "gov:exec:p1-cons003",
              }


          def _seed_current_epoch(state: dict, epoch: int) -> None:
              state.setdefault("consensus", {})
              state["consensus"]["epochs"] = {"current": epoch, "events": []}
              state["consensus"]["validator_set"] = {
                  "active_set": ["alice"],
                  "epoch": epoch,
              }
              state.setdefault("roles", {}).setdefault("validators", {})["active_set"] = ["alice"]
              state.setdefault("validators", {}).setdefault("registry", {})["alice"] = {
                  "account": "alice",
                  "pubkey": "mldsa:alice",
                  "status": "active",
                  "active": True,
              }


          @pytest.mark.parametrize(
              ("tx_type", "payload"),
              [
                  ("VALIDATOR_CANDIDATE_APPROVE", {"account": "bob", "activate_at_epoch": 4}),
                  ("VALIDATOR_SUSPEND", {"account": "alice", "effective_epoch": 4, "reason": "test"}),
                  ("VALIDATOR_REMOVE", {"account": "alice", "effective_epoch": 4, "reason": "test"}),
              ],
          )
          def test_validator_lifecycle_rejects_current_epoch_without_mutation(
              base_state, tx_type: str, payload: dict
          ) -> None:
              state = copy.deepcopy(base_state)
              _seed_current_epoch(state, 4)
              if tx_type == "VALIDATOR_CANDIDATE_APPROVE":
                  state["validators"]["registry"]["bob"] = {
                      "account": "bob",
                      "pubkey": "mldsa:bob",
                      "status": "candidate",
                      "active": False,
                  }
              before = copy.deepcopy(state)
              with pytest.raises(ApplyError) as exc_info:
                  apply_tx(state, _env(tx_type, payload))
              assert exc_info.value.code == "invalid_payload"
              assert exc_info.value.reason == "validator_lifecycle_epoch_must_be_future"
              assert state == before


          def test_validator_candidate_approve_accepts_next_epoch(base_state) -> None:
              state = copy.deepcopy(base_state)
              _seed_current_epoch(state, 4)
              state["validators"]["registry"]["bob"] = {
                  "account": "bob",
                  "pubkey": "mldsa:bob",
                  "status": "candidate",
                  "active": False,
              }
              out = apply_tx(
                  state,
                  _env("VALIDATOR_CANDIDATE_APPROVE", {"account": "bob", "activate_at_epoch": 5}),
              )
              assert out["status"] == "pending_activation"
              assert state["consensus"]["validator_set"]["pending"]["activate_at_epoch"] == 5
          PY

      - name: Install locked backend dependencies
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Format and validate repair
        working-directory: Weall-Protocol
        run: |
          ruff format src/weall/runtime/apply/consensus.py tests/p0/test_p1_cons003_future_validator_epochs.py
          ruff format --check src/weall/runtime/apply/consensus.py tests/p0/test_p1_cons003_future_validator_epochs.py
          ruff check src/weall/runtime/apply/consensus.py tests/p0/test_p1_cons003_future_validator_epochs.py
          pytest -q tests/p0/test_p1_cons003_future_validator_epochs.py tests/p0/test_p0_consensus_core.py

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Weall-Protocol/src/weall/runtime/apply/consensus.py Weall-Protocol/tests/p0/test_p1_cons003_future_validator_epochs.py
          git commit -m "Fix P1-CONS-003 validator lifecycle epoch scheduling"
          git push origin HEAD:production-readiness-audit-20260925
