name: Temporary V2 refresh after claims update

on:
  push:
    branches:
      - p0-03-ci-repair-20261001

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked backend dependencies
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Refresh helper-free V2 derivative graph
        run: |
          set -Eeuo pipefail
          rm .github/workflows/tmp-v2-after-claims-refresh.yml
          cd Weall-Protocol
          python scripts/gen_current_verified_claims.py --check
          PYTHONPATH=src python scripts/compile_v2_spec.py
          cd ..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(ci): refresh V2 derivatives after claims update [tested-tree]'
          test ! -e .github/workflows/tmp-v2-after-claims-refresh.yml
          cd Weall-Protocol
          python scripts/gen_current_verified_claims.py --check
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          python scripts/check_v2_spec_clean_checkout.py
          cd ..
          git push origin HEAD:p0-03-ci-repair-20261001
