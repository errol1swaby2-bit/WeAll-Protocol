name: P1 Reconcile A15 Benchmark Posture

on:
  push:
    branches:
      - p1-revalidation-after-p0-20261005
    paths:
      - .github/workflows/p1-reconcile-a15-benchmark.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p1-revalidation-after-p0-20261005
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked backend environment
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Prove repaired A15 scarcity benchmark
        working-directory: Weall-Protocol
        run: |
          ruff format --check tests/bench_a15_f003_registration_attack.py
          ruff check tests/bench_a15_f003_registration_attack.py
          python tests/bench_a15_f003_registration_attack.py --accounts 4 \
            > /tmp/a15-f003-registration-attack.json
          cat /tmp/a15-f003-registration-attack.json
          python - <<'PY'
          import json
          from pathlib import Path
          row = json.loads(Path("/tmp/a15-f003-registration-attack.json").read_text())
          assert row["accounts"] == 4
          assert row["all_solved_work_verified"] is True
          assert row["all_solved_work_passed_canonical_block_admission"] is True
          assert row["all_admissions_verified_valid_mldsa_signatures"] is True
          assert row["signature_runtime_mode"] == "public-testnet"
          assert row["production_mainnet_mldsa_admission_claimed"] is False
          assert row["production_registration_work_parameters_used"] is True
          PY

      - name: Remove temporary workflow from candidate tree
        run: |
          rm -f .github/workflows/p1-reconcile-a15-benchmark.yml

      - name: Regenerate dependent evidence twice
        working-directory: Weall-Protocol
        run: |
          for round in 1 2; do
            echo "regeneration round $round"
            python scripts/gen_failure_code_registry_v1_5.py
            if [[ -f scripts/gen_api_response_vectors_v1_5.py ]]; then
              python scripts/gen_api_response_vectors_v1_5.py
            fi
            PYTHONPATH=src python scripts/compile_v2_spec.py
            python scripts/gen_b528_b532_completion_proof_v1_5.py
            python scripts/gen_b534_b538_completion_proof_v1_5.py
            python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py
            python scripts/gen_public_beta_blocker_report_v1_5.py
            python scripts/gen_release_evidence_manifest_v1_5.py
            python scripts/gen_current_verified_claims.py
          done

      - name: Commit workflow-free benchmark reconciliation candidate
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No reconciliation diff produced'; exit 1; }
          git diff --check --cached
          git commit -m 'audit: reconcile A15 scarcity benchmark posture'
          echo "candidate_sha=$(git rev-parse HEAD)"
          echo "candidate_tree=$(git rev-parse HEAD^{tree})"
          test -z "$(git status --porcelain)"

      - name: Verify committed candidate
        working-directory: Weall-Protocol
        run: |
          python scripts/check_generated.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          python scripts/check_v2_spec_clean_checkout.py
          python scripts/gen_b528_b532_completion_proof_v1_5.py --check
          python scripts/gen_b534_b538_completion_proof_v1_5.py --check
          python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py --check
          PYTHONDONTWRITEBYTECODE=1 python scripts/check_v15_public_readiness_artifacts.py
          python scripts/check_public_claim_freshness.py
          python scripts/gen_current_verified_claims.py --check
          python tests/bench_a15_f003_registration_attack.py --accounts 4 \
            > /tmp/a15-f003-registration-attack-final.json
          python - <<'PY'
          import json
          from pathlib import Path
          row = json.loads(Path("/tmp/a15-f003-registration-attack-final.json").read_text())
          assert row["signature_runtime_mode"] == "public-testnet"
          assert row["production_mainnet_mldsa_admission_claimed"] is False
          assert row["all_admissions_verified_valid_mldsa_signatures"] is True
          PY
          test -z "$(git status --porcelain)"

      - name: Push verified workflow-free candidate
        run: |
          set -Eeuo pipefail
          test ! -e .github/workflows/p1-reconcile-a15-benchmark.yml
          test -z "$(git status --porcelain)"
          git push origin HEAD:p1-revalidation-after-p0-20261005
