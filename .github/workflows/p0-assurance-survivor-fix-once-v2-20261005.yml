name: P0 assurance survivor fix once v2

on:
  push:
    branches: ["p0-03-production-closure-staging-20261001"]

permissions:
  contents: write

concurrency:
  group: p0-assurance-survivor-fix-once-v2-20261005
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: p0-03-production-closure-staging-20261001
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked backend
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Bind surviving P0-08 mutant to existing negative activation test
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/p0_assurance.py')
          text = path.read_text(encoding='utf-8')
          old = '        tests=("tests/test_economics_activation_requires_hardened_governance_electorate.py",),\n'
          new = '''        tests=(\n            "tests/test_economics_activation_requires_hardened_governance_electorate.py",\n            "tests/test_launch_gate_proof_surfaces.py",\n        ),\n'''
          if text.count(old) != 1:
              raise SystemExit('p0_08_mutation_test_binding_anchor_not_found_once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          ruff format tests/p0_assurance.py
          ruff check tests/p0_assurance.py

      - name: Remove all one-shot helpers before generation
        run: |
          set -Eeuo pipefail
          git rm -f .github/workflows/p0-assurance-survivor-fix-once-20261005.yml
          git rm -f .github/workflows/p0-assurance-survivor-fix-once-v2-20261005.yml

      - name: Regenerate deterministic V2 derivatives
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          PYTHONPATH=src python scripts/compile_v2_spec.py

      - name: Require all non-equivalent P0 mutants killed
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python tests/p0_assurance.py gate \
            --report artifacts/p0-assurance/p0_assurance_report.json \
            --timeout-seconds 120
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('artifacts/p0-assurance/p0_assurance_report.json').read_text())
          summary = report['mutation_summary']
          assert summary['non_equivalent_total'] == 13, summary
          assert summary['killed'] == 13, summary
          assert summary['survived'] == [], summary
          assert summary['invalid'] == [], summary
          assert report['gate']['passed'] is True, report['gate']
          print('OK: P0 assurance gate killed 13/13 non-equivalent mutants')
          PY

      - name: Commit helper-free candidate locally
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test: kill P0 economics activation survivor'
          echo "candidate_sha=$(git rev-parse HEAD)"
          echo "candidate_tree=$(git rev-parse HEAD^{tree})"

      - name: Verify exact committed candidate from clean checkout
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          test ! -e ../.github/workflows/p0-assurance-survivor-fix-once-20261005.yml
          test ! -e ../.github/workflows/p0-assurance-survivor-fix-once-v2-20261005.yml
          python scripts/check_generated.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          python scripts/check_v2_spec_clean_checkout.py
          PYTHONDONTWRITEBYTECODE=1 python scripts/check_v15_public_readiness_artifacts.py
          python scripts/check_public_claim_freshness.py
          python scripts/gen_current_verified_claims.py --check
          git diff --exit-code

      - name: Push exact verified helper-free candidate
        run: |
          set -Eeuo pipefail
          git push origin HEAD:p0-03-production-closure-staging-20261001
