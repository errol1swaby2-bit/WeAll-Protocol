name: PoH PR one-time B5xx proof regeneration

on:
  push:
    branches:
      - fix/poh-two-node-reviewer-readiness-20261013

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reproducible backend dependencies
        run: |
          cd Weall-Protocol
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install -e . --no-deps
      - name: Remove temporary workflow before source inventory scan
        run: git rm -- .github/workflows/poh-proof-freshness-sync-20261013.yml
      - name: Rerun the actual three B5xx proof generators
        run: |
          cd Weall-Protocol
          python scripts/gen_b528_b532_completion_proof_v1_5.py
          python scripts/gen_b534_b538_completion_proof_v1_5.py
          python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py
          python scripts/gen_b528_b532_completion_proof_v1_5.py --check
          python scripts/gen_b534_b538_completion_proof_v1_5.py --check
          python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py --check
      - name: Recompile and check v2 source-bound evidence catalog
        run: |
          cd Weall-Protocol
          python scripts/compile_v2_spec.py
          python scripts/compile_v2_spec.py --check
      - name: Commit updated proof results and exact source fingerprints
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- Weall-Protocol/generated/b528_b532_completion_proof_v1_5.json Weall-Protocol/generated/b534_b538_completion_proof_v1_5.json Weall-Protocol/generated/b567_b571_autonomous_mechanics_proof_v1_5.json Weall-Protocol/generated/v2 web/src/generated/protocolStatus.ts
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix(ci): refresh B528, B534 and B567 source-bound rehearsal proofs'
          git push origin HEAD:fix/poh-two-node-reviewer-readiness-20261013
      - name: Verify canonical V2 archive contents
        run: |
          cd Weall-Protocol
          python scripts/check_v2_spec_clean_checkout.py
