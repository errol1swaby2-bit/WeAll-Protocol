name: P0 helper close P0-12 claim binding

on:
  push:
    branches:
      - p0-tooling-exact-v2-refresh-20261001
    paths:
      - .github/workflows/p0-helper-close-p012.yml
      - .github/scripts/p0_close_p012.py

permissions:
  contents: write

jobs:
  close-p012:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout product branch
        uses: actions/checkout@v4
        with:
          ref: p0-evidence-closure-a10-a12-vectors-20261001
          fetch-depth: 0

      - name: Checkout helper scripts
        uses: actions/checkout@v4
        with:
          ref: p0-tooling-exact-v2-refresh-20261001
          path: .p0-helper
          sparse-checkout: .github/scripts

      - name: Assert expected product base
        run: test "$(git rev-parse HEAD)" = "ed7776f41cea2ee4d6026dc0f26fda9e7096dc00"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: |
          set -Eeuo pipefail
          cd Weall-Protocol
          python -m pip install --upgrade 'pip==26.2.1'
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps
          cd ../web
          npm ci

      - name: Apply P0-12 bounded patch
        run: python .p0-helper/.github/scripts/p0_close_p012.py

      - name: Format and focused tests
        run: |
          set -Eeuo pipefail
          cd Weall-Protocol
          ruff format scripts/gen_current_verified_claims.py tests/test_p0_claim_audit_binding.py
          ruff check scripts/gen_current_verified_claims.py tests/test_p0_claim_audit_binding.py
          ruff format --check scripts/gen_current_verified_claims.py tests/test_p0_claim_audit_binding.py
          pytest -q tests/test_p0_claim_audit_binding.py tests/test_current_verified_claims_fail_closed.py

      - name: Regenerate exact claims and V2 derivatives
        run: |
          set -Eeuo pipefail
          cd Weall-Protocol
          PYTHONPATH=src python scripts/gen_current_verified_claims.py
          PYTHONPATH=src python scripts/compile_v2_spec.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          python scripts/check_generated.py
          python scripts/check_public_claim_freshness.py
          PYTHONDONTWRITEBYTECODE=1 python scripts/check_v15_public_readiness_artifacts.py

      - name: Commit bounded P0-12 closure
        run: |
          set -Eeuo pipefail
          rm -rf .p0-helper
          BAD="$(git status --short --untracked-files=all | awk '{p=$2; if (p != "Weall-Protocol/scripts/gen_current_verified_claims.py" && p != "Weall-Protocol/tests/test_p0_claim_audit_binding.py" && p != "docs/audit/WeAll-A01-A20-P0-Closure-Status-20260930.md" && p != "Weall-Protocol/generated/current_verified_claims.json" && p != "Weall-Protocol/docs/CURRENT_VERIFIED_CLAIMS.md" && p != "web/src/generated/protocolStatus.ts" && p !~ /^Weall-Protocol\/generated\/v2\//) print}')"
          test -z "$BAD"
          git add Weall-Protocol/scripts/gen_current_verified_claims.py
          git add Weall-Protocol/tests/test_p0_claim_audit_binding.py
          git add docs/audit/WeAll-A01-A20-P0-Closure-Status-20260930.md
          git add Weall-Protocol/generated/current_verified_claims.json
          git add Weall-Protocol/docs/CURRENT_VERIFIED_CLAIMS.md
          git add Weall-Protocol/generated/v2
          git add web/src/generated/protocolStatus.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(p0): bind current claims to open audit findings'
          test -z "$(git status --short --untracked-files=all)"

      - name: Verify exact committed generated state
        run: |
          set -Eeuo pipefail
          cd Weall-Protocol
          python scripts/check_generated.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          python scripts/check_v2_spec_clean_checkout.py
          python scripts/gen_current_verified_claims.py --check
          python scripts/check_public_claim_freshness.py
          PYTHONDONTWRITEBYTECODE=1 python scripts/check_v15_public_readiness_artifacts.py

      - name: Restore historical M2/M3 evidence
        run: bash scripts/restore_m2_m3_evidence_from_git.sh --destination "${GITHUB_WORKSPACE}"

      - name: Full backend suite
        working-directory: Weall-Protocol
        run: pytest -q

      - name: Reviewer readiness
        working-directory: Weall-Protocol
        env:
          WEALL_RELEASE_TREE_ALREADY_VERIFIED: '1'
        run: bash scripts/reviewer_production_readiness_gate.sh

      - name: Push validated product branch
        run: git push origin HEAD:p0-evidence-closure-a10-a12-vectors-20261001
