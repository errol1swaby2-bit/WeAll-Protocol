name: Temporary verification-stage exact-source regeneration

on:
  push:
    branches:
      - ux/focused-shell-menu-context-drawer-20261015
    paths:
      - .github/workflows/temp-verification-stage-derivatives-20261015.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Locked backend install
        working-directory: Weall-Protocol
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install -e . --no-deps
      - name: Remove temporary workflow before source-bound generation
        run: |
          git rm .github/workflows/temp-verification-stage-derivatives-20261015.yml
      - name: Recompile and verify exact-source V2 derivatives
        working-directory: Weall-Protocol
        run: |
          PYTHONPATH=src:scripts python scripts/compile_v2_spec.py
          PYTHONPATH=src:scripts python scripts/compile_v2_spec.py --check
      - name: Commit, independently verify Git archive, push
        run: |
          set -euo pipefail
          git config user.name "weall-reviewer-ci"
          git config user.email "weall-reviewer-ci@users.noreply.github.com"
          git add -u Weall-Protocol/generated/v2 web/src/generated/protocolStatus.ts
          git diff --cached --name-only
          git commit -m "chore(web): rebind v2 derivatives to final focused verification layout"
          (cd Weall-Protocol && PYTHONPATH=src:scripts python scripts/compile_v2_spec.py --check && python scripts/check_v2_spec_clean_checkout.py)
          git push origin "HEAD:refs/heads/ux/focused-shell-menu-context-drawer-20261015"
