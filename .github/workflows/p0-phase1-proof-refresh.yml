name: P0 Phase1 proof refresh

on:
  push:
    branches:
      - p0-03-production-closure-staging-20261001
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: p0-03-production-closure-staging-20261001
          fetch-depth: 0

      - name: Guard expected parent
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD^)" = "02177b00693c41705824e394f0188f55fefbe267"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked backend dependencies
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Remove temporary workflow before generation
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/p0-phase1-proof-refresh.yml

      - name: Regenerate deterministic proof artifacts
        working-directory: Weall-Protocol
        env:
          PYTHONPATH: src:scripts
        run: |
          set -Eeuo pipefail
          python scripts/gen_b528_b532_completion_proof_v1_5.py
          python scripts/gen_b534_b538_completion_proof_v1_5.py
          python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py
          python scripts/gen_b528_b532_completion_proof_v1_5.py --check
          python scripts/gen_b534_b538_completion_proof_v1_5.py --check
          python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py --check

      - name: Regenerate V2 derivatives from final source tree
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python scripts/compile_v2_spec.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          python scripts/check_generated.py

      - name: Guard changed paths
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from __future__ import annotations

          import subprocess
          import sys

          allowed_exact = {
              ".github/workflows/p0-phase1-proof-refresh.yml",
              "Weall-Protocol/generated/b528_b532_completion_proof_v1_5.json",
              "Weall-Protocol/generated/b534_b538_completion_proof_v1_5.json",
              "Weall-Protocol/generated/b567_b571_autonomous_mechanics_proof_v1_5.json",
              "web/src/generated/protocolStatus.ts",
          }
          allowed_prefixes = ("Weall-Protocol/generated/v2/",)
          changed = [
              line.strip()
              for line in subprocess.check_output(
                  ["git", "diff", "--name-only", "HEAD"], text=True
              ).splitlines()
              if line.strip()
          ]
          unexpected = [
              path
              for path in changed
              if path not in allowed_exact
              and not any(path.startswith(prefix) for prefix in allowed_prefixes)
          ]
          print("Changed paths:")
          for path in changed:
              print(f"- {path}")
          if unexpected:
              print("Unexpected changed paths:", file=sys.stderr)
              for path in unexpected:
                  print(f"- {path}", file=sys.stderr)
              raise SystemExit(1)
          for required in (
              "Weall-Protocol/generated/b528_b532_completion_proof_v1_5.json",
              "Weall-Protocol/generated/b534_b538_completion_proof_v1_5.json",
              "Weall-Protocol/generated/b567_b571_autonomous_mechanics_proof_v1_5.json",
          ):
              if required not in changed:
                  raise SystemExit(f"expected proof refresh missing:{required}")
          PY

      - name: Commit exact proof refresh
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Weall-Protocol/generated web/src/generated/protocolStatus.ts
          git status --short
          git commit -m "Refresh deterministic proofs after P0-06B phase 1"

      - name: Validate committed clean tree
        working-directory: Weall-Protocol
        env:
          PYTHONPATH: src:scripts
        run: |
          set -Eeuo pipefail
          test -z "$(git status --porcelain)"
          python scripts/gen_b528_b532_completion_proof_v1_5.py --check
          python scripts/gen_b534_b538_completion_proof_v1_5.py --check
          python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py --check
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          python scripts/check_generated.py
          python scripts/check_v2_spec_clean_checkout.py
          pytest -q \
            tests/test_autonomous_validator_ipfs_anti_sybil_economics_read_models.py::test_claim_boundaries_and_artifact_freshness \
            tests/test_full_node_db_api_dispute_storage_coverage.py::test_b534_freshness_check_is_deterministic_and_live_verification_is_explicit \
            tests/test_validator_db_lifecycle_reviewer_accountability_storage_coverage.py::test_b528_freshness_check_is_deterministic_and_live_verification_is_explicit

      - name: Push exact repair head
        run: |
          set -Eeuo pipefail
          git push origin HEAD:p0-03-production-closure-staging-20261001
