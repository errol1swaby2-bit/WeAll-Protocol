name: F-001 README two-frontend automatic login

on:
  pull_request:
    paths:
      - ".github/workflows/f001-readme-two-frontend-login.yml"
      - "web/src/**"
      - "web/tests/rehearsal/**"
      - "web/playwright.rehearsal.config.ts"
      - "web/scripts/**"
      - "web/package*.json"
      - "Weall-Protocol/scripts/devnet_*"
      - "Weall-Protocol/src/**"
      - "Weall-Protocol/requirements*.lock"
      - "Weall-Protocol/docker-compose.ipfs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-readme-rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install README locked backend
        working-directory: Weall-Protocol
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install -e . --no-deps
      - name: Install frozen frontend and browser
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          node scripts/test_canonical_login_resume.mjs
          npx --no-install playwright install --with-deps chromium
      - name: Start the documented launcher and run both real browsers
        working-directory: Weall-Protocol
        run: |
          set -euo pipefail
          source .venv/bin/activate
          export WEALL_DEVNET_DIR="$RUNNER_TEMP/f001-devnet"
          export WEALL_LOCAL_REHEARSAL_KEEP_RUNNING=1
          # Preserve the documented 20s block cadence and real IPFS startup.
          # No direct-session, signature, receipt or reconciliation bypass.
          bash scripts/devnet_local_two_frontend_rehearsal.sh > "$RUNNER_TEMP/f001-launcher.log" 2>&1 &
          launcher=$!
          trap 'kill -TERM "$launcher" 2>/dev/null || true; wait "$launcher" 2>/dev/null || true' EXIT
          ready=0
          for ((i=0; i<600; i++)); do
            if grep -Fq "Local two-frontend rehearsal ready" "$RUNNER_TEMP/f001-launcher.log"; then
              ready=1
              break
            fi
            if ! kill -0 "$launcher" 2>/dev/null; then
              echo "README launcher exited before readiness; no browser proof claimed."
              exit 1
            fi
            sleep 1
          done
          test "$ready" = 1
          cd ../web
          npx --no-install playwright test --config=playwright.rehearsal.config.ts
          echo "scope=LOCAL_CONTROLLED_DEVNET_TWO_BROWSER_GENERATED_DEMO_ACCOUNTS"
          echo "public_release_or_BFT_authority=NOT_ESTABLISHED"
          git rev-parse HEAD
