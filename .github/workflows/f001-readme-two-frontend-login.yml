name: F-001 README two-frontend automatic login

on:
  pull_request:
    paths:
      - ".github/workflows/f001-readme-two-frontend-login.yml"
      - "web/src/**"
      - "web/tests/rehearsal/**"
      - "web/playwright.rehearsal.config.ts"
      - "web/scripts/**"
      - "web/package*.json"
      - "Weall-Protocol/scripts/devnet_*"
      - "Weall-Protocol/src/**"
      - "Weall-Protocol/requirements*.lock"
      - "Weall-Protocol/docker-compose.ipfs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-readme-rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install README locked backend
        working-directory: Weall-Protocol
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install -e . --no-deps
      - name: Install frozen frontend and browser
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          node scripts/test_canonical_login_resume.mjs
          npx --no-install playwright install --with-deps chromium
      - name: Verify CI Docker engine and obtain the launcher-pinned IPFS image
        working-directory: Weall-Protocol
        run: |
          set -euo pipefail
          docker info --format '{{.ServerVersion}}'
          docker compose version
          # Pull exactly the image declared by the documented Compose file.
          # This does not start a substitute daemon or alter launcher safety.
          docker compose -f docker-compose.ipfs.yml config --quiet
          docker compose -f docker-compose.ipfs.yml pull ipfs
      - name: Start the documented launcher and run both real browsers
        working-directory: Weall-Protocol
        run: |
          set -euo pipefail
          source .venv/bin/activate
          mkdir -p "$RUNNER_TEMP/f001-devnet"
          export WEALL_DEVNET_DIR="$RUNNER_TEMP/f001-devnet/.weall-devnet"
          python scripts/devnet_safe_paths.py check-devnet "$WEALL_DEVNET_DIR"
          python scripts/devnet_safe_paths.py check-devnet-writable "$WEALL_DEVNET_DIR"
          python -m pytest -q tests/test_local_rehearsal_ipfs_temp_dir_repair.py tests/test_issue68_delete_boundaries.py
          export WEALL_LOCAL_REHEARSAL_KEEP_RUNNING=1
          # Preserve the documented 20s block cadence and real IPFS startup.
          # No direct-session, signature, receipt or reconciliation bypass.
          # Fail before provisioning identities if the pinned image is absent.
          docker image inspect "$(docker compose -f docker-compose.ipfs.yml config --images)" >/dev/null
          bash scripts/devnet_local_two_frontend_rehearsal.sh > "$RUNNER_TEMP/f001-launcher.log" 2>&1 &
          launcher=$!
          # Keep the documented launcher alive; the disposable CI runner
          # tears down any surviving child processes.
          trap 'kill -TERM "$launcher" 2>/dev/null || true; wait "$launcher" 2>/dev/null || true' EXIT
          launcher_diagnostics() {
            # The launcher is allowed to emit local credentials. Report fixed
            # stage categories only; never publish its raw output.
            python - "$RUNNER_TEMP/f001-launcher.log" "$WEALL_DEVNET_DIR/logs/local-ipfs-compose-up.log" <<'PY'
          import sys
          from pathlib import Path
          def read_log(path):
              p = Path(path)
              return p.read_text(errors="replace") if p.is_file() else ""
          log = read_log(sys.argv[1])
          compose = read_log(sys.argv[2])
          markers = {
              "unsafe_path": "ERROR: unsafe controlled-devnet path:",
              "venv_missing": "ERROR: Python virtualenv not active",
              "port_cleanup": "Port state after cleanup",
              "ipfs_start": "Starting local IPFS daemon",
              "ipfs_ready": "IPFS daemon ready and add-healthy",
              "ipfs_already_healthy": "IPFS daemon already reachable and add-healthy",
              "ipfs_compose_diagnostics": "IPFS port diagnostics",
              "ipfs_port_repair_failed": "ERROR: Docker still could not expose IPFS ports",
              "ipfs_api_timeout": "IPFS daemon did not become reachable",
              "ipfs_add_unhealthy": "/api/v0/add failed",
              "ipfs_directory_failure": "failed to create batch temp directory",
              "ipfs_sharding_failure": "no SHARDING file",
              "genesis_boot": "Booting genesis backend",
              "observer_boot": "Booting observer backend",
              "applicant_authority_confirmed": "Applicant ML-KEM evidence authority confirmed",
              "observer_frontend": "Starting observer frontend",
              "genesis_frontend": "Starting genesis frontend",
              "ready": "Local two-frontend rehearsal ready",
              "python_traceback": "Traceback (most recent call last)",
              "signature_rejection": "signature verification failed",
          }
          print("Launcher diagnostics:", {name: needle in log for name, needle in markers.items()})
          # Use only fixed error categories, including Compose output which
          # the launcher otherwise redirects. Never emit its raw lines.
          combined = (log + "\n" + compose).lower()
          categories = {
              "permission": ("permission denied", "operation not permitted", "access denied"),
              "registry_auth_or_limit": ("toomanyrequests", "pull rate limit", "unauthorized", "denied: requested access"),
              "registry_image_missing": ("manifest unknown", "no matching manifest", "not found: manifest"),
              "network": ("i/o timeout", "tls handshake timeout", "temporary failure in name resolution", "connection refused", "network is unreachable"),
              "docker_engine": ("cannot connect to the docker daemon", "error during connect"),
              "port_conflict": ("address already in use", "port is already allocated", "ports are not available"),
              "mount": ("invalid mount config", "error while creating mount source path", "bind source path does not exist"),
              "disk": ("no space left on device", "read-only file system"),
              "compose_config": ("invalid compose project", "invalid project name", "services must be a mapping"),
              "kubo_blockstore": ("sharding", "batch temp directory", "error opening datastore"),
          }
          print("IPFS failure categories:", {name: any(needle in combined for needle in needles) for name, needles in categories.items()})
          print("Compose log present:", Path(sys.argv[2]).is_file())
          PY
            # Docker status, numeric exit code, and version/readiness are
            # nonsecret. Do not inspect or export container environment.
            docker ps -a --filter name=weall-ipfs --format '{{.Status}}' || true
            if docker inspect --type container weall-ipfs >/dev/null 2>&1; then
              docker inspect --type container --format 'IPFS container state={{.State.Status}} exit={{.State.ExitCode}} restarting={{.State.Restarting}}' weall-ipfs || true
            fi
            if curl -fsS --max-time 3 -X POST http://127.0.0.1:5001/api/v0/version >/dev/null 2>&1; then
              echo "IPFS version API reachable: yes"
            else
              echo "IPFS version API reachable: no"
            fi
          }
          ready=0
          for ((i=0; i<600; i++)); do
            if grep -Fq "Local two-frontend rehearsal ready" "$RUNNER_TEMP/f001-launcher.log"; then
              ready=1
              break
            fi
            if ! kill -0 "$launcher" 2>/dev/null; then
              echo "README launcher exited before readiness; no browser proof claimed."
              launcher_diagnostics
              exit 1
            fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then
            launcher_diagnostics
            echo "README launcher timed out before readiness; no browser proof claimed."
            exit 1
          fi
          cd ../web
          npx --no-install playwright test --config=playwright.rehearsal.config.ts
          echo "scope=LOCAL_CONTROLLED_DEVNET_TWO_BROWSER_GENERATED_DEMO_ACCOUNTS"
          echo "public_release_or_BFT_authority=NOT_ESTABLISHED"
          git rev-parse HEAD
