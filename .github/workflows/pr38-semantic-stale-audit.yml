name: PR38 Semantic Stale Audit

on:
  push:
    branches: ["p0-03-production-closure-staging-20261001"]

permissions:
  contents: read

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: p0-03-production-closure-staging-20261001

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked backend
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Enumerate missing stable IDs and stale semantic bindings without mutation
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import hashlib
          import importlib
          import json
          import sys
          from pathlib import Path

          root = Path.cwd()
          scripts = root / "scripts"
          sys.path.insert(0, str(scripts))
          compiler = importlib.import_module("compile_v2_spec")
          validation = importlib.import_module("v2_spec_validation")

          registry_payload = json.loads(
              (root / "specs" / "v2" / "source" / "stable_ids.json").read_text(encoding="utf-8")
          )
          state_rows = [
              row for row in registry_payload.get("entries", [])
              if isinstance(row, dict) and str(row.get("kind") or "") == "state"
          ]
          print(f"EXISTING_STATE_STABLE_ID_COUNT={len(state_rows)}")
          for row in sorted(state_rows, key=lambda value: str(value.get("canonical_key") or "")):
              print(
                  "EXISTING_STATE_ID="
                  f"{row.get('stable_id')}|{row.get('canonical_key')}|{row.get('introduced_version')}"
              )

          missing: set[tuple[str, str]] = set()
          original_resolve = compiler.StableIdRegistry.resolve

          def diagnostic_resolve(self, kind: str, canonical_key: str) -> str:
              value = self.by_kind_key.get((kind, canonical_key))
              if value is not None:
                  return value
              missing.add((kind, canonical_key))
              digest = hashlib.sha256(f"{kind}\0{canonical_key}".encode("utf-8")).hexdigest()[:16].upper()
              return f"DIAG-{kind.upper()}-{digest}"

          captured = []
          original_reviews = compiler.apply_semantic_reviews

          def capture(tx_rows, route_rows, reviews):
              captured.extend(dict(row) for row in tx_rows)
              placeholder = {
                  "review_digest": "REFRESH_DISCOVERY_ONLY",
                  "reviewer": "REFRESH_DISCOVERY_ONLY",
                  "reviewed_at": "1970-01-01T00:00:00Z",
                  "review_method": "REFRESH_DISCOVERY_ONLY",
                  "independent_review": False,
                  "authority_effect": "REFRESH_DISCOVERY_ONLY",
              }
              for row in tx_rows:
                  row["semantic_derivation"] = row.get("semantic_precision")
                  row["semantic_review"] = dict(placeholder)
              for row in route_rows:
                  row["semantic_derivation"] = row.get("semantic_precision")
                  row["semantic_review"] = dict(placeholder)
              return {
                  "transaction_review_count": 0,
                  "route_review_count": 0,
                  "independent_transaction_reviews": 0,
                  "independent_route_reviews": 0,
                  "validation_result": "REFRESH_DISCOVERY_ONLY",
              }

          compiler.StableIdRegistry.resolve = diagnostic_resolve
          compiler.apply_semantic_reviews = capture
          try:
              compiler.compile_artifacts()
          finally:
              compiler.StableIdRegistry.resolve = original_resolve
              compiler.apply_semantic_reviews = original_reviews

          print(f"MISSING_STABLE_ID_COUNT={len(missing)}")
          for kind, canonical_key in sorted(missing):
              digest = hashlib.sha256(f"{kind}\0{canonical_key}".encode("utf-8")).hexdigest()[:16].upper()
              print(f"MISSING_STABLE_ID={kind}|{canonical_key}|DIAG-{kind.upper()}-{digest}")

          reviews = json.loads(
              (root / "specs" / "v2" / "source" / "semantic_reviews.json").read_text(encoding="utf-8")
          )
          review_by_type = {
              str(row.get("tx_type") or ""): row
              for row in reviews.get("transactions", [])
              if isinstance(row, dict)
          }
          stale = []
          for row in captured:
              tx_type = str(row.get("tx_type") or "")
              if not tx_type or tx_type not in review_by_type:
                  continue
              current = validation.compact_digest(validation.tx_review_material(row))
              persisted = str(review_by_type[tx_type].get("review_digest") or "")
              if current != persisted:
                  stale.append((tx_type, persisted, current))

          print(f"STALE_TRANSACTION_COUNT={len(stale)}")
          for tx_type, old, new in sorted(stale):
              print(f"STALE_TX={tx_type}|{old}|{new}")
          PY
