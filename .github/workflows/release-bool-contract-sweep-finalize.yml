name: Release boolean contract sweep finalize

on:
  push:
    branches: ["release-evidence-contract-hardening"]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: release-evidence-contract-hardening

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Apply bounded exact-boolean sweep
        run: python scripts/Apply-Release-Bool-Contract-Sweep-20260921.py

      - name: Remove temporary helper and workflow before source-sensitive generation
        run: |
          rm scripts/Apply-Release-Bool-Contract-Sweep-20260921.py
          rm .github/workflows/release-bool-contract-sweep-finalize.yml

      - name: Format and lint touched Python
        working-directory: Weall-Protocol
        run: |
          ruff format \
            scripts/gen_public_beta_blocker_report_v1_5.py \
            scripts/gen_b582_b586_readiness_truth_and_proof_v1_5.py \
            scripts/gen_b587_b594_testnet_mechanism_completion_v1_5.py \
            scripts/run_controlled_testnet_go_gate_v1_5.py \
            scripts/gen_final_public_observer_controlled_testnet_go_gate_v1_5.py \
            scripts/gen_release_evidence_manifest_v1_5.py \
            scripts/rehearse_public_api_write_lifecycle_v1_5.py \
            tests/test_release_boolean_contract_sweep.py
          ruff check \
            scripts/gen_public_beta_blocker_report_v1_5.py \
            scripts/gen_b582_b586_readiness_truth_and_proof_v1_5.py \
            scripts/gen_b587_b594_testnet_mechanism_completion_v1_5.py \
            scripts/run_controlled_testnet_go_gate_v1_5.py \
            scripts/gen_final_public_observer_controlled_testnet_go_gate_v1_5.py \
            scripts/gen_release_evidence_manifest_v1_5.py \
            scripts/rehearse_public_api_write_lifecycle_v1_5.py \
            tests/test_release_boolean_contract_sweep.py

      - name: Regenerate release evidence to fixed point
        working-directory: Weall-Protocol
        run: |
          PYTHONPATH=src:scripts python scripts/gen_b582_b586_readiness_truth_and_proof_v1_5.py
          PYTHONPATH=src:scripts python scripts/gen_b587_b594_testnet_mechanism_completion_v1_5.py

          generate_blocker() {
            PYTHONPATH=src:scripts python - <<'PY'
          from gen_public_beta_blocker_report_v1_5 import OUT, _pretty, build
          payload = build()
          if payload.get("public_beta_ready") is not False or payload.get("mainnet_ready") is not False:
              raise SystemExit("blocker report relaxed a forbidden readiness claim")
          OUT.write_text(_pretty(payload), encoding="utf-8")
          PY
          }

          generate_controlled() {
            PYTHONPATH=src:scripts python - <<'PY'
          from run_controlled_testnet_go_gate_v1_5 import OUT, _canon, build
          payload = build()
          if payload.get("public_beta_ready") is not False:
              raise SystemExit("controlled gate relaxed public beta readiness")
          OUT.write_text(_canon(payload), encoding="utf-8")
          PY
          }

          generate_final() {
            PYTHONPATH=src:scripts python - <<'PY'
          from gen_final_public_observer_controlled_testnet_go_gate_v1_5 import OUT, _pretty, build
          payload = build()
          if payload.get("blocker_counts", {}).get("public_beta_ready") is not False:
              raise SystemExit("final gate relaxed public beta readiness")
          if payload.get("external_blockers_still_open") is not True:
              raise SystemExit("final gate lost required external blockers")
          OUT.write_text(_pretty(payload), encoding="utf-8")
          PY
          }

          for pass in 1 2; do
            echo "release convergence pass ${pass}"
            PYTHONPATH=src:scripts python scripts/gen_release_evidence_manifest_v1_5.py
            generate_blocker
            generate_controlled
            generate_final
          done

          PYTHONPATH=src python scripts/gen_current_verified_claims.py
          PYTHONPATH=src:scripts python scripts/compile_v2_spec.py

      - name: Validate exact-boolean and existing fail-closed gates
        working-directory: Weall-Protocol
        run: |
          PYTHONPATH=src:scripts pytest -q \
            tests/test_release_boolean_contract_sweep.py \
            tests/test_release_evidence_contract_fail_closed.py \
            tests/test_fail_closed_boolean_boundaries.py \
            tests/test_current_verified_claims_fail_closed.py \
            tests/test_public_beta_blocker_report_fail_closed.py

          PYTHONPATH=src:scripts python scripts/gen_b582_b586_readiness_truth_and_proof_v1_5.py --check
          PYTHONPATH=src:scripts python scripts/gen_b587_b594_testnet_mechanism_completion_v1_5.py --check
          PYTHONPATH=src:scripts python scripts/gen_release_evidence_manifest_v1_5.py --check
          PYTHONPATH=src:scripts python scripts/gen_public_beta_blocker_report_v1_5.py --check
          PYTHONPATH=src:scripts python scripts/run_controlled_testnet_go_gate_v1_5.py --check
          PYTHONPATH=src:scripts python scripts/gen_final_public_observer_controlled_testnet_go_gate_v1_5.py --check
          PYTHONPATH=src:scripts python scripts/check_v15_public_readiness_artifacts.py --require-git-tracked
          PYTHONPATH=src python scripts/gen_current_verified_claims.py --check
          PYTHONPATH=src python scripts/check_public_claim_freshness.py
          PYTHONPATH=src:scripts python scripts/compile_v2_spec.py --check
          git diff --check

      - name: Commit validated final tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git diff --cached --check
          git commit -m "Enforce exact booleans across release evidence gates"
          git push origin HEAD:release-evidence-contract-hardening
