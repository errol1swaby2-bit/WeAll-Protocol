name: P1 Remediate A20 F002

on:
  push:
    branches:
      - p1-revalidation-after-p0-20261005
    paths:
      - .github/workflows/p1-remediate-a20-f002.yml

permissions:
  contents: write

jobs:
  patch-a20-f002:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: p1-revalidation-after-p0-20261005
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked web environment
        working-directory: web
        run: npm ci

      - name: Apply exact A20-F002 browser custody repair
        working-directory: web
        run: node scripts/p1_patch_a20_f002.mjs

      - name: Prove browser bearer custody source boundary
        working-directory: web
        run: |
          node scripts/test_session_bearer_custody_source.mjs
          npm run test:account-custody-source

      - name: Typecheck and build
        working-directory: web
        run: npm run build

      - name: Commit proven repair to P1 branch
        run: |
          set -Eeuo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/auth/session.ts web/tests/e2e/m2_actor_helpers.ts
          git diff --cached --quiet && { echo 'No implementation change produced'; exit 1; }
          git commit -m 'fix: keep browser session bearer out of persistent storage'
          git push origin HEAD:p1-revalidation-after-p0-20261005
