name: P0 temporary V2 semantic refresh

on:
  push:
    branches:
      - p0-closure-a01-a20-20260930
    paths:
      - .github/workflows/p0-temp-refresh-v2-semantics.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p0-closure-a01-a20-20260930
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          check-latest: false

      - name: Install locked backend dependencies
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade 'pip==26.2.1'
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Reuse canonical production posture in economics
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('Weall-Protocol/src/weall/runtime/apply/economics.py')
          text = path.read_text()
          old_import = 'from weall.runtime.econ_phase import deny_if_econ_disabled, deny_if_econ_time_locked\n'
          new_import = (
              'from weall.runtime.ballot_policy import chain_mode\n'
              'from weall.runtime.econ_phase import deny_if_econ_disabled, deny_if_econ_time_locked\n'
          )
          if 'from weall.runtime.ballot_policy import chain_mode\n' not in text:
              if text.count(old_import) != 1:
                  raise SystemExit(f'economics import replacement count={text.count(old_import)}')
              text = text.replace(old_import, new_import)

          old = '''    chain_id = _as_str(params.get("chain_id") or state.get("chain_id")).lower()\n    production_chain = chain_id == "weall-prod"\n'''
          new = '''    production_chain = chain_mode(state) == "production"\n'''
          if text.count(old) != 1:
              raise SystemExit(f'economics production predicate replacement count={text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          cd Weall-Protocol
          ruff format src/weall/runtime/apply/economics.py
          ruff check src/weall/runtime/apply/economics.py

      - name: Register the PoH authorization source in V2 traceability
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('Weall-Protocol/specs/v2/source/source_mappings.json')
          payload = json.loads(path.read_text())
          mappings = payload.get('mappings')
          if not isinstance(mappings, list):
              raise SystemExit('source_mappings.json mappings must be a list')

          source_path = 'src/weall/api/poh_route_auth.py'
          matches = [row for row in mappings if isinstance(row, dict) and row.get('path') == source_path]
          if len(matches) > 1:
              raise SystemExit(f'duplicate source mapping for {source_path}')
          if not matches:
              mappings.append({
                  'affected_registers': ['routes', 'failures'],
                  'classification': 'authoritative_or_launch_critical',
                  'path': source_path,
                  'primary_mechanism_id': 'M-069',
                  'review_status': 'mapped_current_snapshot',
              })
              mappings.sort(key=lambda row: str(row.get('path') or '') if isinstance(row, dict) else '')
              path.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + '\n')
          PY

      - name: Refresh explicitly reviewed economics semantic binding
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python scripts/refresh_v2_semantic_reviews.py \
            --tx-type ECONOMICS_ACTIVATION \
            --reviewer 'ChatGPT-assisted maintainer P0 closure review; independent review deferred'
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          python scripts/check_generated.py

      - name: Commit reviewed source and derived semantic artifacts
        run: |
          set -Eeuo pipefail
          BAD="$(git status --short --untracked-files=all | awk '{p=$2; if (p != "Weall-Protocol/src/weall/runtime/apply/economics.py" && p != "Weall-Protocol/specs/v2/source/source_mappings.json" && p != "Weall-Protocol/specs/v2/source/semantic_reviews.json" && p != "web/src/generated/protocolStatus.ts" && p !~ /^Weall-Protocol\/generated\/v2\//) print}')"
          if [[ -n "$BAD" ]]; then
            echo 'Unexpected changed files:' >&2
            printf '%s\n' "$BAD" >&2
            exit 1
          fi
          git add Weall-Protocol/src/weall/runtime/apply/economics.py Weall-Protocol/specs/v2/source/source_mappings.json Weall-Protocol/specs/v2/source/semantic_reviews.json Weall-Protocol/generated/v2 web/src/generated/protocolStatus.ts
          if git diff --cached --quiet; then
            echo 'No semantic derivative changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(p0): unify production posture and refresh V2 traceability'
          git push origin HEAD:p0-closure-a01-a20-20260930
