# Reviewer-safe, source-bound proof refresh. This workflow refreshes only a
# deterministic B528-B532 evidence artifact after executing its actual harnesses.
# It never updates semantic review decisions or release authorization.
name: B528-B571 Verified Proof Refresh

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/b528-proof-refresh.yml

permissions:
  contents: write

concurrency:
  group: b528-proof-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-b528-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Weall-Protocol
    steps:
      - name: Checkout exact triggering branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Rehearse and regenerate source-bound B528 proof
        run: |
          set -Eeuo pipefail
          python scripts/gen_b528_b532_completion_proof_v1_5.py
          python scripts/gen_b528_b532_completion_proof_v1_5.py --check
          python scripts/gen_b528_b532_completion_proof_v1_5.py --verify-live
          python scripts/gen_b534_b538_completion_proof_v1_5.py
          python scripts/gen_b534_b538_completion_proof_v1_5.py --check
          python scripts/gen_b534_b538_completion_proof_v1_5.py --verify-live
          python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py
          python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py --check
          python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py --verify-live

      - name: Fail closed on prohibited readiness claims
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("generated/b528_b532_completion_proof_v1_5.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          assert data.get("ok") is True, "live proof did not pass"
          assert data.get("locked_boundaries") == {
              "automatic_upgrades": False,
              "live_economics": False,
              "production_helpers": False,
              "public_validators": False,
          }, "release authorization boundary changed"
          assert data.get("truth_boundary") == (
              "local_private_completion_rehearsal_not_public_beta_or_mainnet"
          ), "proof incorrectly claims public release"
          assert data.get("freshness", {}).get("mode") == "deterministic_input_digest_v1"
          b534 = json.loads(Path("generated/b534_b538_completion_proof_v1_5.json").read_text())
          assert b534.get("ok") is True
          assert b534.get("locked_boundaries") == data.get("locked_boundaries")
          assert b534.get("truth_boundary") == (
              "local_private_full_node_process_rehearsal_not_public_beta_or_mainnet"
          )
          assert b534.get("freshness", {}).get("mode") == "deterministic_input_digest_v1"
          b567 = json.loads(
              Path("generated/b567_b571_autonomous_mechanics_proof_v1_5.json").read_text()
          )
          assert b567.get("ok") is True
          assert b567.get("public_beta_ready") is False
          assert b567.get("claim_boundaries") == {
              "automatic_protocol_upgrades": False,
              "complete_anti_sybil_solved": False,
              "live_economics": False,
              "mainnet_readiness": False,
              "personalized_feed_ranking": False,
              "production_helper_execution": False,
              "public_multi_validator_bft": False,
              "public_validator_readiness": False,
          }
          assert b567.get("freshness", {}).get("mode") == "deterministic_input_digest_v1"
          print("PASS: all three bounded proofs regenerated; all release locks unchanged")
          PY

      - name: Commit only the verified derivative, if changed
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          # This step runs with working-directory: Weall-Protocol.
          # Git pathspecs below are relative to that directory.
          targets=(
            generated/b528_b532_completion_proof_v1_5.json
            generated/b534_b538_completion_proof_v1_5.json
            generated/b567_b571_autonomous_mechanics_proof_v1_5.json
          )
          if git diff --quiet -- "${targets[@]}"; then
            echo "All three verified derivatives are already current."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${targets[@]}"
          git diff --cached --check
          git commit -m 'chore(evidence): regenerate three live-verified source-bound proofs'
          git push origin HEAD:"${GITHUB_REF_NAME}"
