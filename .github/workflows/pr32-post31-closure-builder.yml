name: PR32 Post-PR31 Closure Builder

on:
  push:
    branches:
      - post31-closure-pack-20260929

permissions:
  contents: write

jobs:
  build-closure-pack:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Weall-Protocol
    steps:
      - name: Checkout closure branch
        uses: actions/checkout@v4
        with:
          ref: post31-closure-pack-20260929
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked backend toolchain
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Apply POST31 repairs and regressions
        run: |
          set -Eeuo pipefail
          python scripts/pr32_closure_builder.py apply
          python scripts/pr32_fixture_adjust.py
          python scripts/pr32_source_adjust.py
          ruff format src/weall/runtime/block_replay.py src/weall/runtime/block_builder.py src/weall/runtime/account_id.py src/weall/api/routes_public_parts/state.py src/weall/api/__main__.py tests/test_post31_closure_pack.py
          ruff check --fix src/weall/runtime/block_replay.py src/weall/runtime/block_builder.py src/weall/runtime/account_id.py src/weall/api/routes_public_parts/state.py src/weall/api/__main__.py tests/test_post31_closure_pack.py
          ruff format src/weall/runtime/block_replay.py src/weall/runtime/block_builder.py src/weall/runtime/account_id.py src/weall/api/routes_public_parts/state.py src/weall/api/__main__.py tests/test_post31_closure_pack.py
          cp scripts/pr32_closure_builder.py /tmp/pr32_closure_builder.py
          rm -f scripts/pr32_closure_builder.py scripts/pr32_fixture_adjust.py scripts/pr32_source_adjust.py

      - name: Run focused closure regressions
        run: |
          set -Eeuo pipefail
          pytest -q tests/test_post31_closure_pack.py tests/test_system_tx_completeness.py tests/test_system_tx_apply_block_binding.py | tee /tmp/pr32-focused.log

      - name: Refresh v1.5 evidence to fixed point
        run: |
          set -Eeuo pipefail
          python scripts/check_generated.py

          generate_truthful() {
            local script="$1"
            set +e
            python "scripts/${script}"
            local rc=$?
            set -e
            if [ "$rc" -gt 1 ]; then
              echo "generator ${script} failed with unexpected exit ${rc}" >&2
              exit "$rc"
            fi
            python "scripts/${script}" --check
          }

          python scripts/gen_api_contract_map.py
          python scripts/gen_api_response_vectors_v1_5.py
          python scripts/gen_public_only_protocol_audit_v1_5.py

          # These historical proof packs commit source/input digests and must
          # follow any source-tree repair even when their substantive claim
          # boundaries remain unchanged.
          generate_truthful gen_b528_b532_completion_proof_v1_5.py
          generate_truthful gen_b534_b538_completion_proof_v1_5.py
          generate_truthful gen_b567_b571_autonomous_mechanics_proof_v1_5.py

          for pass in 1 2 3; do
            echo "v1.5 evidence fixed-point pass ${pass}"
            generate_truthful gen_b587_b594_testnet_mechanism_completion_v1_5.py
            generate_truthful gen_public_beta_blocker_report_v1_5.py
            generate_truthful gen_release_evidence_manifest_v1_5.py
            generate_truthful run_controlled_testnet_go_gate_v1_5.py
            python scripts/gen_current_verified_claims.py
          done

          generate_truthful gen_b587_b594_testnet_mechanism_completion_v1_5.py
          generate_truthful gen_public_beta_blocker_report_v1_5.py
          generate_truthful gen_release_evidence_manifest_v1_5.py
          generate_truthful run_controlled_testnet_go_gate_v1_5.py
          python scripts/gen_current_verified_claims.py --check

      - name: Refresh v2 derivatives and validate fixed point
        run: |
          set -Eeuo pipefail
          PYTHONPATH=src python scripts/compile_v2_spec.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          PYTHONDONTWRITEBYTECODE=1 python scripts/check_v15_public_readiness_artifacts.py
          python scripts/check_public_claim_freshness.py
          python scripts/gen_current_verified_claims.py --check

      - name: Run full backend suite
        run: |
          set -Eeuo pipefail
          pytest -q | tee /tmp/pr32-full.log

      - name: Build closure evidence pack
        run: |
          set -Eeuo pipefail
          python /tmp/pr32_closure_builder.py evidence --focused-log /tmp/pr32-focused.log --full-log /tmp/pr32-full.log

      - name: Final diff and push closure commit
        working-directory: .
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/pr32-post31-closure-builder.yml
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: close post-PR31 consensus and runtime posture findings"
          git push origin HEAD:post31-closure-pack-20260929
