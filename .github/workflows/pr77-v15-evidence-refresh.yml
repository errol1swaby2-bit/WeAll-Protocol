name: PR77 bounded V1.5 evidence refresh

on:
  push:
    branches:
      - review/pr70-pr75-pr76-consolidation-stage23-20261031
    paths:
      - Weall-Protocol/src/weall/runtime/apply/reputation.py
      - Weall-Protocol/tests/test_pr77_severe_sanction_clock_no_go.py
      - .github/workflows/pr77-v15-evidence-refresh.yml

permissions:
  contents: write

concurrency:
  group: pr77-v15-evidence-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'errol1swaby2-bit/WeAll-Protocol'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact consolidation branch
        uses: actions/checkout@v4
        with:
          ref: review/pr70-pr75-pr76-consolidation-stage23-20261031
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked backend dependencies
        working-directory: Weall-Protocol
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install -e . --no-deps

      - name: Validate narrow no-go behavior
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          ruff format tests/test_pr77_severe_sanction_clock_no_go.py
          ruff check src/weall/runtime/apply/reputation.py tests/test_pr77_severe_sanction_clock_no_go.py
          ruff format --check src/weall/runtime/apply/reputation.py tests/test_pr77_severe_sanction_clock_no_go.py
          pytest -q tests/test_pr77_severe_sanction_clock_no_go.py tests/test_pr73_account_ban_atomic_duplicate.py tests/test_stage23_account_ban_severe_sanction_no_go.py

      - name: Regenerate only the seven V1.5 source-bound artifacts
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python scripts/gen_api_contract_map.py
          python scripts/gen_failure_code_registry_v1_5.py
          python scripts/gen_b528_b532_completion_proof_v1_5.py
          python scripts/gen_b534_b538_completion_proof_v1_5.py
          python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py
          python scripts/gen_release_evidence_manifest_v1_5.py
          python scripts/gen_public_beta_blocker_report_v1_5.py
          python scripts/check_v15_public_readiness_artifacts.py
          python scripts/check_release_hygiene_v1_5.py --allow-dirty

      - name: Commit ONLY reviewed V1.5 artifacts, without V2 attestation changes
        run: |
          set -Eeuo pipefail
          git diff --check
          python - <<'PY'
          from subprocess import check_output
          allowed = {
              "Weall-Protocol/tests/test_pr77_severe_sanction_clock_no_go.py",
              "Weall-Protocol/generated/api_contract_map_v1_5.json",
              "Weall-Protocol/generated/failure_code_registry_v1_5.json",
              "Weall-Protocol/generated/b528_b532_completion_proof_v1_5.json",
              "Weall-Protocol/generated/b534_b538_completion_proof_v1_5.json",
              "Weall-Protocol/generated/b567_b571_autonomous_mechanics_proof_v1_5.json",
              "Weall-Protocol/generated/release_evidence_manifest_v1_5.json",
              "Weall-Protocol/generated/public_beta_blocker_report_v1_5.json",
          }
          changed = set(check_output(["git", "diff", "--name-only"], text=True).splitlines())
          assert changed <= allowed, f"Unexpected derivative changes: {sorted(changed - allowed)}"
          print("V1.5 derived edits:", sorted(changed))
          PY
          git add -u -- Weall-Protocol/tests/test_pr77_severe_sanction_clock_no_go.py \
            Weall-Protocol/generated/api_contract_map_v1_5.json \
            Weall-Protocol/generated/failure_code_registry_v1_5.json \
            Weall-Protocol/generated/b528_b532_completion_proof_v1_5.json \
            Weall-Protocol/generated/b534_b538_completion_proof_v1_5.json \
            Weall-Protocol/generated/b567_b571_autonomous_mechanics_proof_v1_5.json \
            Weall-Protocol/generated/release_evidence_manifest_v1_5.json \
            Weall-Protocol/generated/public_beta_blocker_report_v1_5.json
          if git diff --cached --quiet; then
            echo 'Seven bounded V1.5 artifacts already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(pr77): Ruff-format test and refresh bounded V1.5 evidence'
          git push origin HEAD:review/pr70-pr75-pr76-consolidation-stage23-20261031
