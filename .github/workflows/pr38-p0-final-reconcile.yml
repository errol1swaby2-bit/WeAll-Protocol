name: PR38 P0 Final Reconcile

on:
  push:
    branches:
      - p0-03-production-closure-staging-20261001

permissions:
  contents: write

concurrency:
  group: pr38-p0-final-reconcile
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: p0-03-production-closure-staging-20261001
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r Weall-Protocol/requirements-dev.lock
          pip install -e Weall-Protocol --no-deps
          cd web
          npm ci

      - name: Remove temporary workflow from candidate tree
        run: |
          rm -f .github/workflows/pr38-p0-final-reconcile.yml

      - name: Lock account-scarcity mutation coverage
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("Weall-Protocol/tests/p0_assurance.py")
          text = path.read_text(encoding="utf-8")
          if "P0-10-ACCOUNT-WORK-PRODUCTION-REQUIRED" not in text:
              marker = "\n)\n\n\ndef property_seed_rng"
              if text.count(marker) != 1:
                  raise SystemExit("p0_assurance_mutation_tuple_anchor_invalid")
              additions = (
                  '    MutationSpec(\n'
                  '        mutation_id="P0-10-ACCOUNT-WORK-PRODUCTION-REQUIRED",\n'
                  '        track="P0-10",\n'
                  '        description="Permit a production chain to disable account-registration work.",\n'
                  '        edits=(\n'
                  '            _edit(\n'
                  '                "src/weall/runtime/account_registration_work.py",\n'
                  '                "    if production_chain and not required:\\n",\n'
                  '                "    if False and production_chain and not required:\\n",\n'
                  '            ),\n'
                  '        ),\n'
                  '        tests=("tests/test_a15_f003_account_registration_scarcity.py",),\n'
                  '    ),\n'
                  '    MutationSpec(\n'
                  '        mutation_id="P0-10-ACCOUNT-CARDINALITY-BOUND",\n'
                  '        track="P0-10",\n'
                  '        description="Bypass the production root-visible account cardinality ceiling.",\n'
                  '        edits=(\n'
                  '            _edit(\n'
                  '                "src/weall/runtime/account_registration_work.py",\n'
                  '                "    if policy.max_accounts > 0 and signer not in accounts and len(accounts) >= policy.max_accounts:\\n",\n'
                  '                "    if False and policy.max_accounts > 0 and signer not in accounts and len(accounts) >= policy.max_accounts:\\n",\n'
                  '            ),\n'
                  '        ),\n'
                  '        tests=("tests/test_a15_f003_account_registration_scarcity.py",),\n'
                  '    ),\n'
              )
              text = text.replace(marker, additions + marker, 1)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Reconcile audit truth wording
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/audit/WeAll-A01-A20-P0-Closure-Status-20260930.md")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "A15-F003 remains closed by finite nonzero identity-bound registration work without claiming human uniqueness or a lifetime account cap.": (
                  "A15-F003 is closed for the current production/public-testnet protocol version by identity/payload-bound SHA-256 registration work with a consensus-enforced 16-bit minimum plus a hard 10,000-record root-visible account ceiling. Production cannot disable the work requirement or configure a ceiling above that reviewed bound. Dedicated evidence covers 10k/100k/1M counterfactual cardinality scaling, distributed fresh signers, canonical admission, signed commit/restart persistence, proof-reuse rejection, and capacity exhaustion without claiming human uniqueness."
              ),
              "The exact-head P0 assurance gate kills all 15 non-equivalent P0 mutants, with zero survivors and zero invalid mutations; the normal Backend CI independently passes this gate before the full pytest suite.": (
                  "The current gate defines 20 non-equivalent P0 mutants, including the original A06 durable-receipt persistence escape plus account-work identity binding, complete work bypass, production-floor weakening, production-work-disable, and production account-cardinality-bound bypass; closure requires all 20 killed with zero survivors and zero invalid mutations on the final exact head before the full pytest suite."
              ),
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"audit_truth_anchor_missing:{old[:80]}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Format and lint bounded Python changes
        working-directory: Weall-Protocol
        run: |
          FILES=(
            src/weall/runtime/account_registration_work.py
            tests/test_a15_f003_account_registration_scarcity.py
            tests/bench_a15_f003_registration_attack.py
            tests/p0_assurance.py
          )
          ruff check --fix "${FILES[@]}"
          ruff format "${FILES[@]}"
          ruff check "${FILES[@]}"
          ruff format --check "${FILES[@]}"

      - name: Deterministically regenerate closure derivatives twice
        working-directory: Weall-Protocol
        run: |
          for round in 1 2; do
            echo "regeneration round ${round}"
            python scripts/gen_failure_code_registry_v1_5.py
            if [[ -f scripts/gen_api_response_vectors_v1_5.py ]]; then
              python scripts/gen_api_response_vectors_v1_5.py
            fi
            PYTHONPATH=src python scripts/compile_v2_spec.py
            python scripts/gen_b528_b532_completion_proof_v1_5.py
            python scripts/gen_b534_b538_completion_proof_v1_5.py
            python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py
            python scripts/gen_public_beta_blocker_report_v1_5.py
            python scripts/gen_release_evidence_manifest_v1_5.py
            python scripts/gen_current_verified_claims.py
          done

      - name: Show bounded candidate diff
        run: |
          git status --short
          git diff --stat
          git diff --name-only

      - name: Commit workflow-free reconciled candidate locally
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No reconciliation diff produced"
            exit 1
          fi
          git commit -m "p0: regenerate exact-head closure evidence"
          echo "candidate_sha=$(git rev-parse HEAD)"
          echo "candidate_tree=$(git rev-parse HEAD^{tree})"
          test -z "$(git status --porcelain)"

      - name: Validate generated and claim truth on local candidate
        working-directory: Weall-Protocol
        run: |
          python scripts/check_generated.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          python scripts/check_v2_spec_clean_checkout.py
          python scripts/gen_b528_b532_completion_proof_v1_5.py --check
          python scripts/gen_b534_b538_completion_proof_v1_5.py --check
          python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py --check
          PYTHONDONTWRITEBYTECODE=1 python scripts/check_v15_public_readiness_artifacts.py
          python scripts/check_public_claim_freshness.py
          python scripts/gen_current_verified_claims.py --check

      - name: Focused A15 and P0-04 closure regressions
        working-directory: Weall-Protocol
        run: |
          pytest -q \
            tests/test_a15_f003_account_registration_scarcity.py \
            tests/test_p0_scheduler_and_receipt_breadth_closure.py::test_p0_04_follower_rejects_receipt_body_tamper_and_restart_preserves_canonical_block
          python tests/bench_a15_f003_registration_attack.py --accounts 32 \
            | tee /tmp/a15-f003-registration-attack.json

      - name: P0 property and mutation assurance
        working-directory: Weall-Protocol
        run: |
          python tests/p0_assurance.py gate \
            --report /tmp/p0_assurance_report.json \
            --timeout-seconds 120

      - name: Full backend regression
        working-directory: Weall-Protocol
        run: |
          pytest -q

      - name: Reviewer readiness on exact local candidate
        working-directory: Weall-Protocol
        env:
          WEALL_RELEASE_TREE_ALREADY_VERIFIED: "0"
        run: |
          bash scripts/reviewer_production_readiness_gate.sh

      - name: Final clean-tree guard
        run: |
          test -z "$(git status --porcelain)"
          test ! -e .github/workflows/pr38-p0-final-reconcile.yml
          echo "final_sha=$(git rev-parse HEAD)"
          echo "final_tree=$(git rev-parse HEAD^{tree})"

      - name: Push verified workflow-free candidate
        run: |
          git push origin HEAD:p0-03-production-closure-staging-20261001
