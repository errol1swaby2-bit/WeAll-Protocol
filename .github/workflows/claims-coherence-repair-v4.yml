name: Claims coherence repair v4

on:
  push:
    branches:
      - claims-coherence-hardening-20260921
    paths:
      - .github/workflows/claims-coherence-repair-v4.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: claims-coherence-hardening-20260921

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked backend environment
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Apply audited source and documentation repair
        run: |
          python - <<'EXTRACT'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/claims-coherence-repair.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end]) + "\n"
          Path('/tmp/weall_claims_coherence_apply.py').write_text(script, encoding='utf-8')
          EXTRACT
          python /tmp/weall_claims_coherence_apply.py
          python - <<'PATCH'
          from pathlib import Path
          path = Path('Weall-Protocol/docs/PRODUCTION_POSTURE.md')
          text = path.read_text(encoding='utf-8')
          old = 'Reviewer verification path for this posture:'
          new = 'Verification path for this posture:'
          if text.count(old) != 1:
              raise SystemExit(f'expected one production-posture review-framing phrase, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PATCH

      - name: Regenerate v1.5 truth artifacts
        working-directory: Weall-Protocol
        run: |
          PYTHONPATH=src:scripts python scripts/gen_external_operator_transcript_requirements_v1_5.py
          PYTHONPATH=src:scripts python scripts/gen_public_beta_blocker_report_v1_5.py
          set +e
          PYTHONPATH=src:scripts python scripts/run_controlled_testnet_go_gate_v1_5.py
          rc=$?
          set -e
          if [[ "$rc" -ne 0 && "$rc" -ne 1 ]]; then exit "$rc"; fi
          test -s generated/controlled_testnet_go_gate_v1_5.json
          PYTHONPATH=src:scripts python scripts/gen_final_public_observer_controlled_testnet_go_gate_v1_5.py
          PYTHONPATH=src python scripts/gen_release_evidence_manifest_v1_5.py
          PYTHONPATH=src python scripts/gen_current_verified_claims.py

      - name: Remove temporary repair workflows
        run: |
          rm -f .github/workflows/claims-coherence-repair.yml
          rm -f .github/workflows/claims-coherence-repair-v3.yml
          rm -f .github/workflows/claims-coherence-repair-v4.yml

      - name: Compile v2 derivatives on final source tree
        working-directory: Weall-Protocol
        run: PYTHONPATH=src python scripts/compile_v2_spec.py

      - name: Validate repaired worktree before commit
        working-directory: Weall-Protocol
        run: |
          python scripts/check_generated.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python scripts/check_v15_public_readiness_artifacts.py
          python scripts/check_public_claim_freshness.py
          python scripts/gen_current_verified_claims.py --check
          PYTHONPATH=src python scripts/check_reviewer_truth_boundaries.py
          PYTHONPATH=src python -m pytest -q tests/test_release_docs_truth_sync.py tests/test_reviewer_language_cleanup.py tests/test_public_readiness_artifacts_v15.py tests/prod/test_public_beta_evidence_gates.py tests/prod/test_final_public_observer_controlled_testnet_go_gate.py
          git diff --check

      - name: Commit exact repaired tree locally
        run: |
          git config user.name 'weall-claims-repair-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git ls-files --cached | grep -E '^\.github/workflows/claims-coherence-repair(-v[34])?\.yml$'; then
            echo 'temporary repair workflow remains tracked in final index' >&2
            exit 1
          fi
          git status --short
          git commit -m 'Harden current claims truth boundaries'

      - name: Validate clean checkout of exact local commit
        working-directory: Weall-Protocol
        run: |
          python scripts/check_v2_spec_clean_checkout.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python scripts/check_v15_public_readiness_artifacts.py --require-git-tracked
          python scripts/check_public_claim_freshness.py
          python scripts/gen_current_verified_claims.py --check
          test -z "$(git status --porcelain)"

      - name: Push validated repair commit
        run: git push origin HEAD:claims-coherence-hardening-20260921
