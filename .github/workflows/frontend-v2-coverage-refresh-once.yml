name: Frontend V2 Coverage Refresh (temporary one-shot)

on:
  push:
    branches:
      - frontend/f1-guided-account-onboarding-20261104
    paths:
      - .github/workflows/frontend-v2-coverage-refresh-once.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: frontend/f1-guided-account-onboarding-20261104
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked compiler dependencies
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Regenerate and verify source-backed V2 derivatives
        working-directory: Weall-Protocol
        run: |
          PYTHONPATH=src python scripts/compile_v2_spec.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          git diff --stat

      - name: Reject unexpected mutations before commit
        run: |
          set -euo pipefail
          mapfile -t changed < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          for path in "${changed[@]}"; do
            case "$path" in
              Weall-Protocol/generated/v2/*|web/src/generated/protocolStatus.ts) ;;
              *) echo "Refusing unexpected generated mutation: $path" >&2; exit 1 ;;
            esac
          done
          echo "Generated changes inspected: ${#changed[@]} files"

      - name: Commit verified generated V2 derivatives to same branch
        run: |
          set -euo pipefail
          git add -- Weall-Protocol/generated/v2 web/src/generated/protocolStatus.ts
          if git diff --cached --quiet; then
            echo "All generated V2 derivatives already match the compiler"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "spec(v2): refresh generated source coverage for F1 registration"
          git push origin HEAD:refs/heads/frontend/f1-guided-account-onboarding-20261104
