name: Temporary finalized-source onboarding derivative refresh

on:
  push:
    branches:
      - fix/fresh-clone-onboarding-first-run-20261014
    paths:
      - .github/workflows/temp-fresh-clone-derivatives-v2-20261014.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Locked backend install
        working-directory: Weall-Protocol
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install -e . --no-deps
      - name: Exclude temporary workflow from FINAL source snapshot
        run: |
          git rm .github/workflows/temp-fresh-clone-derivatives-v2-20261014.yml
      - name: Recompile finalized source, run check and targeted safety tests
        working-directory: Weall-Protocol
        run: |
          PYTHONPATH=src:scripts python scripts/compile_v2_spec.py
          PYTHONPATH=src:scripts python scripts/compile_v2_spec.py --check
          python -m pytest -q tests/test_fresh_clone_onboarding_guide.py tests/test_observer_boot_onboarding_safety.py tests/test_onboarding_boot_invokes_node_boot_with_bash.py
          ruff format --check tests/test_fresh_clone_onboarding_guide.py
          ruff check tests/test_fresh_clone_onboarding_guide.py
      - name: Commit derivatives for FINAL source tree, validate clean Git archive, and push
        run: |
          set -euo pipefail
          git config user.name "weall-reviewer-ci"
          git config user.email "weall-reviewer-ci@users.noreply.github.com"
          git add -u Weall-Protocol/generated/v2 web/src/generated/protocolStatus.ts
          git diff --cached --name-only
          git commit -m "chore(onboarding): bind derivatives to final no-temporary-workflow source"
          (cd Weall-Protocol && PYTHONPATH=src:scripts python scripts/compile_v2_spec.py --check && python scripts/check_v2_spec_clean_checkout.py)
          git push origin "HEAD:refs/heads/fix/fresh-clone-onboarding-first-run-20261014"
