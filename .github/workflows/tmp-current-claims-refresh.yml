name: Temporary current claims refresh

on:
  push:
    branches:
      - p0-03-ci-repair-20261001

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh helper-free claims artifacts
        run: |
          set -Eeuo pipefail
          rm .github/workflows/tmp-current-claims-refresh.yml
          cd Weall-Protocol
          python scripts/gen_current_verified_claims.py
          python scripts/gen_current_verified_claims.py --check
          cd ..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(ci): refresh current verified claims [tested-tree]'
          test ! -e .github/workflows/tmp-current-claims-refresh.yml
          cd Weall-Protocol
          python scripts/gen_current_verified_claims.py --check
          cd ..
          git push origin HEAD:p0-03-ci-repair-20261001
