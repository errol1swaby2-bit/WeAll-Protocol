name: Repair P2 Storage Compatibility Proofs

on:
  push:
    branches:
      - p2-complete-remediation-20260927
    paths:
      - .github/workflows/p2-storage-compatibility-proof-refresh.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: p2-complete-remediation-20260927

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Guard exact compatibility preimages and extract audited storage patch
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object Weall-Protocol/scripts/rehearse_public_api_write_lifecycle_v1_5.py)" = "5a3887e5e9578683e1552e2a4eaa210f9fd1be0a"
          test "$(git hash-object Weall-Protocol/tests/test_v2_spec_compiler.py)" = "66427d747cb53de878735fc7b2d633c0f698fbfe"
          test "$(git hash-object Weall-Protocol/src/weall/runtime/tx_schema.py)" = "5c9f1d87e0ae8ef43b853c682f897d739970fd80"
          test "$(git hash-object Weall-Protocol/src/weall/runtime/apply/storage.py)" = "d6f73a52461d8ab38fb1919c22066b253668b894"
          test "$(git hash-object Weall-Protocol/src/weall/runtime/scheduler_pipeline.py)" = "77cc982ed918de7cda461b90be455390be2708bf"
          test "$(git hash-object Weall-Protocol/scripts/rehearse_storage_operator_durability_v1_5.py)" = "c5c4a166328abf27aea72fd0dafba16e5177c994"
          git show origin/p2-storage-closure-20260927:.github/ci-p2-storage-closure.py > /tmp/p2_storage_patch.py
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/p2_storage_patch.py')
          text = path.read_text(encoding='utf-8')
          old = 'ROOT = Path(__file__).resolve().parents[1]'
          new = 'ROOT = Path(os.environ["GITHUB_WORKSPACE"]).resolve()'
          if text.count(old) != 1:
              raise SystemExit(f'unexpected storage patch ROOT binding count: {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile /tmp/p2_storage_patch.py

      - name: Install locked backend tooling
        working-directory: Weall-Protocol
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Apply audited storage patch in runner and repair compatibility fixtures
        shell: bash
        env:
          COMPAT_PATCH_B64: "REPLACE_B64"
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location('p2_storage_patch', '/tmp/p2_storage_patch.py')
          if spec is None or spec.loader is None:
              raise SystemExit('unable to load audited storage patch')
          patch = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(patch)
          patch.patch_schema()
          patch.patch_storage_runtime()
          patch.patch_scheduler()
          patch.patch_rehearsal()
          patch.write_tests()
          PY
          printf '%s' "$COMPAT_PATCH_B64" | base64 -d > /tmp/compat_patch.py
          python /tmp/compat_patch.py
          python -m py_compile Weall-Protocol/scripts/rehearse_public_api_write_lifecycle_v1_5.py
          git diff --check

      - name: Format and validate compatibility edits
        working-directory: Weall-Protocol
        shell: bash
        run: |
          set -Eeuo pipefail
          ruff format scripts/rehearse_public_api_write_lifecycle_v1_5.py tests/test_v2_spec_compiler.py
          ruff check --fix scripts/rehearse_public_api_write_lifecycle_v1_5.py tests/test_v2_spec_compiler.py
          ruff format scripts/rehearse_public_api_write_lifecycle_v1_5.py tests/test_v2_spec_compiler.py
          ruff check scripts/rehearse_public_api_write_lifecycle_v1_5.py tests/test_v2_spec_compiler.py
          PYTHONPATH=src:scripts python scripts/rehearse_public_api_write_lifecycle_v1_5.py --json

      - name: Refresh all full-suite stale proof artifacts
        working-directory: Weall-Protocol
        shell: bash
        run: |
          set -Eeuo pipefail
          generators=(
            gen_b517_b521_completion_proof_v1_5.py
            gen_b523_b527_completion_proof_v1_5.py
            gen_b539_b543_production_path_proof_v1_5.py
            gen_b544_b548_live_network_final_proof_v1_5.py
            gen_b549_b553_controlled_testnet_candidate_proof_v1_5.py
            gen_b556_b561_final_missing_mechanics_proof_v1_5.py
            gen_b562_b566_mechanics_hardening_proof_v1_5.py
          )
          for generator in "${generators[@]}"; do
            PYTHONPATH=src:scripts python "scripts/$generator"
            PYTHONPATH=src:scripts python "scripts/$generator" --check
          done

      - name: Commit only compatibility fixtures and refreshed proofs
        shell: bash
        run: |
          set -Eeuo pipefail
          files=(
            Weall-Protocol/scripts/rehearse_public_api_write_lifecycle_v1_5.py
            Weall-Protocol/tests/test_v2_spec_compiler.py
            Weall-Protocol/generated/b517_b521_completion_proof_v1_5.json
            Weall-Protocol/generated/b523_b527_completion_proof_v1_5.json
            Weall-Protocol/generated/b539_b543_production_path_proof_v1_5.json
            Weall-Protocol/generated/b544_b548_live_network_final_proof_v1_5.json
            Weall-Protocol/generated/b549_b553_controlled_testnet_candidate_proof_v1_5.json
            Weall-Protocol/generated/b556_b561_final_missing_mechanics_proof_v1_5.json
            Weall-Protocol/generated/b562_b566_mechanics_hardening_proof_v1_5.json
          )
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          while IFS= read -r path; do
            case "$path" in
              Weall-Protocol/scripts/rehearse_public_api_write_lifecycle_v1_5.py|Weall-Protocol/tests/test_v2_spec_compiler.py|Weall-Protocol/generated/b517_b521_completion_proof_v1_5.json|Weall-Protocol/generated/b523_b527_completion_proof_v1_5.json|Weall-Protocol/generated/b539_b543_production_path_proof_v1_5.json|Weall-Protocol/generated/b544_b548_live_network_final_proof_v1_5.json|Weall-Protocol/generated/b549_b553_controlled_testnet_candidate_proof_v1_5.json|Weall-Protocol/generated/b556_b561_final_missing_mechanics_proof_v1_5.json|Weall-Protocol/generated/b562_b566_mechanics_hardening_proof_v1_5.json) ;;
              *) echo "refusing unexpected staged path: $path" >&2; exit 1 ;;
            esac
          done < <(git diff --cached --name-only)
          git commit -m "Align storage compatibility rehearsals and proof snapshots"
          REMOTE_SHA="$(git ls-remote origin refs/heads/p2-complete-remediation-20260927 | awk '{print $1}')"
          test "$REMOTE_SHA" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/p2-complete-remediation-20260927
