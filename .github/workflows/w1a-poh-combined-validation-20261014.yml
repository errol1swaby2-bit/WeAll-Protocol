name: Isolated W1-A plus PoH integration validation

on:
  push:
    branches:
      - audit/w1a-poh-combined-20261014

permissions:
  contents: write

jobs:
  combined:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked backend dependencies
        run: |
          cd Weall-Protocol
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install -e . --no-deps
      - name: Check source formatting and focused integration regressions
        run: |
          cd Weall-Protocol
          ruff format --check src/weall/runtime/dispute_engine.py src/weall/runtime/tx_schema.py tests/test_rem_w1a_r06_f001_canonical_scheduler_order.py tests/test_live_poh_finalize_scheduler_schema_regression.py tests/test_local_two_node_review_rehearsal_regression.py
          python -m pytest -q tests/test_rem_w1a_r06_f001_canonical_scheduler_order.py tests/test_live_poh_finalize_scheduler_schema_regression.py tests/test_local_two_node_review_rehearsal_regression.py tests/test_system_tx_completeness.py tests/test_dispute_followups.py tests/test_dispute_height_lifecycle_boundaries.py tests/test_constitutional_procedure_clock.py
      - name: Exclude temporary workflow from source-bound generated claims
        run: git rm -- .github/workflows/w1a-poh-combined-validation-20261014.yml
      - name: Generate and check combined exact-source artifacts
        run: |
          cd Weall-Protocol
          python scripts/gen_b528_b532_completion_proof_v1_5.py
          python scripts/gen_b534_b538_completion_proof_v1_5.py
          python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py
          python scripts/gen_api_contract_map.py
          python scripts/gen_failure_code_registry_v1_5.py
          python scripts/gen_release_evidence_manifest_v1_5.py
          python scripts/gen_public_beta_blocker_report_v1_5.py
          python scripts/gen_current_verified_claims.py
          python scripts/compile_v2_spec.py
          python scripts/gen_b528_b532_completion_proof_v1_5.py --check
          python scripts/gen_b534_b538_completion_proof_v1_5.py --check
          python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py --check
          python scripts/gen_release_evidence_manifest_v1_5.py --check
          python scripts/gen_current_verified_claims.py --check
          python scripts/compile_v2_spec.py --check
      - name: Commit clean exact-source combined candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- .github/workflows Weall-Protocol/generated Weall-Protocol/docs/CURRENT_VERIFIED_CLAIMS.md web/src/generated/protocolStatus.ts
          git diff --cached --check
          git commit -m 'test(integration): refresh W1-A and PoH source-bound evidence together'
          git push origin HEAD:audit/w1a-poh-combined-20261014
      - name: Verify generated specs from clean Git archive
        run: |
          cd Weall-Protocol
          python scripts/check_v2_spec_clean_checkout.py
      - name: Install and build frontend
        run: |
          cd web
          npm ci
          npm run typecheck
          npm run build
      - name: Full backend regression suite on combined candidate
        run: |
          cd Weall-Protocol
          pytest -q
