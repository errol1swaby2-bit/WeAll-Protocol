name: P1 A16 All-Tx Semantic Matrix

on:
  push:
    branches:
      - p1-revalidation-after-p0-20261005
    paths:
      - .github/workflows/p1-a16-semantic-matrix.yml

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p1-revalidation-after-p0-20261005
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dev environment
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Format A16 assurance files
        working-directory: Weall-Protocol
        run: |
          ruff check --fix scripts/gen_tx_semantic_assurance_v1_5.py tests/test_a16_f006_all_tx_semantic_assurance.py
          ruff format scripts/gen_tx_semantic_assurance_v1_5.py tests/test_a16_f006_all_tx_semantic_assurance.py
          ruff check scripts/gen_tx_semantic_assurance_v1_5.py tests/test_a16_f006_all_tx_semantic_assurance.py
          ruff format --check scripts/gen_tx_semantic_assurance_v1_5.py tests/test_a16_f006_all_tx_semantic_assurance.py

      - name: Generate all-236 semantic manifest
        working-directory: Weall-Protocol
        run: |
          python scripts/gen_tx_semantic_assurance_v1_5.py

      - name: Execute all-236 semantic matrix
        working-directory: Weall-Protocol
        run: |
          pytest -q tests/test_a16_f006_all_tx_semantic_assurance.py

      - name: Remove temporary workflow and commit proven matrix
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/p1-a16-semantic-matrix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No A16 semantic matrix diff produced'; exit 1; }
          git diff --check --cached
          git commit -m 'test: prove all-236 semantic transaction matrix'
          git push origin HEAD:p1-revalidation-after-p0-20261005

# retry after semantic baseline enrichment
