name: Runtime Authority Proof Refresh

on:
  push:
    branches:
      - runtime-authority-hardening-20260921

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Remove refresh harness from evidence source tree
        run: |
          git rm .github/workflows/runtime-authority-proof-refresh.yml

      - name: Install locked development environment
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Refresh uncovered source-bound completion proofs
        working-directory: Weall-Protocol
        run: |
          PYTHONPATH=src:scripts python scripts/gen_b528_b532_completion_proof_v1_5.py
          PYTHONPATH=src:scripts python scripts/gen_b534_b538_completion_proof_v1_5.py
          PYTHONPATH=src:scripts python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py
          PYTHONPATH=src:scripts python scripts/gen_b528_b532_completion_proof_v1_5.py --check
          PYTHONPATH=src:scripts python scripts/gen_b534_b538_completion_proof_v1_5.py --check
          PYTHONPATH=src:scripts python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py --check

      - name: Prove focused stale-artifact and runtime closures
        working-directory: Weall-Protocol
        run: |
          ruff format --check src/weall/api/app.py src/weall/runtime/bft_outbound.py tests/test_runtime_authority_retry_elimination.py
          ruff check src/weall/api/app.py src/weall/runtime/bft_outbound.py tests/test_runtime_authority_retry_elimination.py
          pytest -q \
            tests/test_runtime_authority_retry_elimination.py \
            tests/test_api_app_fail_closed.py \
            tests/test_pb001by_pacemaker_timeout_emission.py \
            tests/test_bft_journal_restart.py \
            tests/test_autonomous_validator_ipfs_anti_sybil_economics_read_models.py::test_claim_boundaries_and_artifact_freshness \
            tests/test_full_node_db_api_dispute_storage_coverage.py::test_b534_freshness_check_is_deterministic_and_live_verification_is_explicit \
            tests/test_validator_db_lifecycle_reviewer_accountability_storage_coverage.py::test_b528_freshness_check_is_deterministic_and_live_verification_is_explicit

      - name: Rebuild downstream evidence chain with v2 last
        working-directory: Weall-Protocol
        run: |
          python scripts/check_generated.py
          PYTHONPATH=src:scripts python scripts/gen_public_only_protocol_audit_v1_5.py
          PYTHONPATH=src:scripts python scripts/gen_release_evidence_manifest_v1_5.py
          PYTHONPATH=src:scripts python scripts/gen_public_beta_blocker_report_v1_5.py
          PYTHONPATH=src python scripts/gen_current_verified_claims.py
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src:scripts python scripts/check_v15_public_readiness_artifacts.py
          PYTHONPATH=src python scripts/gen_current_verified_claims.py --check
          python scripts/check_public_claim_freshness.py
          PYTHONPATH=src python scripts/compile_v2_spec.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check

      - name: Commit exact clean evidence tree
        run: |
          git config user.name "weall-audit-bot"
          git config user.email "weall-audit-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Refresh runtime hardening source-bound proofs"

      - name: Validate exact committed tree and full backend suite
        working-directory: Weall-Protocol
        run: |
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          python scripts/check_v2_spec_clean_checkout.py
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src:scripts python scripts/check_v15_public_readiness_artifacts.py
          python scripts/check_public_claim_freshness.py
          python scripts/gen_current_verified_claims.py --check
          PYTHONPATH=src:scripts python scripts/gen_b528_b532_completion_proof_v1_5.py --check
          PYTHONPATH=src:scripts python scripts/gen_b534_b538_completion_proof_v1_5.py --check
          PYTHONPATH=src:scripts python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py --check
          pytest -q

      - name: Push exact validated tree
        run: |
          git push origin HEAD:runtime-authority-hardening-20260921
