name: P0-10 F001 integrated review refresh

on:
  push:
    branches: ["p0-03-production-closure-staging-20261001"]
    paths:
      - ".github/workflows/p0-10-f001-integrated-review-refresh.yml"

permissions:
  contents: write

concurrency:
  group: p0-10-f001-integrated-review-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Weall-Protocol

    steps:
      - name: Checkout integrated staging branch
        uses: actions/checkout@v4
        with:
          ref: p0-03-production-closure-staging-20261001
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Refresh proof artifacts before V2 compilation
        run: |
          python scripts/gen_b528_b532_completion_proof_v1_5.py
          python scripts/gen_b534_b538_completion_proof_v1_5.py
          python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py
          python scripts/compile_v2_spec.py

      - name: Verify regenerated working tree
        run: |
          python scripts/check_generated.py
          python scripts/gen_b528_b532_completion_proof_v1_5.py --check
          python scripts/gen_b534_b538_completion_proof_v1_5.py --check
          python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py --check
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          PYTHONDONTWRITEBYTECODE=1 python scripts/check_v15_public_readiness_artifacts.py
          python scripts/check_public_claim_freshness.py
          python scripts/gen_current_verified_claims.py --check

      - name: Canon lint
        run: python -m tooling.canon_lint

      - name: Focused F001 regression
        run: |
          pytest -q \
            tests/test_p0_10_a15_f001_bounded_block_history.py \
            tests/test_block_commitments_required.py \
            tests/test_restart_and_sync_safety.py \
            tests/test_bft_canonical_finality_bridge.py \
            tests/test_priority1_lock_vs_highqc_branch_safety.py \
            tests/test_priority1_locked_qc_safety.py

      - name: Full backend regression
        run: pytest -q

      - name: Prepare workflow-free integrated commit
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Weall-Protocol/generated/b528_b532_completion_proof_v1_5.json \
            Weall-Protocol/generated/b534_b538_completion_proof_v1_5.json \
            Weall-Protocol/generated/b567_b571_autonomous_mechanics_proof_v1_5.json \
            Weall-Protocol/generated/v2 \
            web/src/generated/protocolStatus.ts
          git rm .github/workflows/p0-10-f001-integrated-review-refresh.yml
          git commit -m "chore(p0-10): refresh integrated review derivatives"

      - name: Verify committed clean checkout contract
        run: |
          python scripts/check_v2_spec_clean_checkout.py
          bash scripts/verify_release_tree.sh

      - name: Push verified integrated state
        working-directory: .
        env:
          BRANCH: p0-03-production-closure-staging-20261001
        run: git push origin "HEAD:${BRANCH}"
