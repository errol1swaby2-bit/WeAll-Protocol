name: P2B Materialized Helper Patch Diagnostic

on:
  push:
    branches: ["p2-complete-remediation-20260927"]
    paths:
      - ".github/workflows/p2b-materialized-helper-diagnostic.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: p2-complete-remediation-20260927

      - name: Verify source preimages
        shell: bash
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor 484e1b481d7a5a588fa3f39fb20c0480c3f258c4 HEAD
          test "$(git hash-object Weall-Protocol/src/weall/runtime/helper_merge.py)" = "067a6e6feedebc237131e995310ef45aac6e824e"
          test "$(git hash-object Weall-Protocol/src/weall/runtime/helper_apply.py)" = "9f70851f1c460772f6f75e88997b589a85b3ad5a"

      - name: Recover and run patcher
        shell: bash
        run: |
          set -Eeuo pipefail
          python .github/p2b_extract_patcher.py
          python /tmp/p2b_patch.py

      - name: Compile patched files
        shell: bash
        run: |
          set -Eeuo pipefail
          cd Weall-Protocol
          python -m py_compile src/weall/runtime/helper_merge.py
          python -m py_compile src/weall/runtime/helper_apply.py
          python -m py_compile tests/test_helper_merge.py
          python -m py_compile tests/test_helper_materialized_merge_restart.py
          python -m py_compile scripts/rehearse_helper_block_path_adversarial_b593_v1_5.py
          echo "all patched Python files compile"
