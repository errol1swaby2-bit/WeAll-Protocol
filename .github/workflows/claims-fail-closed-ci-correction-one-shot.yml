name: Claim evidence CI correction one-shot

on:
  push:
    branches:
      - claims-fail-closed-evidence-hardening

permissions:
  contents: write

jobs:
  correct-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked backend dependencies
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Apply formatting and derivative corrections
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          ruff format scripts/gen_current_verified_claims.py tests/test_current_verified_claims_fail_closed.py
          python scripts/compile_v2_spec.py
          python scripts/gen_current_verified_claims.py

      - name: Validate corrected branch
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          ruff format --check scripts/gen_current_verified_claims.py tests/test_current_verified_claims_fail_closed.py
          ruff check scripts/gen_current_verified_claims.py tests/test_current_verified_claims_fail_closed.py
          PYTHONPATH=src python -m pytest -q tests/test_current_verified_claims_fail_closed.py
          PYTHONPATH=src python scripts/check_public_claim_freshness.py
          PYTHONPATH=src python scripts/gen_current_verified_claims.py --check
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          python scripts/check_v2_spec_clean_checkout.py

      - name: Commit correction and remove one-shot workflow
        run: |
          set -Eeuo pipefail
          rm -- .github/workflows/claims-fail-closed-ci-correction-one-shot.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Correct claim hardening CI formatting and V2 derivatives'
          git push origin HEAD:claims-fail-closed-evidence-hardening
