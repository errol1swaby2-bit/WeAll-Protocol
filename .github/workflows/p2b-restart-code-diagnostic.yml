name: P2B Restart Rejection Code Diagnostic

on:
  push:
    branches: ["p2-complete-remediation-20260927"]
    paths:
      - ".github/workflows/p2b-restart-code-diagnostic.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: p2-complete-remediation-20260927
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked backend tooling
        working-directory: Weall-Protocol
        shell: bash
        run: |
          set -Eeuo pipefail
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps
      - name: Apply exact P2B candidate patch in runner
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git hash-object Weall-Protocol/src/weall/runtime/helper_merge.py)" = "067a6e6feedebc237131e995310ef45aac6e824e"
          python .github/p2b_extract_patcher.py
          python /tmp/p2b_patch.py
          cd Weall-Protocol
          FILES="src/weall/runtime/helper_merge.py src/weall/runtime/helper_apply.py tests/test_helper_merge.py tests/test_helper_materialized_merge_restart.py scripts/rehearse_helper_block_path_adversarial_b593_v1_5.py"
          ruff format $FILES
          ruff check --fix $FILES
          ruff format $FILES
          ruff check $FILES
      - name: Print exact restart verifier decisions
        working-directory: Weall-Protocol
        shell: bash
        run: |
          set -Eeuo pipefail
          python ../.github/p2b_restart_diag.py
