name: PR26 Exact Tree V2 Refresh

on:
  push:
    branches:
      - production-readiness-audit-20260925

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: production-readiness-audit-20260925

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Remove temporary workflow before compilation
        run: rm .github/workflows/pr26-exact-tree-v2-refresh.yml

      - name: Install backend locked dependencies
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Generate exact-tree V2 derivatives
        working-directory: Weall-Protocol
        run: python scripts/compile_v2_spec.py

      - name: Commit exact-tree derivatives and self-delete
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .github/workflows/pr26-exact-tree-v2-refresh.yml web/src/generated/protocolStatus.ts Weall-Protocol/generated/v2
          git diff --cached --quiet && exit 0
          git commit -m "Refresh V2 derivatives against final review tree"
          git push origin HEAD:production-readiness-audit-20260925
