name: P1 Remediate Batch 2

on:
  push:
    branches:
      - p1-revalidation-after-p0-20261005
    paths:
      - .github/workflows/p1-remediate-batch2.yml

permissions:
  contents: write

jobs:
  patch-a11-f002:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: p1-revalidation-after-p0-20261005
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked backend environment
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Apply exact A11-F002 fail-closed repair
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("Weall-Protocol/src/weall/runtime/apply/economics.py")
          text = path.read_text(encoding="utf-8")
          needle = '''    payload = _as_dict(env.payload)\n    _reject_civic_fee_gate(payload)\n    econ = _ensure_econ_root(state)\n    fp = econ.get("fee_policy")\n    if not isinstance(fp, dict):\n        fp = {}\n\n    for k, v in payload.items():\n'''
          replacement = '''    payload = _as_dict(env.payload)\n    _reject_civic_fee_gate(payload)\n    econ = _ensure_econ_root(state)\n    fp = econ.get("fee_policy")\n    if not isinstance(fp, dict):\n        fp = {}\n\n    # A11-F002: transfer-fee settlement is not yet atomically enforced by\n    # BALANCE_TRANSFER. Until that contract exists, nonzero policy must fail\n    # closed rather than advertise a fee users can bypass. A zero setting is\n    # still allowed so any historical/noncanonical positive state can be\n    # explicitly neutralized.\n    requested_transfer_fee = _as_int(\n        payload.get("transfer_fee_int", fp.get("transfer_fee_int", 0)), 0\n    )\n    if requested_transfer_fee > 0:\n        raise EconomicsApplyError(\n            "forbidden",\n            "transfer_fee_policy_not_enforced",\n            {"transfer_fee_int": int(requested_transfer_fee)},\n        )\n\n    for k, v in payload.items():\n'''
          count = text.count(needle)
          if count != 1:
              raise SystemExit(f"A11-F002 source anchor mismatch: expected 1 occurrence, found {count}")
          path.write_text(text.replace(needle, replacement, 1), encoding="utf-8")
          PY

      - name: Run focused A11 regressions
        working-directory: Weall-Protocol
        run: |
          pytest -q \
            tests/test_p1_latest_medium_closure.py \
            tests/test_economics_canon_apply_alignment.py

      - name: Canon sanity
        working-directory: Weall-Protocol
        run: |
          python -m tooling.canon_lint
          python scripts/check_generated.py

      - name: Commit proven repair to P1 branch
        run: |
          set -Eeuo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Weall-Protocol/src/weall/runtime/apply/economics.py
          git diff --cached --quiet && { echo 'No implementation change produced'; exit 1; }
          git commit -m 'fix: fail closed on unenforced transfer fee policy'
          git push origin HEAD:p1-revalidation-after-p0-20261005
