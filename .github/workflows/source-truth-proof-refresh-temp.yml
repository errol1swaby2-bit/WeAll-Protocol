name: Source Truth Proof Refresh Temporary

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.ref == 'active-source-truth-hardening-20260921'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked development dependencies
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Remove temporary workflow before generation
        run: rm .github/workflows/source-truth-proof-refresh-temp.yml

      - name: Regenerate deterministic source-bound proofs and downstream truth artifacts
        working-directory: Weall-Protocol
        shell: bash
        run: |
          set -Eeuo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          export PYTHONPATH=src:scripts

          python scripts/gen_b528_b532_completion_proof_v1_5.py
          python scripts/gen_b528_b532_completion_proof_v1_5.py --check
          python scripts/gen_b528_b532_completion_proof_v1_5.py --verify-live

          python scripts/gen_b534_b538_completion_proof_v1_5.py
          python scripts/gen_b534_b538_completion_proof_v1_5.py --check
          python scripts/gen_b534_b538_completion_proof_v1_5.py --verify-live

          python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py
          python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py --check
          python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py --verify-live

          python scripts/gen_failure_code_registry_v1_5.py --check
          python scripts/gen_release_evidence_manifest_v1_5.py
          python scripts/gen_public_beta_blocker_report_v1_5.py
          python scripts/gen_current_verified_claims.py

          python scripts/check_v15_public_readiness_artifacts.py
          python scripts/check_public_claim_freshness.py
          python scripts/gen_current_verified_claims.py --check

          PYTHONPATH=src python scripts/compile_v2_spec.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check

          pytest -q \
            tests/test_autonomous_validator_ipfs_anti_sybil_economics_read_models.py::test_claim_boundaries_and_artifact_freshness \
            tests/test_full_node_db_api_dispute_storage_coverage.py::test_b534_freshness_check_is_deterministic_and_live_verification_is_explicit \
            tests/test_validator_db_lifecycle_reviewer_accountability_storage_coverage.py::test_b528_freshness_check_is_deterministic_and_live_verification_is_explicit \
            tests/test_current_document_registry.py

      - name: Commit regenerated proof chain
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "weall-source-truth-closure"
          git config user.email "actions@users.noreply.github.com"
          git add -u
          git diff --cached --check
          git status --short
          git commit -m "Refresh source-bound completion proofs"

      - name: Verify exact committed tree
        working-directory: Weall-Protocol
        shell: bash
        run: |
          set -Eeuo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          export PYTHONPATH=src:scripts

          python scripts/gen_b528_b532_completion_proof_v1_5.py --check
          python scripts/gen_b528_b532_completion_proof_v1_5.py --verify-live
          python scripts/gen_b534_b538_completion_proof_v1_5.py --check
          python scripts/gen_b534_b538_completion_proof_v1_5.py --verify-live
          python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py --check
          python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py --verify-live

          python scripts/check_v15_public_readiness_artifacts.py
          python scripts/check_public_claim_freshness.py
          python scripts/gen_current_verified_claims.py --check
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          python scripts/check_v2_spec_clean_checkout.py
          python scripts/check_release_hygiene_v1_5.py

      - name: Restore historical evidence and run full backend suite
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/restore_m2_m3_evidence_from_git.sh --destination "${GITHUB_WORKSPACE}"
          cd Weall-Protocol
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src pytest -q
          git diff --exit-code
          git diff --cached --exit-code

      - name: Push validated exact head
        shell: bash
        run: |
          set -Eeuo pipefail
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
