name: PR38 P0 Closure Audit Reconcile

on:
  push:
    branches: ["p0-03-production-closure-staging-20261001"]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: p0-03-production-closure-staging-20261001

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked backend
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Remove one-shot workflow before source inventory generation
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/pr38-p0-closure-audit-reconcile.yml
          git diff --check

      - name: Reconcile canonical P0 audit records
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          status_path = Path("docs/audit/WeAll-A01-A20-P0-Closure-Status-20260930.md")
          status = status_path.read_text(encoding="utf-8")

          old = "On the exact current tree all 13 non-equivalent P0 mutants are killed, with zero survivors and zero invalid mutations; the normal Backend CI independently passes this gate before the full pytest suite."
          new = "The exact-head P0 assurance gate kills all 15 non-equivalent P0 mutants, with zero survivors and zero invalid mutations; the normal Backend CI independently passes this gate before the full pytest suite."
          if status.count(old) != 1:
              raise SystemExit(f"expected one P0-11 mutation-count sentence, found {status.count(old)}")
          status = status.replace(old, new, 1)

          replacement = (
              "## Reference exact-head evidence and final-head binding\n\n"
              "The last workflow-free runtime/evidence candidate before this audit-ledger reconciliation was commit `cf9d36cb101f8211dd1bcac1a0975dbcc724a01f`, Git tree `beb93ce2f78ad60e03ead35383dd17be3a839e5a`.\n\n"
              "On that candidate:\n\n"
              "- Backend CI was green, including Ruff, dependency audit, canon lint, generated-artifact checks, historical-evidence restoration, the P0 property/mutation assurance gate, full pytest, and transaction-coverage report generation/upload;\n"
              "- Reviewer Readiness Gate was green;\n"
              "- Web CI was green;\n"
              "- Secrets Guard was green;\n"
              "- the normal Backend CI P0 assurance gate killed **15/15** non-equivalent mutants with zero survivors and zero invalid mutations;\n"
              "- the normal Backend CI full suite completed with **4,743 passed, 1 skipped**;\n"
              "- the workflow-free pre-push finalizer independently ran the exact candidate through generated/public-claim checks and a full backend suite with **4,744 passed** before push;\n"
              "- all temporary PR38 remediation workflows were absent from the candidate tree.\n\n"
              "This reference candidate proves the runtime and generated-evidence closure used by the final P0 audit reconciliation, including the P0-06 production human-authority scope lock. The reconciliation itself changes audit truth text and regenerated claim/spec derivatives, not the closed runtime invariants.\n\n"
              "A tracked Git object cannot stably embed the commit SHA or Git tree hash of the commit that contains that same object: changing the embedded identifier changes the object and therefore changes the identifier. For that reason, this ledger intentionally does **not** label an embedded SHA as its own final head. The final exact PR commit SHA and Git tree are recorded in PR #38 metadata after the workflow-free reconciled tree passes the normal Backend CI, Reviewer Readiness, Web CI, and Secrets Guard gates. This ledger remains a required hashed input to current claim generation, so final same-tree claim/spec validation still fails closed if the ledger and generated evidence diverge.\n\n"
          )
          status, count = re.subn(
              r"## Current exact-head evidence\n.*?(?=## Merge / closure prohibition)",
              replacement,
              status,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f"expected one current exact-head evidence section, found {count}")

          post = (
              "## Post-closure implementation boundary\n\n"
              "1. Keep production positive PoH human-authority creation/advancement scope-closed while the uniqueness/privacy/adjudication and post-commit unpredictable reviewer-entropy protocols remain undefined or unproven.\n"
              "2. Treat any future re-enablement of production PoH human authority as a new protocol feature requiring separate reviewed design, adversarial/restart/state-sync evidence, generated-artifact refresh, and exact-head normal CI before activation.\n"
              "3. Preserve the final exact reconciled commit SHA and Git tree in PR #38 metadata after all normal gates pass; do not weaken public-beta/mainnet/launch claim boundaries merely because the P0 repository closure is complete.\n"
          )
          status, count = re.subn(
              r"## Next implementation order\n.*\Z",
              post,
              status,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f"expected one next implementation order section, found {count}")
          status_path.write_text(status, encoding="utf-8")

          manifest_path = Path("docs/audit/WeAll-A01-A20-P0-Closure-Manifest-20260930.md")
          manifest = manifest_path.read_text(encoding="utf-8")
          old = "Closure condition: Define/enforce a protocol-level uniqueness authority and remove applicant-controlled entropy from reviewer selection (commit/reveal or protocol-assigned unpredictable selection input), with Sybil/collusion/grinding tests."
          new = "Closure condition: Either (a) define/enforce a protocol-level uniqueness authority and post-commit unpredictable reviewer-selection input with Sybil/collusion/grinding evidence, or (b) make an explicit reviewed production-scope decision that renders positive human-authority creation/advancement and its reviewer schedulers unreachable until those primitives exist, with adversarial evidence that the scope lock is consensus-visible and non-bypassable."
          if manifest.count(old) != 1:
              raise SystemExit(f"expected one P0-06 closure condition, found {manifest.count(old)}")
          manifest = manifest.replace(old, new, 1)
          manifest_path.write_text(manifest, encoding="utf-8")
          PY
          git diff --check

      - name: Regenerate same-tree current claims
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python scripts/gen_current_verified_claims.py
          python scripts/gen_current_verified_claims.py --check

      - name: Compile V2 derivatives last against workflow-free reconciled tree
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python scripts/compile_v2_spec.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check

      - name: Verify generated and public claim surfaces
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python scripts/check_generated.py
          PYTHONDONTWRITEBYTECODE=1 python scripts/check_v15_public_readiness_artifacts.py
          python scripts/check_public_claim_freshness.py
          python scripts/gen_current_verified_claims.py --check
          python scripts/gen_b510_b515_completion_proof_v1_5.py --check
          python scripts/gen_b528_b532_completion_proof_v1_5.py --check
          python scripts/gen_b534_b538_completion_proof_v1_5.py --check
          python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py --check

      - name: Focused P0 closure audit regressions
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          pytest -q \
            tests/test_p0_03_production_composition.py \
            tests/test_p0_03_certified_branch_transition.py \
            tests/test_p0_06_production_scope_closure.py \
            tests/test_p0_06a_duplicate_account_adjudication.py \
            tests/test_p0_claim_audit_binding.py \
            tests/test_current_verified_claims_fail_closed.py \
            tests/test_current_verified_claims_p0_scope_closed_status.py \
            tests/test_p0_property_invariants.py

      - name: P0 mutation and property assurance against reconciled tree
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python tests/p0_assurance.py gate \
            --report /tmp/p0_assurance_report.json \
            --timeout-seconds 120
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("/tmp/p0_assurance_report.json").read_text())
          summary = p.get("summary", {})
          assert summary.get("non_equivalent_total") == 15, summary
          assert summary.get("killed") == 15, summary
          assert summary.get("survived") == [], summary
          assert summary.get("invalid") == [], summary
          print(summary)
          PY

      - name: Full backend regression suite
        working-directory: Weall-Protocol
        run: pytest -q

      - name: Commit workflow-free reconciled candidate
        run: |
          set -Eeuo pipefail
          test ! -e .github/workflows/pr38-p0-closure-audit-reconcile.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "audit: reconcile final P0 closure evidence truth"

      - name: Exact-commit reconciliation validation
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python scripts/check_generated.py
          python scripts/check_v2_spec_clean_checkout.py
          PYTHONDONTWRITEBYTECODE=1 python scripts/check_v15_public_readiness_artifacts.py
          python scripts/check_public_claim_freshness.py
          python scripts/gen_current_verified_claims.py --check
          git -C .. diff --exit-code
          git -C .. diff --cached --exit-code
          test -z "$(git -C .. status --porcelain)"

      - name: Push reconciled exact candidate
        run: git push origin HEAD:p0-03-production-closure-staging-20261001
