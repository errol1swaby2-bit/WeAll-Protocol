name: Finalize audit remediation v8

on:
  push:
    branches: ["audit-remediation-20260929"]

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: audit-remediation-20260929
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Apply reviewed v6 source repair and final readiness truth fix
        working-directory: Weall-Protocol
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path("../.github/workflows/audit-remediation-finalize6.yml").read_text(encoding="utf-8")
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          code = textwrap.dedent(workflow[start:end])
          exec(compile(code, "audit-remediation-final-source-patch-v8", "exec"), {"__name__": "__main__"})

          health = Path("src/weall/api/routes_public_parts/health.py")
          text = health.read_text(encoding="utf-8")
          old = '''    require_block_loop = _env_bool("WEALL_READYZ_REQUIRE_BLOCK_LOOP", _is_prod())\n    bl = _try_block_loop_status(ex)\n    if require_block_loop:\n        ready = (\n            bool(ready)\n            and (bl.get("running") is not False)\n            and (bl.get("unhealthy") is not True)\n        )\n'''
          new = '''    require_block_loop = _env_bool("WEALL_READYZ_REQUIRE_BLOCK_LOOP", _is_prod())\n    bl = _try_block_loop_status(ex)\n\n    # An executor that explicitly declares itself unhealthy is never ready,\n    # regardless of environment.  The production/default strictness flag also\n    # makes an explicitly stopped block loop readiness-fatal.  Unknown telemetry\n    # remains non-fatal so observer/test doubles without a producer loop are not\n    # rejected merely because the signal is unavailable.\n    if bl.get("unhealthy") is True:\n        ready = False\n    if require_block_loop and bl.get("running") is False:\n        ready = False\n'''
          if text.count(old) != 1:
              raise SystemExit(f"readyz policy target count={text.count(old)}")
          health.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Remove temporary remediation workflow scaffolding before hashing
        shell: bash
        run: |
          rm -f .github/workflows/audit-remediation-apply.yml
          rm -f .github/workflows/audit-remediation-recovery.yml
          rm -f .github/workflows/audit-remediation-recovery2.yml
          rm -f .github/workflows/audit-remediation-semantic-discovery.yml
          rm -f .github/workflows/audit-remediation-finalize.yml
          rm -f .github/workflows/audit-remediation-finalize2.yml
          rm -f .github/workflows/audit-remediation-finalize3.yml
          rm -f .github/workflows/audit-remediation-finalize4.yml
          rm -f .github/workflows/audit-remediation-finalize5.yml
          rm -f .github/workflows/audit-remediation-finalize6.yml
          rm -f .github/workflows/audit-remediation-finalize7.yml

      - name: Install locked backend toolchain
        working-directory: Weall-Protocol
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Format and lint repaired backend sources
        working-directory: Weall-Protocol
        shell: bash
        run: |
          ruff format \
            src/weall/runtime/apply/roles.py \
            src/weall/runtime/node_operator_scheduler.py \
            src/weall/runtime/scheduler_pipeline.py \
            src/weall/api/routes_public_parts/health.py \
            scripts/compile_v2_spec.py \
            tests/test_readyz_block_loop_signals.py \
            tests/test_audit_remediation_validator_transitions.py \
            tests/test_audit_remediation_spec_compiler.py \
            tests/test_audit_remediation_readyz_truth.py
          ruff check \
            src/weall/runtime/apply/roles.py \
            src/weall/runtime/node_operator_scheduler.py \
            src/weall/runtime/scheduler_pipeline.py \
            src/weall/api/routes_public_parts/health.py \
            scripts/compile_v2_spec.py \
            tests/test_readyz_block_loop_signals.py \
            tests/test_audit_remediation_validator_transitions.py \
            tests/test_audit_remediation_spec_compiler.py \
            tests/test_audit_remediation_readyz_truth.py

      - name: Regenerate transaction canon and pinned chain identities
        working-directory: Weall-Protocol
        shell: bash
        run: |
          python scripts/gen_tx_index.py
          python scripts/build_production_genesis_manifest.py \
            --founding-account '@errol-genesis' \
            --founding-pubkey 'c195d59d38ecf84b9baa227aff88960759afb72d2150f6e27a3187d0a3ae08be' \
            --authority-pubkey 'c195d59d38ecf84b9baa227aff88960759afb72d2150f6e27a3187d0a3ae08be' \
            --genesis-time 1778368894 \
            --econ-unlock-days 90 \
            --bootstrap-expires-height 1008
          python scripts/gen_controlled_devnet_chain_manifest.py
          python scripts/gen_public_testnet_v1_chain_identity.py

      - name: Mark public testnet seed registry for required PQ re-signing
        working-directory: Weall-Protocol
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          manifest = json.loads((root / 'configs/chains/weall-testnet-v1.json').read_text(encoding='utf-8'))
          trust_path = root / 'configs/public_testnet_trust_roots.json'
          registry_path = root / 'configs/public_testnet_seed_registry.json'
          trust = json.loads(trust_path.read_text(encoding='utf-8'))
          registry = json.loads(registry_path.read_text(encoding='utf-8'))

          identity_keys = (
              'network_id',
              'chain_id',
              'genesis_hash',
              'genesis_state_root',
              'protocol_profile_hash',
              'tx_index_hash',
          )
          for key in identity_keys:
              if key in manifest:
                  trust[key] = manifest[key]
                  registry[key] = manifest[key]

          registry['seed_registry_rotation_required'] = True
          registry['pq_resign_required_before_public_testnet'] = True
          registry['seed_registry_signature'] = ''
          registry['seed_registry_rotation_reason'] = 'audit_remediation_tx_index_change_20260929'
          registry['seed_registry_rotation_commitment'] = {
              'genesis_hash': manifest['genesis_hash'],
              'genesis_state_root': manifest['genesis_state_root'],
              'protocol_profile_hash': manifest['protocol_profile_hash'],
              'tx_index_hash': manifest['tx_index_hash'],
          }

          trust_path.write_text(json.dumps(trust, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          registry_path.write_text(json.dumps(registry, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Regenerate directly affected v1.5 release evidence
        working-directory: Weall-Protocol
        shell: bash
        run: |
          python scripts/gen_api_contract_map.py
          python scripts/gen_failure_code_registry_v1_5.py
          python scripts/gen_api_response_vectors_v1_5.py
          python scripts/gen_genesis_testnet_launch_readiness_v1_5.py
          python scripts/gen_b528_b532_completion_proof_v1_5.py
          python scripts/gen_b534_b538_completion_proof_v1_5.py
          python scripts/gen_b539_b543_production_path_proof_v1_5.py
          python scripts/gen_b549_b553_controlled_testnet_candidate_proof_v1_5.py
          python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py
          python scripts/gen_public_beta_blocker_report_v1_5.py
          python scripts/gen_release_evidence_manifest_v1_5.py

      - name: Refresh bounded reviewed semantic bindings and V2 derivatives
        working-directory: Weall-Protocol
        shell: bash
        run: |
          python scripts/refresh_v2_semantic_reviews.py \
            --tx-type GOV_EXECUTE \
            --tx-type ROLE_NODE_OPERATOR_ENROLL \
            --tx-type NODE_OPERATOR_VALIDATOR_OPT_IN \
            --tx-type NODE_OPERATOR_RESPONSIBILITY_UPDATE \
            --tx-type ROLE_NODE_OPERATOR_ACTIVATE \
            --tx-type VALIDATOR_READINESS_VERIFY \
            --tx-type ROLE_VALIDATOR_ACTIVATE \
            --reviewer "AI-assisted audit remediation requested by repository maintainer; not independent review" \
            --review-method "AI-assisted source review of authority/canonical-emission and validator-readiness repair with targeted regression evidence"

      - name: Focused remediation tests and generation gates
        working-directory: Weall-Protocol
        shell: bash
        run: |
          pytest -q \
            tests/test_audit_remediation_validator_transitions.py \
            tests/test_audit_remediation_spec_compiler.py \
            tests/test_audit_remediation_readyz_truth.py \
            tests/test_validator_live_readiness_runner.py \
            tests/test_node_operator_auto_activation_and_responsibilities.py \
            tests/test_readyz_block_loop_signals.py \
            tests/test_v2_spec_compiler.py \
            tests/test_canonical_poh_eligibility_and_node_controls.py \
            tests/test_p2_final_source_closure.py \
            tests/prod/test_public_testnet_v1_chain_identity.py \
            tests/test_production_genesis_bootstrap_config.py \
            tests/test_m2_chain_manifest_closure_gates.py
          python -m tooling.canon_lint
          python scripts/check_generated.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          PYTHONPATH=src python scripts/check_v15_public_readiness_artifacts.py

      - name: Full backend suite
        working-directory: Weall-Protocol
        run: pytest -q

      - name: Frontend install
        working-directory: web
        run: npm ci

      - name: Frontend typecheck and build
        working-directory: web
        shell: bash
        run: |
          npm run typecheck
          npm run build

      - name: Commit exact validated repair tree
        shell: bash
        run: |
          git status --short
          git config user.name "weall-audit-remediation-bot"
          git config user.email "weall-audit-remediation-bot@users.noreply.github.com"
          git add -A
          git commit -m "fix: repair validator reachability, canon, evidence, and readiness truth [audit-remediation-applied]"
          git push origin HEAD:audit-remediation-20260929
