name: Issue71 final-tree v1.5 API plus V2 evidence refresh (one-time)

on:
  push:
    branches:
      - feat/issue71-notification-attention-ux-20261030
    paths:
      - .github/workflows/issue71-v15-v2-finalize-once.yml

permissions:
  contents: write

jobs:
  finalize-api-and-v2:
    if: github.repository == 'errol1swaby2-bit/WeAll-Protocol'
    runs-on: ubuntu-24.04
    concurrency:
      group: issue71-final-tree-v15-v2-evidence
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Check exact branch identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF_NAME" = "feat/issue71-notification-attention-ux-20261030"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" = "$GITHUB_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Locked compiler dependencies
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps
      - name: Remove temporary workflow from FINAL source tree
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm -- .github/workflows/issue71-v15-v2-finalize-once.yml
      - name: Run official API map then V2 derivation and check
        shell: bash
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          PYTHONPATH=src python scripts/gen_api_contract_map.py
          PYTHONPATH=src python scripts/gen_api_contract_map.py --check
          PYTHONPATH=src python scripts/compile_v2_spec.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
      - name: Commit only registered generated surfaces and self-deletion
        shell: bash
        run: |
          set -Eeuo pipefail
          git add -A -- Weall-Protocol/generated/api_contract_map_v1_5.json Weall-Protocol/generated/v2/ web/src/generated/protocolStatus.ts
          python - <<'PY'
          import subprocess
          changes = subprocess.check_output(
              ["git", "diff", "--cached", "--name-only"], text=True
          ).splitlines()
          own = ".github/workflows/issue71-v15-v2-finalize-once.yml"
          assert own in changes, "expected temporary workflow deletion"
          assert "Weall-Protocol/generated/api_contract_map_v1_5.json" in changes, "expected API map change"
          for name in changes:
              assert (
                  name == own
                  or name == "Weall-Protocol/generated/api_contract_map_v1_5.json"
                  or name.startswith("Weall-Protocol/generated/v2/")
                  or name == "web/src/generated/protocolStatus.ts"
              ), f"Unexpected staged path: {name}"
          print("VALIDATED_COMMITTED_ARTIFACTS", len(changes) - 1)
          PY
          test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(evidence): regenerate exact final-tree API map and V2 derivatives"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
