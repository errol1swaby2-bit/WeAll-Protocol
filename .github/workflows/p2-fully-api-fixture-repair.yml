name: Repair P2 Fully API Storage Fixture

on:
  push:
    branches:
      - p2-complete-remediation-20260927
    paths:
      - .github/workflows/p2-fully-api-fixture-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: p2-complete-remediation-20260927
      - name: Guard preimage
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object Weall-Protocol/scripts/rehearse_fully_api_driven_v15_lifecycle.py)" = "3714d1b49acd64f79880b8e0720e753367909138"
      - name: Patch fully API lifecycle fixture
        shell: bash
        env:
          PATCH_B64: ""
        run: |
          set -Eeuo pipefail
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/patch_fully_api.py
          python /tmp/patch_fully_api.py
          python -m py_compile Weall-Protocol/scripts/rehearse_fully_api_driven_v15_lifecycle.py
          git diff --check -- Weall-Protocol/scripts/rehearse_fully_api_driven_v15_lifecycle.py
      - name: Commit and push
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/p2-storage-retrigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Weall-Protocol/scripts/rehearse_fully_api_driven_v15_lifecycle.py
          git add -u .github/p2-storage-retrigger.txt
          git diff --cached --check
          git commit -m "Fix fully API storage failover rehearsal"
          REMOTE_SHA="$(git ls-remote origin refs/heads/p2-complete-remediation-20260927 | awk '{print $1}')"
          test "$REMOTE_SHA" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/p2-complete-remediation-20260927
