name: P1 Reconcile Public Testnet Identity

on:
  push:
    branches:
      - p1-revalidation-after-p0-20261005
    paths:
      - .github/workflows/p1-reconcile-public-testnet-identity.yml

permissions:
  contents: write

concurrency:
  group: p1-reconcile-public-testnet-identity
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p1-revalidation-after-p0-20261005
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked backend environment
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Prove pinned identity and fail-closed registry state
        working-directory: Weall-Protocol
        run: |
          pytest -q \
            tests/prod/test_public_testnet_v1_chain_identity.py::test_public_testnet_v1_chain_identity_is_pinned_and_deterministic \
            tests/prod/test_public_testnet_v1_chain_identity.py::test_public_testnet_v1_chain_identity_generator_is_fresh \
            tests/prod/test_public_testnet_v1_chain_identity.py::test_checked_in_registry_and_trust_roots_match_current_public_testnet_identity

      - name: Remove temporary workflow from candidate tree
        run: |
          rm -f .github/workflows/p1-reconcile-public-testnet-identity.yml

      - name: Regenerate public observer identity-dependent evidence
        working-directory: Weall-Protocol
        run: |
          PYTHONPATH=src python scripts/gen_genesis_testnet_launch_readiness_v1_5.py
          PYTHONPATH=src python scripts/gen_public_genesis_seed_endpoint_requirements_v1_5.py
          PYTHONPATH=src:scripts python scripts/gen_public_observer_launch_transcript_v1_5.py
          PYTHONPATH=src:scripts python scripts/gen_public_observer_launch_evidence_requirements_v1_5.py
          python scripts/gen_public_beta_blocker_report_v1_5.py
          python scripts/gen_release_evidence_manifest_v1_5.py
          python scripts/gen_current_verified_claims.py

      - name: Reconcile V2 derivatives if repository evidence digests changed
        working-directory: Weall-Protocol
        run: |
          PYTHONPATH=src python scripts/compile_v2_spec.py

      - name: Regenerate dependent release evidence after V2
        working-directory: Weall-Protocol
        run: |
          python scripts/gen_public_beta_blocker_report_v1_5.py
          python scripts/gen_release_evidence_manifest_v1_5.py
          python scripts/gen_current_verified_claims.py

      - name: Commit workflow-free public-testnet candidate locally
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No public-testnet reconciliation diff produced'; exit 1; }
          git diff --check --cached
          git commit -m 'audit: reconcile current public testnet identity evidence'
          echo "candidate_sha=$(git rev-parse HEAD)"
          echo "candidate_tree=$(git rev-parse HEAD^{tree})"
          test -z "$(git status --porcelain)"

      - name: Verify exact committed candidate
        working-directory: Weall-Protocol
        run: |
          pytest -q tests/prod/test_public_testnet_v1_chain_identity.py
          python scripts/check_generated.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          python scripts/check_v2_spec_clean_checkout.py
          PYTHONPATH=src python scripts/gen_genesis_testnet_launch_readiness_v1_5.py --check
          PYTHONPATH=src python scripts/gen_public_genesis_seed_endpoint_requirements_v1_5.py --check
          PYTHONPATH=src:scripts python scripts/gen_public_observer_launch_transcript_v1_5.py --check
          PYTHONPATH=src:scripts python scripts/gen_public_observer_launch_evidence_requirements_v1_5.py --check
          PYTHONDONTWRITEBYTECODE=1 python scripts/check_v15_public_readiness_artifacts.py
          python scripts/gen_public_beta_blocker_report_v1_5.py --check
          python scripts/gen_release_evidence_manifest_v1_5.py --check
          python scripts/gen_current_verified_claims.py --check
          test -z "$(git status --porcelain)"

      - name: Push verified workflow-free candidate
        run: |
          set -Eeuo pipefail
          test ! -e .github/workflows/p1-reconcile-public-testnet-identity.yml
          test -z "$(git status --porcelain)"
          git push origin HEAD:p1-revalidation-after-p0-20261005
