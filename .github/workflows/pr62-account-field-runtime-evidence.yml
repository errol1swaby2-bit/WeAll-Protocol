name: PR62 targeted account-field runtime evidence

on:
  pull_request:
    paths:
      - .github/workflows/pr62-account-field-runtime-evidence.yml
      - Weall-Protocol/tests/test_pr62_account_field_runtime_evidence.py
      - Weall-Protocol/src/weall/runtime/apply/content.py
      - Weall-Protocol/src/weall/runtime/apply/reputation.py
      - Weall-Protocol/src/weall/runtime/apply/rewards.py
      - Weall-Protocol/src/weall/runtime/tx_admission_types.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoped-runtime-observation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Weall-Protocol
    steps:
      - name: Checkout exact triggering tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install hashed development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps
      - name: Run focused runtime tests with inspectable log
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/pr62-runtime-observation"
          mkdir -p "$OUT"
          {
            echo "scope=DOMAIN_APPLY_HANDLERS_ONLY_NOT_CONSENSUS_OR_CONSTITUTIONAL_APPROVAL"
            echo "checkout_commit=$(git rev-parse HEAD)"
            echo "pr_branch_sha=${{ github.event.pull_request.head.sha }}"
            echo "normative_authority=NOT_ESTABLISHED"
            sha256sum tests/test_pr62_account_field_runtime_evidence.py
          } > "$OUT/source_and_scope.txt"
          set +e
          pytest -vv tests/test_pr62_account_field_runtime_evidence.py 2>&1 |
            tee "$OUT/targeted_pytest.log"
          RC="${PIPESTATUS[0]}"
          set -e
          echo "pytest_exit_code=$RC" >> "$OUT/source_and_scope.txt"
          sha256sum "$OUT/targeted_pytest.log" >> "$OUT/source_and_scope.txt"
          exit "$RC"
      - name: Upload limited runtime observation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr62-account-field-runtime-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/pr62-runtime-observation/source_and_scope.txt
            ${{ runner.temp }}/pr62-runtime-observation/targeted_pytest.log
