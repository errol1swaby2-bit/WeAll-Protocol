name: PR77 V2 decision packet (no semantic approval)

on:
  push:
    branches:
      - review/pr70-pr75-pr76-consolidation-stage23-20261031
    paths:
      - Weall-Protocol/scripts/pr77_v2_semantic_review_packet.py
      - Weall-Protocol/tests/test_pr77_v2_semantic_review_packet.py
      - Weall-Protocol/tests/test_issue72_versioned_role_gate.py
      - Weall-Protocol/tests/test_pr77_severe_appeal_twenty_vote_guard.py tests/test_pr77_dispute_resolve_appeal_semantic_adjudication.py
      - Weall-Protocol/tests/test_pr77_dispute_resolve_appeal_semantic_adjudication.py
      - .github/workflows/pr77-v2-semantic-review-packet.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-review-packet:
    if: github.repository == 'errol1swaby2-bit/WeAll-Protocol'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        working-directory: Weall-Protocol
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install -e . --no-deps
      - name: Verify source-bound inventory and inspect all stale contracts
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          ruff check scripts/pr77_v2_semantic_review_packet.py tests/test_pr77_v2_semantic_review_packet.py tests/test_issue72_versioned_role_gate.py tests/test_pr77_severe_appeal_twenty_vote_guard.py tests/test_pr77_dispute_resolve_appeal_semantic_adjudication.py
          ruff format --diff tests/test_pr77_dispute_resolve_appeal_semantic_adjudication.py || true
          ruff format --check scripts/pr77_v2_semantic_review_packet.py tests/test_pr77_v2_semantic_review_packet.py tests/test_issue72_versioned_role_gate.py tests/test_pr77_severe_appeal_twenty_vote_guard.py tests/test_pr77_dispute_resolve_appeal_semantic_adjudication.py
          python -m pytest -q tests/test_pr77_v2_semantic_review_packet.py tests/test_issue72_versioned_role_gate.py tests/test_pr77_severe_appeal_twenty_vote_guard.py tests/test_pr77_dispute_resolve_appeal_semantic_adjudication.py
          python scripts/pr77_v2_semantic_review_packet.py --report pr77_v2_semantic_review_packet.json
          echo 'NO-GO: source-bound review packet does NOT accept any V2 semantic changes.'
      - name: Preserve inspectable per-transaction old/new contracts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr77-v2-contract-review-packet-no-authorization
          path: Weall-Protocol/pr77_v2_semantic_review_packet.json
          if-no-files-found: warn
