name: Temporary final readiness refresh

on:
  push:
    branches:
      - audit-r20-comprehensive-remediation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: audit-r20-comprehensive-remediation
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Remove temporary workflow before generation
        run: rm -f .github/workflows/temporary-final-readiness-refresh.yml

      - name: Install locked dependencies
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install -e .

      - name: Refresh reviewer-readiness derivatives in repository order
        working-directory: Weall-Protocol
        run: |
          python scripts/gen_public_only_protocol_audit_v1_5.py
          python scripts/gen_release_evidence_manifest_v1_5.py
          python scripts/gen_public_beta_blocker_report_v1_5.py
          python scripts/gen_current_verified_claims.py
          python scripts/compile_v2_spec.py
          ruff format .
          ruff check . --fix
          ruff format .

      - name: Validate refreshed tree
        working-directory: Weall-Protocol
        run: |
          ruff format --check .
          ruff check .
          python -m tooling.canon_lint
          python scripts/check_generated.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          PYTHONDONTWRITEBYTECODE=1 python scripts/check_v15_public_readiness_artifacts.py
          python scripts/check_public_claim_freshness.py
          python scripts/gen_current_verified_claims.py --check
          git diff --check

      - name: Commit exact validated refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No refresh changes required."
            exit 0
          fi
          git commit -m "fix: refresh reviewer readiness artifacts"
          git push origin HEAD:audit-r20-comprehensive-remediation
