name: PR26 Refresh V2 Derivatives

on:
  push:
    branches:
      - production-readiness-audit-20260925

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: production-readiness-audit-20260925

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked backend dependencies
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Regenerate v2 specification derivatives
        working-directory: Weall-Protocol
        run: |
          PYTHONPATH=src python scripts/compile_v2_spec.py

      - name: Verify regenerated derivatives in working tree
        working-directory: Weall-Protocol
        run: |
          PYTHONPATH=src python scripts/compile_v2_spec.py --check

      - name: Commit refreshed derivatives
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Weall-Protocol/generated/v2 web/src/generated/protocolStatus.ts
          if git diff --cached --quiet; then
            echo "No derivative changes to commit."
          else
            git commit -m "Refresh v2 specification derivatives"
          fi

      - name: Verify committed clean archive
        working-directory: Weall-Protocol
        run: |
          python scripts/check_v2_spec_clean_checkout.py

      - name: Push refreshed derivatives
        run: |
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/production-readiness-audit-20260925)" ]; then
            echo "No new commit to push."
          else
            git push origin HEAD:production-readiness-audit-20260925
          fi
