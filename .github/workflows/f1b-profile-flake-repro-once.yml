# Fourth reproduction: bounded read-only canonical account reconciliation before PROFILE_UPDATE.
name: F1b No-Retry Profile Flake Reproduction (temporary)

on:
  push:
    branches:
      - frontend/f1-guided-account-onboarding-20261104
    paths:
      - .github/workflows/f1b-profile-flake-repro-once.yml

permissions:
  contents: write

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Checkout existing PR
        uses: actions/checkout@v4
        with:
          ref: frontend/f1-guided-account-onboarding-20261104
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked runtime and Chromium
        timeout-minutes: 5
        run: |
          python -m pip install --upgrade pip
          (cd Weall-Protocol && pip install --require-hashes -r requirements-dev.lock && pip install -e . --no-deps)
          # Hosted ubuntu-24.04 already has Chromium shared-library prerequisites.
          # The full Web CI independently validates playwright --with-deps.
          (cd web && npm ci && npx playwright install chromium)
      - name: Repeat full real-stack custody three times without retry
        env:
          CI: "1"
          WEALL_M2_TRACE: "1"
          WEALL_CUSTODY_REPEAT_EACH: "3"
        run: |
          bash scripts/run_account_custody_real_stack_e2e.sh
      - name: Upload redacted-failure browser evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: f1b-first-attempt-flake-evidence
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
      - name: Remove this one-shot workflow before source hashing
        run: |
          rm .github/workflows/f1b-profile-flake-repro-once.yml
          test ! -e .github/workflows/f1b-profile-flake-repro-once.yml
      - name: Compile V2 final-tree derivatives
        working-directory: Weall-Protocol
        run: |
          PYTHONPATH=src python scripts/compile_v2_spec.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
      - name: Check bounded file-change set
        run: |
          set -euo pipefail
          mapfile -t changed < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          for file in "${changed[@]}"; do
            case "$file" in
              .github/workflows/f1b-profile-flake-repro-once.yml|Weall-Protocol/generated/v2/*|web/src/generated/protocolStatus.ts) ;;
              *) echo "Out-of-scope file: $file" >&2; exit 1 ;;
            esac
          done
          test "${#changed[@]}" -gt 1
      - name: Atomically commit compiler derivatives and temporary workflow removal
        run: |
          set -euo pipefail
          git add -u -- .github/workflows/f1b-profile-flake-repro-once.yml
          git add -- Weall-Protocol/generated/v2 web/src/generated/protocolStatus.ts
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "test(F1b): reconcile three-repeat first-attempt custody reliability evidence"
          (cd Weall-Protocol && PYTHONPATH=src python scripts/compile_v2_spec.py --check)
          git push origin HEAD:refs/heads/frontend/f1-guided-account-onboarding-20261104
