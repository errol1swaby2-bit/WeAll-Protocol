name: P1 Final Evidence Packaging

on:
  push:
    branches: ["p1-final-evidence-execution-20260927"]

permissions:
  contents: write
  actions: read

jobs:
  package-evidence:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: 06694e0d14ca318d6a9ffa1cad6253cedae38a10
      TARGET_TREE: bcda576f9ae44792d86ca949863233b4e6693745
      EVIDENCE_BRANCH: p1-final-evidence-closure-20260927
      ARTIFACT_REL: artifacts/p1-final-closure
      SOURCE_ARTIFACT_ID: "10936689738"
      SOURCE_ARTIFACT_SHA256: ca2ffb86e0d4a78ce385909c1c3b769c80540d3a519035eb3fec9c651748e2fd
    steps:
      - name: Checkout immutable implementation freeze
        uses: actions/checkout@v4
        with:
          ref: 06694e0d14ca318d6a9ffa1cad6253cedae38a10
          fetch-depth: 0

      - name: Verify immutable freeze
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Download and verify successful evidence artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          ZIP="$RUNNER_TEMP/p1-evidence.zip"
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            -o "$ZIP"
          echo "$SOURCE_ARTIFACT_SHA256  $ZIP" | sha256sum -c -
          unzip -q "$ZIP" -d "$GITHUB_WORKSPACE"
          test -f "$ARTIFACT_REL/P1_EVIDENCE_MANIFEST.json"
          test -f "$ARTIFACT_REL/SHA256SUMS"
          ( cd "$ARTIFACT_REL" && sha256sum -c SHA256SUMS )
          python - "$ARTIFACT_REL/P1_EVIDENCE_MANIFEST.json" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[1],encoding='utf-8'))
          expected={
            'implementation_freeze_commit':'06694e0d14ca318d6a9ffa1cad6253cedae38a10',
            'implementation_tree':'bcda576f9ae44792d86ca949863233b4e6693745',
            'evidence_commit_parent_required':'06694e0d14ca318d6a9ffa1cad6253cedae38a10',
            'known_p1_count':12,
            'all_p1_patched_and_proven':True,
            'all_gates_passed':True,
            'source_invariant_scan_passed':True,
            'merge_ci_green':True,
          }
          for k,v in expected.items():
              assert m.get(k)==v,(k,m.get(k),v)
          assert len(m.get('p1_findings',[]))==12
          assert len({x['id'] for x in m['p1_findings']})==12
          assert all(x.get('status')=='patched_and_proven' for x in m['p1_findings'])
          assert len(m.get('gates',[]))==8
          assert all(g.get('status')=='passed' and g.get('exit_code')==0 for g in m['gates'])
          print('OK: successful P1 evidence manifest verified')
          PY

      - name: Create evidence-only direct-child commit
        shell: bash
        run: |
          set -Eeuo pipefail
          BAD="$(git status --porcelain=v1 --untracked-files=all | awk -v p="$ARTIFACT_REL/" '{x=substr($0,4); if(index(x,p)!=1) print $0}')"
          if [[ -n "$BAD" ]]; then
            echo "non-evidence working-tree changes present:" >&2
            printf '%s\n' "$BAD" >&2
            exit 2
          fi
          git switch -c "$EVIDENCE_BRANCH" "$TARGET_SHA"
          git add -f -- "$ARTIFACT_REL"
          test -n "$(git diff --cached --name-only)"
          while IFS= read -r p; do
            [[ "$p" == "$ARTIFACT_REL/"* ]] || { echo "forbidden staged path: $p" >&2; exit 2; }
          done < <(git diff --cached --name-only)
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'audit: add final P1 closure evidence for 06694e0d'
          test "$(git rev-parse HEAD^)" = "$TARGET_SHA"
          for p in Weall-Protocol/src Weall-Protocol/tests .github web scripts; do
            git diff --quiet "$TARGET_SHA" HEAD -- "$p"
          done
          CHANGED="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          while IFS= read -r p; do
            [[ "$p" == "$ARTIFACT_REL/"* ]] || { echo "forbidden committed path: $p" >&2; exit 2; }
          done <<< "$CHANGED"
          git push origin "HEAD:$EVIDENCE_BRANCH"
          echo "Evidence commit: $(git rev-parse HEAD)"
