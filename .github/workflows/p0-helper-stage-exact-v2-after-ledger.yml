name: P0 helper stage exact V2 after ledger refresh

on:
  push:
    branches:
      - p0-tooling-exact-v2-refresh-20261001
    paths:
      - .github/workflows/p0-helper-stage-exact-v2-after-ledger.yml

permissions:
  contents: write

jobs:
  validate-closure-evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p0-evidence-closure-a10-a12-vectors-20261001
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          check-latest: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked backend and frontend dependencies
        run: |
          set -Eeuo pipefail
          cd Weall-Protocol
          python -m pip install --upgrade 'pip==26.2.1'
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps
          cd ../web
          npm ci

      - name: Patch A12 generated-vector truth source exactly
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("Weall-Protocol/scripts/gen_api_response_vectors_v1_5.py")
          text = path.read_text(encoding="utf-8")
          vector_ids = (
              "poh-async-my-cases-requires-session",
              "poh-tier2-my-cases-session",
              "poh-live-my-cases-session",
          )
          for vector_id in vector_ids:
              marker = f'"id": "{vector_id}"'
              start = text.index(marker)
              next_start = text.find('\n    {\n        "id":', start + len(marker))
              end = len(text) if next_start < 0 else next_start
              block = text[start:end]
              assert '"code": "session_required"' in block, vector_id
              assert '["session_required", "session_mismatch"]' in block, vector_id
              patched = block.replace(
                  '"code": "session_required"',
                  '"code": "poh_session_required"',
                  1,
              ).replace(
                  '["session_required", "session_mismatch"]',
                  '["poh_session_required", "poh_session_identity_mismatch"]',
                  1,
              )
              assert patched != block, vector_id
              text = text[:start] + patched + text[end:]
          path.write_text(text, encoding="utf-8")
          PY

      - name: Ruff A10 A12 closure evidence
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          ruff format --check \
            tests/test_p0_a10_treasury_restart_replay.py \
            tests/test_p0_a12_generated_vector_runtime_truth.py
          ruff check \
            tests/test_p0_a10_treasury_restart_replay.py \
            tests/test_p0_a12_generated_vector_runtime_truth.py

      - name: Regenerate A12 truth evidence dependency chain and exact V2 derivatives
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          PYTHONPATH=src python scripts/gen_api_response_vectors_v1_5.py
          PYTHONPATH=src:scripts python - <<'PY'
          import json
          from pathlib import Path

          from gen_b587_b594_testnet_mechanism_completion_v1_5 import build as build_b587
          from gen_final_public_observer_controlled_testnet_go_gate_v1_5 import build as build_final
          from gen_public_beta_blocker_report_v1_5 import build as build_blockers
          from gen_release_evidence_manifest_v1_5 import build as build_release
          from run_controlled_testnet_go_gate_v1_5 import build as build_controlled

          root = Path.cwd()

          def write(rel: str, payload: dict) -> None:
              path = root / rel
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(payload, sort_keys=True, indent=2) + "\n", encoding="utf-8")
              print(f"wrote {rel}")

          # B587 intentionally remains a bounded NO-GO artifact when its own
          # mechanism-completion conditions are false. Generate it without
          # treating that truthful NO-GO return posture as a workflow failure.
          write("generated/b587_b594_testnet_mechanism_completion_v1_5.json", build_b587())
          write("generated/public_beta_blocker_report_v1_5.json", build_blockers())
          write("generated/release_evidence_manifest_v1_5.json", build_release())
          write("generated/controlled_testnet_go_gate_v1_5.json", build_controlled())
          write("generated/final_public_observer_controlled_testnet_go_gate_v1_5.json", build_final())
          # Release manifest hashes the final gate and B587. Refresh once more
          # after both are current. Final/controlled only summarize release
          # posture, not its digest, so this reaches a deterministic fixed point.
          write("generated/release_evidence_manifest_v1_5.json", build_release())
          PY
          PYTHONPATH=src python scripts/gen_current_verified_claims.py
          PYTHONPATH=src python scripts/compile_v2_spec.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          python scripts/check_generated.py

      - name: Commit bounded closure evidence refresh
        run: |
          set -Eeuo pipefail
          BAD="$(git status --short --untracked-files=all | awk '{p=$2; if (p != "Weall-Protocol/scripts/gen_api_response_vectors_v1_5.py" && p != "Weall-Protocol/generated/api_response_vectors_v1_5.json" && p != "Weall-Protocol/generated/b587_b594_testnet_mechanism_completion_v1_5.json" && p != "Weall-Protocol/generated/controlled_testnet_go_gate_v1_5.json" && p != "Weall-Protocol/generated/current_verified_claims.json" && p != "Weall-Protocol/generated/final_public_observer_controlled_testnet_go_gate_v1_5.json" && p != "Weall-Protocol/generated/public_beta_blocker_report_v1_5.json" && p != "Weall-Protocol/generated/release_evidence_manifest_v1_5.json" && p != "web/src/generated/protocolStatus.ts" && p !~ /^Weall-Protocol\/generated\/v2\//) print}')"
          if [[ -n "$BAD" ]]; then
            echo 'Unexpected closure-refresh changes:' >&2
            printf '%s\n' "$BAD" >&2
            exit 1
          fi
          git add \
            Weall-Protocol/scripts/gen_api_response_vectors_v1_5.py \
            Weall-Protocol/generated/api_response_vectors_v1_5.json \
            Weall-Protocol/generated/b587_b594_testnet_mechanism_completion_v1_5.json \
            Weall-Protocol/generated/controlled_testnet_go_gate_v1_5.json \
            Weall-Protocol/generated/current_verified_claims.json \
            Weall-Protocol/generated/final_public_observer_controlled_testnet_go_gate_v1_5.json \
            Weall-Protocol/generated/public_beta_blocker_report_v1_5.json \
            Weall-Protocol/generated/release_evidence_manifest_v1_5.json \
            Weall-Protocol/generated/v2 \
            web/src/generated/protocolStatus.ts
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore(p0): bind A12 vectors and refresh A10 A12 evidence'
          fi
          test -z "$(git status --short --untracked-files=all)"

      - name: Prove A10 restart replay and A12 generated-vector runtime truth
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          pytest -q \
            tests/test_p0_a10_treasury_restart_replay.py \
            tests/test_p0_a12_generated_vector_runtime_truth.py \
            tests/test_p0_group_treasury_governance_binding.py \
            tests/test_p0_governance_economics_closure.py \
            tests/test_p0_a01_a20_closure_regressions.py \
            tests/test_p0_restart_and_poh_privacy_closure.py

      - name: Verify exact committed generated state
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python scripts/check_generated.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          python scripts/check_v2_spec_clean_checkout.py
          PYTHONPATH=src python scripts/gen_api_response_vectors_v1_5.py --check
          PYTHONPATH=src:scripts python scripts/gen_b587_b594_testnet_mechanism_completion_v1_5.py --check
          PYTHONPATH=src:scripts python scripts/gen_public_beta_blocker_report_v1_5.py --check
          PYTHONPATH=src:scripts python scripts/run_controlled_testnet_go_gate_v1_5.py --check
          PYTHONPATH=src:scripts python scripts/gen_final_public_observer_controlled_testnet_go_gate_v1_5.py --check
          PYTHONPATH=src:scripts python scripts/gen_release_evidence_manifest_v1_5.py --check
          PYTHONDONTWRITEBYTECODE=1 python scripts/check_v15_public_readiness_artifacts.py
          python scripts/check_public_claim_freshness.py
          python scripts/gen_current_verified_claims.py --check

      - name: Restore historical M2/M3 closure evidence
        run: |
          set -Eeuo pipefail
          bash scripts/restore_m2_m3_evidence_from_git.sh --destination "${GITHUB_WORKSPACE}"

      - name: Full pytest
        working-directory: Weall-Protocol
        run: pytest -q

      - name: Reviewer readiness gate
        env:
          WEALL_RELEASE_TREE_ALREADY_VERIFIED: "1"
        run: |
          set -Eeuo pipefail
          cd Weall-Protocol
          bash scripts/reviewer_production_readiness_gate.sh

      - name: Push validated evidence branch
        run: |
          set -Eeuo pipefail
          git push origin HEAD:p0-evidence-closure-a10-a12-vectors-20261001

# Branch-only helper; never merge this workflow into a product branch.
# Refreshes truthful NO-GO evidence dependencies to a deterministic fixed point.
