name: P0 helper stage exact V2 after ledger refresh

on:
  push:
    branches:
      - p0-tooling-exact-v2-refresh-20261001
    paths:
      - .github/workflows/p0-helper-stage-exact-v2-after-ledger.yml

permissions:
  contents: write

jobs:
  validate-closure-evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p0-evidence-closure-a02-a06-a12-20261001
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          check-latest: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked backend and frontend dependencies
        run: |
          set -Eeuo pipefail
          cd Weall-Protocol
          python -m pip install --upgrade 'pip==26.2.1'
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps
          cd ../web
          npm ci

      - name: Ruff closure evidence
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          ruff format --check tests/test_p0_restart_and_poh_privacy_closure.py
          ruff check tests/test_p0_restart_and_poh_privacy_closure.py

      - name: Regenerate exact evidence-head V2 derivatives
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          PYTHONPATH=src python scripts/compile_v2_spec.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          python scripts/check_generated.py

      - name: Commit derivative-only refresh
        run: |
          set -Eeuo pipefail
          BAD="$(git status --short --untracked-files=all | awk '{p=$2; if (p != "web/src/generated/protocolStatus.ts" && p !~ /^Weall-Protocol\/generated\/v2\//) print}')"
          if [[ -n "$BAD" ]]; then
            echo 'Unexpected non-derivative changes:' >&2
            printf '%s\n' "$BAD" >&2
            exit 1
          fi
          git add Weall-Protocol/generated/v2 web/src/generated/protocolStatus.ts
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore(p0): refresh A02 A06 A12 closure derivatives'
          fi
          test -z "$(git status --short --untracked-files=all)"

      - name: Prove A02 A06 A12 closure paths
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          pytest -q \
            tests/test_nonce_failure_block_progression.py \
            tests/test_p0_restart_and_poh_privacy_closure.py \
            tests/test_p0_a01_a20_closure_regressions.py \
            tests/test_pb001bo_canonical_block_hash_persistence.py \
            tests/test_restricted_poh_session_and_webrtc_transport.py

      - name: Verify exact committed generated state
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python scripts/check_generated.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          python scripts/check_v2_spec_clean_checkout.py
          PYTHONDONTWRITEBYTECODE=1 python scripts/check_v15_public_readiness_artifacts.py
          python scripts/check_public_claim_freshness.py
          python scripts/gen_current_verified_claims.py --check

      - name: Restore historical M2/M3 closure evidence
        run: |
          set -Eeuo pipefail
          bash scripts/restore_m2_m3_evidence_from_git.sh --destination "${GITHUB_WORKSPACE}"

      - name: Full pytest
        working-directory: Weall-Protocol
        run: pytest -q

      - name: Reviewer readiness gate
        env:
          WEALL_RELEASE_TREE_ALREADY_VERIFIED: "1"
        run: |
          set -Eeuo pipefail
          cd Weall-Protocol
          bash scripts/reviewer_production_readiness_gate.sh

      - name: Push validated evidence branch
        run: |
          set -Eeuo pipefail
          git push origin HEAD:p0-evidence-closure-a02-a06-a12-20261001

# Branch-only helper; never merge this workflow into a product branch.
