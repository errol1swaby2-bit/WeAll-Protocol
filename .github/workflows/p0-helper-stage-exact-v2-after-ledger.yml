name: P0 helper stage exact V2 after ledger refresh

on:
  push:
    branches:
      - p0-tooling-exact-v2-refresh-20261001
    paths:
      - .github/workflows/p0-helper-stage-exact-v2-after-ledger.yml

permissions:
  contents: read

jobs:
  refresh-staging:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p0-a10-positive-proof-staging-20261001
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          check-latest: false

      - name: Install locked backend dependencies
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade 'pip==26.2.1'
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Prove positive A10 governance-to-value-transfer path
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          ruff format --check tests/test_p0_group_treasury_governance_binding.py
          ruff check tests/test_p0_group_treasury_governance_binding.py
          pytest -q \
            tests/test_p0_group_treasury_governance_binding.py \
            tests/test_p0_governance_economics_closure.py \
            tests/test_fail_closed_group_treasury.py \
            tests/test_system_queue_lifecycle_integrity.py \
            tests/test_four_gate_safety.py
