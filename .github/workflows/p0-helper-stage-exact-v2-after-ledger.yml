name: P0 helper stage exact V2 after ledger refresh

on:
  push:
    branches:
      - p0-tooling-exact-v2-refresh-20261001
    paths:
      - .github/workflows/p0-helper-stage-exact-v2-after-ledger.yml

permissions:
  contents: write

jobs:
  refresh-staging:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p0-full-suite-repair-staging-20261001
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          check-latest: false

      - name: Install locked backend dependencies
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade 'pip==26.2.1'
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Patch hardened lifecycle fixtures
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path

          root = Path("Weall-Protocol")

          def insert_profile(path: Path, profile_id: str, hash_char: str, start_token: str) -> None:
              text = path.read_text(encoding="utf-8")
              if f'"profile_id": "{profile_id}"' in text:
                  return
              start = text.index(start_token)
              marker = '        "accounts": {\n'
              pos = text.index(marker, start)
              block = (
                  '        "ballot_profile": {\n'
                  f'            "profile_id": "{profile_id}",\n'
                  '            "active": True,\n'
                  '        },\n'
                  '        "ballot_profile_activation_receipts": [\n'
                  '            {\n'
                  f'                "profile_id": "{profile_id}",\n'
                  '                "status": "active",\n'
                  f'                "profile_hash": "{hash_char}" * 64,\n'
                  '                "allowed_modes": ["prod", "production"],\n'
                  '                "independent_review_complete": True,\n'
                  '            }\n'
                  '        ],\n'
              )
              path.write_text(text[:pos] + block + text[pos:], encoding="utf-8")

          insert_profile(
              root / "scripts/rehearse_v15_full_lifecycle.py",
              "production-reviewed-v15-lifecycle-v1",
              "a",
              "def _base_state()",
          )
          insert_profile(
              root / "scripts/rehearse_api_driven_full_lifecycle_v1_5.py",
              "production-reviewed-v15-api-lifecycle-v1",
              "b",
              "def _base_state()",
          )
          fully = root / "scripts/rehearse_fully_api_driven_v15_lifecycle.py"
          insert_profile(
              fully,
              "production-reviewed-v15-fully-api-lifecycle-v1",
              "c",
              "def run_harness()",
          )

          text = fully.read_text(encoding="utf-8")
          if "@appeal-1" not in text:
              appeal_token = '"DISPUTE_APPEAL"'
              appeal_pos = text.index(appeal_token, text.index("def run_harness()"))
              insert_pos = text.rfind("    apply_dispute(", 0, appeal_pos)
              if insert_pos < 0:
                  raise SystemExit("appeal apply_dispute insertion point not found")
              pool = "".join(
                  [
                      "    # Strict production appeals require a completely fresh constitutional panel.\n",
                      "    # Add nine Tier-2 dispute-review volunteers after the original decision so\n",
                      "    # they cannot alter the first-round panel, but can satisfy 7 jurors + 2 substitutes.\n",
                      "    for idx in range(1, 10):\n",
                      '        account_id = f"@appeal-{idx}"\n',
                      '        state["accounts"][account_id] = {\n',
                      '            "nonce": 0,\n',
                      '            "poh_tier": 2,\n',
                      '            "reputation": 5,\n',
                      '        }\n',
                      '        state["roles"]["jurors"]["active_set"].append(account_id)\n',
                      '        state["roles"]["jurors"]["by_id"][account_id] = {\n',
                      '            "account_id": account_id,\n',
                      '            "active": True,\n',
                      '            "status": "active",\n',
                      '            "enrolled": True,\n',
                      '            "responsibilities": {\n',
                      '                "reviewer": {\n',
                      '                    "dispute_review": {"opted_in": True, "active": True}\n',
                      '                }\n',
                      '            },\n',
                      '        }\n',
                      "\n",
                  ]
              )
              text = text[:insert_pos] + pool + text[insert_pos:]
              fully.write_text(text, encoding="utf-8")
          PY

          cd Weall-Protocol
          ruff format \
            scripts/rehearse_v15_full_lifecycle.py \
            scripts/rehearse_api_driven_full_lifecycle_v1_5.py \
            scripts/rehearse_fully_api_driven_v15_lifecycle.py
          ruff check \
            scripts/rehearse_v15_full_lifecycle.py \
            scripts/rehearse_api_driven_full_lifecycle_v1_5.py \
            scripts/rehearse_fully_api_driven_v15_lifecycle.py

      - name: Prove repaired lifecycle rehearsals
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python scripts/rehearse_v15_full_lifecycle.py --json
          python scripts/rehearse_api_driven_full_lifecycle_v1_5.py --json
          python scripts/rehearse_fully_api_driven_v15_lifecycle.py --json

      - name: Regenerate deterministic lifecycle proof artifacts
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          generators=(
            scripts/gen_b517_b521_completion_proof_v1_5.py
            scripts/gen_b523_b527_completion_proof_v1_5.py
            scripts/gen_b528_b532_completion_proof_v1_5.py
            scripts/gen_b534_b538_completion_proof_v1_5.py
            scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py
          )
          for gen in "${generators[@]}"; do
            python "$gen"
            python "$gen" --check
          done

      - name: Commit proof refresh
        run: |
          set -Eeuo pipefail
          git add \
            Weall-Protocol/scripts/rehearse_v15_full_lifecycle.py \
            Weall-Protocol/scripts/rehearse_api_driven_full_lifecycle_v1_5.py \
            Weall-Protocol/scripts/rehearse_fully_api_driven_v15_lifecycle.py \
            Weall-Protocol/generated/b517_b521_completion_proof_v1_5.json \
            Weall-Protocol/generated/b523_b527_completion_proof_v1_5.json \
            Weall-Protocol/generated/b528_b532_completion_proof_v1_5.json \
            Weall-Protocol/generated/b534_b538_completion_proof_v1_5.json \
            Weall-Protocol/generated/b567_b571_autonomous_mechanics_proof_v1_5.json
          if ! git diff --cached --quiet; then
            git commit -m 'test(p0): refresh production lifecycle proof fixtures'
          fi
          test -z "$(git status --short --untracked-files=all)"

      - name: Validate proof consumers
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          pytest -q \
            tests/test_generated_checker_read_only.py \
            tests/test_validator_replay_poh_dispute_economics_feed_storage_coverage.py \
            tests/test_validator_replay_lifecycle_feed_public_surface_coverage.py \
            tests/test_validator_db_lifecycle_reviewer_accountability_storage_coverage.py \
            tests/test_full_node_db_api_dispute_storage_coverage.py \
            tests/test_autonomous_validator_ipfs_anti_sybil_economics_read_models.py

      - name: Push validated staging branch
        run: |
          set -Eeuo pipefail
          git push origin HEAD:p0-full-suite-repair-staging-20261001
