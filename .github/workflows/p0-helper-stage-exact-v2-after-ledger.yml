name: P0 helper stage exact V2 after ledger refresh

on:
  push:
    branches:
      - p0-tooling-exact-v2-refresh-20261001
    paths:
      - .github/workflows/p0-helper-stage-exact-v2-after-ledger.yml

permissions:
  contents: write

jobs:
  refresh-staging:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p0-full-suite-repair-staging-20261001
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          check-latest: false

      - name: Install locked backend dependencies
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade 'pip==26.2.1'
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Activate reviewed ballot profile in production lifecycle rehearsals
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path

          root = Path("Weall-Protocol")

          path = root / "scripts/rehearse_v15_full_lifecycle.py"
          text = path.read_text(encoding="utf-8")
          if '"profile_id": "production-reviewed-v15-lifecycle-v1"' not in text:
              needle = '''        "params": {
              "economic_unlock_time": 1,
              "economics_enabled": False,
              "ipfs_replication_factor": 1,
          },
          "accounts": {
          '''
              replacement = '''        "params": {
              "economic_unlock_time": 1,
              "economics_enabled": False,
              "ipfs_replication_factor": 1,
          },
          "ballot_profile": {
              "profile_id": "production-reviewed-v15-lifecycle-v1",
              "active": True,
          },
          "ballot_profile_activation_receipts": [
              {
                  "profile_id": "production-reviewed-v15-lifecycle-v1",
                  "status": "active",
                  "profile_hash": "a" * 64,
                  "allowed_modes": ["prod", "production"],
                  "independent_review_complete": True,
              }
          ],
          "accounts": {
          '''
              if needle not in text:
                  raise SystemExit("v15 lifecycle params anchor not found")
              text = text.replace(needle, replacement, 1)
              path.write_text(text, encoding="utf-8")

          path = root / "scripts/rehearse_api_driven_full_lifecycle_v1_5.py"
          text = path.read_text(encoding="utf-8")
          if '"profile_id": "production-reviewed-v15-api-lifecycle-v1"' not in text:
              needle = '''        "params": {
              "economic_unlock_time": 1,
              "economics_enabled": False,
              "ipfs_replication_factor": 2,
          },
          "accounts": {
          '''
              replacement = '''        "params": {
              "economic_unlock_time": 1,
              "economics_enabled": False,
              "ipfs_replication_factor": 2,
          },
          "ballot_profile": {
              "profile_id": "production-reviewed-v15-api-lifecycle-v1",
              "active": True,
          },
          "ballot_profile_activation_receipts": [
              {
                  "profile_id": "production-reviewed-v15-api-lifecycle-v1",
                  "status": "active",
                  "profile_hash": "b" * 64,
                  "allowed_modes": ["prod", "production"],
                  "independent_review_complete": True,
              }
          ],
          "accounts": {
          '''
              if needle not in text:
                  raise SystemExit("api lifecycle params anchor not found")
              text = text.replace(needle, replacement, 1)
              path.write_text(text, encoding="utf-8")
          PY

          cd Weall-Protocol
          ruff format \
            scripts/rehearse_v15_full_lifecycle.py \
            scripts/rehearse_api_driven_full_lifecycle_v1_5.py
          ruff check \
            scripts/rehearse_v15_full_lifecycle.py \
            scripts/rehearse_api_driven_full_lifecycle_v1_5.py

      - name: Prove repaired lifecycle rehearsals
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          python scripts/rehearse_v15_full_lifecycle.py --json
          python scripts/rehearse_api_driven_full_lifecycle_v1_5.py --json

      - name: Regenerate deterministic lifecycle proof artifacts
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          generators=(
            scripts/gen_b517_b521_completion_proof_v1_5.py
            scripts/gen_b523_b527_completion_proof_v1_5.py
            scripts/gen_b528_b532_completion_proof_v1_5.py
            scripts/gen_b534_b538_completion_proof_v1_5.py
            scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py
          )
          for gen in "${generators[@]}"; do
            python "$gen"
            python "$gen" --check
          done

      - name: Commit only rehearsals and deterministic proof artifacts
        run: |
          set -Eeuo pipefail
          allowed='^( M|M |A |\?\?) (Weall-Protocol/scripts/rehearse_v15_full_lifecycle.py|Weall-Protocol/scripts/rehearse_api_driven_full_lifecycle_v1_5.py|Weall-Protocol/generated/b517_b521_completion_proof_v1_5.json|Weall-Protocol/generated/b523_b527_completion_proof_v1_5.json|Weall-Protocol/generated/b528_b532_completion_proof_v1_5.json|Weall-Protocol/generated/b534_b538_completion_proof_v1_5.json|Weall-Protocol/generated/b567_b571_autonomous_mechanics_proof_v1_5.json)$'
          unexpected="$(git status --short --untracked-files=all | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            echo 'Unexpected generated changes:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          git add \
            Weall-Protocol/scripts/rehearse_v15_full_lifecycle.py \
            Weall-Protocol/scripts/rehearse_api_driven_full_lifecycle_v1_5.py \
            Weall-Protocol/generated/b517_b521_completion_proof_v1_5.json \
            Weall-Protocol/generated/b523_b527_completion_proof_v1_5.json \
            Weall-Protocol/generated/b528_b532_completion_proof_v1_5.json \
            Weall-Protocol/generated/b534_b538_completion_proof_v1_5.json \
            Weall-Protocol/generated/b567_b571_autonomous_mechanics_proof_v1_5.json
          if ! git diff --cached --quiet; then
            git commit -m 'test(p0): refresh production lifecycle proof fixtures'
          fi

      - name: Validate proof consumers
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          pytest -q \
            tests/test_generated_checker_read_only.py \
            tests/test_validator_replay_poh_dispute_economics_feed_storage_coverage.py \
            tests/test_validator_replay_lifecycle_feed_public_surface_coverage.py \
            tests/test_validator_db_lifecycle_reviewer_accountability_storage_coverage.py \
            tests/test_full_node_db_api_dispute_storage_coverage.py \
            tests/test_autonomous_validator_ipfs_anti_sybil_economics_read_models.py

      - name: Push validated staging branch
        run: |
          set -Eeuo pipefail
          test -z "$(git status --short --untracked-files=all)"
          git push origin HEAD:p0-full-suite-repair-staging-20261001
