name: P1 Format A03 Persistence Tests

on:
  push:
    branches:
      - p1-revalidation-after-p0-20261005
    paths:
      - .github/workflows/p1-format-a03.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p1-revalidation-after-p0-20261005
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dev environment
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps
      - name: Format and prove A03 tests
        working-directory: Weall-Protocol
        run: |
          ruff check --fix tests/test_p1_a03_startup_durable_authority.py tests/test_p1_a03_observer_queue_durability.py
          ruff format tests/test_p1_a03_startup_durable_authority.py tests/test_p1_a03_observer_queue_durability.py
          ruff check tests/test_p1_a03_startup_durable_authority.py tests/test_p1_a03_observer_queue_durability.py
          pytest -q tests/test_p1_a03_startup_durable_authority.py tests/test_p1_a03_observer_queue_durability.py
      - name: Commit formatted tests and remove formatter
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/p1-format-a03.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No A03 format diff produced'; exit 1; }
          git diff --check --cached
          git commit -m 'style: format A03 persistence regressions'
          git push origin HEAD:p1-revalidation-after-p0-20261005
