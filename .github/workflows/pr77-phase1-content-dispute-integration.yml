name: PR77 phase1 content-to-dispute executor integration (synthetic only)

on:
  push:
    branches:
      - review/pr70-pr75-pr76-consolidation-stage23-20261031
    paths:
      - Weall-Protocol/tests/test_phase1_content_flag_dispute_executor_integration.py
      - Weall-Protocol/tests/test_reviewer_opt_in_reassigns_unassigned_content_reviews.py
      - Weall-Protocol/tests/test_trusted_responsibility_opt_in.py
      - Weall-Protocol/tests/test_content_reviewer_selection_and_surface.py
      - Weall-Protocol/src/weall/runtime/apply/dispute.py
      - Weall-Protocol/src/weall/runtime/apply/content.py
      - Weall-Protocol/src/weall/runtime/apply/roles.py
      - Weall-Protocol/docs/audits/pr77_phase1_content_dispute_integration_20261102.md
      - .github/workflows/pr77-phase1-content-dispute-integration.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-content-dispute:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked backend dependencies
        working-directory: Weall-Protocol
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install -e . --no-deps
      - name: Actual signed executor, system queue, and replay test
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          ruff check tests/test_phase1_content_flag_dispute_executor_integration.py tests/test_reviewer_opt_in_reassigns_unassigned_content_reviews.py tests/test_trusted_responsibility_opt_in.py src/weall/runtime/apply/roles.py src/weall/runtime/apply/dispute.py src/weall/runtime/apply/content.py
          ruff format --check tests/test_phase1_content_flag_dispute_executor_integration.py tests/test_reviewer_opt_in_reassigns_unassigned_content_reviews.py tests/test_trusted_responsibility_opt_in.py src/weall/runtime/apply/roles.py src/weall/runtime/apply/dispute.py src/weall/runtime/apply/content.py
          python -m pytest -q tests/test_phase1_content_flag_dispute_executor_integration.py tests/test_reviewer_opt_in_reassigns_unassigned_content_reviews.py tests/test_trusted_responsibility_opt_in.py tests/test_content_reviewer_selection_and_surface.py tests/test_dispute_auto_juror_assignment.py tests/test_dispute_requires_explicit_juror_strict.py tests/test_dispute_juror_vote_acceptance_gate.py tests/test_dispute_review_outcome_semantics.py
          echo 'Synthetic local genesis, not independently final BFT or verified global humanity.'
