name: Complete P1 Remediation Driver v2

on:
  push:
    branches: [p1-complete-remediation-20260926]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p1-complete-remediation-20260926
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute corrected source patch and regression authoring from pinned harness
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          harness = Path('.github/workflows/p1-complete-remediation-20260926.yml').read_text()

          def step_script(name: str) -> str:
              lines = harness.splitlines()
              marker = f'- name: {name}'
              start = next((i for i, line in enumerate(lines) if line.strip() == marker), None)
              if start is None:
                  raise SystemExit(f'missing harness step: {name}')
              run_i = next((i for i in range(start + 1, len(lines)) if lines[i].strip() == 'run: |'), None)
              if run_i is None:
                  raise SystemExit(f'missing run block: {name}')
              body = []
              for line in lines[run_i + 1:]:
                  if line.startswith('      - name: ') or line.startswith('      - uses: '):
                      break
                  if line.startswith('          '):
                      body.append(line[10:])
                  elif not line.strip():
                      body.append('')
                  else:
                      break
              return '\n'.join(body) + '\n'

          patch = step_script('Apply all remaining P1 repairs')
          old = '''    count = text.count(old)\n    if count != 1:\n        raise SystemExit(f"expected one match in {path}, found {count}: {old[:120]!r}")\n    p.write_text(text.replace(old, new, 1))\n'''
          new = '''    count = text.count(old)\n    if count != 1:\n        if (\n            path == "src/weall/runtime/apply/roles.py"\n            and count == 2\n            and 'rec["active"] = True' in old\n        ):\n            start = text.find("def _apply_role_node_operator_activate(")\n            end = text.find("def _apply_role_node_operator_suspend(", start)\n            if start < 0 or end < 0:\n                raise SystemExit("NodeOperator activation function boundaries not found")\n            segment = text[start:end]\n            if segment.count(old) != 1:\n                raise SystemExit("NodeOperator activation target is not unique within function")\n            p.write_text(text[:start] + segment.replace(old, new, 1) + text[end:])\n            return\n        raise SystemExit(f"expected one match in {path}, found {count}: {old[:120]!r}")\n    p.write_text(text.replace(old, new, 1))\n'''
          if patch.count(old) != 1:
              raise SystemExit(f'patch helper body match count={patch.count(old)}')
          patch = patch.replace(old, new, 1)
          subprocess.run(['bash', '-Eeuo', 'pipefail', '-c', patch], cwd='Weall-Protocol', check=True)

          tests = step_script('Add adversarial P1 regression suite')
          subprocess.run(['bash', '-Eeuo', 'pipefail', '-c', tests], cwd='Weall-Protocol', check=True)
          PY

      - name: Install locked dependencies
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Run corrected harness validation and derivative preparation
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          harness = Path('.github/workflows/p1-complete-remediation-20260926.yml').read_text()
          names = [
              'Format, lint, and run focused P1 regressions',
              'Register new stable failure contracts',
              'Refresh semantic contracts for every touched applier and V2 derivatives',
          ]

          def step_script(name: str) -> str:
              lines = harness.splitlines()
              marker = f'- name: {name}'
              start = next((i for i, line in enumerate(lines) if line.strip() == marker), None)
              if start is None:
                  raise SystemExit(f'missing harness step: {name}')
              run_i = next((i for i in range(start + 1, len(lines)) if lines[i].strip() == 'run: |'), None)
              if run_i is None:
                  raise SystemExit(f'missing run block: {name}')
              body = []
              for line in lines[run_i + 1:]:
                  if line.startswith('      - name: ') or line.startswith('      - uses: '):
                      break
                  if line.startswith('          '):
                      body.append(line[10:])
                  elif not line.strip():
                      body.append('')
                  else:
                      break
              return '\n'.join(body) + '\n'

          for name in names:
              print(f'=== {name} ===', flush=True)
              subprocess.run(['bash', '-Eeuo', 'pipefail', '-c', step_script(name)], cwd='Weall-Protocol', check=True)
          PY

      - name: Remove temporary workflows and commit exact candidate
        run: |
          git rm -f .github/workflows/p1-complete-remediation-20260926.yml
          git rm -f .github/workflows/p1-complete-remediation-driver-v2.yml
          git rm -f .github/workflows/fix-p1-remediation-harness-20260926.yml || true
          git rm -f .github/workflows/refresh-v2-derivatives-20260926.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Close all remaining confirmed P1 audit findings'

      - name: Exact-commit generated and readiness validation
        working-directory: Weall-Protocol
        run: |
          python scripts/check_generated.py
          python scripts/check_v2_spec_clean_checkout.py
          PYTHONDONTWRITEBYTECODE=1 python scripts/check_v15_public_readiness_artifacts.py
          python scripts/check_public_claim_freshness.py
          python scripts/gen_current_verified_claims.py --check

      - name: Full backend regression suite
        working-directory: Weall-Protocol
        run: pytest -q

      - name: Verify validation left tracked state clean
        run: |
          git diff --exit-code
          git diff --cached --exit-code

      - name: Push validated P1 closure
        run: git push origin HEAD:p1-complete-remediation-20260926
