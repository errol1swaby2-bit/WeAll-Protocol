name: V15 Failure Registry Refresh

on:
  push:
    branches:
      - p2-complete-remediation-20260927
    paths:
      - .github/workflows/v15-failure-registry-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: p2-complete-remediation-20260927
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked backend dependencies
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Remove refresh workflow from source tree
        run: git rm .github/workflows/v15-failure-registry-refresh.yml

      - name: Refresh coupled readiness artifacts from final source state
        working-directory: Weall-Protocol
        run: |
          python scripts/gen_failure_code_registry_v1_5.py
          PYTHONPATH=src python scripts/gen_release_evidence_manifest_v1_5.py
          PYTHONPATH=src:scripts python scripts/gen_public_beta_blocker_report_v1_5.py
          python scripts/gen_current_verified_claims.py

          python scripts/gen_failure_code_registry_v1_5.py --check
          PYTHONPATH=src python scripts/gen_release_evidence_manifest_v1_5.py --check
          PYTHONPATH=src:scripts python scripts/gen_public_beta_blocker_report_v1_5.py --check
          python scripts/gen_current_verified_claims.py --check

          PYTHONPATH=src python scripts/compile_v2_spec.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          PYTHONDONTWRITEBYTECODE=1 python scripts/check_v15_public_readiness_artifacts.py
          python scripts/check_public_claim_freshness.py
          python scripts/gen_current_verified_claims.py --check
          git diff --check

      - name: Commit coupled artifact refresh and self-delete
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Refresh coupled readiness artifacts after P2 closures'
          git push origin HEAD:p2-complete-remediation-20260927
