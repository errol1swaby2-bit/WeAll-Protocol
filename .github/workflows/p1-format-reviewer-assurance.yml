name: P1 Format Reviewer Assurance Imports

on:
  push:
    branches:
      - p1-revalidation-after-p0-20261005
    paths:
      - .github/workflows/p1-format-reviewer-assurance.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p1-revalidation-after-p0-20261005
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Ruff
        run: |
          python -m pip install ruff==0.15.22

      - name: Apply exact Ruff fixes
        working-directory: Weall-Protocol
        run: |
          ruff check --fix \
            tests/test_p1_a19_reviewer_bootstrap.py \
            tests/test_p1_a19_reviewer_front_door.py
          ruff format \
            tests/test_p1_a19_reviewer_bootstrap.py \
            tests/test_p1_a19_reviewer_front_door.py
          ruff check \
            tests/test_p1_a19_reviewer_bootstrap.py \
            tests/test_p1_a19_reviewer_front_door.py
          ruff format --check \
            tests/test_p1_a19_reviewer_bootstrap.py \
            tests/test_p1_a19_reviewer_front_door.py

      - name: Commit workflow-free normalized tree
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/p1-format-reviewer-assurance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No Ruff normalization diff produced'; exit 1; }
          git diff --check --cached
          git commit -m 'style: normalize reviewer assurance imports'
          git push origin HEAD:p1-revalidation-after-p0-20261005
