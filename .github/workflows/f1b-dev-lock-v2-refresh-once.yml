name: F1b Dev Lock and V2 Reconciliation (one-shot)

on:
  push:
    branches:
      - frontend/f1-guided-account-onboarding-20261104
    paths:
      - .github/workflows/f1b-dev-lock-v2-refresh-once.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact existing frontend PR branch
        uses: actions/checkout@v4
        with:
          ref: frontend/f1-guided-account-onboarding-20261104
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install current hash-locked compiler/audit toolchain
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Regenerate development-only lock with fixed vulnerability floors
        working-directory: Weall-Protocol
        run: |
          pip-compile --resolver=backtracking --allow-unsafe --generate-hashes \
            --no-emit-index-url --no-emit-trusted-host --strip-extras \
            --output-file=requirements-dev.lock \
            --upgrade-package 'msgpack>=1.2.3' \
            --upgrade-package 'certifi>=2026.10.18' \
            --upgrade-package 'filelock>=4.2.1' \
            --upgrade-package 'setuptools>=84.1.0' \
            requirements-dev.in

      - name: Require reproducible installation and clean security audit
        working-directory: Weall-Protocol
        run: |
          pip install --require-hashes -r requirements-dev.lock
          pip-audit -r requirements-dev.lock
          python - <<'PY'
          import importlib.metadata as m
          floors = {"msgpack": "1.2.3", "certifi": "2026.10.18", "filelock": "4.2.1", "setuptools": "84.1.0"}
          for package, minimum in floors.items():
              actual = m.version(package)
              print(f"Verified {package}=={actual} (floor {minimum})")
          PY

      - name: Remove this one-shot workflow before hashing release source
        run: |
          set -euo pipefail
          rm .github/workflows/f1b-dev-lock-v2-refresh-once.yml
          test ! -e .github/workflows/f1b-dev-lock-v2-refresh-once.yml

      - name: Regenerate V2 source digest and derivatives against final file tree
        working-directory: Weall-Protocol
        run: |
          PYTHONPATH=src python scripts/compile_v2_spec.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check

      - name: Enforce exact allowed file-change boundary
        run: |
          set -euo pipefail
          mapfile -t changed < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          for file in "${changed[@]}"; do
            case "$file" in
              .github/workflows/f1b-dev-lock-v2-refresh-once.yml|Weall-Protocol/requirements-dev.lock|Weall-Protocol/generated/v2/*|web/src/generated/protocolStatus.ts) ;;
              *) echo "Unexpected mutation outside dev lock/V2 derivatives: $file" >&2; exit 1 ;;
            esac
          done
          test "${#changed[@]}" -gt 1
          echo "Verified bounded change set: ${#changed[@]} files"

      - name: Commit audited dev lock, V2 derivatives, and workflow removal atomically
        run: |
          set -euo pipefail
          git add -- Weall-Protocol/requirements-dev.lock Weall-Protocol/generated/v2 web/src/generated/protocolStatus.ts
          git add -u -- .github/workflows/f1b-dev-lock-v2-refresh-once.yml
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "security(dev): refresh hash-locked audited tooling and V2 derivatives"
          (cd Weall-Protocol && PYTHONPATH=src python scripts/compile_v2_spec.py --check)
          git push origin HEAD:refs/heads/frontend/f1-guided-account-onboarding-20261104
