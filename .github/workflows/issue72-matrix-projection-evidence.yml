name: Issue72 Reputation Matrix focused projection

on:
  pull_request:
    paths:
      - .github/workflows/issue72-matrix-projection-evidence.yml
      - Weall-Protocol/src/weall/runtime/reputation_matrix.py
      - Weall-Protocol/tests/test_issue72_matrix_authoritative_projection.py
      - web/src/pages/Account.tsx
      - web/scripts/test_issue72_reputation_authority_source.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-matrix:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Weall-Protocol
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps
      - name: Verify canonical matrix source projection
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/issue72-matrix"
          mkdir -p "$OUT"
          {
            echo "scope=READ_ONLY_CANONICAL_MATRIX_NO_CONSENSUS_ACTIVATION"
            echo "checkout_commit=$(git rev-parse HEAD)"
            echo "role_gate_parity=NOT_CLOSED"
            sha256sum src/weall/runtime/reputation_matrix.py
            sha256sum tests/test_issue72_matrix_authoritative_projection.py
          } > "$OUT/source_and_scope.txt"
          set +e
          {
            ruff format --check src/weall/runtime/reputation_matrix.py tests/test_issue72_matrix_authoritative_projection.py &&
            ruff check src/weall/runtime/reputation_matrix.py tests/test_issue72_matrix_authoritative_projection.py &&
            pytest -vv -rx tests/test_issue72_matrix_authoritative_projection.py tests/test_reputation_matrix_read_model.py tests/test_reputation_matrix_completion_v1_5.py
          } 2>&1 | tee "$OUT/targeted_pytest.log"
          RC="${PIPESTATUS[0]}"
          set -e
          echo "exit_code=$RC" >> "$OUT/source_and_scope.txt"
          sha256sum "$OUT/targeted_pytest.log" >> "$OUT/source_and_scope.txt"
          exit "$RC"
      - name: Verify frontend Matrix truth without browser
        working-directory: web
        run: node scripts/test_issue72_reputation_authority_source.mjs
      - name: Publish bounded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue72-matrix-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/issue72-matrix/source_and_scope.txt
            ${{ runner.temp }}/issue72-matrix/targeted_pytest.log
