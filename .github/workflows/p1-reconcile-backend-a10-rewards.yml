name: P1 Reconcile Backend A10 Reward Scope

on:
  push:
    branches:
      - p1-revalidation-after-p0-20261005
    paths:
      - .github/workflows/p1-reconcile-backend-a10-rewards.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p1-revalidation-after-p0-20261005
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked backend environment
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Format and prove changed surfaces
        working-directory: Weall-Protocol
        run: |
          ruff check --fix \
            src/weall/runtime/system_tx_engine.py \
            tests/test_p1_a10_reward_scheduler_scope.py \
            tests/bench_a15_f003_registration_attack.py
          ruff format \
            src/weall/runtime/system_tx_engine.py \
            tests/test_p1_a10_reward_scheduler_scope.py \
            tests/bench_a15_f003_registration_attack.py
          ruff check \
            src/weall/runtime/system_tx_engine.py \
            tests/test_p1_a10_reward_scheduler_scope.py \
            tests/bench_a15_f003_registration_attack.py
          pytest -q \
            tests/test_p1_a10_reward_scheduler_scope.py \
            tests/test_v15_epoch_issuance_scheduler.py
          python tests/bench_a15_f003_registration_attack.py --accounts 4 \
            > /tmp/a15-registration-proof.json
          cat /tmp/a15-registration-proof.json
          python - <<'PY'
          import json
          p=json.load(open("/tmp/a15-registration-proof.json", encoding="utf-8"))
          assert p["accounts"] == 4
          assert p["all_solved_work_passed_canonical_block_admission"] is True
          assert p["all_admissions_verified_valid_mldsa_signatures"] is True
          assert p["signature_runtime_mode"] == "public-testnet"
          assert p["production_mainnet_mldsa_admission_claimed"] is False
          assert p["production_registration_work_parameters_used"] is True
          PY

      - name: Remove temporary workflow from candidate tree
        run: |
          rm -f .github/workflows/p1-reconcile-backend-a10-rewards.yml

      - name: Refresh reward transaction semantic bindings
        working-directory: Weall-Protocol
        run: |
          python scripts/refresh_v2_semantic_reviews.py \
            --tx-type BLOCK_REWARD_MINT \
            --tx-type BLOCK_REWARD_DISTRIBUTE \
            --reviewer "Errol Jacob Jones Swaby (maintainer-assisted P1 audit)"

      - name: Regenerate dependent evidence twice
        working-directory: Weall-Protocol
        run: |
          for round in 1 2; do
            echo "regeneration round $round"
            python scripts/gen_failure_code_registry_v1_5.py
            if [[ -f scripts/gen_api_response_vectors_v1_5.py ]]; then
              python scripts/gen_api_response_vectors_v1_5.py
            fi
            PYTHONPATH=src python scripts/compile_v2_spec.py
            python scripts/gen_b528_b532_completion_proof_v1_5.py
            python scripts/gen_b534_b538_completion_proof_v1_5.py
            python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py
            python scripts/gen_public_beta_blocker_report_v1_5.py
            python scripts/gen_release_evidence_manifest_v1_5.py
            python scripts/gen_current_verified_claims.py
          done

      - name: Commit workflow-free candidate locally
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No reconciliation diff produced'; exit 1; }
          git diff --check --cached
          git commit -m 'audit: reconcile reward scope and scarcity evidence'
          echo "candidate_sha=$(git rev-parse HEAD)"
          echo "candidate_tree=$(git rev-parse HEAD^{tree})"
          test -z "$(git status --porcelain)"

      - name: Verify committed candidate
        working-directory: Weall-Protocol
        run: |
          python scripts/check_generated.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          python scripts/check_v2_spec_clean_checkout.py
          python scripts/gen_b528_b532_completion_proof_v1_5.py --check
          python scripts/gen_b534_b538_completion_proof_v1_5.py --check
          python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py --check
          PYTHONDONTWRITEBYTECODE=1 python scripts/check_v15_public_readiness_artifacts.py
          python scripts/check_public_claim_freshness.py
          python scripts/gen_current_verified_claims.py --check
          pytest -q \
            tests/test_p1_a10_reward_scheduler_scope.py \
            tests/test_v15_epoch_issuance_scheduler.py
          python tests/bench_a15_f003_registration_attack.py --accounts 4 \
            > /tmp/a15-registration-proof-verify.json
          test -z "$(git status --porcelain)"

      - name: Push verified workflow-free candidate
        run: |
          set -Eeuo pipefail
          test ! -e .github/workflows/p1-reconcile-backend-a10-rewards.yml
          test -z "$(git status --porcelain)"
          git push origin HEAD:p1-revalidation-after-p0-20261005
