name: Repair P2 Multiprocess Storage Fixture

on:
  push:
    branches:
      - p2-complete-remediation-20260927
    paths:
      - .github/workflows/p2-multiprocess-storage-fixture-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: p2-complete-remediation-20260927
      - name: Guard preimage
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object Weall-Protocol/scripts/rehearse_multiprocess_ipfs_operator_durability_v1_5.py)" = "154e8c6369b56b9ef8ea152617bf580b5c886ca1"
      - name: Patch multiprocess storage fixture
        shell: bash
        env:
          PATCH_B64: ""
        run: |
          set -Eeuo pipefail
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/patch_multiprocess.py
          python /tmp/patch_multiprocess.py
          python -m py_compile Weall-Protocol/scripts/rehearse_multiprocess_ipfs_operator_durability_v1_5.py
          git diff --check -- Weall-Protocol/scripts/rehearse_multiprocess_ipfs_operator_durability_v1_5.py
      - name: Commit and push
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Weall-Protocol/scripts/rehearse_multiprocess_ipfs_operator_durability_v1_5.py
          git diff --cached --check
          git commit -m "Fix multiprocess storage replication rehearsal"
          REMOTE_SHA="$(git ls-remote origin refs/heads/p2-complete-remediation-20260927 | awk '{print $1}')"
          test "$REMOTE_SHA" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/p2-complete-remediation-20260927
