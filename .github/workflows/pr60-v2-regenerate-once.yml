# Temporary, branch-scoped reviewer artifact regeneration.
# This one-shot file is removed after the compiler output has been committed.
name: PR60 V2 Derivative Regeneration

on:
  push:
    paths:
      - ".github/workflows/pr60-v2-regenerate-once.yml"

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ github.repository == 'errol1swaby2-bit/WeAll-Protocol' && github.ref == 'refs/heads/fix/pr59-rehearsal-membership-ballot-20261024' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install reproducible compiler dependencies
        working-directory: Weall-Protocol
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install -e . --no-deps

      - name: Compile and validate V2 derivatives
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          PYTHONPATH=src python scripts/compile_v2_spec.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          git diff --check

      - name: Commit generated derivatives only
        shell: bash
        run: |
          set -Eeuo pipefail
          git add -A -- Weall-Protocol/generated/v2 web/src/generated/protocolStatus.ts
          if git diff --cached --quiet; then
            echo "No V2 derivatives changed"
            exit 0
          fi
          # Do not commit changes outside the compiler's declared outputs.
          if git diff --name-only --cached | grep -Ev '^(Weall-Protocol/generated/v2/|web/src/generated/protocolStatus\\.ts$)'; then
            echo "Unexpected staged path" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(v2): regenerate source-bound derivatives for PR60"
          git push origin HEAD:"${GITHUB_REF_NAME}"
