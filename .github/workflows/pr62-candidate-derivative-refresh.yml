name: PR62 candidate derivative maintenance

on:
  push:
    branches:
      - draft/pr62-constitutional-change-impact-gate-v02-20261028
    paths:
      - .github/workflows/pr62-candidate-derivative-refresh.yml
      - .github/workflows/constitutional-change-gate-candidate.yml
      - 'Weall-Protocol/tooling/constitutional_change_gate/**'
      - Weall-Protocol/specs/v2/source/source_mappings.json
      - Weall-Protocol/tests/test_pr62_account_field_runtime_evidence.py
      - .github/workflows/pr62-account-field-runtime-evidence.yml

permissions:
  contents: write

concurrency:
  group: pr62-candidate-derivative-maintenance
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'errol1swaby2-bit/WeAll-Protocol' && github.ref_name == 'draft/pr62-constitutional-change-impact-gate-v02-20261028'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact triggering branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked backend development tools
        working-directory: Weall-Protocol
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install -e . --no-deps
      - name: Format candidate code and refresh its pinned digests
        working-directory: Weall-Protocol
        run: |
          set -Eeuo pipefail
          ruff format tooling/constitutional_change_gate/operational_impact.py tooling/constitutional_change_gate/semantic_impact_candidates.py tooling/constitutional_change_gate/tests/test_semantic_impact_candidates.py tooling/constitutional_change_gate/repository_coverage.py tooling/constitutional_change_gate/tests/test_repository_coverage.py tests/test_pr62_account_field_runtime_evidence.py tooling/constitutional_change_gate/weall_change_gate.py tooling/constitutional_change_gate/tests/test_change_gate.py tooling/constitutional_change_gate/reconcile_v2.py tooling/constitutional_change_gate/tests/test_v2_reconciliation.py tooling/constitutional_change_gate/field_trace.py tooling/constitutional_change_gate/tests/test_field_trace.py
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path("tooling/constitutional_change_gate")
          manifest = root / "SHA256SUMS.txt"
          update = {
              "operational_impact.py",
              "semantic_impact_candidates.py",
              "tests/test_semantic_impact_candidates.py",
              "repository_coverage.py",
              "tests/test_repository_coverage.py",
              "field_trace.py",
              "tests/test_field_trace.py",
              "weall_change_gate.py",
              "tests/test_change_gate.py",
              "reconcile_v2.py",
              "tests/test_v2_reconciliation.py",
          }
          lines = []
          seen = set()
          for line in manifest.read_text(encoding="utf-8").splitlines():
              digest, path = line.split("  ", 1)
              seen.add(path)
              if path in update:
                  digest = hashlib.sha256((root / path).read_bytes()).hexdigest()
              lines.append(f"{digest}  {path}")
          for path in sorted(update - seen):
              lines.append(f"{hashlib.sha256((root / path).read_bytes()).hexdigest()}  {path}")
          manifest.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          cd tooling/constitutional_change_gate
          sha256sum -c SHA256SUMS.txt
          python -m unittest discover -s tests -q
      - name: Regenerate source-bound v2 derivatives
        working-directory: Weall-Protocol
        run: |
          python scripts/compile_v2_spec.py
          python scripts/compile_v2_spec.py --check
      - name: Verify scoped changes and push reproducible derivative commit
        run: |
          set -Eeuo pipefail
          git diff --check
          git add -u -- Weall-Protocol/tooling/constitutional_change_gate/operational_impact.py Weall-Protocol/tooling/constitutional_change_gate/semantic_impact_candidates.py Weall-Protocol/tooling/constitutional_change_gate/tests/test_semantic_impact_candidates.py Weall-Protocol/tooling/constitutional_change_gate/repository_coverage.py Weall-Protocol/tooling/constitutional_change_gate/tests/test_repository_coverage.py Weall-Protocol/tests/test_pr62_account_field_runtime_evidence.py Weall-Protocol/tooling/constitutional_change_gate/field_trace.py Weall-Protocol/tooling/constitutional_change_gate/tests/test_field_trace.py Weall-Protocol/tooling/constitutional_change_gate/weall_change_gate.py Weall-Protocol/tooling/constitutional_change_gate/tests/test_change_gate.py Weall-Protocol/tooling/constitutional_change_gate/reconcile_v2.py Weall-Protocol/tooling/constitutional_change_gate/tests/test_v2_reconciliation.py Weall-Protocol/tooling/constitutional_change_gate/SHA256SUMS.txt Weall-Protocol/generated/v2 web/src/generated/protocolStatus.ts
          if git diff --cached --quiet; then
            echo "PR62 candidate and generated artifacts already current."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(pr62): format candidate graph and refresh v2 derivatives'
          git push origin HEAD:"${GITHUB_REF_NAME}"
