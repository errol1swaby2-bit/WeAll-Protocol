name: R20 Comprehensive Remediation

on:
  workflow_dispatch:
  push:
    branches: ["audit-r20-comprehensive-remediation"]

permissions:
  contents: write

concurrency:
  group: r20-comprehensive-remediation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  remediate-and-validate:
    if: ${{ !contains(github.event.head_commit.message || '', '[r20-remediation-applied]') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Weall-Protocol

    steps:
      - name: Checkout exact remediation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify audited ancestry
        run: |
          test "$(git -C .. merge-base HEAD 69cce170829ded30ebb030669f05c387df6a3ddb)" = "69cce170829ded30ebb030669f05c387df6a3ddb"

      - name: Materialize verified r20 remediation drivers
        run: |
          python scripts/bootstrap_r20_remediation.py
          python scripts/patch_r20_materialized_drivers.py

      - name: Apply r20 remediation drivers
        run: |
          set -o pipefail
          python scripts/apply_r20_comprehensive_remediation.py 2>&1 | tee generated/r20_driver_a.log
          python scripts/apply_r20_remaining_remediation.py 2>&1 | tee generated/r20_driver_b.log
          rm -f scripts/apply_r20_comprehensive_remediation.py scripts/apply_r20_remaining_remediation.py

      - name: Install locked backend
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Format and lint transformed tree
        run: |
          ruff format .
          ruff check . --fix
          ruff format .
          ruff format --check .
          ruff check .

      - name: Refresh canon-derived transaction index
        run: python scripts/gen_tx_index.py

      - name: Rebind exact audited r20 semantic-review contracts
        run: python ../.github/r20/rebind_semantic_reviews.py

      - name: Regenerate reviewed v2 derivatives
        run: PYTHONPATH=src python scripts/compile_v2_spec.py

      - name: Validate transformed tree before finalization
        run: |
          python -m tooling.canon_lint
          python scripts/check_generated.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          PYTHONDONTWRITEBYTECODE=1 python scripts/check_v15_public_readiness_artifacts.py

      - name: Verify 44-of-44 remediation coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a = json.loads(Path('generated/r20_remediation_driver_result.json').read_text())
          b = json.loads(Path('generated/r20_remaining_remediation_result.json').read_text())
          found = set(a['patched_findings']) | set(b['patched_findings'])
          if len(found) != 44:
              raise SystemExit(f'expected 44 unique r20 findings, got {len(found)}: {sorted(found)}')
          Path('generated/r20_comprehensive_remediation_coverage.json').write_text(
              json.dumps({
                  'audited_base': '69cce170829ded30ebb030669f05c387df6a3ddb',
                  'count': 44,
                  'findings': sorted(found),
                  'ok': True,
              }, indent=2) + '\n'
          )
          print('r20 coverage: 44/44')
          PY

      - name: Preserve remediation evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: r20-remediation-manifests
          path: |
            Weall-Protocol/generated/r20_remediation_driver_result.json
            Weall-Protocol/generated/r20_remaining_remediation_result.json
            Weall-Protocol/generated/r20_comprehensive_remediation_coverage.json
            Weall-Protocol/generated/r20_repository_description_action.txt
            Weall-Protocol/generated/r20_stale_semantic_reviews.json
            Weall-Protocol/generated/r20_semantic_review_rebind.json
            Weall-Protocol/generated/r20_driver_a.log
            Weall-Protocol/generated/r20_driver_b.log

      - name: Finalize reviewer candidate and regenerate derivatives
        run: |
          python ../.github/r20/finalize_candidate.py
          PYTHONPATH=src python scripts/compile_v2_spec.py
          ruff format --check .
          ruff check .
          python -m tooling.canon_lint
          python scripts/check_generated.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          PYTHONDONTWRITEBYTECODE=1 python scripts/check_v15_public_readiness_artifacts.py

      - name: Create local exact candidate commit
        run: |
          git -C .. config user.name "github-actions[bot]"
          git -C .. config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .. add -A
          if git -C .. diff --cached --quiet; then
            echo "No remediation changes to commit."
            exit 1
          fi
          git -C .. commit -m "fix: close r20 multi-run audit findings [r20-remediation-applied]"

      - name: Validate exact local candidate commit
        run: |
          python scripts/check_v2_spec_clean_checkout.py
          python -m tooling.canon_lint
          python scripts/check_generated.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          PYTHONDONTWRITEBYTECODE=1 python scripts/check_v15_public_readiness_artifacts.py
          pytest -q
          test -z "$(git -C .. status --porcelain --untracked-files=all)"

      - name: Push exact validated candidate
        run: git -C .. push origin HEAD:audit-r20-comprehensive-remediation
