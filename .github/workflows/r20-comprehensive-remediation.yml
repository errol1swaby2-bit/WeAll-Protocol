name: R20 Comprehensive Remediation

on:
  workflow_dispatch:
  push:
    branches: ["audit-r20-comprehensive-remediation"]

permissions:
  contents: write

concurrency:
  group: r20-comprehensive-remediation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remediate-and-validate:
    if: ${{ !contains(github.event.head_commit.message || '', '[r20-remediation-applied]') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Weall-Protocol
    env:
      PYTHONPATH: src:scripts

    steps:
      - name: Checkout exact remediation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify control script and audited ancestry
        run: |
          python -m py_compile ../.github/r20/r20_candidate_control.py
          test "$(git -C .. merge-base HEAD 69cce170829ded30ebb030669f05c387df6a3ddb)" = "69cce170829ded30ebb030669f05c387df6a3ddb"

      - name: Materialize verified r20 remediation drivers
        run: |
          python ../.github/r20/r20_candidate_control.py materialize

      - name: Apply r20 remediation drivers
        run: |
          set -o pipefail
          python scripts/apply_r20_comprehensive_remediation.py 2>&1 | tee generated/r20_driver_a.log
          python scripts/apply_r20_remaining_remediation.py 2>&1 | tee generated/r20_driver_b.log
          python ../.github/r20/r20_candidate_control.py post-apply

      - name: Install locked backend
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Format and lint transformed tree
        run: |
          ruff format .
          ruff check . --fix
          ruff format .
          ruff format --check .
          ruff check .

      - name: Refresh canon before semantic review
        run: |
          python scripts/gen_tx_index.py
          python scripts/gen_failure_code_registry_v1_5.py

      - name: Rebind exact audited semantic reviews
        run: |
          python ../.github/r20/r20_candidate_control.py audit-rebind

      - name: Compile transformed v2 registers
        run: |
          python scripts/compile_v2_spec.py

      - name: Verify exact runtime-state delta and repair stale test expectation
        run: |
          python ../.github/r20/r20_candidate_control.py verify-state

      - name: Verify 44-of-44 remediation coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          a = json.loads(Path("generated/r20_remediation_driver_result.json").read_text())
          b = json.loads(Path("generated/r20_remaining_remediation_result.json").read_text())
          found = set(a["patched_findings"]) | set(b["patched_findings"])
          if len(found) != 44:
              raise SystemExit(f"expected 44 unique r20 findings, got {len(found)}: {sorted(found)}")
          Path("generated/r20_comprehensive_remediation_coverage.json").write_text(
              json.dumps(
                  {
                      "audited_base": "69cce170829ded30ebb030669f05c387df6a3ddb",
                      "count": 44,
                      "findings": sorted(found),
                      "ok": True,
                  },
                  indent=2,
              )
              + "\n"
          )
          print("r20 coverage: 44/44")
          PY

      - name: Preserve remediation evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: r20-remediation-manifests
          path: |
            Weall-Protocol/generated/r20_remediation_driver_result.json
            Weall-Protocol/generated/r20_remaining_remediation_result.json
            Weall-Protocol/generated/r20_comprehensive_remediation_coverage.json
            Weall-Protocol/generated/r20_repository_description_action.txt
            Weall-Protocol/generated/r20_stale_semantic_reviews.json
            Weall-Protocol/generated/r20_semantic_review_rebind.json
            Weall-Protocol/generated/r20_driver_a.log
            Weall-Protocol/generated/r20_driver_b.log

      - name: Remove transient r20 tooling
        run: |
          python ../.github/r20/r20_candidate_control.py cleanup

      - name: Regenerate final chain identities
        run: |
          python scripts/gen_tx_index.py
          python scripts/gen_failure_code_registry_v1_5.py
          python scripts/build_production_genesis_manifest.py \
            --chain-id weall-prod \
            --founding-account '@errol-genesis' \
            --founding-pubkey 'c195d59d38ecf84b9baa227aff88960759afb72d2150f6e27a3187d0a3ae08be' \
            --authority-pubkey 'c195d59d38ecf84b9baa227aff88960759afb72d2150f6e27a3187d0a3ae08be' \
            --genesis-time 1778368894 \
            --econ-unlock-days 90 \
            --bootstrap-expires-height 1008 \
            --genesis-out configs/genesis.ledger.prod.json \
            --manifest-out configs/chains/weall-genesis.json
          python scripts/assert_production_genesis_artifacts.py
          python scripts/gen_controlled_devnet_chain_manifest.py
          python scripts/gen_controlled_devnet_chain_manifest.py --check
          python scripts/gen_public_testnet_v1_chain_identity.py
          python scripts/gen_public_testnet_v1_chain_identity.py --check

      - name: Regenerate deterministic v1.5 proof artifacts
        run: |
          generators=(
            gen_b505_b509_mechanics_proof_v1_5.py
            gen_b523_b527_completion_proof_v1_5.py
            gen_b528_b532_completion_proof_v1_5.py
            gen_b534_b538_completion_proof_v1_5.py
            gen_b539_b543_production_path_proof_v1_5.py
            gen_b544_b548_live_network_final_proof_v1_5.py
            gen_b549_b553_controlled_testnet_candidate_proof_v1_5.py
            gen_b556_b561_final_missing_mechanics_proof_v1_5.py
            gen_b562_b566_mechanics_hardening_proof_v1_5.py
            gen_b567_b571_autonomous_mechanics_proof_v1_5.py
            gen_governance_execution_vectors_v1_5.py
          )
          for generator in "${generators[@]}"; do
            python "scripts/${generator}"
          done
          for generator in "${generators[@]}"; do
            python "scripts/${generator}" --check
          done

      - name: Regenerate final reviewer-readiness derivatives
        run: |
          python scripts/gen_public_only_protocol_audit_v1_5.py
          python scripts/gen_release_evidence_manifest_v1_5.py
          python scripts/gen_public_beta_blocker_report_v1_5.py
          python scripts/gen_current_verified_claims.py
          python scripts/compile_v2_spec.py
          ruff format .
          ruff check . --fix
          ruff format .

      - name: Validate final transformed tree
        run: |
          ruff format --check .
          ruff check .
          python -m tooling.canon_lint
          python scripts/check_generated.py
          python scripts/compile_v2_spec.py --check
          python scripts/check_v2_spec_clean_checkout.py
          PYTHONDONTWRITEBYTECODE=1 python scripts/check_v15_public_readiness_artifacts.py
          python scripts/check_public_claim_freshness.py
          python scripts/gen_current_verified_claims.py --check
          python scripts/assert_production_genesis_artifacts.py
          python scripts/gen_controlled_devnet_chain_manifest.py --check
          python scripts/gen_public_testnet_v1_chain_identity.py --check

      - name: Verify candidate does not modify workflow files
        run: |
          git -C .. diff --exit-code HEAD -- .github/workflows/backend-ci.yml
          git -C .. diff --exit-code HEAD -- .github/workflows/r20-comprehensive-remediation.yml

      - name: Create local exact candidate commit
        run: |
          git -C .. config user.name "github-actions[bot]"
          git -C .. config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .. add -A
          if git -C .. diff --cached --quiet; then
            echo "No remediation changes to commit."
            exit 1
          fi
          git -C .. commit -m "fix: close r20 multi-run audit findings [r20-remediation-applied]"

      - name: Validate exact candidate clean-checkout reproducibility
        run: |
          python scripts/check_v2_spec_clean_checkout.py

      - name: Validate exact candidate canon and generated artifacts
        run: |
          python -m tooling.canon_lint
          python scripts/check_generated.py
          python scripts/compile_v2_spec.py --check
          PYTHONDONTWRITEBYTECODE=1 python scripts/check_v15_public_readiness_artifacts.py
          python scripts/check_public_claim_freshness.py
          python scripts/gen_current_verified_claims.py --check

      - name: Validate exact candidate full backend suite
        run: |
          pytest -q

      - name: Validate exact candidate clean worktree
        run: |
          git -C .. diff --exit-code
          git -C .. diff --cached --exit-code

      - name: Push exact validated candidate
        run: |
          git -C .. push origin HEAD:audit-r20-comprehensive-remediation
