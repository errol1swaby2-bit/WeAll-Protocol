name: Complete P1 Remediation Driver v10

on:
  push:
    branches: [p1-complete-remediation-20260926]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p1-complete-remediation-20260926
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute corrected v9 remediation pipeline
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          source = Path('.github/workflows/p1-complete-remediation-driver-v9.yml').read_text()

          def step_script(name: str) -> str:
              lines = source.splitlines()
              marker = f'- name: {name}'
              start = next((i for i, line in enumerate(lines) if line.strip() == marker), None)
              if start is None:
                  raise SystemExit(f'missing v9 step: {name}')
              run_i = next((i for i in range(start + 1, len(lines)) if lines[i].strip() == 'run: |'), None)
              if run_i is None:
                  raise SystemExit(f'missing v9 run block: {name}')
              body = []
              for line in lines[run_i + 1:]:
                  if line.startswith('      - name: ') or line.startswith('      - uses: '):
                      break
                  if line.startswith('          '):
                      body.append(line[10:])
                  elif not line.strip():
                      body.append('')
                  else:
                      break
              return '\n'.join(body) + '\n'

          pipeline = [
              ('Apply corrected P1 source repairs and regression tests', '.'),
              ('Install locked dependencies', 'Weall-Protocol'),
              ('Run focused P1 validation and refresh derivatives', '.'),
              ('Remove temporary workflows and commit exact candidate', '.'),
              ('Exact-commit generated and readiness validation', 'Weall-Protocol'),
              ('Full backend regression suite', 'Weall-Protocol'),
              ('Verify validation left tracked state clean', '.'),
              ('Push validated P1 closure', '.'),
          ]

          for name, cwd in pipeline:
              print(f'=== {name} ===', flush=True)
              script = step_script(name)

              if name == 'Run focused P1 validation and refresh derivatives':
                  bad = r'canonical_key=([^\\s]+)'
                  good = r'canonical_key=(\S+)'
                  if script.count(bad) != 1:
                      raise SystemExit(f'v9 stable-state regex match count={script.count(bad)}')
                  script = script.replace(bad, good, 1)

              if name == 'Remove temporary workflows and commit exact candidate':
                  anchor = 'git rm -f .github/workflows/p1-complete-remediation-driver-v9.yml\n'
                  addition = anchor + 'git rm -f .github/workflows/p1-complete-remediation-driver-v10.yml\n'
                  if script.count(anchor) != 1:
                      raise SystemExit(f'v10 cleanup anchor count={script.count(anchor)}')
                  script = script.replace(anchor, addition, 1)

              subprocess.run(
                  ['bash', '-Eeuo', 'pipefail', '-c', script],
                  cwd=cwd,
                  check=True,
              )
          PY
