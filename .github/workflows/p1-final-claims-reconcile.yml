name: P1 Final Claims Reconcile

on:
  push:
    branches:
      - p1-revalidation-after-p0-20261005
    paths:
      - .github/workflows/p1-final-claims-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p1-revalidation-after-p0-20261005
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked backend environment
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Validate corrected P1 matrix
        working-directory: Weall-Protocol
        run: |
          pytest -q tests/test_p1_a18_claim_boundaries.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check

      - name: Remove temporary workflow from candidate tree
        run: |
          rm -f .github/workflows/p1-final-claims-reconcile.yml

      - name: Regenerate current-claims artifacts
        working-directory: Weall-Protocol
        run: |
          python scripts/gen_current_verified_claims.py

      - name: Commit workflow-free claims candidate locally
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No claims reconciliation diff produced'; exit 1; }
          git diff --check --cached
          git commit -m 'audit: reconcile final P1 claim artifacts'
          echo "candidate_sha=$(git rev-parse HEAD)"
          echo "candidate_tree=$(git rev-parse HEAD^{tree})"
          test -z "$(git status --porcelain)"

      - name: Verify exact committed candidate
        working-directory: Weall-Protocol
        run: |
          python scripts/gen_current_verified_claims.py --check
          python scripts/check_public_claim_freshness.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          python scripts/check_v2_spec_clean_checkout.py
          pytest -q tests/test_p1_a18_claim_boundaries.py
          test -z "$(git status --porcelain)"

      - name: Push verified workflow-free candidate
        run: |
          set -Eeuo pipefail
          test ! -e .github/workflows/p1-final-claims-reconcile.yml
          test -z "$(git status --porcelain)"
          git push origin HEAD:p1-revalidation-after-p0-20261005
