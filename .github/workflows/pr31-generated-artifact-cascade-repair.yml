name: PR31 generated artifact cascade repair

on:
  push:
    branches: ["audit-remediation-20260929"]

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout PR31 branch
        uses: actions/checkout@v4
        with:
          ref: audit-remediation-20260929
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Remove one-shot workflow before hashing final tree
        shell: bash
        run: rm -f .github/workflows/pr31-generated-artifact-cascade-repair.yml

      - name: Install locked backend toolchain
        working-directory: Weall-Protocol
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Regenerate current verified claims
        working-directory: Weall-Protocol
        shell: bash
        run: |
          python scripts/gen_current_verified_claims.py

      - name: Regenerate downstream V2 derivatives
        working-directory: Weall-Protocol
        shell: bash
        run: |
          PYTHONPATH=src python scripts/compile_v2_spec.py

      - name: Re-run claims generator to prove no reverse dependency
        working-directory: Weall-Protocol
        shell: bash
        run: |
          python scripts/gen_current_verified_claims.py

      - name: Audit generated-artifact closure
        working-directory: Weall-Protocol
        shell: bash
        run: |
          python -m tooling.canon_lint
          python scripts/check_generated.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          PYTHONDONTWRITEBYTECODE=1 python scripts/check_v15_public_readiness_artifacts.py
          python scripts/check_public_claim_freshness.py
          python scripts/gen_current_verified_claims.py --check
          git diff --check

      - name: Search for direct claims-manifest consumers
        working-directory: Weall-Protocol
        shell: bash
        run: |
          printf '%s\n' 'Direct references to current_verified_claims:'
          grep -RIn --exclude='current_verified_claims.json' --exclude='CURRENT_VERIFIED_CLAIMS.md' \
            'current_verified_claims' scripts src specs generated docs tests || true

      - name: Restore historical M2/M3 closure evidence
        working-directory: .
        shell: bash
        run: |
          bash scripts/restore_m2_m3_evidence_from_git.sh --destination "${GITHUB_WORKSPACE}"

      - name: Full backend suite
        working-directory: Weall-Protocol
        shell: bash
        run: pytest -q

      - name: Show exact cascade diff
        shell: bash
        run: |
          git status --short
          git diff --stat
          git diff --name-only

      - name: Commit validated cascade repair
        shell: bash
        run: |
          git config user.name "weall-pr31-closure-bot"
          git config user.email "weall-pr31-closure-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated-artifact changes remain to commit."
            exit 0
          fi
          git commit -m "fix: refresh claims manifest and cascading derivatives [pr31-ci-closure]"
          git push origin HEAD:audit-remediation-20260929
