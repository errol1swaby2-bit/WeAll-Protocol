name: F1b No-Retry Real-Stack Evidence (temporary)

on:
  push:
    branches:
      - frontend/f1-guided-account-onboarding-20261104
    paths:
      - .github/workflows/f1b-reliability-e2e-once.yml

permissions:
  contents: write

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout only existing PR branch
        uses: actions/checkout@v4
        with:
          ref: frontend/f1-guided-account-onboarding-20261104
          fetch-depth: 0
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install audited backend toolchain
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps
      - name: Install frontend and Chromium
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Enforce first-attempt-only custody tests
        env:
          CI: "1"
          WEALL_M2_TRACE: "1"
          WEALL_KEEP_M2_CUSTODY_RUNTIME: "1"
        run: |
          # The required real-stack config forces Playwright retries=0.
          grep -F 'WEALL_REQUIRE_REAL_ACCOUNT_CUSTODY_E2E === "1" ? 0' web/playwright.config.ts
          bash scripts/run_account_custody_real_stack_e2e.sh
      - name: Upload failure-only browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: f1b-no-retry-custody-diagnostics
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
      - name: Remove temporary workflow before compiling source evidence
        run: |
          set -euo pipefail
          rm .github/workflows/f1b-reliability-e2e-once.yml
          test ! -e .github/workflows/f1b-reliability-e2e-once.yml
      - name: Regenerate and verify final V2 source evidence
        working-directory: Weall-Protocol
        run: |
          PYTHONPATH=src python scripts/compile_v2_spec.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
      - name: Enforce bounded derivative writes
        run: |
          set -euo pipefail
          mapfile -t changed < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          for file in "${changed[@]}"; do
            case "$file" in
              .github/workflows/f1b-reliability-e2e-once.yml|Weall-Protocol/generated/v2/*|web/src/generated/protocolStatus.ts) ;;
              *) echo "Out-of-scope mutation: $file" >&2; exit 1 ;;
            esac
          done
          test "${#changed[@]}" -gt 1
      - name: Commit source-bound evidence and self-removal atomically
        run: |
          set -euo pipefail
          git add -u -- .github/workflows/f1b-reliability-e2e-once.yml
          git add -- Weall-Protocol/generated/v2 web/src/generated/protocolStatus.ts
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "test(F1b): no-retry custody, lost-ack registration and revocation evidence"
          (cd Weall-Protocol && PYTHONPATH=src python scripts/compile_v2_spec.py --check)
          git push origin HEAD:refs/heads/frontend/f1-guided-account-onboarding-20261104
