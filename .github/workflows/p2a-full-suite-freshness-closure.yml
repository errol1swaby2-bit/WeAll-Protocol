name: P2A Full Suite Freshness Closure

on:
  push:
    branches:
      - p2-complete-remediation-20260927

permissions:
  contents: write

jobs:
  close-p2a-full-suite-failures:
    runs-on: ubuntu-latest
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked backend tooling
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Remove one-shot workflow before freshness regeneration
        run: git rm .github/workflows/p2a-full-suite-freshness-closure.yml

      - name: Repair degraded-to-serial coverage semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("Weall-Protocol/tests/test_helper_contract_coverage.py")
          text = path.read_text(encoding="utf-8")
          old = '''def test_planner_parallel_execution_serial_mismatches_are_explicitly_fail_closed() -> None:\n    contract_map = build_helper_contract_map(TX_INDEX)\n    degraded = [item for item in contract_map["contracts"] if item["degraded_to_serial"]]\n    assert degraded, "expected at least one known degraded-to-serial tx in current snapshot"\n    for item in degraded:\n        assert item["helper_eligible"] is False\n        assert item["effective_lane_id"] == LANE_SERIAL\n        assert item["execution_lane_id"] == LANE_SERIAL\n        assert item["planner_lane_hint"] != "SERIAL"\n        assert item["reason"] == "execution_lane_serial"\n'''
          new = '''def test_planner_parallel_execution_serial_mismatches_are_explicitly_fail_closed() -> None:\n    contract_map = build_helper_contract_map(TX_INDEX)\n    degraded = [item for item in contract_map["contracts"] if item["degraded_to_serial"]]\n    assert degraded, "expected at least one known degraded-to-serial tx in current snapshot"\n    expected_lane_by_hint = {\n        "IDENTITY": "PARALLEL_IDENTITY",\n        "SOCIAL": "PARALLEL_SOCIAL",\n        "CONTENT": "PARALLEL_CONTENT",\n        "STORAGE": "PARALLEL_CONTENT",\n        "ECONOMICS": "PARALLEL_ECONOMY",\n    }\n    for item in degraded:\n        assert item["helper_eligible"] is False\n        assert item["effective_lane_id"] == LANE_SERIAL\n        assert item["planner_lane_hint"] != "SERIAL"\n        if item["reason"] == "planner_execution_lane_mismatch":\n            expected_lane = expected_lane_by_hint[item["planner_lane_hint"]]\n            assert item["execution_lane_id"] != LANE_SERIAL\n            assert item["execution_lane_id"] != expected_lane\n        else:\n            assert item["execution_lane_id"] == LANE_SERIAL\n            assert item["reason"] == "execution_lane_serial"\n'''
          if text.count(old) != 1:
              raise SystemExit("expected helper contract coverage preimage not found exactly once")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Format and lint repaired coverage test
        working-directory: Weall-Protocol
        run: |
          ruff format tests/test_helper_contract_coverage.py
          ruff format --check tests/test_helper_contract_coverage.py
          ruff check tests/test_helper_contract_coverage.py

      - name: Refresh deterministic B528-B532 proof artifact
        working-directory: Weall-Protocol
        run: |
          python scripts/gen_b528_b532_completion_proof_v1_5.py
          python scripts/gen_b528_b532_completion_proof_v1_5.py --check

      - name: Refresh deterministic B534-B538 proof artifact
        working-directory: Weall-Protocol
        run: |
          python scripts/gen_b534_b538_completion_proof_v1_5.py
          python scripts/gen_b534_b538_completion_proof_v1_5.py --check

      - name: Refresh deterministic B567-B571 proof artifact
        working-directory: Weall-Protocol
        run: |
          python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py
          python scripts/gen_b567_b571_autonomous_mechanics_proof_v1_5.py --check

      - name: Recompile v2 derivatives after proof refresh
        working-directory: Weall-Protocol
        run: PYTHONPATH=src python scripts/compile_v2_spec.py

      - name: Rerun exact previously failing tests
        working-directory: Weall-Protocol
        run: |
          pytest -q \
            tests/test_helper_contract_coverage.py \
            tests/test_autonomous_validator_ipfs_anti_sybil_economics_read_models.py::test_claim_boundaries_and_artifact_freshness \
            tests/test_full_node_db_api_dispute_storage_coverage.py::test_b534_freshness_check_is_deterministic_and_live_verification_is_explicit \
            tests/test_validator_db_lifecycle_reviewer_accountability_storage_coverage.py::test_b528_freshness_check_is_deterministic_and_live_verification_is_explicit

      - name: Verify working-tree generated and derivative freshness
        working-directory: Weall-Protocol
        run: |
          python scripts/check_generated.py
          PYTHONPATH=src python scripts/compile_v2_spec.py --check
          PYTHONDONTWRITEBYTECODE=1 python scripts/check_v15_public_readiness_artifacts.py
          python scripts/check_public_claim_freshness.py
          python scripts/gen_current_verified_claims.py --check

      - name: Verify final diff hygiene
        run: |
          git status --short
          git diff --check

      - name: Create local P2A closure commit
        run: |
          set -Eeuo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Close P2A full-suite freshness failures"

      - name: Verify clean checkout from closure commit
        working-directory: Weall-Protocol
        run: |
          python scripts/check_v2_spec_clean_checkout.py
          python scripts/check_public_claim_freshness.py
          python scripts/gen_current_verified_claims.py --check

      - name: Push verified P2A closure commit
        run: git push origin "HEAD:${{ github.ref_name }}"
