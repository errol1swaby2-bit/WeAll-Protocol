name: CI P2 Closure Fallout Repair

on:
  push:
    branches:
      - p2-complete-remediation-20260927
    paths:
      - .github/workflows/ci-p2-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: p2-complete-remediation-20260927
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked backend dependencies
        working-directory: Weall-Protocol
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Run CI fallout repair
        run: python .github/ci-p2-repair.py
